min_version = "2025.11.3"

[env]
CARGO_HOME = "{{env.HOME}}/.cargo"
RUSTUP_HOME = "{{env.HOME}}/.rustup"
CARGO_TARGET_DIR = "target/rust"
RUST_BACKTRACE = "1"
RUST_TEST_THREADS = "1"
DENO_NO_UPDATE_CHECK = "1"

[tools]
deno = "2.8.3"
rust = "1.93.0"

[tasks.setup]
description = "Cache the minimal Rust and Deno development toolchain"
run = [
  "rustup target add wasm32-unknown-unknown",
  "cargo fetch --locked",
  "deno install --allow-scripts=npm:@tailwindcss/oxide,npm:esbuild,npm:sharp",
  "deno task e2e:install:browsers",
]

[tasks.dev]
description = "Run the current backend, frontend, and docsite development servers"
run = "deno task dev"

[tasks.fmt]
run = [
  "cargo fmt --all",
  "deno fmt",
]

[tasks."fmt:check"]
run = [
  "cargo fmt --all --check",
  "deno fmt --check",
]

[tasks.lint]
run = [
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "deno lint tools e2e frontend/src docsite/src",
]

[tasks.check]
run = [
  "cargo check --workspace --all-targets --all-features --locked",
  "cargo check -p ugoite-domain --target wasm32-unknown-unknown --locked",
  "cargo check -p ugoite-api-client --target wasm32-unknown-unknown --locked",
  "cargo check -p ugoite-wasm --target wasm32-unknown-unknown --locked",
  "deno task check",
  "cargo run -p xtask -- openapi-check",
  "cargo run -p xtask -- architecture-check",
  "cargo run -p xtask -- docs-current-stack-check",
]

[tasks.test]
run = [
  "cargo test --workspace --locked",
  "deno task test",
]

[tasks.e2e]
description = "Run CI-parity E2E tests, preferring Docker Compose and falling back to host processes"
run = "deno task e2e:full"

[tasks."e2e:smoke"]
description = "Run CI-parity E2E smoke tests"
run = "deno task e2e:smoke"

[tasks."test:smoke"]
run = [
  "cargo test -p ugoite-domain -p ugoite-core -p ugoite-server --locked",
  "deno task frontend:test",
]

[tasks."test:cli"]
description = "Run the CLI package tests"
run = "cargo test -p ugoite-cli --locked"

[tasks.ci]
run = [
  "mise run fmt:check",
  "mise run lint",
  "mise run check",
  "mise run test",
]

[tasks."ci:merge"]
run = [
  "mise run ci",
  "deno task frontend:build",
  "deno task docsite:build",
  "mise run e2e:smoke",
]

[tasks."ci:release"]
run = [
  "mise run ci:merge",
  "cargo build -p ugoite-server --release --locked",
  "cargo build -p ugoite-cli --release --locked",
  "cargo check -p ugoite-wasm --target wasm32-unknown-unknown --locked",
  "bash scripts/verify-release-local-image.sh",
]
