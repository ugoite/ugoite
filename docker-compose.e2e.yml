services:
  ugoite:
    image: ugoite:e2e
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - UGOITE_ROOT=/data
      - UGOITE_SERVER_ADDRESS=0.0.0.0:8000
      - UGOITE_STATIC_DIR=/app/static
      - UGOITE_DEV_AUTH_MODE=${UGOITE_DEV_AUTH_MODE:-mock-oauth}
      - UGOITE_DEV_USER_ID=${UGOITE_DEV_USER_ID:-e2e-user}
      - UGOITE_BOOTSTRAP_TOKEN=${UGOITE_BOOTSTRAP_TOKEN:-e2e-token}
      - UGOITE_AUTH_BEARER_TOKENS=${UGOITE_AUTH_BEARER_TOKENS:-}
      - UGOITE_AUTH_BEARER_SIGNING_SECRETS=${UGOITE_AUTH_BEARER_SIGNING_SECRETS:-}
      - UGOITE_AUTH_BEARER_ACTIVE_KIDS=${UGOITE_AUTH_BEARER_ACTIVE_KIDS:-}
      - UGOITE_BOOTSTRAP_DEFAULT_SPACE=true
