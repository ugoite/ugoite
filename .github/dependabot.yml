---
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"
    groups:
      rust-arrow-stack:
        patterns:
          - "arrow*"
          - "parquet"
          - "iceberg*"
          - "datafusion*"
          - "opendal*"
    ignore:
      # Arrow/Iceberg's Cargo crates share concrete Arrow types, so a
      # major/minor update of any member must be reviewed as one stack.
      # Keep those updates suppressed until a compatible upstream stack can
      # be upgraded and validated together; patch updates remain grouped.
      - dependency-name: "arrow*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "parquet"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "iceberg*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "datafusion*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "opendal*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/packages/ugoite"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "devcontainers"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"
