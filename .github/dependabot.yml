---
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"
    groups:
      rust-arrow-stack:
        patterns:
          - "arrow*"
          - "parquet"
          - "iceberg*"
          - "datafusion*"
          - "opendal*"
    ignore:
      # Arrow/Iceberg's Cargo crates share concrete Arrow types, so a
      # major/minor update of any member must be reviewed as one stack.
      # Keep those updates suppressed until a compatible upstream stack can
      # be upgraded and validated together; patch updates remain grouped.
      - dependency-name: "arrow*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "parquet"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "iceberg*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "datafusion*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "opendal*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/packages/ugoite"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "devcontainers"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  # Keep Deno updates in an independent weekly frame. The five manifests share
  # one deno.lock, so group version updates across all monitored directories
  # and allow only one regular Deno update PR at a time.
  - package-ecosystem: "deno"
    directories:
      - "/"
      - "/frontend"
      - "/docsite"
      - "/e2e"
      - "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      deno-workspace:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 removes compiler APIs used by the frontend changed-file
      # check. Keep patch and minor updates visible while that consumer adapts.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Grouped runs with these Starlight versions failed static rendering
      # because Deno cannot resolve astro:middleware.
      - dependency-name: "@astrojs/starlight"
        versions:
          - "0.42.1"
          - "0.42.2"
          - "0.42.3"
          - "0.42.4"
          - "0.42.5"
          - "0.42.6"
          - "0.42.7"
          - "0.42.8"
          - "0.42.9"
          - "0.42.10"
          - "0.42.11"
          - "0.43.0"
          - "0.43.1"
      # These manifest targets resolve to 1.65.1 in the lockfile; navigation
      # tests then load as CommonJS, where import.meta fails. Hold each target
      # and the resolved version.
      - dependency-name: "@playwright/test"
        versions:
          - "1.61.0"
          - "1.61.1"
          - "1.62.0"
          - "1.62.1"
          - "1.63.0"
          - "1.64.0"
          - "1.64.1"
          - "1.65.0"
          - "1.65.1"
      # These manifest targets resolve to 2.2.3, which removes defineConfig
      # used by frontend/app.config.ts. Hold each target and the resolved
      # version.
      - dependency-name: "@solidjs/start"
        versions:
          - "2.0.0"
          - "2.0.1"
          - "2.0.2"
          - "2.0.3"
          - "2.0.4"
          - "2.0.5"
          - "2.0.6"
          - "2.1.0"
          - "2.2.0"
          - "2.2.1"
          - "2.2.2"
          - "2.2.3"
  # Rust compiler updates arrive as normal PRs against the single
  # rust-toolchain.toml authority (monthly cadence).
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "monthly"
