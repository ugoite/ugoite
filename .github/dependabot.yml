---
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"
    groups:
      rust-arrow-stack:
        patterns:
          - "arrow*"
          - "parquet"
          - "iceberg*"
          - "datafusion*"
          - "opendal*"
    ignore:
      # Arrow/Iceberg's Cargo crates share concrete Arrow types, so a
      # major/minor update of any member must be reviewed as one stack.
      # Keep those updates suppressed until a compatible upstream stack can
      # be upgraded and validated together; patch updates remain grouped.
      - dependency-name: "arrow*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "parquet"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "iceberg*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "datafusion*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "opendal*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/packages/ugoite"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "devcontainers"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  # Keep Deno updates in an independent weekly frame. The five manifests share
  # one deno.lock, so group version updates across all monitored directories
  # and allow only one regular Deno update PR at a time.
  - package-ecosystem: "deno"
    directories:
      - "/"
      - "/frontend"
      - "/docsite"
      - "/e2e"
      - "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      deno-workspace:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 removes compiler APIs used by the frontend changed-file
      # check. Keep patch and minor updates visible while that consumer adapts.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Starlight 0.43.1 imports astro:middleware during static rendering; the
      # current Deno build path cannot resolve that scheme.
      - dependency-name: "@astrojs/starlight"
        versions:
          - "0.43.1"
      # Playwright 1.65.1 loads the Docsite navigation TypeScript tests as
      # CommonJS, where their import.meta usage fails.
      - dependency-name: "@playwright/test"
        versions:
          - "1.65.1"
  # Rust compiler updates arrive as normal PRs against the single
  # rust-toolchain.toml authority (monthly cadence).
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "monthly"
