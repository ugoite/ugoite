---
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"
    groups:
      rust-arrow-stack:
        patterns:
          - "arrow-*"
          - "parquet"
          - "iceberg"
    ignore:
      - dependency-name: "arrow-array"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "arrow-schema"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "parquet"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "iceberg"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/packages/ugoite"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"

  - package-ecosystem: "devcontainers"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    schedule:
      interval: "daily"
