name: Renovate

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Run a read-only Renovate full dry-run with debug logging
        required: false
        type: boolean
        default: false
      writer_debug:
        description: Run the Renovate writer with debug logging for diagnosis
        required: false
        type: boolean
        default: false
  schedule:
    # 01:17 JST daily; GitHub Actions cron uses UTC.
    - cron: "17 16 * * *"

permissions:
  contents: read

concurrency:
  group: renovate-ugoite-main
  cancel-in-progress: false

jobs:
  renovate:
    if: ${{ github.repository == 'ugoite/ugoite' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Issue read-only diagnostic App token
        if: ${{ inputs.diagnostic }}
        id: diagnostic-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ugoite
          repositories: ugoite
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Issue single-repository writer App token
        if: ${{ !inputs.diagnostic }}
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ugoite
          repositories: ugoite
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Verify App slug matches the PR gate
        env:
          APP_SLUG: ${{ inputs.diagnostic && steps.diagnostic-token.outputs.app-slug || steps.app-token.outputs.app-slug }}
          RENOVATE_APP_SLUG: ${{ vars.RENOVATE_APP_SLUG }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_SLUG}" || -z "${RENOVATE_APP_SLUG}" || "${APP_SLUG}" != "${RENOVATE_APP_SLUG}" ]]; then
            echo "::error::The installed GitHub App slug does not match RENOVATE_APP_SLUG."
            exit 1
          fi
          echo "GitHub App identity matches the PR gate configuration."

      - name: Verify Dependabot alerts API access without printing alert data
        env:
          GH_TOKEN: ${{ inputs.diagnostic && steps.diagnostic-token.outputs.token || steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          alert_counts="$(
            gh api --paginate \
              'repos/ugoite/ugoite/dependabot/alerts?state=open&per_page=100' \
              --jq '{
                open: length,
                with_first_patched_version: ([
                  .[] | select(.security_vulnerability.first_patched_version.identifier != null)
                ] | length)
              }' \
              | jq -s '{
                open: (map(.open) | add // 0),
                with_first_patched_version: (map(.with_first_patched_version) | add // 0)
              }'
          )"
          open_count="$(jq -r '.open' <<<"${alert_counts}")"
          patched_count="$(jq -r '.with_first_patched_version' <<<"${alert_counts}")"
          echo "Dependabot alerts API: accessible; open=${open_count}; with_first_patched_version=${patched_count}"
          {
            echo "### Dependabot alert inventory"
            echo "- Open alerts: ${open_count}"
            echo "- Alerts with a first patched version: ${patched_count}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Write diagnostic-only Renovate config
        if: ${{ inputs.diagnostic }}
        run: |
          set -euo pipefail
          # The Renovate action container mounts host /tmp at container /tmp.
          cat > /tmp/renovate-diagnostic.json <<'EOF'
          {"force":{"vulnerabilityAlerts":{"enabled":false}}}
          EOF

      - name: Run pinned Renovate CLI writer
        if: ${{ !inputs.diagnostic }}
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: "45.1.1" # renovate: datasource=github-releases depName=renovatebot/renovate
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ugoite/ugoite
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_ALLOW_SCRIPTS: "false"
          RENOVATE_ALLOW_PLUGINS: "false"
          LOG_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.writer_debug && 'debug' || 'info' }}

      - name: Run pinned Renovate CLI read-only diagnostic
        if: ${{ inputs.diagnostic }}
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          token: ${{ steps.diagnostic-token.outputs.token }}
          renovate-version: "45.1.1" # renovate: datasource=github-releases depName=renovatebot/renovate
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ugoite/ugoite
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_DRY_RUN: full
          RENOVATE_ADDITIONAL_CONFIG_FILE: /tmp/renovate-diagnostic.json
          RENOVATE_ALLOW_SCRIPTS: "false"
          RENOVATE_ALLOW_PLUGINS: "false"
          LOG_LEVEL: debug
