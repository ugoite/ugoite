name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

jobs:
  select-tier:
    name: Select E2E tier
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      test_type: ${{ steps.select.outputs.test_type }}
      selection_reason: ${{ steps.select.outputs.selection_reason }}
    steps:
      - name: Checkout PR history
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select E2E tier
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import fnmatch
          import os
          import subprocess
          from pathlib import PurePosixPath

          event_name = os.environ["EVENT_NAME"]
          if event_name in {"merge_group", "push"}:
              test_type = "full"
              selection_reason = f"{event_name} requires full E2E coverage"
          else:
              base_sha = os.environ["PR_BASE_SHA"].strip()
              head_sha = os.environ["HEAD_SHA"].strip()
              if not base_sha or not head_sha:
                  raise SystemExit("pull_request tiering requires PR_BASE_SHA and HEAD_SHA")

              raw = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
                  text=True,
              )
              changed_files = [line.strip() for line in raw.splitlines() if line.strip()]
              smoke_only_patterns = (
                  "README.md",
                  "LICENSE",
                  "AGENTS.md",
                  "docs/**",
                  "docsite/**",
                  ".github/ISSUE_TEMPLATE/**",
              )

              def is_smoke_only(path: str) -> bool:
                  candidate = PurePosixPath(path)
                  return any(
                      fnmatch.fnmatch(path, pattern) or candidate.match(pattern)
                      for pattern in smoke_only_patterns
                  )

              if changed_files and all(is_smoke_only(path) for path in changed_files):
                  test_type = "smoke"
                  selection_reason = "docs/docsite-only pull request"
              else:
                  test_type = "full"
                  selection_reason = "application or workflow inputs changed"

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write(f"test_type={test_type}\n")
              handle.write(f"selection_reason={selection_reason}\n")
          print(f"Selected E2E tier: {test_type} ({selection_reason})")
          PY

  e2e:
    needs: select-tier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Playwright and e2e node cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            e2e/node_modules
          key: ${{ runner.os }}-e2e-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (from docker-build-ci cache)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ugoite-backend:e2e
          cache-from: |
            type=gha,scope=backend-image
            type=gha,scope=docker-build-common
          build-contexts: |
            core=./ugoite-core
            minimum=./ugoite-minimum
            module=./ugoite-cli

      - name: Build frontend image (from docker-build-ci cache)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ugoite-frontend:e2e
          cache-from: |
            type=gha,scope=frontend-image
            type=gha,scope=docker-build-common
          build-contexts: |
            shared=./shared

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Announce selected E2E tier
        run: |
          echo "Selected tier: ${{ needs.select-tier.outputs.test_type }}"
          echo "Reason: ${{ needs.select-tier.outputs.selection_reason }}"

      - name: Install docsite dependencies
        working-directory: ./docsite
        run: bun install --frozen-lockfile

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          PLAYWRIGHT_CI_REPORTER: junit
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml
        run: bash e2e/scripts/run-e2e-compose.sh "${{ needs.select-tier.outputs.test_type }}"

      - name: Fail on skipped e2e tests
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("e2e/test-results/junit.xml")
          if not report.exists():
            raise SystemExit(f"missing junit report: {report}")

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          skipped = sum(int(float(s.attrib.get("skipped", "0") or 0)) for s in suites)
          tests = sum(int(float(s.attrib.get("tests", "0") or 0)) for s in suites)
          if tests == 0:
            raise SystemExit("e2e tests: zero executed tests")
          if skipped > 0:
            raise SystemExit(f"e2e tests: skipped={skipped} is not allowed")
          sys.stdout.write(f"e2e tests OK: tests={tests}, skipped={skipped}\n")
          PY
