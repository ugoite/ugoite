name: YAML Workflow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          arch=amd64
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch=arm64
          fi
          tmpdir="$(mktemp -d)"
          curl -fsSL -o "$tmpdir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_${arch}.tar.gz"
          tar -xzf "$tmpdir/actionlint.tar.gz" -C "$tmpdir"
          sudo install -m 0755 "$tmpdir/actionlint" /usr/local/bin/actionlint

      - name: Check root artifact hygiene
        run: bash scripts/check-root-artifact-hygiene.sh

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.10.10

      - name: Check GitHub Action SHA pins (REQ-OPS-031)
        run: >
          uv run --with pytest --with pyyaml --with bashlex
          pytest -W error
          docs/tests/test_guides.py::test_docs_req_ops_031_github_actions_are_sha_pinned_and_updatable -v

      - name: Run yamllint
        run: |
          git ls-files -- '*.yml' '*.yaml' ':(exclude)charts/*/templates/*.yaml' \
            | xargs uvx --from yamllint yamllint --strict \
              -d "{extends: relaxed, rules: {line-length: disable}}"

      - name: Run actionlint
        run: actionlint

  required-check:
    name: YAML Workflow CI
    if: ${{ always() }}
    needs:
      - ci
    runs-on: ubuntu-slim
    steps:
      - name: Check upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = {
              job: data.get("result", "missing")
              for job, data in needs.items()
              if data.get("result") not in {"success", "skipped"}
          }
          if failures:
              details = ", ".join(
                  f"{job}={result}" for job, result in sorted(failures.items())
              )
              raise SystemExit(f"Required CI jobs failed or were cancelled: {details}")
          print("Required CI jobs succeeded.")
          PY
