name: PR Require Close Issue Link

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  require-close-issue-link:
    runs-on: ubuntu-slim
    if: ${{ github.event_name == 'merge_group' || (!github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]') }}
    steps:
      - name: Check out trusted gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target and merge_group must never execute PR code.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          sparse-checkout: |
            mise.toml
            tools/knowledge_compatibility.ts
            tools/pr_body_gate.ts
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true

      - name: Validate PR body matches required template
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno run --allow-read --allow-env --allow-net=api.github.com tools/pr_body_gate.ts
