name: Dev Container Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .devcontainer/**
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR number to validate against current main
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: devcontainer-validation-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  build-up-setup:
    if: ${{ github.event_name == 'pull_request' || inputs.pull_request_number != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the PR head onto current main
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +"refs/pull/${PR_NUMBER}/head:refs/remotes/validation/pr-${PR_NUMBER}"
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          pr_head_sha="$(git rev-parse "refs/remotes/validation/pr-${PR_NUMBER}")"
          git checkout --detach "${base_sha}"
          git -c user.name=tohboeh5 \
            -c user.email=47549972+tohboeh5@users.noreply.github.com \
            merge --no-edit --no-ff "${pr_head_sha}" \
            -m "Dev Container validation merge for PR #${PR_NUMBER}"
          merge_sha="$(git rev-parse HEAD)"

          {
            printf 'Base main: `%s`\n' "${base_sha}"
            printf 'PR #%s head: `%s`\n' "${PR_NUMBER}" "${pr_head_sha}"
            printf 'Synthetic merge: `%s`\n' "${merge_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build, start, and initialize the Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -euo pipefail
            mise --version
            # devcontainers/ci uses a non-login shell here; resolve mise tools
            # without relying on interactive shell startup files.
            mise exec -- deno --version
            mise exec -- cargo --version
            mise exec -- rustc --version
