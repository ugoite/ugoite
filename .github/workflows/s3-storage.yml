name: S3 storage demonstration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minio-storage:
    name: minio-storage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: "false"

      - name: Run S3 publication and Space recovery proofs
        run: mise run test:s3-storage
