name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: ci-impact-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan_status: ${{ steps.plan.outputs.plan_status }}
      plan_scope: ${{ steps.plan.outputs.plan_scope }}
      jobs_skipped: ${{ steps.plan.outputs.jobs_skipped }}
      plan_rust_check: ${{ steps.plan.outputs.plan_rust_check }}
      plan_rust_test: ${{ steps.plan.outputs.plan_rust_test }}
      plan_web: ${{ steps.plan.outputs.plan_web }}
      plan_artifacts: ${{ steps.plan.outputs.plan_artifacts }}
      plan_docsite_nav: ${{ steps.plan.outputs.plan_docsite_nav }}
      plan_cp1_acceptance: ${{ steps.plan.outputs.plan_cp1_acceptance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: deno
          cache: true

      - name: Report conservative CI lane plan
        id: plan
        env:
          CI_IMPACT_EVENT: ${{ github.event_name }}
          CI_IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_IMPACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mise run ci:impact

  rust-check:
    name: ci-rust-check
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_rust_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install Rust CI components
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

          rustc --version --verbose
          cargo clippy -V
          rustfmt --version
          rustup target list --installed

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=ugoite-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >>"$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"
          fi

      - name: Run Rust and repository checks
        id: rust-check
        run: scripts/measure-step.sh rust-check mise run ci:lane:rust-check

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  rust-test:
    name: ci-rust-test
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_rust_test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: "false"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=ugoite-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >>"$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"
          fi

      - name: Run Rust tests
        id: rust-test
        run: scripts/measure-step.sh rust-test mise run ci:lane:rust-test

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  web:
    name: ci-web
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Deno cache path
        run: echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >>"$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Rust CI components
        run: |
          rustup component add rustfmt
          rustup target add wasm32-unknown-unknown
          rustfmt --version
          rustup target list --installed

      - name: Resolve Deno version
        id: deno-version
        run: echo "version=$(deno --version | awk 'NR==1 { print $2 }')" >>"$GITHUB_OUTPUT"

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: "false"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=ugoite-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >>"$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"
          fi

      - name: Restore Deno cache
        id: deno-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-cache
          key: deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-

      - name: Run web quality gates
        id: web
        run: scripts/measure-step.sh web mise run ci:lane:web

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Save Deno cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-cache
          key: ${{ steps.deno-cache-restore.outputs.cache-primary-key }}

  artifact-build:
    name: artifact-build
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      UGOITE_IMAGE_TAG: ugoite:e2e
      UGOITE_IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record workflow start
        id: workflow-start
        run: |
          echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"
          echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >>"$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install Rust CI components
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
          rustc --version --verbose
          cargo clippy -V
          rustfmt --version
          rustup target list --installed

      - name: Resolve Deno version
        id: deno-version
        run: echo "version=$(deno --version | awk 'NR==1 { print $2 }')" >>"$GITHUB_OUTPUT"

      - name: Restore Cargo dependency cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: "false"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Configure Rust compiler cache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >>"$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=ugoite-v1" >>"$GITHUB_ENV"
          echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}" >>"$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >>"$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >>"$GITHUB_ENV"
          fi

      - name: Restore Deno cache
        id: deno-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-cache
          key: deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Resolve production Pages metadata
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Resolve CI build configuration
        id: ci-config
        env:
          PAGE_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGE_CONFIGURED: ${{ steps.pages.outcome == 'success' }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && "${PAGE_CONFIGURED}" == "true" ]]; then
            docsite_origin="${PAGE_ORIGIN}"
            if [[ -n "${PAGE_BASE_PATH}" ]]; then
              docsite_base="${PAGE_BASE_PATH%/}/"
            else
              docsite_base="/"
            fi
            cache_save_allowed="true"
            docker_cache_to="type=gha,scope=ugoite-runtime,mode=min"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "::notice::GitHub Pages is not configured; using the non-production docsite build configuration."
            fi
            docsite_origin="https://example.invalid"
            docsite_base="/"
            cache_save_allowed="false"
            docker_cache_to=""
          fi

          {
            echo "docsite_origin=${docsite_origin}"
            echo "docsite_base=${docsite_base}"
            echo "cache_save_allowed=${cache_save_allowed}"
            echo "docker_cache_scope=ugoite-runtime"
            echo "docker_cache_mode=min"
            echo "docker_cache_from=type=gha,scope=ugoite-runtime"
            echo "docker_cache_to=${docker_cache_to}"
            echo "ugoite_source_sha=${GITHUB_SHA}"
          } >>"$GITHUB_OUTPUT"

      - name: Build, package, and verify artifacts
        id: artifacts
        env:
          DOCSITE_ORIGIN: ${{ steps.ci-config.outputs.docsite_origin }}
          DOCSITE_BASE: ${{ steps.ci-config.outputs.docsite_base }}
          UGOITE_SOURCE_SHA: ${{ github.sha }}
          UGOITE_IMAGE_PREBUILT: "true"
          UGOITE_IMAGE_USE_BUILDX: "true"
          UGOITE_IMAGE_CACHE_FROM: ${{ steps.ci-config.outputs.docker_cache_from }}
          UGOITE_IMAGE_CACHE_TO: ${{ steps.ci-config.outputs.docker_cache_to }}
          UGOITE_CI_RUN_ID: ${{ github.run_id }}
        run: scripts/measure-step.sh artifact-prepare mise run ci:artifacts:prepare

      - name: Measure E2E artifact inputs
        id: e2e-input-size
        run: echo "bytes=$(du -sb target/artifacts/image/ugoite-e2e-docker.tar.gz target/artifacts/cli target/artifacts/manifest.json target/artifacts/SHA256SUMS | awk '{sum += $1} END {print sum}')" >>"$GITHUB_OUTPUT"

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload docsite artifact
        id: upload-docsite
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-docsite-pages
          path: target/artifacts/docsite/site
          if-no-files-found: error

      - name: Upload runtime image artifact
        id: upload-image
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-runtime-image
          path: target/artifacts/image/ugoite-e2e-docker.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload CLI artifact
        id: upload-cli
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-cli-linux
          path: target/artifacts/cli/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload Helm artifact
        id: upload-helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-helm-chart
          path: target/artifacts/helm/*.tgz
          if-no-files-found: error
          compression-level: 0

      - name: Upload artifact manifest
        id: upload-manifest
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-artifact-manifest
          path: |
            target/artifacts/manifest.json
            target/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Summarize artifact lane
        if: always()
        env:
          DOCSITE_ORIGIN: ${{ steps.ci-config.outputs.docsite_origin }}
          DOCSITE_BASE: ${{ steps.ci-config.outputs.docsite_base }}
          CACHE_SAVE_ALLOWED: ${{ steps.ci-config.outputs.cache_save_allowed }}
          ARTIFACT_PREPARE_DURATION_SECONDS: ${{ steps.artifacts.outputs.duration_seconds }}
          E2E_ARTIFACT_INPUT_BYTES: ${{ steps.e2e-input-size.outputs.bytes }}
          DOCKER_CACHE_SCOPE: ${{ steps.ci-config.outputs.docker_cache_scope }}
          DOCKER_CACHE_MODE: ${{ steps.ci-config.outputs.docker_cache_mode }}
          DOCKER_CACHE_FROM: ${{ steps.ci-config.outputs.docker_cache_from }}
          DOCKER_CACHE_TO: ${{ steps.ci-config.outputs.docker_cache_to }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          DENO_CACHE_HIT: ${{ steps.deno-cache-restore.outputs.cache-hit }}
          DENO_CACHE_PRIMARY_KEY: ${{ steps.deno-cache-restore.outputs.cache-primary-key }}
          DENO_CACHE_MATCHED_KEY: ${{ steps.deno-cache-restore.outputs.cache-matched-key }}
          DOCSITE_ARTIFACT_DIGEST: ${{ steps.upload-docsite.outputs.artifact-digest }}
          IMAGE_ARTIFACT_DIGEST: ${{ steps.upload-image.outputs.artifact-digest }}
          CLI_ARTIFACT_DIGEST: ${{ steps.upload-cli.outputs.artifact-digest }}
          HELM_ARTIFACT_DIGEST: ${{ steps.upload-helm.outputs.artifact-digest }}
          MANIFEST_ARTIFACT_DIGEST: ${{ steps.upload-manifest.outputs.artifact-digest }}
          WORKFLOW_START_EPOCH: ${{ steps.workflow-start.outputs.epoch }}
          DENO_DIR_PATH: ${{ runner.temp }}/deno-cache
        run: |
          deno_cache_fallback="false"
          if [[ -n "${DENO_CACHE_MATCHED_KEY}" && "${DENO_CACHE_MATCHED_KEY}" != "${DENO_CACHE_PRIMARY_KEY}" ]]; then
            deno_cache_fallback="true"
          fi

          total_duration_seconds="n/a"
          if [[ -n "${WORKFLOW_START_EPOCH}" ]]; then
            total_duration_seconds="$(( $(date +%s) - WORKFLOW_START_EPOCH ))"
          fi

          artifact_size_bytes="0"
          if [[ -d target/artifacts ]]; then
            artifact_size_bytes="$(du -sk target/artifacts | awk '{print $1 * 1024}')"
          fi

          deno_cache_size_bytes="0"
          if [[ -d "${DENO_DIR_PATH}" ]]; then
            deno_cache_size_bytes="$(du -sk "${DENO_DIR_PATH}" | awk '{print $1 * 1024}')"
          fi

          rust_target_size_bytes="0"
          if [[ -d target/rust ]]; then
            rust_target_size_bytes="$(du -sk target/rust | awk '{print $1 * 1024}')"
          fi

          {
            echo "## CI Artifact Lane Summary"
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Cargo dependency cache exact hit: \`${RUST_CACHE_HIT:-}\`"
            echo "- Deno cache exact hit: \`${DENO_CACHE_HIT:-}\`"
            echo "- Deno cache fallback restore: \`${deno_cache_fallback}\`"
            echo "- Saving shared caches allowed: \`${CACHE_SAVE_ALLOWED}\`"
            echo "- Docker cache scope: \`${DOCKER_CACHE_SCOPE}\`"
            echo "- Docker cache export mode: \`${DOCKER_CACHE_MODE}\`"
            echo "- DOCSITE_ORIGIN: \`${DOCSITE_ORIGIN}\`"
            echo "- DOCSITE_BASE: \`${DOCSITE_BASE}\`"
            echo "- Artifact preparation duration: ${ARTIFACT_PREPARE_DURATION_SECONDS:-n/a}s"
            echo "- E2E artifact inputs: ${E2E_ARTIFACT_INPUT_BYTES:-n/a} bytes"
            echo "- total artifact lane duration: ${total_duration_seconds}s"
            echo
            echo "### Artifact Digests"
            echo
            echo "- ugoite-docsite-pages: \`${DOCSITE_ARTIFACT_DIGEST:-not-uploaded}\`"
            echo "- ugoite-runtime-image: \`${IMAGE_ARTIFACT_DIGEST:-not-uploaded}\`"
            echo "- ugoite-cli-linux: \`${CLI_ARTIFACT_DIGEST:-not-uploaded}\`"
            echo "- ugoite-helm-chart: \`${HELM_ARTIFACT_DIGEST:-not-uploaded}\`"
            echo "- ugoite-artifact-manifest: \`${MANIFEST_ARTIFACT_DIGEST:-not-uploaded}\`"
            echo
            echo "### Packaged Checksums"
            echo
            if [[ -f target/artifacts/SHA256SUMS ]]; then
              cat target/artifacts/SHA256SUMS
            else
              echo "_SHA256SUMS not available_"
            fi
            echo
            echo "### Cache and Artifact Sizes"
            echo
            echo "- target/rust: \`${rust_target_size_bytes}\` bytes"
            echo "- DENO_DIR: \`${deno_cache_size_bytes}\` bytes"
            echo "- target/artifacts: \`${artifact_size_bytes}\` bytes"
          } >>"$GITHUB_STEP_SUMMARY"

  e2e-smoke-mobile:
    name: ci-e2e-smoke-mobile
    needs: [impact, artifact-build]
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_artifacts == 'true' && needs.artifact-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UGOITE_SOURCE_SHA: ${{ github.sha }}
      UGOITE_CI_RUN_ID: ${{ github.run_id }}
      UGOITE_ARTIFACT_SELECTION: runtime
      UGOITE_IMAGE_TAG: ugoite:e2e
      UGOITE_IMAGE_PLATFORM: linux/amd64
      UGOITE_SKIP_PLAYWRIGHT_DEPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Deno and Playwright cache paths
        run: |
          echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >>"$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/playwright-browsers" >>"$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: deno
          cache: true

      - name: Resolve Deno version
        id: deno-version
        run: |
          echo "version=$(deno --version | awk 'NR==1 { print $2 }')" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deno-cache-restore
        with:
          path: ${{ runner.temp }}/deno-cache
          key: deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-v1-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache-restore
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/deno.json', 'deno.lock') }}
          restore-keys: playwright-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install browser dependencies
        run: deno task e2e:install:browsers

      - name: Start artifact transfer measurement
        id: transfer-start
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-artifact-manifest
          path: target/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-runtime-image
          path: target/artifacts/image

      - name: Record artifact transfer measurement
        id: transfer
        env:
          START_EPOCH: ${{ steps.transfer-start.outputs.epoch }}
        run: |
          echo "seconds=$(( $(date +%s) - START_EPOCH ))" >>"$GITHUB_OUTPUT"
          echo "bytes=$(du -sb target/artifacts | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: Verify and load the exact build artifacts
        id: load-artifacts
        run: scripts/measure-step.sh load-artifacts mise run ci:artifacts:load

      - name: Run smoke, Asset, and mobile E2E
        id: e2e
        run: scripts/measure-step.sh smoke-mobile mise run ci:lane:e2e-smoke-mobile

      - name: Save Playwright browser cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: ${{ steps.playwright-cache-restore.outputs.cache-primary-key }}

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-e2e-smoke-mobile-${{ github.run_id }}
          path: |
            target/e2e/login-responsive/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize E2E lane
        if: always()
        env:
          DOWNLOAD_SECONDS: ${{ steps.transfer.outputs.seconds }}
          DOWNLOAD_BYTES: ${{ steps.transfer.outputs.bytes }}
          LOAD_SECONDS: ${{ steps.load-artifacts.outputs.duration_seconds }}
          VERIFY_SECONDS: ${{ steps.load-artifacts.outputs.verification_seconds }}
          CLI_EXTRACT_SECONDS: ${{ steps.load-artifacts.outputs.cli_extract_seconds }}
          IMAGE_LOAD_SECONDS: ${{ steps.load-artifacts.outputs.image_load_seconds }}
          E2E_SECONDS: ${{ steps.e2e.outputs.duration_seconds }}
        run: |
          {
            echo "## Smoke and mobile E2E timing"
            echo
            echo "- Artifact download: ${DOWNLOAD_SECONDS:-n/a}s / ${DOWNLOAD_BYTES:-n/a} bytes"
            echo "- Artifact verification: ${VERIFY_SECONDS:-n/a}s"
            echo "- CLI extraction: ${CLI_EXTRACT_SECONDS:-n/a}s"
            echo "- Docker image load: ${IMAGE_LOAD_SECONDS:-n/a}s"
            echo "- Total artifact load step: ${LOAD_SECONDS:-n/a}s"
            echo "- E2E lane: ${E2E_SECONDS:-n/a}s"
          } >>"$GITHUB_STEP_SUMMARY"

