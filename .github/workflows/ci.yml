name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  required:
    name: ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/local/lib/android /usr/share/dotnet
          sudo docker system prune --all --force
          df -h

      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v3
        with:
          install: true
          cache: true

      - name: Install Rust CI components
        run: rustup component add rustfmt clippy && rustup target add wasm32-unknown-unknown

      - name: Run pull request gate
        if: github.event_name == 'pull_request'
        run: mise run ci

      - name: Run merge gate
        if: github.event_name == 'merge_group' || github.event_name == 'push'
        run: mise run ci:merge
