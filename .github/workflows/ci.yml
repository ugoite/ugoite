  docsite-nav:
    name: ci-docsite-nav
    needs: impact
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_docsite_nav == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Deno and Playwright cache paths
        run: |
          echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >>"$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/playwright-browsers" >>"$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: deno
          cache: true

      - name: Resolve Deno version
        id: deno-version
        run: echo "version=$(deno --version | awk 'NR==1 { print $2 }')" >>"$GITHUB_OUTPUT"

      - name: Restore Deno cache
        id: deno-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-cache
          key: deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-

      - name: Restore Playwright browser cache
        id: playwright-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/deno.json', 'deno.lock') }}
          restore-keys: |
            playwright-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run docsite navigation and link checks
        id: docsite-nav
        run: scripts/measure-step.sh docsite-nav mise run ci:lane:docsite-nav

      - name: Summarize docsite navigation
        if: always()
        env:
          DURATION_SECONDS: ${{ steps.docsite-nav.outputs.duration_seconds }}
        run: |
          echo "- docsite navigation duration: ${DURATION_SECONDS:-n/a}s" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload docsite navigation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docsite-navigation-evidence-${{ github.run_id }}
          path: e2e/test-results/docsite-navigation-junit.xml
          if-no-files-found: ignore

  pr-context-report:
    name: ci-pr-context-report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate PR Context Report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/pr-context-report
          scripts/mitase report pr --base "$BASE_SHA" --head "$HEAD_SHA" --format json >target/pr-context-report/report.json
          scripts/mitase report pr --base "$BASE_SHA" --head "$HEAD_SHA" --format markdown >target/pr-context-report/report.md
          cat target/pr-context-report/report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload PR Context Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-context-report
          path: target/pr-context-report/
          if-no-files-found: error

  cp1-acceptance:
    name: ci-cp1-acceptance
    needs: [impact, artifact-build]
    if: needs.impact.result == 'success' && needs.impact.outputs.plan_cp1_acceptance == 'true' && needs.artifact-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_ENFORCE_CI_GATES: "true"
      UGOITE_SKIP_PLAYWRIGHT_DEPS: "1"
      UGOITE_SOURCE_SHA: ${{ github.sha }}
      UGOITE_CI_RUN_ID: ${{ github.run_id }}
      UGOITE_ARTIFACT_SELECTION: cli
      UGOITE_SQL_EXPORT_CLI_BINARY: ${{ github.workspace }}/target/rust/release/ugoite
      UGOITE_SQL_EXPORT_CLI_LOAD_RESOURCE: target/cp1-profiling/sql-export-cli-load.time.txt
      UGOITE_SQL_EXPORT_CLI_TRANSFER_REPORT: target/cp1-profiling/sql-export-cli-transfer.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install Rust CI components
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Configure Deno and Playwright cache paths
        run: |
          echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >>"$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/playwright-browsers" >>"$GITHUB_ENV"

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-bin: "false"
          shared-key: "cargo-deps"
          add-job-id-key: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/deno.json', 'deno.lock') }}
          restore-keys: playwright-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright browser dependencies
        run: deno task e2e:install:browsers

      - name: Start SQL export CLI artifact transfer measurement
        id: cli-transfer-start
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-artifact-manifest
          path: target/artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ugoite-cli-linux
          path: target/artifacts/cli

      - name: Record SQL export CLI artifact transfer
        id: cli-transfer
        env:
          START_EPOCH: ${{ steps.cli-transfer-start.outputs.epoch }}
        run: |
          echo "download_action_seconds=$(( $(date +%s) - START_EPOCH ))" >>"$GITHUB_OUTPUT"
          echo "downloaded_logical_bytes=$(du -sb target/artifacts/cli target/artifacts/manifest.json target/artifacts/SHA256SUMS | awk '{sum += $1} END {printf "%.0f", sum}')" >>"$GITHUB_OUTPUT"

      - name: Verify and load the exact CLI artifact
        id: cli-load
        run: bash scripts/measure-process-resources.sh target/cp1-profiling/sql-export-cli-load.time.txt mise run ci:artifacts:load

      - name: Record SQL export CLI artifact evidence
        env:
          DOWNLOAD_ACTION_SECONDS: ${{ steps.cli-transfer.outputs.download_action_seconds }}
          DOWNLOADED_LOGICAL_BYTES: ${{ steps.cli-transfer.outputs.downloaded_logical_bytes }}
          VERIFICATION_SECONDS: ${{ steps.cli-load.outputs.verification_seconds }}
          EXTRACTION_SECONDS: ${{ steps.cli-load.outputs.cli_extract_seconds }}
        run: |
          mkdir -p target/cp1-profiling
          cat >target/cp1-profiling/sql-export-cli-transfer.json <<EOF
          {
            "selection": "cli",
            "download_action_seconds": ${DOWNLOAD_ACTION_SECONDS},
            "downloaded_logical_bytes": ${DOWNLOADED_LOGICAL_BYTES},
            "verification_seconds": ${VERIFICATION_SECONDS},
            "extraction_seconds": ${EXTRACTION_SECONDS}
          }
          EOF

      - name: Run fixed 10k/two-Space query and bounded export acceptance
        run: scripts/measure-step.sh cp1-acceptance mise run ci:lane:cp1-acceptance

      - name: Upload CP1 acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ugoite-cp1-acceptance-${{ github.run_id }}
          path: |
            target/cp1-profiling/
            target/query-surfaces-measurement.json
            target/sql-export-measurement/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: ci-required
    if: ${{ always() }}
    needs: [impact, rust-check, rust-test, web, artifact-build, e2e-smoke-mobile, e2e-owner, e2e-portable, docsite-nav, cp1-acceptance, pr-context-report]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-gate-check.sh
          sparse-checkout-cone-mode: false

      - name: Validate CI lane plan and required results
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          IMPACT_PLAN_STATUS: ${{ needs.impact.outputs.plan_status }}
          IMPACT_PLAN_SCOPE: ${{ needs.impact.outputs.plan_scope }}
          IMPACT_JOBS_SKIPPED: ${{ needs.impact.outputs.jobs_skipped }}
          PLAN_RUST_CHECK: ${{ needs.impact.outputs.plan_rust_check }}
          PLAN_RUST_TEST: ${{ needs.impact.outputs.plan_rust_test }}
          PLAN_WEB: ${{ needs.impact.outputs.plan_web }}
          PLAN_ARTIFACTS: ${{ needs.impact.outputs.plan_artifacts }}
          PLAN_DOCSITE_NAV: ${{ needs.impact.outputs.plan_docsite_nav }}
          PLAN_CP1_ACCEPTANCE: ${{ needs.impact.outputs.plan_cp1_acceptance }}
          RUST_CHECK_RESULT: ${{ needs.rust-check.result }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ARTIFACT_BUILD_RESULT: ${{ needs.artifact-build.result }}
          E2E_SMOKE_MOBILE_RESULT: ${{ needs.e2e-smoke-mobile.result }}
          E2E_OWNER_RESULT: ${{ needs.e2e-owner.result }}
          E2E_PORTABLE_RESULT: ${{ needs.e2e-portable.result }}
          DOCSITE_NAV_RESULT: ${{ needs.docsite-nav.result }}
          CP1_ACCEPTANCE_RESULT: ${{ needs.cp1-acceptance.result }}
          PR_CONTEXT_RESULT: ${{ needs.pr-context-report.result }}
        run: scripts/ci-gate-check.sh
