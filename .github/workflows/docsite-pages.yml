name: Docsite Pages

# Stable docs deploy only from a published release tag. Main-branch CI builds
# and verifies the docsite but never promotes it to Pages, so the site root
# never presents unreleased main docs as the latest published release.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to render stable docs from (for example v0.2.1)
        required: true
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      pages_configured: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${RELEASE_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            echo "unsupported trigger: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi
          if ! [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be stable release SemVer vX.Y.Z, got '${tag}'" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Manual deploys stay fail-closed: only an actually published
            # release may render stable docs.
            gh release view "${tag}" --json tagName >/dev/null
          fi
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Checkout release tag bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag source carries its own release identity
        id: identity
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          version="${tag#v}"
          actual="$(tr -d '[:space:]' <version.txt)"
          if [[ "${actual}" != "${version}" ]]; then
            echo "version.txt (${actual}) does not match release tag (${tag})" >&2
            exit 1
          fi
          if [[ ! -f "docs/version/releases/v${version}.md" ]]; then
            echo "docs/version/releases/v${version}.md is missing at ${tag}" >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "$(git rev-list -n 1 "${tag}")" != "${source_sha}" ]]; then
            echo "checkout HEAD is not release tag ${tag}" >&2
            exit 1
          fi
          echo "source_sha=${source_sha}" >>"${GITHUB_OUTPUT}"

      - name: Configure Deno cache path
        run: echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >>"$GITHUB_ENV"

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          install_args: deno
          cache: true

      - name: Resolve Deno version
        id: deno-version
        run: echo "version=$(deno --version | awk 'NR==1 { print $2 }')" >>"$GITHUB_OUTPUT"

      - name: Restore Deno cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-cache
          key: deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-

      - name: Resolve Pages metadata
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Report unavailable Pages promotion
        if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is not configured; skipping stable docsite deployment."

      - name: Build stable docsite from release tag
        if: steps.pages.outcome == 'success'
        env:
          PAGE_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          if [[ -n "${PAGE_BASE_PATH}" ]]; then
            docsite_base="${PAGE_BASE_PATH%/}/"
          else
            docsite_base="/"
          fi
          DOCSITE_ORIGIN="${PAGE_ORIGIN}" DOCSITE_BASE="${docsite_base}" mise run build:docsite

      - name: Validate stable docsite build
        if: steps.pages.outcome == 'success'
        run: |
          set -euo pipefail
          index="docsite/dist/index.html"
          if [[ ! -f "${index}" ]]; then
            echo "docsite build is missing top-level index.html" >&2
            exit 1
          fi
          if [[ ! -s "${index}" ]]; then
            echo "docsite index.html is empty" >&2
            exit 1
          fi
          for forbidden in "localhost" "127.0.0.1" "example.invalid"; do
            if grep -q "${forbidden}" "${index}"; then
              echo "docsite index.html contains forbidden origin text '${forbidden}'" >&2
              exit 1
            fi
          done

      - name: Record stable docsite source
        if: steps.pages.outcome == 'success'
        run: |
          {
            echo "Stable docsite source: tag \`${{ steps.resolve.outputs.tag }}\` (\`${{ steps.identity.outputs.source_sha }}\`)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docsite/dist

  deploy:
    if: needs.build.outputs.pages_configured == 'true'
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
