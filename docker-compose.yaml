services:
  ugoite:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - target: 8000
        published: 0
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./spaces:/data
    environment:
      - UGOITE_ROOT=/data
      - UGOITE_SERVER_ADDRESS=0.0.0.0:8000
      - UGOITE_STATIC_DIR=/app/static
      - UGOITE_BOOTSTRAP_DEFAULT_SPACE=true
      - UGOITE_DEV_AUTH_MODE=mock-oauth
      - UGOITE_DEV_USER_ID=${UGOITE_DEV_USER_ID:-dev-local-user}
      - UGOITE_BOOTSTRAP_TOKEN=${UGOITE_BOOTSTRAP_TOKEN:-dev-token}
