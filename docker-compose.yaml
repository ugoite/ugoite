services:
  ugoite:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - target: 8000
        published: ${UGOITE_PORT:-8000}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - "${UGOITE_DATA_DIR:-./data}:/data"
    environment:
      - UGOITE_ROOT=/data
      - UGOITE_SERVER_ADDRESS=0.0.0.0:8000
      - UGOITE_STATIC_DIR=/app/static
      - UGOITE_PUBLIC_ORIGIN=${UGOITE_PUBLIC_ORIGIN:-http://localhost:8000}
      - UGOITE_API_BASE_URL=${UGOITE_API_BASE_URL:-http://localhost:8000/api}
      - UGOITE_WEBAUTHN_RP_ID=${UGOITE_WEBAUTHN_RP_ID:-localhost}
      - UGOITE_NODE_SECRET_KEY=${UGOITE_NODE_SECRET_KEY:?set UGOITE_NODE_SECRET_KEY to at least 32 random bytes}
