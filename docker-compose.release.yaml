services:
  ugoite:
    image: ghcr.io/ugoite/ugoite:${UGOITE_VERSION:?set UGOITE_VERSION}
    ports:
      - "127.0.0.1:${UGOITE_PORT:-8000}:8000"
    volumes:
      - "${UGOITE_SPACES_DIR:-./spaces}:/data"
    environment:
      - UGOITE_ROOT=/data
      - UGOITE_SERVER_ADDRESS=0.0.0.0:8000
      - UGOITE_STATIC_DIR=/app/static
      - UGOITE_BOOTSTRAP_DEFAULT_SPACE=true
      - UGOITE_DEV_AUTH_MODE=${UGOITE_DEV_AUTH_MODE:-mock-oauth}
      - UGOITE_DEV_USER_ID=${UGOITE_DEV_USER_ID:-dev-local-user}
      - UGOITE_BOOTSTRAP_TOKEN=${UGOITE_BOOTSTRAP_TOKEN:-dev-token}
