validation:
  preset: strict
  readiness:
    target: traceable
    probes:
      implemented_criteria:
        - criterion: REQ-SRCH-002#criterion.current-entry-scan
          level: verifiable
        - criterion: REQ-ENTRY-001#criterion.creation
          level: verifiable
        - criterion: REQ-FORM-002#criterion.preserve-physical-fields
          level: verifiable
    limits: { max_ownership_scope_units: 64 }
  changed:
    baseline: { strategy: parent }
    require_owned_changes: false
verification:
  runners:
    cargo-test-integration:
      executable: cargo
      arguments: [test, -p, "{package}", --test, "{harness}", "{test}", --, --exact]
    cargo-test-unit:
      executable: cargo
      arguments: [test, -p, "{package}", "{test}", --, --exact]
    frontend-vitest:
      executable: deno
      arguments: [task, --cwd, frontend, test, "src/routes/spaces/[space_id]/search.test.tsx", --testNamePattern, "{test}"]
    frontend-vitest-file:
      executable: deno
      arguments: [task, --cwd, frontend, test, "{file}", --testNamePattern, "{test}"]
    e2e-playwright:
      executable: deno
      arguments: [run, --node-modules-dir=none, -A, npm:@playwright/test@^1.60.0, test, --config, e2e/playwright.config.ts, "{file}", --grep, "{test}"]
    docsite-vitest:
      executable: deno
      arguments: [task, --cwd, docsite, test, src/ssot.test.ts, --testNamePattern, "{test}"]
    docsite-vitest-file:
      executable: deno
      arguments: [task, --cwd, docsite, test, "{file}", --testNamePattern, "{test}"]
    deno-test-file:
      executable: deno
      arguments: [test, -A, --filter, "{test}", "{file}"]
