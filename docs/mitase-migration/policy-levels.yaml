schema: ugoite/migration/v1
kind: policy-level-decisions
source:
  legacy_policy_registry: docs/spec/policies/policies.yaml
  legacy_normative_strength: not-declared
  decision_owner: Ugoite repository governance
decisions:
  - policy: POL-000
    level: must
    basis: Foundation precedence and the repository authority boundary are non-optional.
  - policy: POL-001
    level: should
    basis: Portability is a design objective whose concrete trade-offs remain context-dependent.
  - policy: POL-002
    level: must
    basis: Durable product logic must remain in the canonical core rather than diverging in adapters.
  - policy: POL-003
    level: should
    basis: Minimal topology is an architectural preference subject to documented deployment constraints.
  - policy: POL-004
    level: must
    basis: The server must remain an adapter and security boundary rather than a second logic owner.
  - policy: POL-005
    level: should
    basis: The CLI is a preferred explicit operator surface, while other surfaces remain valid.
  - policy: POL-006
    level: must
    basis: Frontend behavior must follow shared contracts without creating a parallel semantic authority.
  - policy: POL-007
    level: must
    basis: Typed Form and Entry schema behavior is part of the durable Knowledge boundary.
  - policy: POL-008
    level: must
    basis: Requirement-to-test traceability must remain machine-readable and continuously checkable.
  - policy: POL-009
    level: must
    basis: Required quality gates must run before product changes become shared behavior.
  - policy: POL-010
    level: must
    basis: AI-assisted operation must remain inside explicit trusted tooling and interfaces.
  - policy: POL-011
    level: must
    basis: Security, isolation, and trust boundaries are baseline constraints.
  - policy: POL-012
    level: must
    basis: Search and typed references are core Knowledge operations, not optional convenience behavior.
  - policy: POL-013
    level: must
    basis: Product evolution must remain specification-first so implementation drift is visible.
  - policy: POL-014
    level: must
    basis: Compatibility changes require explicit review and visible evolution across layers.
  - policy: POL-015
    level: should
    basis: MCP is the current AI operator surface, while its future scope remains intentionally constrained.
  - policy: POL-016
    level: must
    basis: The v0.1 Knowledge compatibility floor protects ownership, authority, history, and adapter semantics.
