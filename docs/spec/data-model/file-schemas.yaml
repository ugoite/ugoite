version: '0.3'
updated: 2026-06
schemas:
  space_meta:
    description: Raw Space metadata written at creation.
    path: spaces/{id}/meta.json
    schema:
      type: object
      required:
      - id
      - name
      - created_at
      - storage
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: number
        storage:
          type: object
          required:
          - type
          - root
          properties:
            type:
              type: string
            root:
              type: string
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  space_settings:
    description: Space settings. Membership objects are added lazily by dedicated
      collaboration operations.
    path: spaces/{id}/settings.json
    schema:
      type: object
      required:
      - default_form
      properties:
        default_form:
          type: string
        members:
          type: object
          additionalProperties:
            type: object
        member_invitations:
          type: object
          additionalProperties:
            type: object
        membership_version:
          type: integer
  user_preferences:
    description: Portable user-scoped browser preferences.
    path: users/{sha256(user_id)}/preferences.json
    schema:
      type: object
      properties:
        selected_space_id:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
          enum:
          - en
          - ja
          - null
        ui_theme:
          type:
          - string
          - 'null'
          enum:
          - materialize
          - classic
          - pop
          - null
        color_mode:
          type:
          - string
          - 'null'
          enum:
          - light
          - dark
          - null
        primary_color:
          type:
          - string
          - 'null'
          enum:
          - violet
          - blue
          - emerald
          - amber
          - null
        content_width:
          type:
          - string
          - 'null'
          enum:
          - standard
          - wide
          - null
  response_hmac:
    description: Lazily created response-signing material.
    path: spaces/{id}/hmac.json
    schema:
      type: object
      required:
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  form_definition:
    description: Normalized Form definition persisted through Iceberg metadata.
    path: iceberg://spaces/{space_id}/form_{form_id}
    schema:
      type: object
      required:
      - id
      - name
      - version
      - fields
      - allow_extra_attributes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        allow_extra_attributes:
          type: string
          enum:
          - deny
          - allow_json
          - allow_columns
        fields:
          type: object
          additionalProperties:
            type: object
            required:
            - id
            - type
            properties:
              id:
                type: integer
                minimum: 100
              type:
                type: string
              required:
                type: boolean
              target_form:
                type: string
              default: {}
  iceberg_catalog_pointers:
    description: Versioned Catalog pointer manifest used by portable local Spaces; it replaces metadata-directory discovery.
    path: spaces/{id}/forms/catalog-pointers.v1.json
    schema:
      type: object
      required: [version, tables]
      properties:
        version:
          const: 1
        tables:
          type: array
          items:
            type: object
            required: [namespace, table, metadata_location]
            properties:
              namespace:
                type: array
                items: {type: string}
              table: {type: string}
              metadata_location: {type: string}
  materialized_view_meta:
    description: Metadata-only placeholder; no result rows.
    path: spaces/{id}/materialized_views/{sql_id}/meta.json
    schema:
      type: object
      required:
      - sql_id
      - sql
      - created_at
      - updated_at
      - snapshot_id
      properties:
        sql_id:
          type: string
        sql:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        snapshot_id:
          type: integer
  sql_session_meta:
    description: SQL session metadata; count and rows are evaluated on demand.
    path: spaces/{id}/sql_sessions/{session_id}/meta.json
    schema:
      type: object
      required:
      - id
      - space_id
      - sql_id
      - sql
      - status
      - created_at
      - expires_at
      - view
      - pagination
      - count
      properties:
        id:
          type: string
        space_id:
          type: string
        sql_id:
          type: string
        sql:
          type: string
        status:
          type: string
          enum:
          - ready
          - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        view:
          type: object
        pagination:
          type: object
        count:
          type: object
  entry_revision:
    description: Authoritative append-only Entry revision for one stable Form ID. Core writes this schema through ugoite-iceberg.
    path: iceberg://spaces/{space_id}/form_{form_id}
    schema:
      type: object
      required:
      - revision_id
      - entry_id
      - entry_version
      - operation
      - committed_at
      - author_id
      - form_version
      - source_kind
      properties:
        revision_id: {}
        entry_id: {}
        parent_revision_id: {}
        entry_version: {}
        operation:
          enum: [upsert, delete, restore]
        committed_at: {}
        author_id: {}
        form_version: {}
        source_kind: {}
        source_id: {}
        extra_attributes: {}
        extension_metadata: {}
