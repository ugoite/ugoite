version: '0.3'
updated: 2026-06
schemas:
  space_meta:
    description: Raw Space metadata written at creation.
    path: spaces/{id}/meta.json
    schema:
      type: object
      required:
      - id
      - name
      - created_at
      - storage
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: number
        storage:
          type: object
          required:
          - type
          - root
          properties:
            type:
              type: string
            root:
              type: string
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  space_settings:
    description: Space settings. Membership objects are added lazily by dedicated
      collaboration operations.
    path: spaces/{id}/settings.json
    schema:
      type: object
      required:
      - default_form
      properties:
        default_form:
          type: string
        members:
          type: object
          additionalProperties:
            type: object
        member_invitations:
          type: object
          additionalProperties:
            type: object
        membership_version:
          type: integer
  user_preferences:
    description: Portable user-scoped browser preferences.
    path: users/{sha256(user_id)}/preferences.json
    schema:
      type: object
      properties:
        selected_space_id:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
          enum:
          - en
          - ja
          - null
        ui_theme:
          type:
          - string
          - 'null'
          enum:
          - materialize
          - classic
          - pop
          - null
        color_mode:
          type:
          - string
          - 'null'
          enum:
          - light
          - dark
          - null
        primary_color:
          type:
          - string
          - 'null'
          enum:
          - violet
          - blue
          - emerald
          - amber
          - null
  response_hmac:
    description: Lazily created response-signing material.
    path: spaces/{id}/hmac.json
    schema:
      type: object
      required:
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  form_definition:
    description: Normalized Form definition persisted through Iceberg metadata.
    path: iceberg://forms/{name}
    schema:
      type: object
      required:
      - name
      - version
      - fields
      - allow_extra_attributes
      properties:
        name:
          type: string
        version:
          type: integer
        allow_extra_attributes:
          type: string
          enum:
          - deny
          - allow_json
          - allow_columns
        fields:
          type: object
          additionalProperties:
            type: object
            required:
            - type
            properties:
              type:
                type: string
              required:
                type: boolean
              target_form:
                type: string
              default: {}
  materialized_view_meta:
    description: Metadata-only placeholder; no result rows.
    path: spaces/{id}/materialized_views/{sql_id}/meta.json
    schema:
      type: object
      required:
      - sql_id
      - sql
      - created_at
      - updated_at
      - snapshot_id
      properties:
        sql_id:
          type: string
        sql:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        snapshot_id:
          type: integer
  sql_session_meta:
    description: SQL session metadata; count and rows are evaluated on demand.
    path: spaces/{id}/sql_sessions/{session_id}/meta.json
    schema:
      type: object
      required:
      - id
      - space_id
      - sql_id
      - sql
      - status
      - created_at
      - expires_at
      - view
      - pagination
      - count
      properties:
        id:
          type: string
        space_id:
          type: string
        sql_id:
          type: string
        sql:
          type: string
        status:
          type: string
          enum:
          - ready
          - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        view:
          type: object
        pagination:
          type: object
        count:
          type: object
  entry_row:
    description: Logical current Entry row for one Form.
    path: iceberg://forms/{name}/entries
    schema:
      type: object
      required:
      - entry_id
      - title
      - form
      - created_at
      - updated_at
      - fields
      - revision_id
      - author
      properties:
        entry_id: {}
        title: {}
        form: {}
        tags: {}
        links: {}
        created_at: {}
        updated_at: {}
        fields: {}
        extra_attributes: {}
        revision_id: {}
        parent_revision_id: {}
        assets: {}
        integrity: {}
        deleted: {}
        deleted_at: {}
        author: {}
  revision_row:
    description: Logical append-only revision row for one Form.
    path: iceberg://forms/{name}/revisions
    schema:
      type: object
      required:
      - revision_id
      - entry_id
      - timestamp
      - author
      - fields
      - markdown_checksum
      properties:
        revision_id: {}
        entry_id: {}
        parent_revision_id: {}
        timestamp: {}
        author: {}
        fields: {}
        extra_attributes: {}
        markdown_checksum: {}
        integrity: {}
        restored_from: {}
