version: '0.4'
updated: 2026-08-13
schemas:
  derived_relation_head:
    description: Relation-local visibility coordinate for the current immutable Iceberg build. It is not Catalog or checkpoint authority.
    path: spaces/{id}/_ugoite/derived/relations/{relation_id}/head.json
    schema:
      type: object
      additionalProperties: false
      required:
      - format_version
      - space_id
      - relation_id
      - generation
      - definition_version
      - definition_fingerprint
      - producer_id
      - producer_fingerprint
      - compatibility_epoch
      - build_id
      - table_identifier
      - table_uuid
      - metadata_location
      - snapshot_id
      - schema_id
      - input_digest
      - source_coordinate
      - head_fence
      - checksum
      properties:
        format_version: {type: integer, const: 1}
        space_id: {type: string}
        relation_id: {type: string, format: uuid}
        generation: {type: integer}
        definition_version: {type: integer}
        definition_fingerprint: {type: string}
        producer_id: {type: string}
        producer_fingerprint: {type: string}
        compatibility_epoch: {type: integer}
        build_id:
          type: string
          format: uuid
          description: Immutable UUIDv7 build identity. Producers and readers must reject non-UUIDv7 values.
        table_identifier: {type: object}
        table_uuid: {type: string, format: uuid}
        metadata_location: {type: string}
        snapshot_id: {type: [integer, 'null']}
        schema_id: {type: integer}
        input_digest: {type: string}
        source_coordinate: {type: object}
        head_fence: {type: string}
        checksum: {type: string}
  space_meta:
    description: Raw Space metadata written at creation.
    path: spaces/{id}/meta.json
    schema:
      type: object
      required:
      - schema_version
      - space_id
      - space_uid
      - slug
      - id
      - name
      - created_at
      - storage
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        schema_version:
          type: integer
          const: 2
        space_id:
          type: string
        space_uid:
          type: string
          format: uuid
          description: Immutable UUIDv7 Space identity.
        slug:
          type: string
        id:
          type: string
        name:
          type: string
        created_at:
          type: number
        storage:
          type: object
          required:
          - type
          - root
          properties:
            type:
              type: string
            root:
              type: string
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  space_settings:
    description: Current Space settings. Portable membership and authorization
      state is stored in security/principals.json; legacy membership-shaped keys
      are unsupported.
    path: spaces/{id}/settings.json
    schema:
      type: object
      required:
      - default_form
      properties:
        default_form:
          type: string
  user_preferences:
    description: Portable user-scoped browser preferences.
    path: users/{sha256(user_id)}/preferences.json
    schema:
      type: object
      properties:
        selected_space_id:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
          enum:
          - en
          - ja
          - null
        ui_theme:
          type:
          - string
          - 'null'
          enum:
          - materialize
          - classic
          - pop
          - null
        color_mode:
          type:
          - string
          - 'null'
          enum:
          - light
          - dark
          - null
        primary_color:
          type:
          - string
          - 'null'
          enum:
          - violet
          - blue
          - emerald
          - amber
          - null
        content_width:
          type:
          - string
          - 'null'
          enum:
          - standard
          - wide
          - null
  response_hmac:
    description: Lazily created response-signing material.
    path: spaces/{id}/hmac.json
    schema:
      type: object
      required:
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  node_response_hmac:
    description: Lazily created Node-default response-signing material. This is
      Node-local and is not included in a Space export.
    path: response_hmac/default.json
    schema:
      type: object
      required:
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  form_definition:
    description: Normalized Form definition persisted through Iceberg metadata.
    path: iceberg://spaces/{space_id}/form_{form_id}
    schema:
      type: object
      required:
      - id
      - name
      - version
      - fields
      - allow_extra_attributes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        allow_extra_attributes:
          type: string
          enum:
          - deny
          - allow_json
          - allow_columns
        fields:
          type: object
          additionalProperties:
            type: object
            required:
            - id
            - type
            properties:
              id:
                type: integer
                minimum: 100
              type:
                type: string
              required:
                type: boolean
              target_form:
                type: string
              default: {}
  iceberg_catalog_head:
    description: The sole mutable catalog root, conditionally read and published with an OpenDAL ETag.
    path: spaces/{id}/_ugoite/catalog/head.json
    schema:
      type: object
      required: [format_version, space_id, namespace, generation, form_registry_generation, tables, publication_location, publication_command_id, checksum]
      properties:
        format_version: {type: integer}
        space_id: {type: string}
        namespace:
          type: array
          items: {type: string}
        generation: {type: integer, minimum: 0}
        form_registry_generation: {type: integer, minimum: 0}
        tables:
          type: object
          additionalProperties:
            type: object
            required: [identifier, form_id, table_uuid, metadata_location]
            properties:
              identifier:
                type: object
                required: [namespace, table]
                properties:
                  namespace:
                    type: array
                    items: {type: string}
                  table: {type: string}
              form_id: {type: [string, 'null'], format: uuid}
              table_uuid: {type: string, format: uuid}
              metadata_location: {type: string}
        publication_location: {type: [string, 'null']}
        publication_command_id: {type: [string, 'null']}
        checksum: {type: string}
  iceberg_catalog_publication:
    description: Immutable Head-publication evidence linked from the current Catalog Head.
    path: spaces/{id}/_ugoite/catalog/publications/{generation}-{command_id}.json
    schema:
      type: object
      required: [generation, previous_generation, previous_publication, previous_head_checksum, command_id, command_kind, command_digest, affected_table, base_metadata_location, new_metadata_location, base_snapshot_id, base_schema_id, new_snapshot_id, new_schema_id, next_head_checksum, next_head, checksum]
      properties:
        generation: {type: integer, minimum: 0}
        previous_generation: {type: [integer, 'null']}
        previous_publication: {type: [string, 'null']}
        previous_head_checksum: {type: [string, 'null']}
        command_id: {type: string}
        command_kind: {type: string}
        command_digest: {type: string}
        affected_table:
          type: object
          required: [namespace, table]
          properties:
            namespace:
              type: array
              items: {type: string}
            table: {type: string}
        base_metadata_location: {type: [string, 'null']}
        new_metadata_location: {type: string}
        base_snapshot_id: {type: [integer, 'null']}
        base_schema_id: {type: [integer, 'null']}
        new_snapshot_id: {type: [integer, 'null']}
        new_schema_id: {type: integer}
        next_head_checksum: {type: string}
        next_head: {type: object}
        checksum: {type: string}
  sql_session_meta:
    description: SQL session metadata; count and rows are evaluated on demand.
    path: spaces/{id}/sql_sessions/{session_id}/meta.json
    schema:
      type: object
      required:
      - id
      - space_id
      - sql_id
      - sql
      - status
      - created_at
      - expires_at
      - checkpoint
      - query_policy
      - pagination
      - count
      properties:
        id:
          type: string
        space_id:
          type: string
        sql_id:
          type: string
        sql:
          type: string
        status:
          type: string
          enum:
          - ready
          - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        checkpoint:
          type: object
        query_policy:
          description: Derived checkpoint-pinned single-Form, column, and sparse Entry-denial policy cache. It is never execution or Catalog authority; every use rebuilds and compares it from the immutable checkpoint and current authorization state, and it does not list every readable Entry.
          type: object
        pagination:
          type: object
        count:
          type: object
  entry_revision:
    description: Authoritative append-only Entry revision for one stable Form ID. Core writes this schema through ugoite-iceberg.
    path: iceberg://spaces/{space_id}/form_{form_id}
    schema:
      type: object
      required:
      - revision_id
      - entry_id
      - entry_version
      - operation
      - committed_at
      - author_id
      - ugoite_entry_updated_by
      - form_version
      - source_kind
      properties:
        revision_id: {}
        entry_id: {}
        parent_revision_id: {}
        entry_version: {}
        operation:
          enum: [upsert, delete, restore]
        committed_at: {}
        author_id: {}
        ugoite_entry_updated_by:
          description: Principal that authored this revision, including delete and restore revisions.
        ugoite_entry_deleted_by:
          description: Principal that authored the current delete tombstone; null on non-delete revisions.
        form_version: {}
        source_kind: {}
        source_id: {}
        extra_attributes: {}
        extension_metadata: {}
