version: '0.3'
updated: 2026-06
schemas:
  space_meta:
    description: Raw Space metadata written at creation.
    path: spaces/{id}/meta.json
    schema:
      type: object
      required:
      - id
      - name
      - created_at
      - storage
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: number
        storage:
          type: object
          required:
          - type
          - root
          properties:
            type:
              type: string
            root:
              type: string
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  space_settings:
    description: Space settings. Membership objects are added lazily by dedicated
      collaboration operations.
    path: spaces/{id}/settings.json
    schema:
      type: object
      required:
      - default_form
      properties:
        default_form:
          type: string
        members:
          type: object
          additionalProperties:
            type: object
        member_invitations:
          type: object
          additionalProperties:
            type: object
        membership_version:
          type: integer
  user_preferences:
    description: Portable user-scoped browser preferences.
    path: users/{sha256(user_id)}/preferences.json
    schema:
      type: object
      properties:
        selected_space_id:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
          enum:
          - en
          - ja
          - null
        ui_theme:
          type:
          - string
          - 'null'
          enum:
          - materialize
          - classic
          - pop
          - null
        color_mode:
          type:
          - string
          - 'null'
          enum:
          - light
          - dark
          - null
        primary_color:
          type:
          - string
          - 'null'
          enum:
          - violet
          - blue
          - emerald
          - amber
          - null
        content_width:
          type:
          - string
          - 'null'
          enum:
          - standard
          - wide
          - null
  response_hmac:
    description: Lazily created response-signing material.
    path: spaces/{id}/hmac.json
    schema:
      type: object
      required:
      - hmac_key_id
      - hmac_key
      - last_rotation
      properties:
        hmac_key_id:
          type: string
        hmac_key:
          type: string
        last_rotation:
          type: string
          format: date-time
  form_definition:
    description: Normalized Form definition persisted through Iceberg metadata.
    path: iceberg://spaces/{space_id}/form_{form_id}
    schema:
      type: object
      required:
      - id
      - name
      - version
      - fields
      - allow_extra_attributes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        allow_extra_attributes:
          type: string
          enum:
          - deny
          - allow_json
          - allow_columns
        fields:
          type: object
          additionalProperties:
            type: object
            required:
            - id
            - type
            properties:
              id:
                type: integer
                minimum: 100
              type:
                type: string
              required:
                type: boolean
              target_form:
                type: string
              default: {}
  iceberg_catalog_head:
    description: The sole mutable catalog root, conditionally read and published with an OpenDAL ETag.
    path: spaces/{id}/_ugoite/catalog/head.json
    schema:
      type: object
      required: [format_version, space_id, namespace, generation, form_registry_generation, tables, publication_location, publication_command_id, checksum]
      properties:
        format_version: {type: integer}
        space_id: {type: string}
        namespace:
          type: array
          items: {type: string}
        generation: {type: integer, minimum: 0}
        form_registry_generation: {type: integer, minimum: 0}
        tables:
          type: object
          additionalProperties:
            type: object
            required: [identifier, form_id, table_uuid, metadata_location]
            properties:
              identifier:
                type: object
                required: [namespace, table]
                properties:
                  namespace:
                    type: array
                    items: {type: string}
                  table: {type: string}
              form_id: {type: [string, 'null'], format: uuid}
              table_uuid: {type: string, format: uuid}
              metadata_location: {type: string}
        publication_location: {type: [string, 'null']}
        publication_command_id: {type: [string, 'null']}
        checksum: {type: string}
  iceberg_catalog_publication:
    description: Immutable Head-publication evidence linked from the current Catalog Head.
    path: spaces/{id}/_ugoite/catalog/publications/{generation}-{command_id}.json
    schema:
      type: object
      required: [generation, previous_generation, previous_publication, previous_head_checksum, command_id, command_kind, command_digest, affected_table, base_metadata_location, new_metadata_location, base_snapshot_id, base_schema_id, new_snapshot_id, new_schema_id, next_head_checksum, next_head, checksum]
      properties:
        generation: {type: integer, minimum: 0}
        previous_generation: {type: [integer, 'null']}
        previous_publication: {type: [string, 'null']}
        previous_head_checksum: {type: [string, 'null']}
        command_id: {type: string}
        command_kind: {type: string}
        command_digest: {type: string}
        affected_table:
          type: object
          required: [namespace, table]
          properties:
            namespace:
              type: array
              items: {type: string}
            table: {type: string}
        base_metadata_location: {type: [string, 'null']}
        new_metadata_location: {type: string}
        base_snapshot_id: {type: [integer, 'null']}
        base_schema_id: {type: [integer, 'null']}
        new_snapshot_id: {type: [integer, 'null']}
        new_schema_id: {type: integer}
        next_head_checksum: {type: string}
        next_head: {type: object}
        checksum: {type: string}
  sql_session_meta:
    description: SQL session metadata; count and rows are evaluated on demand.
    path: spaces/{id}/sql_sessions/{session_id}/meta.json
    schema:
      type: object
      required:
      - id
      - space_id
      - sql_id
      - sql
      - status
      - created_at
      - expires_at
      - checkpoint
      - query_policy
      - pagination
      - count
      properties:
        id:
          type: string
        space_id:
          type: string
        sql_id:
          type: string
        sql:
          type: string
        status:
          type: string
          enum:
          - ready
          - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        checkpoint:
          type: object
        query_policy:
          description: Derived checkpoint-pinned Form, column, and Entry authorization policy. It is session metadata, never Catalog authority.
          type: object
        pagination:
          type: object
        count:
          type: object
  entry_revision:
    description: Authoritative append-only Entry revision for one stable Form ID. Core writes this schema through ugoite-iceberg.
    path: iceberg://spaces/{space_id}/form_{form_id}
    schema:
      type: object
      required:
      - revision_id
      - entry_id
      - entry_version
      - operation
      - committed_at
      - author_id
      - form_version
      - source_kind
      properties:
        revision_id: {}
        entry_id: {}
        parent_revision_id: {}
        entry_version: {}
        operation:
          enum: [upsert, delete, restore]
        committed_at: {}
        author_id: {}
        form_version: {}
        source_kind: {}
        source_id: {}
        extra_attributes: {}
        extension_metadata: {}
