version: 3
updated: 2026-08-26
roots:
- path: _ugoite/space-bindings
  kind: directory
  notes:
  - Node-local Space locators; excluded from portable Space exports.
- path: _ugoite/space-patches
  kind: directory
  notes:
  - Node-local Space patch journals and locks; excluded from portable Space exports.
- path: spaces
  kind: directory
  notes:
  - Space-owned data and metadata.
- path: response_hmac
  kind: directory
  notes:
  - Node-local response-signing material; excluded from Space exports.
- path: users
  kind: directory
  notes:
  - User-scoped portable preferences; created lazily.
space_layout:
  bootstrap:
    operation: create_space
    entries:
    - path: spaces/{space_id}
      kind: directory
    - path: spaces/{space_id}/meta.json
      kind: file
      schema: space_meta
    - path: spaces/{space_id}/settings.json
      kind: file
      schema: space_settings
    - path: spaces/{space_id}/_ugoite/catalog
      kind: directory
      notes:
      - Catalog Head is the sole mutable catalog authority.
    - path: spaces/{space_id}/_ugoite/catalog/head.json
      kind: file
      schema: iceberg_catalog_head
    - path_glob: spaces/{space_id}/_ugoite/catalog/publications/{generation}-{encoded_command_id}.json
      kind: file
      schema: iceberg_catalog_publication
      notes:
      - Immutable records are authoritative only when reachable from Head.
    - path: spaces/{space_id}/forms
      kind: directory
      notes:
      - Iceberg owns table data and metadata locations beneath the Space.
    - path: spaces/{space_id}/assets
      kind: directory
    - path: spaces/{space_id}/_ugoite/derived/relations
      kind: directory
      notes:
      - Lazy, non-authoritative DerivedRelation roots; absence is recoverable.
    - path: spaces/{space_id}/sql_sessions
      kind: directory
    post_bootstrap:
    - logical_resource: Entry Form
      notes:
      - Created through the Iceberg Form store with one Body markdown field.
  triggers:
    response_signing:
      operation: load_response_hmac_material
      entries:
      - path: spaces/{space_id}/hmac.json
        kind: file
        schema: response_hmac
      - path: response_hmac/default.json
        kind: file
        schema: node_response_hmac
    sql_session_creation:
      operation: create_sql_session
      entries:
      - path: spaces/{space_id}/sql_sessions/{session_id}/meta.json
        kind: file
        schema: sql_session_meta
    asset_save:
      operation: save_asset
      entries:
      - path_glob: spaces/{space_id}/assets/{asset_id}
        kind: file
    derived_relation_rebuild:
      operation: ugoite_index_run
      entries:
      - path: spaces/{space_id}/_ugoite/derived/relations/{relation_id}/head.json
        kind: file
        schema: derived_relation_head
      - path_glob: spaces/{space_id}/_ugoite/derived/relations/{relation_id}/builds/{build_id}
        kind: directory
        notes:
        - Official Iceberg metadata, manifests, and Parquet files are owned by Iceberg.
user_layout:
  trigger: patch_user_preferences
  entries:
  - path: users/{sha256(user_id)}/preferences.json
    kind: file
    schema: user_preferences
