version: '0.1'
updated: 2026-11
category: Advanced User Stories
stories:
- id: STORY-006
  title: Voice-to-Form
  type: BYOAI
  as_a: mobile user
  i_want: to record a voice memo and have my chosen AI assistant structure it
  so_that: 'I can use the best AI model available (Claude, GPT-4, etc.) without being locked into the app''s built-in
    model.

    '
  acceptance_criteria:
  - User records audio; app saves an AssetReference into a chosen Form field
  - User invokes their connected MCP Agent (e.g., "Format this voice entry")
  - Agent reads the transcript (via MCP), extracts fields, and updates the entry with H2 headers
  requirements:
  - REQ-ENTRY-008
  status: planned
  implementation_notes: The current MCP surface can read Entry resources and save Entry updates. Voice capture,
    transcription, and the recording-to-structured-Entry flow are not shipped.
  planned_capabilities:
  - voice capture, transcription, and structured Entry workflow
  available_api:
  - 'rest: POST /spaces/{space_id}/assets'
  - 'rest: PUT /spaces/{space_id}/entries/{entry_id}'
  - 'mcp: ugoite://entry/{id} resource and ugoite.save update tool'
- id: STORY-008
  title: Agentic Refactoring
  type: BYOAI
  as_a: user with a messy space
  i_want: to ask my AI agent to "clean up this folder"
  so_that: I can leverage external intelligence to organize my knowledge base on demand.
  acceptance_criteria:
  - MCP exposes Entry search, Entry and Form resources, and the existing save tool
  - User asks Agent: Find duplicates in Project X and merge them.
  - Agent proposes changes and the user reviews them before they are applied
  requirements: []
  status: planned
  implementation_notes: The authenticated MCP v1 surface already provides search/save/delete tools and lazy Entry,
    history, schema, and Form resources. Agent orchestration and a user confirmation workflow remain future work.
  planned_capabilities:
  - Agent orchestration and user-reviewed confirmation workflow
  available_api:
  - 'mcp: ugoite.search, ugoite.save, ugoite.delete, and lazy Entry/history/schema/Form resources'
- id: STORY-009
  title: Data Grid
  type: Form
  as_a: power user
  i_want: to view and edit my form data in a spreadsheet-like grid
  so_that: I can bulk edit, copy-paste to/from Excel, and manage data efficiently.
  acceptance_criteria:
  - Form Detail view presents a data grid
  - Drag Select: Users can drag to select multiple cells (rectangular selection) and copy
  - Inline Edit: Users can toggle Edit Mode and edit cells in place
  - Quick Add: Users can add a new row (Entry) directly from the grid view
  - Changes are saved immediately or on blur
  related_apis:
  - rest: PUT /spaces/{space_id}/entries/{entry_id}
  - rest: POST /spaces/{space_id}/entries
  requirements:
  - REQ-FE-030
  - REQ-FE-031
  status: implemented
