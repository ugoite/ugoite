version: '0.1'
updated: 2026-06
category: Core User Stories
stories:
- id: STORY-002
  title: Structured Freedom
  type: Form
  as_a: user
  i_want: to use standard Markdown headers to define data fields (e.g., `## Date`)
  so_that: 'I can manage structured data with the ease of writing text, without complex forms.

    '
  acceptance_criteria:
  - System parses H2 headers as property keys
  - Users can define Forms to enforce required headers and data types
  - Frontend provides validation warnings if an entry violates its Form definition
  - Creating an entry from a Form uses the fixed global template
  related_apis:
  - rest: POST /spaces/{space_id}/entries
  - rest: PUT /spaces/{space_id}/entries/{entry_id}
  - rest: GET /spaces/{space_id}/forms
  - mcp: ugoite://{space_id}/forms
  requirements:
  - REQ-ENTRY-006
  - REQ-IDX-002
  status: implemented
- id: STORY-003
  title: Bring Your Own Cloud
  type: Freedom
  as_a: privacy-conscious user
  i_want: to store my entries on my own S3 bucket or local NAS
  so_that: I have complete control over my data privacy and backup.
  acceptance_criteria:
  - Local filesystem and S3-compatible storage URIs are supported by the shared OpenDAL layer
  - A storage connection can be tested before use
  - Storage migration is an explicit operator procedure rather than an automatic PATCH side effect
  related_apis:
  - 'rest: PATCH /spaces/{space_id}'
  - 'rest: POST /spaces/{space_id}/test-connection'
  requirements:
  - REQ-STO-001
  - REQ-STO-006
  status: partial
  implementation_notes: Local and S3-compatible operators and connection testing exist. Changing a storage descriptor
    does not migrate existing data; operators must perform migration explicitly.
- id: STORY-004
  title: Time Travel
  type: Versioning
  as_a: user who made a mistake
  i_want: to view and restore previous versions of an entry
  so_that: I never lose important information.
  acceptance_criteria:
  - Every save creates a new immutable revision
  - UI allows browsing history and reverting
  related_apis:
  - rest: GET /spaces/{space_id}/entries/{entry_id}/history
  - rest: GET /spaces/{space_id}/entries/{entry_id}/history/{revision_id}
  - rest: POST /spaces/{space_id}/entries/{entry_id}/restore
  requirements:
  - REQ-ENTRY-005
  status: implemented
- id: STORY-005
  title: Search Across Everything
  type: Form
  as_a: user with many entries
  i_want: to search my entries by keywords and structured fields
  so_that: I can quickly find relevant information.
  acceptance_criteria:
  - Keyword search returns matching non-deleted entries
  - Structured queries filter current Entry data
  - The UI exposes keyword-first and advanced query flows
  related_apis:
  - rest: GET /spaces/{space_id}/search?q=query
  - rest: POST /spaces/{space_id}/query
  requirements:
  - REQ-IDX-003
  - REQ-IDX-004
  - REQ-IDX-007
  status: implemented
  implementation_notes: Keyword matching is case-insensitive substring search with unspecified ordering; relevance
    ranking is not implemented.
