version: "0.1"
updated: "2026-10-05"
component_group:
  id: composition-studio
  title: Composition Studio
  status: planned
  routes:
    - /spaces/{space_id}/compositions/new
    - /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
    - /spaces/{space_id}/compositions/{composition_id}/history
  notes: Authoring contract for the Composition Studio uplift. The New, Edit, and History routes each carry their page spec. Steady-state surfaces carry no explanatory paragraphs. Redesign direction is recorded in ADR-019 (Design/Data/Inspector modes over a first-class layout AST); the component contracts below describe the shipped Studio until the layout-v1 implementation lands.
components:
  - id: studio-header
    type: page-header
    ownership: tool-name-only
    actions:
      - id: studio-back
        type: icon-button
        title: Back
        single_control: true
      - id: studio-save
        type: icon-button
        title: Save
        single_control: true
        async_state: explicit-busy-without-layout-shift
        save_readiness: name-non-empty-plus-valid-refs-plus-exactly-once-placement-plus-no-dangling-plus-one-layout-item
        blocked_save: disabled-with-reason-in-accessible-name-and-title-no-prose
        source_only: cannot-save-canonical-parse-gated-at-save-with-allowlisted-summary
  - id: studio-data
    type: list
    title: Data
    status: implemented
    ownership: source-navigator-with-per-source-editor-for-selection-only
    label_kind: compact-section-label
    rows:
      selection: full-row-activate
      reorder: keyboard-operable-move-up-down
      remove: blocked-while-displays-reference-with-reason
      source_kinds: [saved-sql-exact-revision, entry-query]
      identity_display: human-name-only
      revision_identity: advanced-disclosure-only
    entry_query_editor:
      sections: [fields, filter, sort, result]
      semantics: existing-entry-query-vocabulary-only
      filter_operators: [equals, contains, lt, lte, gt, gte]
      sort_directions: [asc, desc]
      projection: [fields, preview]
      edits: draft-source-query-through-narrow-updaters
      unknown_operators: rejected-fail-closed
    saved_sql_viewer:
      sql: read-only-with-edit-saved-sql-action-to-existing-editor-route
      sections: [sql, variables, result-schema, result]
      reads: user-gated-sqlApi-get-plus-bounded-limit-1-probe-denied-concealed
      revision_update: explicit-exact-revision-only-no-latest-fallback
      composition_save: separate-explicit-action-never-conflated
    concealment: denied-or-missing-renders-source-unavailable-no-identifiers
    preview_discipline: existing-debounced-handle-only-no-second-path
    result_pages: bounded-shared-page-with-controller-owned-paging
    responsive:
      narrow: navigator-and-editor-stack
      narrow_width: 390px
    surface_tokens: fixed-only-no-raw-color
    async_state: explicit-loading-empty-error
  - id: studio-display
    type: list
    title: Display
    status: removed
    ownership: design-canvas-plus-inspector
    removal: legacy-display-list-removed-in-RA8-canvas-owns-add-remove-reorder-inspector-owns-label
    insertion_delegate: display-picker-at-canvas-target-only
    display_kinds: [table, metric]
    table_presentation:
      entry_query: EntryResultTable
      saved_sql: SqlResultTable
    metric_semantics: exact-scalar-no-aggregation
  - id: studio-parameters
    type: form
    title: Parameters
    status: implemented
    scope: data-mode-only
    disclosure: renders-only-with-at-least-one-source
    label_kind: compact-section-label
    binding: existing-composition-parameter-grammar-by-reference
    type_compatibility: rust-owned-diagnostics
  - id: studio-tags
    type: form
    title: Tags
    status: implemented
    scope: data-mode-only
    label_kind: compact-section-label
    semantics: entry-metadata-tags
  - id: studio-preview
    type: query-results
    title: Preview
    status: removed
    ownership: design-canvas-plus-data-workspace
    removal: legacy-preview-section-removed-in-UXB-canvas-previews-blocks-inline-per-source-results-page-in-workspace-resolve-diagnostics-in-strip
    execution: existing-entry-query-and-sql-query-operations-only
    rendering:
      mode: shared-composition-renderer
      stale_responses: generation-guarded
    async_state: explicit-loading-empty-error
  - id: studio-diagnostics
    type: query-results
    title: Diagnostics
    status: implemented
    ownership: shared-resolve-and-preview-diagnostics-in-every-mode
    source: debounced-shared-preview-handle-only-no-second-path
    rendering:
      mode: shared-composition-diagnostics-with-structural-alert-roles
      placement: above-mode-content-in-design-data-and-split
    async_state: explicit-loading-empty-error
  - id: studio-layout
    type: two-column-workspace
    desktop: editor-and-preview-split
    narrow: one-column-stacked
    narrow_width: 390px
    surface_tokens: fixed-only-no-raw-color
  - id: use-flow-renderer
    type: flow-layout
    title: Saved tool flow
    status: implemented
    ownership: renderer-only-no-authoring-affordances
    source: saved-tool-layout-rows-and-component-declarations
    rows:
      order: layout-row-array-then-item-order
      items: [parameter-control, text, metric, table]
    text:
      styles: [title, heading, body, caption]
      semantics: fixed-typography-no-markdown-no-source-fetch
    parameter_controls:
      order: layout-placement-first
      labels: declared-human-label
      state: transient-work-never-stored
    metric_semantics: exact-scalar-no-aggregation
    table_presentation:
      entry_query: EntryResultTable
      saved_sql: SqlResultTable
      overflow: own-viewport-only-no-document-scroll
    responsive:
      desktop: row-items-inline
      narrow: wrap-stack
      narrow_width: 390px
    surface_tokens: fixed-only-no-raw-color
    async_state: explicit-loading-empty-error
  - id: design-canvas
    type: flow-layout
    title: Design canvas
    status: implemented
    ownership: shared-flow-item-presenter-with-edit-only-affordances
    source: draft-components-and-layout-rows-with-debounced-shared-preview
    blank_state: single-add-data-action-opens-source-picker-no-prose
    blank_scope: zero-sources-and-zero-blocks-normal-canvas-after-first-source
    rows:
      order: layout-row-array-then-item-order
      reorder: keyboard-operable-move-up-down-buttons
      cross_row_item_moves: unsupported-insertion-targets-instead
      items: [parameter-control, text, metric, table]
    selection:
      scope: transient-work-component-parameter-identity-only
      affordance: outline-with-pressed-toggle-and-visible-focus
      inspector_handoff: selected-block-identity-only
      inspector_handoff_narrow: block-tap-opens-bottom-sheet-below-560px
    insertion:
      control: single-add-control-per-gap
      palette: modal-dialog-with-backdrop-escape-focus-trap-and-focus-return
      palette_entries: [
        text-always,
        metric-table-only-with-sources,
        parameters-only-with-parameters,
      ]
      metric_table: existing-display-picker-at-target
      parameter: place-existing-only-no-creation
    removal:
      component: remove-declaration-and-unplace
      parameter_control: unplace-only-semantics-kept
      guards: blocked-while-referenced-preserved
    preview_discipline: existing-debounced-handle-only-no-second-path
    responsive:
      narrow: wrap-stack
      narrow_width: 390px
    surface_tokens: fixed-only-no-raw-color
    async_state: explicit-loading-empty-error
  - id: studio-inspector
    type: inspector
    title: Inspector
    status: implemented
    ownership: selected-block-only-no-creation
    source: canvas-selection-identity-only
    empty_state: no-panel-no-prose
    metric_fields:
      label: optional-display-label
      data: existing-source-picker-only
      value: entry-field-or-sql-column-no-inference
    table_fields:
      label: optional-display-label
      data: existing-source-picker-only
    text_fields:
      text: inline-content
      style: fixed-enum-only
    parameter_control:
      ref: owned-label-read-only-no-override
      placement: retarget-existing-parameter-in-place
    data_jump: expand-and-focus-existing-source-row
    data_jump_narrow: dismiss-sheet-show-data-workspace-focus-jumped-row
    preview_discipline: existing-debounced-handle-only-no-second-path
    responsive:
      narrow: bottom-sheet-dialog-on-block-tap
      narrow_width: 390px
      narrow_gate: 560px
    sheet: dialog-with-visible-focus-trap-escape-backdrop-close-focus-returns-to-block
    sheet_state: transient-work-selected-id-plus-open-flag-only
    sheet_reuse: existing-inspector-content-no-duplicated-editors
    surface_tokens: fixed-only-no-raw-color
  - id: studio-mode
    type: segmented-control
    title: Studio mode
    status: implemented
    ownership: single-operative-control-for-workspace-arrangement-only
    options: [design, data, split]
    labels: icon-with-short-label
    accessible_names: radiogroup-with-checked-option-and-native-focus
    arrangement_only: draft-preview-selection-shared-continuous-no-refetch
    true_modes:
      design: finished-shape-only-canvas-plus-inspector-no-data-no-parameters-no-tags-no-preview-section
      data: fetch-definition-only-workspace-plus-parameters-plus-tags-no-canvas-no-preview-section
      split: design-canvas-plus-scoped-data-pane-no-parameters-no-tags-no-preview-section
    blank_design: single-add-data-action-opens-source-picker-no-prose
    split_availability: desktop-only-below-760px-design-data-only
    narrow_resize: crossing-below-760px-gate-returns-to-design-no-stuck-split
    persistence: transient-work-never-stored
    responsive:
      narrow: design-data-toggle-split-unavailable
      narrow_width: 390px
    surface_tokens: fixed-only-no-raw-color
  - id: studio-sync
    type: workspace-synchronization
    title: Design Data synchronization
    status: implemented
    ownership: selection-identity-only-no-pixels
    block_to_source: metric-table-auto-select-component-source-text-parameter-keep-selection
    source_to_blocks: soft-highlight-using-blocks-selection-unchanged
    highlight: visual-token-colors-only-distinct-from-selection-outline
    split: left-design-canvas-right-data-pane-for-selected-block-source
    split_state: transient-work-never-persisted
    stale_responses: generation-guarded-latest-draft-only
    preview_discipline: scoped-visible-component-plus-selected-source-existing-path-only
    responsive:
      narrow: forced-design-below-gate-with-stacked-fallback
      narrow_width: 390px
    surface_tokens: fixed-only-no-raw-color
    async_state: explicit-loading-empty-error
