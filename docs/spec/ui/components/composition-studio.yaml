    status: implemented
    ownership: single-add-data-dialog-with-forms-and-saved-sql-tabs
    tabs: [forms, saved-sql]
    tab_pattern: settings-tablist-with-tab-and-tabpanel-roles-no-arrow-key-nav
    tab_labels: existing-composition-studioForms-and-spaceShell-savedSql-only
    rows: shared-form-and-saved-sql-row-labels-with-full-row-button-activation
