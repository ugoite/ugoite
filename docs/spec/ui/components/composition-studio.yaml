---
title: "Composition Studio"
---

**Status: Text-first Composition authoring is the current target.** The browser
uses the strict typed graph and SQL contract in
[ADR-027](../../../architecture/contracts/adr-027-text-first-composition.md),
[REQ-COMP-010](../../../mitase/requirements/composition/text-first-graph.yaml),
and [REQ-FE-083](../../../mitase/requirements/frontend/composition-text-first.yaml).
SQL template normalization and optional Form seeds remain in REQ-FE-082. The
prior Composition UI criteria remain historical in REQ-FE-079.

## Modes and variables

Studio opens in Design. Its only modes are Design and Variables; the selected
mode control owns its name, and the panel does not repeat it as a heading.

Variables lists a meaningful variable name with a kind icon beside one focused
editor. Variables are typed constants, inputs, or inline SQL query results.
Names, types, SQL output aliases, field names, and Text content appear only
where they carry meaning. UUIDs and explanatory row copy are not primary-path
labels. A query stores one SQL source with explicit typed graph bindings and a
server-derived table or scalar result descriptor. Parameter diagnostics stay
near the SQL or binding control; there is no separate Arguments page.

The SQL editor is text-first. Rust owns SQL and `{{name}}` parameter
normalization, parsing, and diagnostics. Lint, authorized schema check, and
explicit execution are separate actions. Form is optional when creating a
query; its starter uses explicit projectable user-data columns and never
silently replaces authored SQL. Composition wildcard restrictions do not
change ordinary SQL or published Saved SQL behavior.

## Saved revisions and historical shapes

Before saving, the server validates the current graph and derives query Form
bindings and result descriptors from current authorized planning. It does not
trust submitted bindings or schema fingerprints. Saves retain append-only
history and their existing idempotent receipt and stale-revision conflict
behavior. The replaced prerelease graph shape is not silently converted or
restored as an executable Composition. Exact reads, raw inspection, export, and
history remain available for those stored revisions without migration; the
user must create a current-shape Composition to execute it.

## Design canvas

The canvas offers Text, Table, and Input only. Insertion is completed in the
canvas without opening a second Inspector. The two mode controls are Design
and Variables; Metric and Saved SQL binding pickers are not offered.

- Text starts editable in its placed position. Its plain template uses
  `{{variable_id}}`; a compact adjacent control selects Title, Heading, Body,
  or Caption. The Rust parser supplies literal and scalar-reference parts.
- Table references one table query variable. Its SQL projection owns displayed
  columns, aliases, and order. The component has no independent column
  projection editor.
- Input references one input variable. Its current value is transient Work,
  not part of the Composition document.

When Table or Input needs a variable that is not yet declared, creation moves
to Variables and returns to the pending Design placement only on success.
Cancel or failure leaves no unplaced component or dangling reference. Existing
variables can be selected without changing their shared query definition.

## Reader

Reader and Design share the same result renderer. Reader does not show mode
controls, component selection, Text editing, or style controls. Text is rendered
as text, not HTML or evaluated markup. A stale, failed, unauthorized, or
missing value is not replaced with an older result. Table paging remains
bounded and server-owned; empty results keep their SQL result headings.

## Responsive and accessible behavior

Controls remain keyboard reachable with visible focus and useful accessible
names. Text editing retains focus and supports multiline input. Variable lists
and pickers fit narrow screens without page-level horizontal overflow. Reader
tables scroll within their own region. Current implementation evidence is
tracked by the Composition Studio feature and verification bindings; this file
does not claim manual device or screen-reader validation that has not run.
