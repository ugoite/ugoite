---
title: "Composition Studio"
---

**Role: visual hierarchy and labels.** Current interaction behavior is defined
by [REQ-FE-083](../../../mitase/requirements/frontend/composition-text-first.yaml).
Composition semantics and runtime behavior are defined by
[REQ-COMP-010](../../../mitase/requirements/composition/text-first-graph.yaml).
SQL editing and optional Form seeds follow
[REQ-FE-082](../../../mitase/requirements/frontend/composition-sql-workspace.yaml).
The UI policies govern accessibility, focus, and responsive behavior.

## Visual hierarchy

The selected mode control owns its name; the panel does not repeat it as a
heading. Variables shows meaningful names with kind icons beside one focused
editor. Names, types, SQL output aliases, field names, and Text content appear
where they carry meaning. UUIDs and explanatory row copy are not primary-path
labels.

## Canvas

Insert components directly in the canvas without opening a second Inspector.
