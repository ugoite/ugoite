title: "Composition Studio"
---

**Status: implementation in progress; complete SQL grammar coverage remains a separate gate.** The normative next Composition model is [ADR-025](../../../architecture/contracts/adr-025-composition-query-variable-graph.md). The unreleased source-based model in [ADR-024](../../../architecture/contracts/adr-024-composition-sql-first.md) is superseded and has no compatibility path.

## Modes and variable graph

The only mode controls are Design and Variables. The selected control owns its name; its panel does not repeat that name as a visible heading.

Variables shows one typed graph. A row presents its meaningful variable name and kind icon. Adding a value, input, or SQL variable starts from +. A constant edits its typed literal, an input edits its type and default, and a query edits its SQL document in the shared Workspace. Query outputs show a table or scalar shape only when that distinction is unambiguous. The list has no common SQL subtitle, separate label field, or explanatory cards.

Desktop places the variable rail beside its editor. On narrow screens the rail is a drawer that closes after selection. Drawer, selection, loading, and diagnostics are transient Work.

## Shared SQL Workspace

Every query variable uses the shared SQL Workspace defined in [sql-workspace.yaml](sql-workspace.yaml). The same editor kernel and toolbar behavior apply to new Saved SQL, Saved SQL editing, and Composition query variables. SQL text is the sole durable query representation. Rust owns parsing, validation, typing, compilation, and serialization; the browser does not define another SQL parser or generator.

The Workspace provides Form/relation, columns, filter, sort, structure, and arguments actions. Arguments can be added from an empty state and bind SQL parameter names explicitly to graph variables. A missing, unused, or mistyped argument is a local diagnostic and blocks saving or execution. Parameter values appear only when declared and supplied. The SQL body, result table, and local diagnostic remain in the same editor surface. Composition uses the shared argument editor for add, rename, type change, and removal. A rename applies Rust's parameter edit and the explicit binding together, and stale edits cannot replace newer SQL or another session. A type change disconnects an incompatible binding without changing the upstream scalar. Only unreferenced declarations can be removed. Values and defaults remain owned by graph inputs and constants; Composition does not expose a second argument-default editor.

The feature matrix in ADR-025 is the acceptance boundary: every SQL construct admitted by the Rust executor must have an equivalent typed GUI operation and round-trip fixture. The current structure toolbar is not evidence of full admitted-grammar coverage. CTEs, joins, nested expressions, set operations, and other constructs remain incomplete until their executor and GUI contracts are verified together.

## Design canvas and binding picker

The canvas keeps the four add actions Input, Text, Table, and Value visible together, including on an empty draft. The name field has a localized placeholder, and Save is separate from the two mode controls. An unselected canvas uses the full width; an Inspector appears only after explicit selection and can be closed. Empty literal Text offers an in-place edit action. Tables keep readable cells inside their own horizontal scroll region at narrow widths.

The canvas offers Input, Text, Table, and Value. Input references one input variable. Text holds literal content or a string scalar reference. Table references a table result variable. Value references a compatible scalar variable. Display components do not store Form IDs, SQL text, Saved SQL revisions, SQL arguments, source IDs, or result schemas.

A Table may carry an ordered display-only view whose columns pair an exact query-result column key with a human label. Form-to-Table creation presets the public Form fields, including fields with types not eligible for Metric aggregation. A fieldless Form presets the stable Entry ID column. The Design Inspector can choose any current query result column, rename its display label, and reorder it; metadata result columns appear there only after explicit selection. These settings project the existing query result for display. They do not rewrite SQL, mutate Entries, or change its column types and values. An absent view presents the complete query result. Editing a query to change its output columns keeps the view in draft Work until the author updates its selected columns; save rejects stale view keys against the resolved result schema.

The Table Inspector presents selected columns using their saved display labels. Unselected result columns are kept behind a collapsed “Add result columns” disclosure so technical metadata does not crowd the selected Form fields. The disclosure changes only which exact result keys are selected; it does not change their labels or query meaning. Repeated display labels receive ordinal context in accessible editing and removal names. The disclosure summary and each optional-column choice have a 44px minimum touch target.

“Show every result column” appears only when the current view omits or contains unavailable result keys. It adds missing current columns after the existing selection, preserving selected order and headings while dropping unavailable keys. When result names are ambiguous, the action clears the keyed view so the default positional result can be shown.

Table and Value share one BindingPicker with Variables, Forms, and Saved SQL tabs. Variables is the default tab; the picker never silently applies a previous choice. Empty and loading panels expose a local status instead of a blank panel. Variable choices are filtered by result type. Choosing a Form or exact Saved SQL revision resolves or reuses a compatible query variable and inserts the component atomically. Form Table selection creates the equivalent of SELECT * FROM "G". Form Value requires an explicit aggregate and any required column. Saved SQL pins an exact revision; a scalar result must have exactly one row and one selected column. The picker never assumes COUNT or picks a first row or column.

Opening Saved SQL shows the listed revisions immediately. Only the chosen
revision is prepared, using explicitly bound Composition variables. Listing
candidates does not run query probes, wait for other candidates, or fabricate
argument values. Incompatible results and unavailable revisions are reported
locally after selection, and leave the draft unchanged.

Reuse is based on semantic query identity, exact bindings, result descriptor, and authorized context, not a matching display name. An edited query variable is not reused just because its name matches. Resolution, permission, descriptor, type, or revision failure leaves no partial query variable or component.

Adding a component closes the picker and leaves the canvas visible; it does not open an Inspector. Selecting a placed Table or Value exposes one variable reference action. That action opens the same picker and changes only the selected component reference, leaving shared query variables intact. Removing a component does not remove its variable.

At runtime, each Input component presents its variable name with an accessible name and an input control at least 44px high. Repeated controls follow component order during keyboard navigation and fit a 390px viewport without page-level horizontal overflow.

When a selected evaluation fails, every selected result and page is cleared.
The failed query retains its local cause; successful siblings announce that the
evaluation produced no result instead of remaining in Loading. An unselected
result survives only while its Publication and authorization identity match.
Repairing the input recomputes and publishes the affected closure together.

A successful Table result with zero rows retains its column headings and announces the shared SQL empty-result status. It does not retain previous rows or display a loading message.

The picker has one modal focus owner. Full rows select candidates; Escape closes the picker and restores focus. Controls expose accessible names, visible focus, and at least 44px targets. The picker and drawer fit 320px layouts without horizontal page overflow or a second navigation surface over the canvas.

## Names and state

Composition name, variable name, SQL output alias, Form field name, Text content, and accessible name each appear where they carry meaning. Binding-only UUIDs are not ordinary primary-path labels. There are no Composition tags, source aliases, or editable component labels.

A new Composition can preview and insert existing Forms or exact Saved SQL before it is named. Authoring probes use a transient nonempty document title; the editor name remains untouched, and an unnamed definition still cannot be saved. Text editing retains its input node, focus, selection and composition session while its live definition changes.

Inputs, constants under edit, preview values, query results, pages, cursors, loading state, and errors remain Work. Evaluation is stateless and does not append Entry history or persist result rows.
