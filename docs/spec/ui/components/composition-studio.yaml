version: "0.1"
updated: "2026-10-09"
component_group:
  id: composition-studio
  title: Composition Studio
  status: planned
  routes:
    - /spaces/{space_id}/compositions/new
    - /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
    - /spaces/{space_id}/compositions/{composition_id}/history
  notes: Authoring contract for the Composition Studio uplift. The New, Edit, and History routes each carry their page spec. Steady-state surfaces carry no explanatory paragraphs. Layout v1 is implemented (Design/Data/Inspector modes over a first-class layout AST per ADR-019); the component contracts below describe the shipped Studio.
components:
  - id: studio-header
    type: page-header
    ownership: tool-name-only
    actions:
      - id: studio-back
        type: link
        position: leading
        presentation: icon-only
        visible_content: chevron-left
        accessible_name: destination-specific localized parent name
        single_control: true
      - id: studio-save
        type: button
        title: Save
        single_control: true
        rationale: visible-text-label-so-beginners-find-the-primary-mutation-keeps-disabled-reason-and-steady-busy-label
        async_state: explicit-busy-without-layout-shift
        save_readiness: name-non-empty-plus-valid-refs-plus-exactly-once-placement-plus-no-dangling-plus-one-layout-item
        blocked_save: disabled-with-reason-in-accessible-name-and-title-no-prose
        source_only: cannot-save-canonical-parse-gated-at-save-with-allowlisted-summary
  - id: studio-data
    type: list
    title: Data
    status: implemented
    ownership: collapsible-source-navigator-with-per-source-editor-for-selection-only
    source_authoring: design-mode-only
    empty_source_list: no-add-data-prompt
    label_kind: compact-section-label
    rows:
      selection: full-row-activate
      reorder: keyboard-operable-move-up-down
      remove: blocked-while-displays-reference-with-reason
      source_kinds: [saved-sql-exact-revision, entry-query]
      identity_display: human-name-only
      revision_identity: advanced-disclosure-only
    source_picker:
      row_name: human-source-name-only
      row_name_overflow: ellipsis-with-full-name-native-title
      row_accessible_name: full-human-source-name
      row_identifiers: source-draft-entry-revision-ids-never-rendered
    entry_query_editor:
      sections: [fields, filter, sort, result]
      semantics: existing-entry-query-vocabulary-only
      filter_operators: [equals, contains, lt, lte, gt, gte]
      sort_directions: [asc, desc]
      projection: [fields, preview]
      projection_choices: projectable-snapshot-fields-only; already-selected-nonprojectable-fields-remain-available-for-removal
      preview_availability: switch-to-preview-enabled-only-when-field-schema-covers-every-current-form-field
      metric_projection: selected-entry-field-is-in-fields-projection-and-projection-edits-retain-metric-fields
      projection_initialization: reserve-metric-bound-fields-then-schema-order-up-to-64
      projection_capacity: unchecked-fields-disabled-with-localized-limit-title-at-64
      projection_removal: selected-non-metric-fields-enabled-metric-bound-fields-disabled
      projection_recovery: overbooked-saved-drafts-disable-controls-with-metric-binding-title
      edits: draft-source-query-through-narrow-updaters
      unknown_operators: rejected-fail-closed
      filter_sort_editing: shared-entry-browser-display-dialog-only
      field_identity:
        display_name: transient-form-field-name-first-when-form-resolves-the-field
        fallback:
          schema_field: localized-schema-ordinal-skipping-live-form-names-and-prior-fallbacks
          referenced_field_missing_from_schema_snapshot: distinct-deterministic-localized-ordinal-skipping-live-form-names-and-prior-fallbacks
        raw_field_id: query-data-only-never-rendered-in-field-filter-sort-projection-or-dialog-labels
      capability_gating: dialog-offers-only-capable-snapshot-backed-fields-with-disabled-add-and-reason-at-zero
      projection_placement: inline-unchanged-dialog-columns-contract-not-identical
      form_definition: transient-formApi-load-cached-per-source-never-stored
      source_identity: selected-human-source-name-owned-by-workspace-heading
      raw_form_id: draft-data-only-never-rendered
    source_navigator:
      disclosure: icon-only-44px-control-with-localized-accessible-name
      initial_state: expanded
      collapsed: editor-uses-full-available-width
      selection: retained-while-collapsed
      state: transient-work-only-never-saved
      row_name: human-source-name-only
      row_name_overflow: ellipsis-with-full-name-native-title
      row_accessible_name: full-human-source-name
      row_identifiers: source-draft-entry-revision-ids-never-rendered
    saved_sql_viewer:
      sql: read-only-with-edit-saved-sql-action-to-existing-editor-route
      sections: [sql, variables, result-schema, result]
      reads: user-gated-sqlApi-get-plus-bounded-limit-1-probe-denied-concealed
      revision_update: explicit-exact-revision-only-no-latest-fallback
      composition_save: separate-explicit-action-never-conflated
