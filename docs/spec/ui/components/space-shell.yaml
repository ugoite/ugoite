version: "0.4"
updated: "2026-10-09"
component_group:
  id: space-shell-shared
  title: Space Shell Shared Components
components:
  - id: global-sidebar
    type: sidebar
    position: left-fixed
    width: 228px
    items: [Spaces]
    notes: Global routes only. Hidden below 900px and replaced by the global bottom navigation.
  - id: space-sidebar
    type: sidebar
    position: left-fixed
    width: 228px
    items: [Home, Assets, Forms, Saved tools, Search, History, Settings]
    notes: Owns the active Space section context on Space-scoped routes. Saved tools opens the current Space's Composition list and remains active across its list, authoring, revision, and history routes. Pages must not restate the active section identity. Hidden below 900px and replaced by the Space bottom navigation.
  - id: workspace-topbar
    type: top-bar
    height: 58px
    notes: Contains quiet Konase utility access and the account entry point. It does not own page identity; nested object or task identity is expressed by the page.
    konase_panel:
      reference: konase-panel.yaml
      trigger: icon-only
      lifetime: shell-owned-preserved-while-hidden
  - id: mobile-bottom-navigation
    type: bottom-navigation
    height: 66px
    breakpoint: 900px
    items: [Home, Forms, Search, History, More]
    more_items: [Assets, Saved tools, Settings]
  - id: global-mobile-bottom-navigation
    type: bottom-navigation
    height: 66px
    breakpoint: 900px
    items: [Spaces]
  - id: space-selector
    type: select
    scope: authorized-spaces
    option_label: name-then-slug-then-localized-untitled
    unresolved_current_space_label: localized-loading-text
    unavailable_current_space_label: localized-neutral-label
    displays_space_uid: false
