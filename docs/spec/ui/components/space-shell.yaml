version: "0.2"
updated: "2026-07-17"
component_group:
  id: space-shell-shared
  title: Space Shell Shared Components
components:
  - id: global-sidebar
    type: sidebar
    position: left-fixed
    width: 218px
    items: [Home, Forms, Search, Settings]
    notes: Hidden below 900px and replaced by the bottom navigation.
  - id: workspace-topbar
    type: top-bar
    height: 58px
    notes: Contains the Space selector, route context, and account entry point.
  - id: mobile-bottom-navigation
    type: bottom-navigation
    height: 66px
    breakpoint: 900px
    items: [Home, Forms, Search, Settings]
  - id: desktop-content-width
    type: responsive-content-container
    breakpoint: 900px
    options:
      standard: 1180px
      wide: 1600px
    persist: portable-user-preferences
