---
title: "SQL-first Composition Studio"
---

**Status: planned.** This is the target interaction contract from
[ADR-024](../../../architecture/contracts/adr-024-composition-sql-first.md).
The current Composition Studio remains described in
[`composition-studio.yaml`](composition-studio.yaml) until its replacement is
implemented and verified. The shared SQL editor, typed parameter controls,
preview, and result contract are defined in
[`sql-workspace.yaml`](sql-workspace.yaml).

## Composition Data surface

Composition sources are inline SQL or an exact Saved SQL revision. Selecting a
Form creates editable SQL such as `SELECT * FROM "G"`; it does not create an
EntryQuery. Source identity remains an opaque stable ID. The selected SQL name
has one visible owner and is not repeated as a second large editor heading.

Desktop uses a plain source rail with full-row selection. Narrow viewports use
an overlay drawer; selecting a source closes it, Escape closes it, focus is
restored, and the source-list control has a clear accessible name. Drawer and
page state are transient Work.

There are no Composition tags or user-editable display labels for sources,
variables, or components. Names come from the inline SQL name, referenced Saved
SQL name, SQL output alias, variable ID, or Text body. Form field names and
accessible names remain available where they carry meaning.

The steady state has no introductory paragraphs, duplicate SQL-type labels,
revision banners, decorative cards, or persistent save-status summaries. Show
only the SQL list, the selected Workspace, typed inputs when declared, and the
current query result. A result table may scroll horizontally; the page and SQL
editor do not. SQL text inputs use at least 16px to avoid iOS focus zoom.
