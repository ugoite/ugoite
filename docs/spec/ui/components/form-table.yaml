version: "0.1"
updated: "2026-10-09"
component_group:
  id: form-table
  title: Form-scoped Entry Table
components:
  - id: editable-form-entry-table
    type: editable-data-grid
    implementation: frontend/src/components/FormTable.tsx
    tests: frontend/src/components/FormTable.test.tsx
    scope: selected-form
    columns:
      desktop: [form-fields, optional-created-at, optional-updated-at]
      mobile: [form-fields, optional-created-at, optional-updated-at]
      optional_system_columns_default: hidden
      labels:
        form_fields: display-label-when-set-otherwise-field-name
        system_fields: localized-created-and-updated
    column_picker:
      trigger:
        icon: columns
        visible_label: none
        accessible_name: localized-columns
      dialog:
        title: localized-columns
        choices: localized-optional-system-timestamps
        actions: [localized-cancel, localized-apply]
        focus: trap-and-return-to-trigger
        explanatory_copy: none
      labels:
        field_ids: never-visible
        system_fields: [localized-created, localized-updated]
    identity:
      entry_id:
        primary_rows: hidden
        accessible_names: hidden
        access: advanced-entry-info-details-with-copy
      field_ids: never-visible
    mobile_edit_mode:
      edit_value_controls:
        fields: [first-three-card-fields, expanded-additional-fields]
        visible_content: formatted-current-value
        accessible_name: localized-form-field-label-or-name-plus-formatted-current-value
        entry_and_stable_field_ids: never
    row_open:
      control: localized-view-entry-button
      target: selected-entry
    selection:
      cells: currently-visible-columns
      copy: selected-visible-values-only
