version: "0.1"
updated: "2026-10-08"
component_group:
  id: action-icon-bar
  title: Shared Action Icon Bar
components:
  - id: action-icon-bar
    type: toolbar
    implementation: frontend/src/components/ActionIconBar.tsx
    presentation:
      default: icon-label
      modes: [icon-label, icon-only]
      action_override: takes-precedence-over-toolbar-mode
    icon_only:
      visible_label: screen-reader-only
      accessible_name: localized-action-name-on-control
      title: matching-accessible-name
      target_size: 44px
      focus: visible
      overflow:
        layout: single-row
        behavior: horizontal-scroll-within-toolbar
        preserves: [all-actions, 44px-targets, visible-focus]
    eligibility:
      candidates: [secondary-utility-with-established-page-context]
      keep_visible: [primary-mutation, domain-action, recovery-choice, history-changing-action]
      destructive_action: keep-visible-unless-individually-accepted-with-danger-and-confirmation
    states: busy-and-disabled-behavior-preserved
