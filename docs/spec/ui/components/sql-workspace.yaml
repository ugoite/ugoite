---
title: "Shared SQL Workspace"
---

**Status: text-first for Saved SQL.** `/sql/new` and Saved SQL detail/edit use
the shared controlled SQL text editor. The owning route supplies saving,
current schema authorization, parameter values, query execution, counting, and
paging. The Workspace does not own query persistence or Knowledge authority.
Composition query variables also use direct text editing, but retain their
host-owned Structure Toolbar until the planned migration in REQ-FE-079.

## SQL authoring

- SQL is edited as one text document. Rust/WASM owns normalization, parsing,
  static lint, source ranges, and diagnostics; the browser does not build or
  rewrite a SQL syntax tree.
- The editor keeps wrapping, undo, keyboard editing, schema-aware completion,
  an accessible name, and a minimum 16px text size.
- `{{name}}` is the authoring form for typed SQL parameters. The Rust normalizer
  ignores markers inside quoted strings, identifiers, and comments. Composition
  binds an argument explicitly to a typed graph variable; matching names alone
  do not create a persisted binding.
- Offline Lint checks syntax and the selected static profile without loading
  Knowledge or requiring a Space. The Composition profile rejects output
  projection wildcards in Composition query definitions. Ordinary SQL keeps
  its existing wildcard behavior, including `COUNT(*)` and multiplication.
- Check uses the owning adapter's current Form permissions, schema, and typed
  parameters. It returns diagnostics and result-column metadata without reading
  result rows. A stale or failed Check cannot enable Run.
- Run is an explicit action. It uses bounded, stateless query execution and the
  current successful Check. Lint and Check do not run result queries.
- On `/sql/new`, a Form is an optional source starter. Its only action
  seeds editable SQL from authorized projectable user-data columns; there is no
  column wizard or SQL syntax-construction toolbar. A Form without projectable
  data fields shows one local error and never adds metadata columns. Saved SQL is
  never reseeded implicitly.
- Saved SQL editing does not expose Form, Columns, Filter, Sort, Structure, or
  Arguments SQL construction actions. Its typed argument definitions and
  optional defaults remain editable in the separate argument editor, while
  query values stay transient in the runtime input surface. Composition shows
  a typed variable selector beside each `{{name}}` reference; its Structure
  Toolbar remains available pending the planned migration.

## Results

Run, Count rows, and continuation are explicit host callbacks. Results use the
existing typed table and pagination controls. Paging state is transient Work;
generated SQL does not receive a synthetic `LIMIT`. The Workspace clears or
hides results that do not match the current SQL, parameter values, authorization,
and schema.

## Layout and controls

- Keep the page in one column at narrow widths. Only the result-table viewport
  scrolls horizontally.
- Keep the steady state free of explanatory paragraphs and decorative cards.
  Show short local diagnostics and recovery guidance only when needed.
- Keep the Saved SQL primary action visibly labeled. Give icon-only actions
  accessible names, visible focus, and at least 44px targets. Disabled actions
  expose their reason accessibly.
- EntryBrowser and FormTable retain their own search, filtering, sorting,
  pagination, and column-selection controls; these are not SQL Workspace tools.

Composition Design and Variables behavior is specified separately in
[`composition-studio.yaml`](composition-studio.yaml).
