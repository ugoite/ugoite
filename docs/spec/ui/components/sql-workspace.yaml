---
title: "Shared SQL Workspace"
---

**Status: shared editor implemented; complete grammar coverage remains in progress.** The /sql/new route and Saved SQL detail/edit use the same Workspace component. Composition query variables use the same Workspace component and the authorized graph resolver for exact Saved SQL source. [ADR-025](../../../architecture/contracts/adr-025-composition-query-variable-graph.md) defines the required lossless document and executor-to-GUI coverage contract. The owning route supplies SQL state, schema, parameters, preview, count, pagination, save, and execution callbacks. The Workspace presents them without becoming another query or persistence authority.

## Editing and parameter presentation

- Keep direct SQL editing available. A read-only adapter can present an exact
  pinned Saved SQL revision without enabling edits.
- Keep SQL text controlled by the owning adapter. Workspace controls dispatch
  explicit callbacks and do not parse or regenerate SQL themselves.
- Present declared variables using their transient Work values or declared
  defaults. An explicit unset value overrides the default; the Workspace does
  not coerce or persist parameter values.
- Give the editor an accessible name and wrap long lines within the Workspace.
- Keep the shared SQL editor's default wrapping behavior unchanged for other
  callers.

The shared toolbar has six actions: Form, Columns, Filter, Sort, Structure,
and Arguments. Structure opens the less common relation and query-tree edits.
The toolbar sends typed SQL Document edits through the Rust/WASM protocol; it
does not classify SQL with a second bounded analyzer or fall back to a separate
SQL generator. The document serializer is responsible for retaining comments,
quoted identifiers, aliases, and untouched clauses. Text edits and tree edits
share the same Rust parser, diagnostics, transaction checks, and undo history.

Form metadata is context for the editor, not a second saved query model. The
Form action presents eligible human-readable names directly, without requiring
statement/query/parser-node selection. It can choose or replace a relation
while retaining aliases and other clauses;
relation-free SELECT statements such as `SELECT 1` remain editable. Nested
relations, joins, CTEs, set operations, projections, filters, grouping,
ordering, row limits, expressions, and SQL arguments are edited through the
same document tree. Operations that cannot preserve a selected source span
must fail locally with a diagnostic and leave the SQL unchanged. They must not
silently replace the whole query with a starter statement.

A successful Form selection closes the dialog and restores focus to the Form
button. Only SQL with multiple sources asks which source to change. Detailed tree
editing is an explicit advanced action. Empty or trivia-only SQL can start a
query through the same Rust-owned typed transaction; an incomplete nonempty
SQL draft cannot be overwritten with a starter. Pending operations are guarded
by host identity as well as exact SQL source, including when two query variables
have identical SQL. Closing the editor invalidates unfinished operations.
Argument discovery can temporarily disable argument mutations, but must not
disable the Form opener or prevent focus restoration after a document edit.
Run and Save remain subject to current argument validation.

Columns opens an ordered list of result fields directly. Form field labels and
system field names identify the choices; stable SQL identifiers remain the
Rust operation input. A plain wildcard offers Choose fields before individual
fields can be added, removed, or moved. Expansion uses the authorized planner's
complete output names and order, including readable fields not present in Form
metadata. It is limited to a single plain outer projection with an unambiguous
Form qualifier; multiple output sources, nested queries, modifiers and ambiguous
schemas remain unchanged and expose a local unavailable state. Qualified
wildcards use only their own planned output. Both the primary and advanced
editors enforce this boundary. Complex expressions retain
their exact source and have an explicit advanced editing entry point. Multiple
SELECT results expose an explicit result choice instead of a statement tree.
Edits, Undo, and Redo use exact-source, host-scoped Rust transactions; a moved
field retains its focused control. Positional sorting and grouping obey
`REQ-SQL-001#criterion.projection-position-bindings`.

The argument action is available with no arguments declared. SQL placeholders
are paired with explicit, typed declarations; unused, undefined, duplicated,
or incompatible arguments produce local lint errors. Text inside string
literals and comments is not treated as a placeholder. Invalid or incomplete
SQL drafts remain visible and editable, but cannot be saved or executed.

Authorized planner diagnostics validate the same SQL with its current Form
permissions and output schema before save or preview. Syntax parsing alone does
not promise that a query is executable. The SQL feature matrix records each
executor-admitted construct, its typed document representation, GUI operations,
and verification evidence in the [SQL feature matrix contract](../../../architecture/contracts/sql-gui-feature-matrix.md).
The matrix remains the completion gate: a parser node or preserved-only tree
display is not evidence that the construct can be edited in the GUI.

## Preview and results

Run Query, Count rows, and page continuation are explicit actions delegated to
the owning adapter. Preview presents loading, failure, empty, and current-page
states with the existing typed `SqlResultTable` and `ResultPagination`. The
adapter uses stateless SQL execution, request page size, and request
continuation; generated SQL does not add `LIMIT` to simulate paging. Row counts
do not run implicitly on every page.

## Layout and controls

- Keep the page in one column at narrow widths. Only the result-table viewport
  scrolls horizontally.
- Render SQL editor and variable input text at no less than 16px.
- Give icon-only actions accessible names and at least 44px targets. Disabled
  actions include their reason in the accessible name and title.
- The owning route's primary Save action retains its visible text label.
- Keep the steady state free of explanatory paragraphs and decorative cards.

The Composition variable rail, Design binding picker, pinned Saved SQL
revision lifecycle, and graph-specific drawer behavior are defined in
[`composition-studio.yaml`](composition-studio.yaml).

## ADR-025 target: shared SQL document controls

The accepted next target gives `/sql/new`, Saved SQL editing, and Composition
query variables the same six icon actions in one row: Form/relation, columns,
filter, sort, structure, and arguments. At widths up to 320px, only this row
scrolls horizontally. The optional SQL argument-value row appears only when
the host has declared arguments and supplied runtime values; its labels and
inputs have one owner. The remaining order is SQL document, then result table.

Each action edits the Rust-owned SQL document through typed operations. Text
and structure edits synchronize through the same parser, diagnostics, and
serializer; unsupported drafts cannot run or save, and no local generator
replaces edited SQL. The available operations cover every SQL construct the
authorized Rust executor admits. The Form/relation tree can start empty, so
valid relation-free SELECT statements remain editable. Argument creation is
available with zero existing arguments and from an expression that needs one.
Parameter name/type errors stay local to the affected expression and do not
disable unrelated actions.

The shared controls keep icon accessible names, visible focus, 44px targets,
Escape and focus restoration for dialogs, and text inputs of at least 16px.
The host owns saving and execution; SQL remains one durable string, and result
pages remain request state rather than generated `LIMIT` clauses.
