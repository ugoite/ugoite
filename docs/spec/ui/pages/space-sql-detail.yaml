version: "0.1"
updated: "2026-09-24"
page:
  id: space-sql-detail
  title: Saved query
  route: /spaces/{space_id}/sql/{sql_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: sql-detail-heading
      type: heading
      title: Saved query name
      ownership: object-identity
    - id: sql-detail-metadata
      type: list
      title: Query metadata
    - id: sql-detail-editor
      type: sql-editor
      title: SQL
    - id: sql-detail-variables
      type: list
      title: Variables
    - id: sql-detail-primary-action
      type: button
      title: Run Query or Open Variables
    - id: saved-sql-index-action
      type: link
      title: Back to Saved SQL
      target_page: space-sql
