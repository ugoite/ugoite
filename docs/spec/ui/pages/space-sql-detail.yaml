version: "0.1"
updated: "2026-09-28"
page:
  id: space-sql-detail
  title: Saved query
  route: /spaces/{space_id}/sql/{sql_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: sql-detail-header
      type: page-header
      items:
        - id: saved-sql-index-action
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Saved SQL
          visible_content: chevron-left
          target_page: space-sql
        - id: sql-detail-heading
          type: heading
          title: Saved query name
          ownership: object-identity
    - id: sql-detail-metadata
      type: list
      title: Query metadata
      includes: saved and current Form names for immutable Form-ID bindings
    - id: sql-detail-editor
      type: sql-editor
      title: SQL
    - id: sql-detail-variables
      type: list
      title: Variables
    - id: sql-detail-primary-action
      type: button
      title: Run Query or Open Variables
