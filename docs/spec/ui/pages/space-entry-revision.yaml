version: "0.1"
updated: "2026-10-09"
page:
  id: space-entry-revision
  title: Space Entry Revision
  route: /spaces/{space_id}/entries/{entry_id}/history/{revision_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: entry-revision-header
      type: page-header
      items:
        - id: entry-history-parent-action
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Entry history
          visible_content: chevron-left
          target_page: space-entry-history
        - id: entry-revision-heading
          type: heading
          title: Revision
    - id: revision-content
      type: list
      title: Revision
      mode: read-only field values
      metadata:
        - read-only state
        - timestamp
      actor_label: member-display-name-or-localized-unknown-actor
      technical-identifiers:
        visibility: collapsed-localized-details-only
        values: [revision ID, actor ID]
        copy: exact-value
      restore: confirmed append-only action
