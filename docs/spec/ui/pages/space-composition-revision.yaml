version: "0.1"
updated: "2026-10-16"
page:
  id: space-composition-revision
  title: Saved tool revision
  route: /spaces/{space_id}/compositions/{composition_id}/{revision_id}
  implementation: implemented
  contract_status: planned
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: composition-heading
      type: heading
      title: Saved tool name
      ownership: object-identity
    - id: composition-actions
      type: toolbar
      actions:
        - id: composition-edit
          type: icon-button
          title: Edit
          status: implemented
          target: /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
        - id: composition-history
          type: icon-button
          title: History
          status: implemented
          target: /spaces/{space_id}/compositions/{composition_id}/history
        - id: composition-restore
          type: button
          title: Restore
          status: implemented
          availability: historical revisions only
          source: composition.restore with the opened revision as the restore source, the latest revision as the base, and one Idempotency-Key reused for retry
          description: Restore appends a new revision from the opened historical revision and never rewrites history. A stale base shows a conflict with a recovery link to history; the new revision opens for review and further edits.
    - id: composition-history-identity
      type: history
      current_revision: operation, timestamp, and current state are visible
      revision_identity: exact revision stays in the internal route target and is not rendered as a user-facing label
    - id: composition-diagnostics
      type: list
      title: Resolve diagnostics
      source: current composition.resolve response for the selected exact revision
    - id: composition-components
      type: query-results
      title: Flow rows with inputs, text, metrics, and tables
      source: resolved SQL sources from the selected exact Composition revision
      layout: saved-tool flow rows in declaration order; pixel coordinates are not persisted
      variables: typed definitions/defaults are Knowledge; runtime values and raw input are transient Work
      input_components: reference one variable and own no saved value; no display label is persisted
      text_components: literal body or direct string-variable reference with fixed typography roles
      table_components: render the current bounded page from one SQL source using SqlResultTable
      table_presentation:
        component: SqlResultTable
        result_presentation_reference: ../components/result-table.yaml
      metric_components: server-evaluated scalar output column from one SQL source; require exactly one row and one selected scalar column
      metric_presentation: distinguish zero rows, one-row NULL, zero, multiple rows, unavailable source, invalid result, and execution error
      metric_numeric_presentation: optional unit and fractional-digit formatting; never changes SQL semantics
      query_semantics: Layout does not change the source query plan
      pagination_owner: SQL query handle; continuation and explicit count stay in stateless query requests
      state: previews, raw input, pages, results, and diagnostics are transient Work
      horizontal_overflow: result-table viewport only
