version: "0.1"
updated: "2026-10-03"
page:
  id: space-composition-revision
  title: Saved tool revision
  route: /spaces/{space_id}/compositions/{composition_id}/{revision_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: composition-heading
      type: heading
      title: Saved tool name
      ownership: object-identity
    - id: composition-actions
      type: toolbar
      actions:
        - id: composition-edit
          type: icon-button
          title: Edit
          status: implemented
          target: /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
        - id: composition-history
          type: icon-button
          title: History
          status: implemented
          contract: docs/spec/ui/components/composition-studio.yaml
        - id: composition-restore
          type: button
          title: Restore
          status: implemented
          availability: historical revisions only
          source: composition.restore with the opened revision as the restore source, the latest revision as the base, and one Idempotency-Key reused for retry
          description: Restore appends a new revision from the opened historical revision and never rewrites history. A stale base shows a conflict with a recovery link to history; the new revision opens for review and further edits.
    - id: composition-parameters
      type: form
      title: Declared parameters
      source: composition.resolve for the selected exact revision
      placement: layout-placed controls render inside the flow in placement order; unplaced definitions stay in this section
      state: transient-work-never-stored
    - id: composition-diagnostics
      type: list
      title: Resolve diagnostics
      source: current composition.resolve response
    - id: composition-components
      type: query-results
      title: Flow rows with parameter controls, text, metrics, and tables
      source: existing entry.query and exact-revision sql.query operations
      layout: saved-tool rows in row-array then item order
      text_presentation: fixed title-heading-body-caption styles without source fetch
      table_presentation:
        entry_query: EntryResultTable
        saved_sql: SqlResultTable
      metric_presentation: shared WASM metric evaluator
      pagination_owner: composition query handle
      description: Composition table components delegate presentation to the source-native Entry or SQL result presenter. Composition does not implement a third generic table grammar, and source query semantics remain unchanged.
      rendering:
        mode: bounded-current-page
        parameters-and-pages: transient-work
    - id: composition-pagination
      type: button
      title: Previous and Next
      source: existing query continuation
