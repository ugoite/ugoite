version: "0.1"
updated: "2026-10-20"
page:
  id: space-composition-revision
  title: Saved tool revision
  route: /spaces/{space_id}/compositions/{composition_id}/{revision_id}
  implementation: implemented
  contract_status: in_progress
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: composition-heading
      type: heading
      title: Saved tool name
      ownership: object-identity
    - id: composition-actions
      type: toolbar
      actions:
        - id: composition-edit
          type: icon-button
          title: Edit
          status: implemented
          target: /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
        - id: composition-history
          type: icon-button
          title: History
          status: implemented
          target: /spaces/{space_id}/compositions/{composition_id}/history
        - id: composition-restore
          type: button
          title: Restore
          status: implemented
          availability: historical revisions only
          source: composition.restore with the opened revision as the restore source and latest revision as the base
          persistence: append a new revision and preserve existing receipt and stale-write semantics
    - id: composition-history-identity
      type: history
      current_revision: operation, timestamp, and current state are visible
      revision_identity: exact revision stays in the internal route target and is not rendered as a user-facing label
    - id: composition-diagnostics
      type: list
      title: Evaluation diagnostics
      source: composition.evaluate for the selected exact revision and immutable input snapshot
    - id: composition-components
      type: query-results
      title: Flow rows with inputs, text, values, and tables
      source: typed variable graph from the selected exact Composition revision
      layout: saved-tool flow rows in declaration order; pixel coordinates are not persisted
      variables: typed constants and definitions are Knowledge; input values and query results are transient Work
      input_components: reference one input variable and own no saved runtime value
      text_components: literal body or string scalar reference with fixed typography roles
      table_components: bounded page from a table<Row> variable through the stateless evaluation path
      table_presentation:
        result_presentation_reference: ../components/result-table.yaml
      value_components: display-compatible scalar variable, including explicit empty/null/error states
      value_cardinality: one row and one column; no implicit first-row or first-column selection
      pagination_owner: server-owned stateless continuation for the query variable
      state: input values, pages, results, and diagnostics are transient Work
      horizontal_overflow: result-table viewport only
