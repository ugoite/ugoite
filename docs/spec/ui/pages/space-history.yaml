version: "0.1"
updated: "2026-10-08"
page:
  id: space-history
  title: Space History
  route: /spaces/{space_id}/history
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: change-timeline
      type: list
      title: Space changes
    - id: change-detail
      type: dialog
      description: The selected Change detail uses a localized icon-only close button, retains Escape and backdrop dismissal, traps focus, and returns focus to the opener.
    - id: change-detail-pagination
      type: button
      component: ResultPagination
      reference: ../components/result-pagination.yaml
      owner: Space History detail cursor handlers
      scopes: [affected entries, related changes]
      loading: separate status indicator
