version: "0.2"
updated: "2026-07-17"
page:
  id: space-form-grid
  title: Forms Workspace
  route: /spaces/{space_id}/forms
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: form-picker
      type: searchable-master-list
      items:
        - form-name
      actions:
        - create-form
    - id: selected-form-entries
      type: data-grid
      description: The selected Form's Entries are shown directly without a second Entries view or nested view tabs.
      actions:
        - edit-form
        - create-entry
        - open-entry
        - export-csv
responsive:
  desktop: split-master-detail
  mobile: stacked
