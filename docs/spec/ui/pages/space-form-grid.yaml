version: "0.2"
updated: "2026-09-16"
page:
  id: space-form-grid
  title: Forms List
  route: /spaces/{space_id}/forms
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: form-list
      type: list
      description: The Forms route is list-only. Selecting a Form navigates to its form-scoped Entry list at the Entries route with a form query parameter. One shared list DOM serves desktop and mobile with border-separated rows, and per-row edit stays on a small button that does not steal the navigation click.
      items:
        - form-name
      actions:
        - create-form
        - edit-form
        - open-form-entries
    - id: system-form-visibility
      type: filter-button
      description: Reserved system Forms stay hidden until the compact visibility toggle is enabled.
responsive:
  desktop: border-separated-list
  mobile: stacked-border-separated-list
