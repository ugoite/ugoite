version: "0.1"
updated: "2026-09-28"
page:
  id: space-sql-results
  title: Saved query results
  route: /spaces/{space_id}/sql/{sql_id}/run
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: query-identity-heading
      type: heading
      title: Saved query name
      ownership: object-identity
    - id: sql-results-table
      type: query-results
      source: sql.query using exact Saved SQL ID and revision with server-derived Form bindings
      component: PagedResultTable
      description: Renders every row in the current SQL page with a native table without creating persistent execution state.
      rendering:
        mode: native-page-table
        rows: all-fetched-page-rows
    - id: sql-results-pagination
      type: button
      title: Previous and Next
      source: client-held continuation
    - id: sql-results-count
      type: button
      title: Count rows
      source: sql.query.count
      description: Explicit action; page loading does not issue a count request.
    - id: saved-query-detail-action
      type: link
      title: Back to Saved SQL
      target_page: space-sql-detail
