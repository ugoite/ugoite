version: "0.1"
updated: "2026-11-13"
page:
  id: space-composition-edit
  title: Edit tool
  route: /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
  implementation: implemented
  contract_status: in_progress
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: studio-load
      type: query-results
      title: Exact revision load
      source: Load the selected Composition Entry revision into the strict typed graph reader
      loading: explicit
      unsupported_or_invalid_document: >-
        Show a concise local diagnostic and a back control. Keep raw inspection,
        export, and Entry history recovery available through their existing
        paths; do not open, migrate, or execute a replaced Composition document.
    - id: studio-name
      type: text-input
      title: Tool name
      ownership: composition-object-identity
      source: Composition name from the selected canonical revision
    - id: studio-save
      type: button
      title: Save
      label: Save
      single_control: true
      source: canonical Composition document through composition.save with the selected base revision
      persistence: append one Entry revision with existing receipt and stale-write semantics
      readiness: strict inline-SQL graph, valid result descriptors and bindings, and each component placed exactly once
    - id: composition-studio
      type: composition-studio
      reference: ../components/composition-studio.yaml
      contract_status: in_progress
      default_mode: design
      modes: [design, variables]
      variables:
        kinds: [constant, input, query]
        query_outputs: [table, scalar]
        query_source: inline_sql_only
        editor: text-first SQL Workspace with explicit SQL-parameter-to-variable bindings
      design:
        components: [text, table, input]
        table_binding: select_table_query_variable_or_create_one_in_variables_and_return
        input_binding: select_input_variable_or_create_one_and_place_it
        text_content: in_place_plain_template_using_rust_parsed_scalar_references
        text_style: [title, heading, body, caption]
        component_inspector: none
        reader_edit_controls: hidden
      execution:
        preview: explicit, using immutable evaluation snapshots and current authorization
        results: transient stateless work
        paging: bounded_server_owned_continuation
      work: Draft, input values, previews, pages, results, and editor diagnostics are transient
