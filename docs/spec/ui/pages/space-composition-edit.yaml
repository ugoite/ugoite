version: "0.1"
updated: "2026-10-06"
page:
  id: space-composition-edit
  title: Edit tool
  route: /spaces/{space_id}/compositions/{composition_id}/{revision_id}/edit
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: studio-load
      type: query-results
      title: Exact revision load
      source: composition.get for the exact revision, then server-side composition.lint normalization of the stored spec
      rendering:
        mode: shared-composition-renderer
        rows: first-page-per-source
      async_state: explicit-loading-empty-error
      description: Unknown versions and lint failures show a concise error with one back control to the opened revision and never open the studio. Canonical revisions may omit empty optional parameter and Saved SQL variable collections; the editor restores those as empty state.
    - id: studio-header
      type: page-header
      title: Tool name
      ownership: tool-name-only
      description: One icon-only Back control to the opened revision, one tool-name text input owning the name, one visible-text Save action.
    - id: studio-back
      type: link
      position: leading
      presentation: icon-only
      accessible_name: Back to revision
      visible_content: chevron-left
      single_control: true
    - id: studio-name
      type: text-input
      title: Tool name
      ownership: object-identity
      source: draft name written through setDraftName, prefilled from the lint-normalized document
    - id: studio-save
      type: button
      title: Save
      label: Save
      single_control: true
      source: canonical draft YAML through composition.save with composition_id and base_revision_id plus one Idempotency-Key reused for retry
      deterministic_rejection: >-
        Show a localized summary when composition.save returns an allowlisted
        composition_diagnostic; use the generic save failure when the
        diagnostic is absent or unknown. Clear the uncertain attempt on
        rejection and keep retry on the same route with the identical
        payload and key.
    - id: studio-data
      type: list
      title: Data
      source: >-
        draft sources restored from the lint-normalized document with human names
        only; use localized ordinal labels when current source metadata is
        unavailable instead of exposing document source identifiers
      selection: full-row-activate
      reorder: keyboard-operable-move-up-down
      remove: blocked-while-displays-reference-with-reason
      revision_identity: advanced-disclosure-only
    - id: studio-data-mode-tabs
      type: tab-list
      title: Sources, Parameters, Tags
      scope: data-mode-only
      initial_selection: Sources
      parameter_disclosure: only-after-a-source-exists
      state: transient-work-never-saved
    - id: studio-parameters
      type: list
      title: Parameters
      scope: data-mode-parameters-tab-renders-only-with-at-least-one-source
      source: draft parameters provisioned from Saved SQL variable types and restored from the lint-normalized document
      selection: rows-with-inline-editors
      row_label: declared-human-label-then-user-authored-parameter-name
      row_metadata: parameter-type
      remove: guarded-remove-with-short-referenced-reason
      binding: existing-composition-parameter-grammar-by-reference
    - id: studio-add-data
      type: button
      title: Add data
      single_control: true
      source: CompositionSourcePicker dialog over Forms and user-query Saved SQL
    - id: studio-add-data-dialog
      type: dialog
      title: Add data
      source: Forms through form.list and Saved SQL through sql.list
      selection: full-row-activate
      rendering: human-name-only rows with loading, empty, and error states
      row_name_overflow: ellipsis-with-full-name-native-title
      internal_identifiers: form-source-draft-entry-revision-ids-never-rendered
    - id: studio-display
      type: list
      title: Display
      status: removed
      source: display add, remove, reorder, and label editing are owned by the Design canvas and inspector; the display picker serves only as the canvas insertion delegate
    - id: studio-display-picker
      type: dialog
      title: Add display
      kind_selection: Table/Metric tabs inside the picker
      sequence: kind, source, metric value field only for Metric, optional label, add
      source_selection: selected row remains visible across compatible kind changes
      entry_query_field_labels: transient Form labels, query capability names, or field keys; else localized source schema ordinals
      entry_query_metric_field: added_to_the_source_fields_projection
      entry_query_metric_candidates: rust_scalar_types_only_excludes_list_object_list_row_reference_asset_reference_binary_maps_to_string
      projection_initialization: reserve_metric_bound_fields_then_schema_order_up_to_64
      projection_capacity: at_limit_only_already_projected_fields_are_selectable
      overbooked_projection_recovery: disable_projection_controls_with_metric_binding_title
      internal_field_ids: never rendered
      sizing: 720px maximum width and viewport-capped vertical scrolling
    - id: studio-tags
      type: form
      title: Tags
      scope: data-mode-tags-tab-only
      semantics: entry-metadata-tags
      source: comma-or-space-separated text parsed into draft tags, prefilled from the lint-normalized document
    - id: studio-preview
      type: query-results
      title: Preview
      source: canonical draft YAML through composition.preview with debounced side-effect-free resolution
      result_presentation: CompositionRenderer
      rendering:
        mode: shared-composition-renderer
        rows: first-page-per-source
      pagination_owner: studio-edit route
      description: Renders the preview plan through the shared renderer without creating persistent execution state.
