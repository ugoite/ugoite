version: "0.4"
updated: "2026-10-08"
page:
  id: space-entry-detail
  title: Entry Detail
  route: /spaces/{space_id}/entries/{entry_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: entry-load-failure
      type: inline-error-state
      content: localized-error-summary
      recovery_actions: [retry, back-to-form]
      visible_identifiers: none
    - id: entry-header
      type: page-header
      items:
        - id: back-to-form
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Form
          visible_content: chevron-left
          target_page: space-form-grid
        - id: entry-label
          type: heading
          text: Entry
          description: Entry is the task identity; the selected Form name may appear once as secondary context when useful. A Form-defined Title or Name remains a normal field. Stable Entry IDs belong in advanced Info details.
    - id: entry-action-bar
      type: toolbar
      component: ActionIconBar
      reference: ../components/action-icon-bar.yaml
      description: Save and Delete keep visible labels. History and Info use named icon-only utility controls. Delete retains danger styling and confirmation.
      actions:
        - id: save
          type: button
          presentation: icon-label
          intent: primary-mutation
        - id: history
          type: link
          presentation: icon-only
          accessible_name: localized-history-and-recovery
        - id: info
          type: link
          presentation: icon-only
          accessible_name: localized-entry-info
          target_page: space-entry-info
        - id: delete
          type: button
          presentation: icon-label
          danger: true
          confirmation: required
      save_status:
        id: entry-save-status
        role: status
        location: after-action-bar
        values: [saving, transient-success]
        persistent-saved-indicator: false
    - id: entry-fields-editor
      type: form
      visibility: form-defined-entry
      items:
        - typed-form-fields
      description: Form fields only. A Form-defined Title or Name renders as a normal field with no Entry-level semantics; a Markdown field stays multiline and adds an icon-only preview dialog.
      field_controls:
        boolean: free-form-text-input
        date: native-date-input
        list: multiline-input
        markdown: multiline-input-with-icon-preview-dialog
        row_reference: searchable-entry-picker
        string: single-row-autogrowing-textarea
        string_view: preserve-line-breaks
        time: native-time-input
        timestamp: native-datetime-local-input
        timestamp_tz: browser-local-datetime-input-with-offset-preservation
        timestamp_ns: native-datetime-local-input-with-fractional-seconds
        timestamp_tz_ns: browser-local-datetime-input-with-offset-and-fractional-seconds
        uuid: text-input-with-generate-action
        scalar: free-form-text-input
      validation: inline
responsive:
  desktop: single-column
  mobile: stacked-primary-first
