version: "0.2"
updated: "2026-07-17"
page:
  id: space-entry-detail
  title: Entry Detail
  route: /spaces/{space_id}/entries/{entry_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: entry-header
      type: page-header
      items:
        - id: back-to-form
          type: link
          target_page: space-form-grid
        - id: entry-title
          type: heading
          text: "{entry_title}"
        - id: save-status
          type: status
          values:
            - saved
            - unsaved
            - saving
        - id: save-entry
          type: primary-button
    - id: entry-workspace
      type: two-column-workspace
      primary:
        - id: entry-edit-modes
          type: tab-bar
          default: fields-when-form-exists
          tabs:
            - id: fields
              label: Fields
              visibility: form-defined-entry
              description: Form-first editing for non-technical users.
            - id: preview
              label: Preview
              description: Rendered read-only entry preview.
            - id: source
              label: Source
              description: Full Markdown editing for advanced changes.
        - id: entry-fields-editor
          type: form-editor
          items:
            - title
            - typed-form-fields
          field_controls:
            boolean: free-form-text-input
            list: multiline-input
            markdown: multiline-input
            row_reference: searchable-entry-picker
            scalar: free-form-text-input
          validation: inline
        - id: entry-preview
          type: markdown-preview
        - id: entry-source-editor
          type: markdown-editor
          mode: edit
      secondary:
        - id: entry-details
          type: metadata-card
          items:
            - form
            - updated_at
            - entry_id
        - id: entry-assets
          type: asset-uploader
        - id: entry-management
          type: action-card
          actions:
            - history
            - refresh
            - discard-draft
            - sharing
            - delete
responsive:
  desktop: two-column
  mobile: stacked-primary-first
