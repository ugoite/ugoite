version: "0.4"
updated: "2026-09-18"
page:
  id: space-entry-detail
  title: Entry Detail
  route: /spaces/{space_id}/entries/{entry_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: entry-header
      type: page-header
      items:
        - id: back-to-form
          type: link
          target_page: space-form-grid
        - id: entry-label
          type: heading
          text: "{entry_label}"
          description: Legacy compatibility title when present, otherwise the stable entry ID. No Untitled canonical label.
        - id: save-status
          type: status
          values:
            - saved
            - unsaved
            - saving
        - id: save-entry
          type: primary-button
    - id: entry-action-bar
      type: toolbar
      actions:
        - refresh
        - history
        - id: info
          type: link
          target_page: space-entry-info
        - delete
    - id: entry-fields-editor
      type: form
      visibility: form-defined-entry
      items:
        - typed-form-fields
      description: Form fields only. A Form-defined Title or Name renders as a normal field with no Entry-level semantics; a Markdown Form field remains an ordinary multiline field.
      field_controls:
        boolean: free-form-text-input
        date: native-date-input
        list: multiline-input
        markdown: multiline-input
        row_reference: searchable-entry-picker
        scalar: free-form-text-input
      validation: inline
responsive:
  desktop: single-column
  mobile: stacked-primary-first
