version: "0.3"
updated: "2026-09-16"
page:
  id: space-entry-detail
  title: Entry Detail
  route: /spaces/{space_id}/entries/{entry_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: entry-header
      type: page-header
      items:
        - id: back-to-form
          type: link
          target_page: space-form-grid
        - id: entry-title
          type: heading
          text: "{entry_title}"
        - id: save-status
          type: status
          values:
            - saved
            - unsaved
            - saving
        - id: save-entry
          type: primary-button
    - id: entry-action-bar
      type: toolbar
      actions:
        - refresh
        - history
        - id: info
          type: link
          target_page: space-entry-info
        - delete
    - id: entry-fields-editor
      type: form
      visibility: form-defined-entry
      items:
        - title
        - typed-form-fields
      field_controls:
        boolean: free-form-text-input
        date: native-date-input
        list: multiline-input
        markdown: multiline-input
        row_reference: searchable-entry-picker
        scalar: free-form-text-input
      validation: inline
      advanced:
        - id: entry-source-disclosure
          label: Advanced
          content:
            - id: source
              label: Source
              description: Full Markdown editing for advanced changes.
            - id: entry-source-editor
              mode: edit
    - id: entry-source-editor
      type: markdown-editor
      mode: edit
      visibility: formless-entry
responsive:
  desktop: single-column
  mobile: stacked-primary-first
