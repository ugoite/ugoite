version: "0.1"
updated: "2026-08-10"
page:
  id: space-assets
  title: Form-owned Asset References
  route: /spaces/{space_id}/assets
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: asset-reference-list
      type: list
      description: Presents current Form-owned AssetReference values as a border-separated inventory grouped by asset ID, keeps each occurrence linked to its Entry, and reveals secondary metadata through Details. It reads entry.list in bounded pages until the complete current inventory is available.
      source: entry.list
      states:
        - loading
        - complete
        - error-with-retry
        - empty
        - referenced-asset
    - id: asset-reference-empty-state
      type: list
      description: Explains that assets appear here only after an Entry saves a Form-owned asset reference.
      target_page: space-form-grid
responsive:
  desktop: border-separated-list
  mobile: stacked-border-separated-list
