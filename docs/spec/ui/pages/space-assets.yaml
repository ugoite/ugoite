version: "0.1"
updated: "2026-08-10"
page:
  id: space-assets
  title: Form-owned Asset References
  route: /spaces/{space_id}/assets
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: asset-reference-list
      type: list
      description: Presents current Form-owned AssetReference values from asset.list as full-row RowList rows with type/size meta, keeps each asset linked to its detail route, and keeps exact asset IDs in advanced disclosure. It reads the portable asset inventory once; rows stay mounted during refetch.
      source: asset.list
      states:
        - loading
        - complete
        - error-with-retry
        - empty
        - referenced-asset
    - id: asset-reference-empty-state
      type: list
      description: Explains that assets appear here only after an Entry saves a Form-owned asset reference.
      target_page: space-form-grid
responsive:
  desktop: border-separated-list
  mobile: stacked-border-separated-list
