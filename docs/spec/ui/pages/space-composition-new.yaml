version: "0.1"
updated: "2026-10-08"
page:
  id: space-composition-new
  title: New tool
  route: /spaces/{space_id}/compositions/new
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: studio-header
      type: page-header
      title: Tool name
      ownership: tool-name-only
      description: One Back control to the saved-tools list, one tool-name text input owning the name, one Save text button.
    - id: studio-back
      type: link
      title: Back to saved tools
      single_control: true
    - id: studio-name
      type: text-input
      title: Tool name
      ownership: object-identity
      source: draft name written through setDraftName
    - id: studio-save
      type: button
      title: Save
      single_control: true
      rationale: visible-text-label-so-beginners-find-the-primary-mutation-keeps-disabled-reason-and-steady-busy-label
      source: canonical draft YAML through composition.save with one Idempotency-Key reused for retry
      save_readiness: >-
        Save stays disabled until the tool name is non-empty, all refs are
        valid with every component placed exactly once and no dangling refs,
        and the layout holds at least one item. A source-only draft cannot
        save. A disabled Save carries its reason in the accessible name and
        title with no prose paragraph. Canonical parsing gates the save
        itself: rejections surface the allowlisted diagnostic summary, and
        anything else uses the generic save failure.
      seed: >-
        One-shot router location state consumed on mount with the state
        cleared so back and forward never double-add the source. A form seed
        carries the current EntryQuery source plus a default Table plus a
        single-row layout with the tool name prefilled. A Saved SQL seed
        carries the exact revision source plus a default Table plus a single
        row plus mapped variables with parameter controls placed only when
        variables exist. Every seed emits at least one layout item and opens
        save-ready with a visible block; never a zero-display draft.
      deterministic_rejection: >-
        Show a localized summary when composition.save returns an allowlisted
        composition_diagnostic; use the generic save failure when the
        diagnostic is absent or unknown. Clear the uncertain attempt on
        rejection and keep retry on the same route with the identical
        payload and key.
    - id: studio-mode
      type: segmented-control
      title: Studio mode
      ownership: single-operative-control-for-workspace-arrangement-only
      description: True modes switch the arrangement only with shared draft, preview, and selection state. Design shows the finished shape only (canvas plus inspector, diagnostics strip); Data shows the fetch definition only (workspace, Parameters once a source exists, Tags); Split pairs the canvas with the scoped data pane. A blank draft guides with one Add-data action and no prose.
    - id: studio-diagnostics
      type: query-results
      title: Diagnostics
      source: shared CompositionDiagnostics over the debounced preview with structural alert roles, above the mode content in every mode
      rendering:
        mode: shared-composition-diagnostics
      description: Replaces the removed Preview section for resolve and preview diagnostics; blocks preview inline on the canvas.
    - id: studio-data
      type: list
      title: Data
      scope: data-mode-and-split-pane-only
      source: draft sources with human names only
      entry_query_field_labels: transient-form-name-then-localized-schema-ordinal-or-distinct-ordinal-for-referenced-fields-outside-snapshot
      field_identity: raw-field-ids-stay-in-query-data-and-never-render-in-data-editor-rows
      selection: full-row-activate
      reorder: keyboard-operable-move-up-down
      remove: blocked-while-displays-reference-with-reason
      revision_identity: advanced-disclosure-only
    - id: studio-add-data
      type: button
      title: Add data
      single_control: true
      source: CompositionSourcePicker dialog over Forms and user-query Saved SQL
    - id: studio-add-data-dialog
      type: dialog
      title: Add data
      source: Forms through form.list and Saved SQL through sql.list
      selection: full-row-activate
      rendering: human-name-only rows with loading, empty, and error states
    - id: studio-display
      type: list
      title: Display
      status: removed
      source: display add, remove, reorder, and label editing are owned by the Design canvas and inspector; the display picker serves only as the canvas insertion delegate
    - id: studio-parameters
      type: list
      title: Parameters
      scope: data-mode-only-renders-only-with-at-least-one-source
      source: draft parameters provisioned from Saved SQL variable types
      selection: rows-with-inline-editors
      row_label: declared-human-label-then-user-authored-parameter-name
      row_metadata: parameter-type
      remove: guarded remove with a short referenced reason
      binding: existing-composition-parameter-grammar-by-reference
      type_compatibility: rust-owned-diagnostics
    - id: studio-add-parameter
      type: button
      title: Add parameter
      single_control: true
      source: parameter name and type inputs over the draft
    - id: studio-tags
      type: form
      title: Tags
      scope: data-mode-only
      semantics: entry-metadata-tags
      source: comma-or-space-separated text parsed into draft tags
    - id: studio-preview
      type: query-results
      title: Preview
      status: removed
      source: blocks preview inline on the Design canvas through the shared debounced handle, per-source results page inside the Data workspace, and resolve diagnostics render in the every-mode strip
      result_presentation: CompositionRenderer
      rendering:
        mode: shared-composition-renderer
        rows: first-page-per-source
      pagination_owner: studio-new route
      description: The standalone Preview section is removed; preview state lives in the canvas, the workspace, and the diagnostics strip without a second preview path.
