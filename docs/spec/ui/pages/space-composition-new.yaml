version: "0.1"
updated: "2026-10-16"
page:
  id: space-composition-new
  title: New tool
  route: /spaces/{space_id}/compositions/new
  implementation: implemented
  contract_status: planned
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: studio-name
      type: text-input
      title: Tool name
      ownership: composition-object-identity
      source: Composition name in the canonical document
    - id: studio-save
      type: button
      title: Save
      label: Save
      single_control: true
      source: canonical Composition document through composition.save
      persistence: one Space-owned Entry revision with existing receipt and stale-write semantics
      readiness: valid strict document with each component placed exactly once and no dangling references
    - id: composition-studio
      type: composition-studio
      reference: ../components/composition-studio.yaml
      contract_status: planned
      steady_state: Design canvas and the selected SQL Workspace, without explanatory paragraphs or decorative cards
      sources:
        allowed: [inline_sql, saved_sql]
        form_selection: >-
          Selecting a Form creates an editable inline SQL source named from the
          Form and starts with SQL such as SELECT * FROM "G". Core derives
          immutable Form ID bindings; the editor does not insert LIMIT 50.
        saved_sql_selection: >-
          Select one exact Saved SQL Entry revision. Show its referenced name
          or the existing localized untitled representation and keep its SQL
          read-only in Composition.
        inline_sql_name: Editable semantic SQL object name independent of stable source id
        saved_sql_alias: absent
      workspace:
        inline_sql: shared SQL Workspace with direct SQL editing and capability-approved structured actions
        saved_sql: read-only exact revision in Composition
        contract: ../components/sql-workspace.yaml
      design:
        components: [input, text, table, metric]
        label_step: absent
        variable_reference: Input references a Composition variable; Text displays literal content or a direct string-variable value
        table: Uses the selected SQL source result
        metric: Selects one declared scalar output column from a SQL source
      composition_metadata:
        tags_control: absent
        editable_component_labels: absent
        editable_variable_labels: absent
        source_display_alias: absent
      execution:
        preview: explicit, owned by Composition adapter
        results: shared SQL result presentation; current state only
        paging_and_count: explicit query operations
        browser_aggregation: absent
      work: Draft, typed input, preview results, paging, and drawer state are transient
