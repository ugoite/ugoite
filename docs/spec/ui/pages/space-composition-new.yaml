version: "0.1"
updated: "2026-10-21"
page:
  id: space-composition-new
  title: New tool
  route: /spaces/{space_id}/compositions/new
  implementation: temporarily-unavailable
  availability: No browser route is registered until the Composition UI gates are complete.
  contract_status: in_progress
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: studio-name
      type: text-input
      title: Tool name
      ownership: composition-object-identity
      source: Composition name in the canonical document
    - id: studio-save
      type: button
      title: Save
      label: Save
      single_control: true
      source: canonical Composition document through composition.save
      persistence: one Space-owned Entry revision with existing receipt and stale-write semantics
      readiness: strict typed graph, valid SQL descriptors and bindings, and each component placed exactly once
    - id: composition-studio
      type: composition-studio
      reference: ../components/composition-studio.yaml
      contract_status: in_progress
      modes: [design, variables]
      variables:
        kinds: [constant, input, query]
        query_outputs: [table, scalar]
        sql_representation: one durable SQL string; parser and descriptor metadata are server-owned
        editor: shared SQL Workspace with local parameter and query diagnostics
      design:
        components: [input, text, table, value]
        table_and_value_binding_picker:
          tabs: [variables, forms, saved_sql]
          default_tab: variables
          form_table: create_or_exactly_reuse_query_variable_and_insert
          form_value: require_explicit_aggregate_and_column_before_atomic_insert
          saved_sql: pin_exact_entry_revision_and_validate_output_shape
          persisted_component_reference: variable_only
        insertion: close_picker_and_leave_canvas_visible_without_opening_inspector
        inspector: one_variable_reference_action_for_table_and_value
      execution:
        preview: composition.preview for authoring metadata; composition.evaluate for runtime values
        results: transient_stateless_work
        paging: bounded_server_owned_continuation
        authorization: recheck_current_acl_publication_and_pinned_revisions
      work: Draft, input values, previews, pages, results, and editor diagnostics are transient
