version: "0.1"
updated: "2026-09-24"
page:
  id: space-query-create
  title: Query Create
  route: /spaces/{space_id}/sql/new
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: query-title-input
      type: text-input
      label: "Query name"
      placeholder: "Untitled query"
    - id: query-sql-editor
      type: sql-editor
      features:
        - syntax-highlighting
        - linting
        - completion
    - id: query-save-button
      type: button
      variant: primary
      label: "Save"
      target_page: space-search
