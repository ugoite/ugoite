version: "0.1"
updated: "2026-10-18"
page:
  id: space-query-create
  title: New
  route: /spaces/{space_id}/sql/new
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: query-create-header
      type: page-header
      items:
        - id: saved-sql-parent-action
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Saved SQL
          visible_content: chevron-left
          target_page: space-sql
        - id: query-create-heading
          type: heading
          title: New
    - id: query-title-input
      type: text-input
      label: "Query name"
      placeholder: "Untitled query"
    - id: query-sql-workspace
      type: shared-sql-workspace
      reference: ../components/sql-workspace.yaml
      initial_sql: SELECT 1
      schema: current authorized Form names and public field columns
      structured_actions: shared SQL structure toolbar only
      preview: stateless SQL request with request-owned paging
    - id: query-variable-default-editor
      type: typed-variable-list
      visibility: only-when-sql-contains-variables
      behavior: each variable can have an explicitly enabled typed default or remain without a default
      validation: ADR-023 typed-value rules; empty string is distinct from no default
    - id: query-save-button
      type: button
      variant: primary
      label: "Save"
      behavior: explicitly save edited SQL and typed variable defaults as ordinary user-query Saved SQL
      target_page: space-sql
