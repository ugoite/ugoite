version: "0.1"
updated: "2026-09-28"
page:
  id: space-query-create
  title: New
  route: /spaces/{space_id}/sql/new
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: query-create-header
      type: page-header
      items:
        - id: saved-sql-parent-action
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Saved SQL
          visible_content: chevron-left
          target_page: space-sql
        - id: query-create-heading
          type: heading
          title: New
    - id: query-title-input
      type: text-input
      label: "Query name"
      placeholder: "Untitled query"
    - id: query-form-select
      type: select
      label: Form for this query
      source: current authorized non-system Forms
      value: immutable Form ID
    - id: query-form-generate-action
      type: button
      label: Generate SQL from Form
      behavior: replace editor contents with a quoted Form-name starter query
    - id: query-sql-editor
      type: sql-editor
      features:
        - syntax-highlighting
        - linting
        - completion
      completion_source: current authorized Form names and public field columns
    - id: query-save-button
      type: button
      variant: primary
      label: "Save"
      target_page: space-sql
