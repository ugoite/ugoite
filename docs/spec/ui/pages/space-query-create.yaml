version: "0.1"
updated: "2026-10-16"
page:
  id: space-query-create
  title: New
  route: /spaces/{space_id}/sql/new
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: query-create-header
      type: page-header
      items:
        - id: saved-sql-parent-action
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Saved SQL
          visible_content: chevron-left
          target_page: space-sql
        - id: query-create-heading
          type: heading
          title: New
    - id: query-title-input
      type: text-input
      label: "Query name"
      placeholder: "Untitled query"
    - id: query-form-select
      type: select
      label: Form for this query
      source: current authorized non-system Forms
      value: immutable Form ID
    - id: query-form-generate-action
      type: button
      label: Generate SQL from Form
      behavior: generate a quoted Form-name starter query; when the editor has been edited, show the exact generated SQL for review and apply only after an explicit action
    - id: query-aggregate-operation-select
      type: select
      label: Aggregate
      options:
        - Count rows
        - Count values
        - Sum
        - Average
        - Minimum
        - Maximum
    - id: query-aggregate-field-select
      type: select
      label: Field
      visibility: hidden for Count rows
      source: current Form fields compatible with the selected aggregate
      visible_option_names: human field labels only
    - id: query-filter-field-select
      type: select
      label: Filter field
      optional_value: None
      source: current Form fields that support Composition-compatible typed SQL equality parameters
      visible_option_names: human field labels only
    - id: query-aggregate-generate-action
      type: button
      label: Generate aggregate SQL
      behavior: generate one-value ordinary SQL from the selected operation and fields, using a typed parameter when a filter field is selected; when the editor has been edited, show the exact generated SQL for review and apply only after an explicit action
    - id: query-generated-sql-proposal
      type: conditional-sql-preview
      visibility: only-when-generated-sql-would-replace-edited-content
      content: compact current-to-generated SQL line diff; long contiguous changes show exact removed and added line counts, high-edit-distance fallback ranges use an uncounted omission marker, and SQL beyond preview bounds uses a preview-limit marker; each summary allows an optional full generated SQL disclosure
      actions:
        - Use generated SQL
        - Keep current SQL
      behavior: propose when generated SQL or the set or metadata of SQL variables differs from edited content; mark added and removed SQL lines distinctly and show each added, removed, or changed variable type or description; applying uses the reviewed SQL and its associated variable metadata; keeping current SQL preserves the exact editor content and variable metadata; editor or generator-setting changes dismiss the proposal; both actions are disabled while saving
    - id: query-sql-editor
      type: sql-editor
      behavior: generated SQL remains editable and uses backend-owned SQL column names
      features:
        - syntax-highlighting
        - linting
        - completion
      completion_source: current authorized Form names and public field columns
    - id: query-variable-default-editor
      type: typed-variable-list
      visibility: only-when-sql-contains-variables
      behavior: each variable can have an explicitly enabled typed default or remain without a default
      validation: ADR-023 typed-value rules; empty string is distinct from no default
    - id: query-save-button
      type: button
      variant: primary
      label: "Save"
      behavior: explicitly save generated or edited content and typed variable defaults as ordinary user-query Saved SQL
      target_page: space-sql
