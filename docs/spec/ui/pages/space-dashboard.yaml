version: "0.1"
updated: "2026-10-08"
page:
  id: space-dashboard
  title: Space Dashboard
  route: /spaces/{space_id}/dashboard
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: space-title
      type: heading
      level: 1
      text: "{space_name}"
      emphasis: xl
    - id: saved-tools-heading
      type: heading
      title: Saved tools
      ownership: subordinate-workspace
    - id: saved-tools-list
      type: list
      labelled_by: saved-tools-heading
      source: composition.list first page
    - id: saved-tools-all
      type: link
      title: All
      target_page: space-compositions
    - id: saved-tools-new
      type: icon-button
      title: New tool
      single_control: true
      status: implemented
      target_page: space-composition-new
    - id: quick-actions
      type: grid-list
      item_type: action
      items:
        - id: first-form-guidance
          type: callout
          when: no-creatable-forms
          title: "Start by creating your first form"
          action_label: "Create your first form"
        - id: create-entry
          type: button
          label: "New entry"
          target_page: space-entries-object
        - id: create-form
          type: button
          label: "New form"
          target_page: space-form-grid
          emphasis_when: no-creatable-forms
    - id: continue-entry
      type: link
      when: a-recent-entry-exists
      label: Entry
      secondary: form-name-or-em-dash
      source: entry.list
      presentation: full-row
      target_page: space-entry-detail
      visible_identifier: none
      route_identity: entry-id
    - id: recent-entries
      type: list
      count: 4
      source: entry.list
      selection: full-row-activate
      label: Entry
      secondary: form-name-or-em-dash
      target_page: space-entry-detail
      visible_identifier: none
      route_identity: entry-id
