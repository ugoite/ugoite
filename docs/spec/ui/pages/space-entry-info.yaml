version: "0.1"
updated: "2026-10-09"
page:
  id: space-entry-info
  title: Entry Info
  route: /spaces/{space_id}/entries/{entry_id}/info
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: entry-info-header
      type: page-header
      items:
        - id: back-to-entry
          type: link
          position: leading
          presentation: icon-only
          accessible_name: Back to Entry
          visible_content: chevron-left
          target_page: space-entry-detail
        - id: entry-info-title
          type: heading
          text: "Entry info"
    - id: entry-info-metadata
      type: list
      items:
        - form
        - updated_at
        - created_at
    - id: entry-info-advanced-details
      type: list
      title: Advanced details
      disclosure: collapsed-by-default
      items:
        - entry_id
        - current_revision_id
      actions:
        - id: copy-entry-id
          type: button
          target: entry_id
          label: localized-copy
    - id: entry-info-sharing
      type: settings-panel
      component_contract:
        id: resource-access-editor
        reference: ../components/access-policy-editor.yaml
      items:
        - access-policy-editor
      member_label_resolution:
        source: current_space_member_directory
        while_loading: localized_unknown_member
        previous_space_directory: never_used
      tests:
        - path: frontend/src/components/AccessPolicyEditor.test.tsx
          selector: "REQ-UX-ACCESS-001: resolves grant names only from the current Space directory"
