version: "0.2"
updated: "2026-09-27"
page:
  id: space-form-entries
  title: Form Entries
  route: /spaces/{space_id}/forms/{form_ref}/entries
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: form-entries-object-heading
      type: page-header
      description: The selected Form name is the sole page identity; Forms navigation remains owned by the persistent shell.
    - id: form-entry-list
      type: query-results
      component: EntryBrowser
      reference: ../components/entry-browser.yaml
      controller: EntryQueryController
      description: The Form's Entries workspace loads current Entries through a Form-scoped server query. New Entry creation retains the selected Form, and the browser is hidden for unknown or reserved metadata Forms.
      states: [loading, complete, empty, error-with-retry]
      actions: [create-entry]
responsive:
  desktop: horizontally-scrollable-table-with-sticky-trailing-action
  mobile: horizontally-scrollable-table-with-sticky-trailing-action
