version: "0.1"
updated: "2026-09-24"
page:
  id: space-asset-detail
  title: Asset Detail
  route: /spaces/{space_id}/assets/{asset_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: asset-detail-header
      type: page-header
      description: Names the selected asset with type/size meta while the persistent shell owns the Assets workspace context.
    - id: asset-download-delete-actions
      type: toolbar
      description: Offers Download and Delete Asset as one-row actions with busy states; delete returns to the inventory after the server confirms.
      source: asset.read
    - id: asset-entry-references
      type: list
      description: Lists every current Entry referencing the asset as full-row links to entry detail; the exact asset ID stays in advanced disclosure.
      source: asset.list
      accessible_name_source: asset-references-title
responsive:
  desktop: border-separated-list
  mobile: stacked-border-separated-list
