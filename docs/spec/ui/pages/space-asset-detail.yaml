version: "0.1"
updated: "2026-10-08"
page:
  id: space-asset-detail
  title: Asset Detail
  route: /spaces/{space_id}/assets/{asset_id}
  implementation: implemented
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: asset-detail-header
      type: page-header
      description: Names the selected asset with type/size meta while the persistent shell owns the Assets workspace context.
    - id: asset-download-delete-actions
      type: toolbar
      component: ActionIconBar
      reference: ../components/action-icon-bar.yaml
      description: Download is a named icon-only utility action. Delete keeps its visible label, danger styling, blocked-reference reason using only Form and Field names, and confirmation; successful deletion returns to the inventory.
      actions:
        - id: download
          presentation: icon-only
        - id: delete
          presentation: icon-label
          danger: true
          blocked_while_referenced: true
          confirmation_when_available: required
      source: asset.read
    - id: asset-entry-references
      type: list
      description: Lists every current Entry referencing the asset as full-row links labeled by Form and Field; Entry IDs stay in route targets and never appear in visible or accessible reference labels, while the exact asset ID stays in advanced disclosure.
      source: asset.list
      accessible_name_source: asset-references-title
responsive:
  desktop: border-separated-list
  mobile: stacked-border-separated-list
