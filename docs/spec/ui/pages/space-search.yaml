version: "0.2"
updated: "2026-09-27"
page:
  id: space-search
  title: Entry Search
  route: /spaces/{space_id}/search
  implementation: implemented
  visible_heading: screen-reader-only
components:
  shared:
    - id: space-shell
      type: persistent-workspace-navigation
      reference: ../components/space-shell.yaml
  body:
    - id: keyword-result-list
      type: query-results
      component: EntryBrowser with EntryResultTable
      reference: ../components/entry-browser.yaml
      controller: EntryQueryController
      selection_target: space-entry-detail
      toolbar:
        search_control:
          owner: search-page
          role: search
          input_label: searchPage.searchKeywords
          submit_label: searchPage.searchEntries
          commit: explicit-submit
          deep_link: query.q
        result_actions: [columns-dialog, filters-dialog, multi-sort-dialog]
        navigation:
          control: icon-link
          icon: UiIcon.sql
          accessible_name: searchPage.openSavedQueries
          target: /spaces/{space_id}/sql
          position: after-result-actions
      form_labels:
        source: current-space-form-list
        lookup_key: entry.form_id
        loading: show-neutral-placeholder-and-page-level-status
        failure: preserve-results-and-offer-form-list-retry
        unresolved_id: show-unknown-form-label-without-removing-entry
        consistency: separate-read-no-shared-snapshot-guarantee
      rendering:
        mode: native-page-table
        rows: all-fetched-page-rows
