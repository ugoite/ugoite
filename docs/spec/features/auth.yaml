version: '0.4'
updated: '2026-08-26'
kind: auth
support_boundary:
  supported:
  - mandatory authentication
  - owner bootstrap with Passkey
  - Passkey/WebAuthn registration and passwordless login
  - opaque browser sessions, logout, and revocation
  - invitations, membership lifecycle, roles, and ACL enforcement
  - authenticated REST and MCP access
  - Node and Space authorization audit read access
  - owner-approved Space access recovery by principal-binding replacement
  - recovery-code + recovery-TOTP Account Self-Recovery
  - remote CLI device authentication with DPoP
  internal_dependency:
  - authentication capability discovery
  - shared device authorization/token machinery and MCP-scoped OAuth metadata
  experimental: []
  future:
  - OIDC authentication and account linking
  - administrator account recovery
  - agent and service-account principals
apis:
  - id: auth.config
    method: GET
    status: internal
    backend:
      path: /auth/config
      file: crates/ugoite-server/src/lib.rs
      function: auth_config
    note: Internal dependency for selecting the supported browser authentication flow.
  - id: auth.setup
    method: POST
    status: supported
    backend:
      path: /auth/setup/start|/auth/setup/finish
      file: crates/ugoite-server/src/lib.rs
      function: auth_setup_start
    frontend:
      path: /setup
      file: frontend/src/routes/setup.tsx
      function: SetupRoute
    note: Bootstrap-only recovery-code display is part of setup output. Account Self-Recovery requires the user to explicitly enroll a recovery authenticator in Security Settings.
  - id: auth.passkey
    method: POST|DELETE|GET
    status: supported
    backend:
      path: /auth/passkey/start|/auth/passkey/finish|/auth/passkeys|/auth/passkeys/start|/auth/passkeys/finish|/auth/passkeys/{credential_id}
      file: crates/ugoite-server/src/lib.rs
      function: auth_passkey_start
    frontend:
      path: /login|/settings/security
      file: frontend/src/routes/login.tsx
      function: LoginRoute
  - id: auth.session
    method: GET|DELETE
    status: supported
    backend:
      path: /auth/session|/auth/sessions|/auth/sessions/{session_id}
      file: crates/ugoite-server/src/lib.rs
      function: auth_session
    frontend:
      path: /settings/security
      file: frontend/src/routes/settings/security.tsx
      function: SecuritySettingsRoute
  - id: auth.membership
    method: GET|POST|DELETE
    status: supported
    backend:
      path: /auth/invitations/start|/auth/invitations/finish|/auth/invitations/accept|/spaces/{space_id}/members|/spaces/{space_id}/members/invitations|/spaces/{space_id}/members/{principal_id}|/spaces/{space_id}/members/{principal_id}/role
      file: crates/ugoite-server/src/lib.rs
      function: invite_member
    frontend:
      path: /spaces/join|/spaces/{space_id}/settings
      file: frontend/src/routes/spaces/join.tsx
      function: JoinSpaceRoute
  - id: auth.audit
    method: GET
    status: supported
    backend:
      path: /auth/audit|/spaces/{space_id}/audit
      file: crates/ugoite-server/src/lib.rs
      function: list_audit_events
    frontend:
      path: /settings/security|/spaces/{space_id}/settings
      file: frontend/src/components/AuditLogViewer.tsx
      function: AuditLogViewer
  - id: auth.mcp
    method: POST
    status: supported
    backend:
      path: /mcp
      file: crates/ugoite-server/src/mcp.rs
      function: handle
    note: v0.1 supports the authenticated MCP protocol and ACL boundary. An MCP client obtains a scoped credential through the internal resource-bound OAuth device and token endpoints below; browser cookie sessions are rejected. MCP and CLI credentials remain separate by resource and audience.
  - id: auth.authorization
    method: GET|POST|PUT|PATCH|DELETE
    status: supported
    backend:
      path: /spaces/{space_id}/protected-resources
      file: crates/ugoite-server/src/lib.rs
      function: require_space_action
    note: The path is a registry marker for the protected REST surface; concrete routes are authoritative in OpenAPI.
  - id: auth.recovery
    method: POST
    status: supported
    backend:
      path: /spaces/{space_id}/admin/recovery/force-reset|/auth/recovery/owner/start|/auth/recovery/owner/finish
      file: crates/ugoite-server/src/lib.rs
      function: owner_force_reset
    frontend:
      path: /recover
      file: frontend/src/routes/recover/index.tsx
      function: RecoverRoute
    note: Space recovery changes only the target principal's Node-local HumanAccount binding. This Owner-approved Space Recovery journey is separate from Account Self-Recovery.
  - id: auth.account_recovery
    method: POST
    status: supported
    backend:
      path: /auth/recovery/start|/auth/recovery/finish|/auth/recovery/totp/start|/auth/recovery/totp/finish
      file: crates/ugoite-server/src/lib.rs
      function: auth_recovery_start
    frontend:
      path: /recover/account|/settings/security
      file: frontend/src/lib/auth-api.ts
      function: recoverPasskey
    note: Account Self-Recovery accepts Account ID + one offline Recovery Code + recovery-only TOTP, then replaces the Node-local credential generation with a new Passkey and rotates all Recovery Codes. It preserves the HumanAccount and Space identity; OIDC linking and administrator recovery remain future scope.
  - id: auth.accounts
    method: GET|POST
    status: future
    backend:
      path: /auth/accounts|/auth/accounts/{account_id}/status
      file: crates/ugoite-server/src/lib.rs
      function: list_accounts
  - id: auth.oidc
    method: GET|POST
    status: future
    backend:
      path: /auth/oidc/providers|/auth/oidc/{provider_id}/start|/auth/oidc/callback|/auth/oidc/{provider_id}/link
      file: crates/ugoite-server/src/lib.rs
      function: oidc_start
  - id: auth.device
    method: GET|POST|DELETE
    status: internal
    backend:
      path: /auth/devices|/auth/devices/{credential_id}|/oauth/device/authorization|/oauth/device/pending|/oauth/device/approve
      file: crates/ugoite-server/src/lib.rs
      function: oauth_device_authorization
    frontend:
      path: /device
      file: frontend/src/routes/device.tsx
      function: DeviceApprovalRoute
    note: Shared internal device authorization/token machinery. REST CLI requests omit resource; MCP requests use exactly {issuer}/mcp.
  - id: auth.cli_device
    method: POST
    status: supported
    backend:
      path: /oauth/device/authorization|/oauth/device/pending|/oauth/device/approve|/oauth/token|/auth/devices|/auth/devices/{credential_id}
      file: crates/ugoite-server/src/lib.rs
      function: oauth_device_authorization
    frontend:
      path: /device
      file: frontend/src/routes/device.tsx
      function: DeviceApprovalRoute
    note: Remote CLI uses a fresh P-256 key, browser approval, opaque issuer-audience credentials, rotating refresh credentials, and DPoP. Logout deletes local state; remote asset upload remains future scope.
  - id: auth.agent
    method: POST
    status: future
    backend:
      path: /oauth/agent/token|/oauth/token|/oauth/authorize|/oauth/revoke|/spaces/{space_id}/agents|/spaces/{space_id}/agents/{agent_id}|/spaces/{space_id}/agents/{agent_id}/delegated-token|/spaces/{space_id}/approvals
      file: crates/ugoite-server/src/lib.rs
      function: issue_autonomous_agent_token
  - id: auth.oauth_metadata
    method: GET
    status: internal
    backend:
      path: /.well-known/oauth-protected-resource|/.well-known/oauth-authorization-server
      file: crates/ugoite-server/src/lib.rs
      function: oauth_protected_resource_metadata
    note: Metadata is exposed for supported MCP credential discovery. Generic third-party OAuth compatibility is not a v0.1 goal.
