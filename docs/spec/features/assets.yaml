- id: asset.upload
  method: POST
  status: implemented
  backend:
    path: /spaces/{space_id}/assets
    file: crates/ugoite-server/src/lib.rs
    function: upload_asset
  frontend:
    path: /spaces/{space_id}/assets
    file: frontend/src/lib/asset-api.ts
    function: assetApi.upload
  ugoite_core:
    file: crates/ugoite-iceberg/src/service.rs
    function: save_asset
  ugoite_cli:
    command: ugoite asset upload
    file: crates/ugoite-cli/src/commands/asset.rs
