  notes: Upload returns an AssetReference and does not create an Entry. Core/local CLI upload is implemented; remote CLI asset upload is intentionally unavailable in this release. API, REST, and frontend multipart upload use the same verified-storage mutation boundary as other Space writes; unsupported or unverified non-local storage fails closed.
