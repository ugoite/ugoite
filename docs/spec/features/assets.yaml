- id: asset.read
  method: GET
  status: implemented
  backend:
    path: /spaces/{space_id}/assets/{asset_id}
    file: crates/ugoite-server/src/lib.rs
    function: get_asset
  notes: Byte reads require the containing Form and Entry query context so
    Entry policy is evaluated as the Asset parent policy. The byte operation
    exposes no logical name or media type; those remain Form-owned metadata.
