  id: REQ-SEC-005
  title: Admin Bootstrap and Recovery Controls
  description: 'Initial setup MUST use an expiring one-time secret stored only as a

    hash and MUST establish either two passkeys or a passkey plus confirmed TOTP

    and recovery codes. Recovery codes and invitation tokens MUST be single-use

    and stored only as hashes.

    '
  related_spec:
