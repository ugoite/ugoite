  title: Initial Owner Bootstrap Controls
  description: 'Initial setup MUST use an expiring one-time secret stored only as a hash, MUST reject reuse, MUST create the administrator account and required initial Passkey state, MUST emit bootstrap-only recovery-code material once, and MUST create an authenticated opaque browser session. Account Self-Recovery is a separate explicitly enrolled flow.'
