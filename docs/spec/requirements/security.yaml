  id: REQ-SEC-010
  title: Credentialed CORS Allowlist
  description: Shared cross-origin deployments should use explicit CORS allowlists. The current server uses permissive
    origin/method/header middleware and relies on same-origin browser deployment by default.
  related_spec:
  - security/overview.md
  priority: high
  status: planned
  verification: untraced
