  id: REQ-SEC-001
  title: Localhost Binding
  description: The server binds to `127.0.0.1:8000` by default. Remote exposure requires an explicit `UGOITE_SERVER_ADDRESS`;
    supplied Compose files bind host ports to loopback.
  related_spec:
  - security/overview.md
  priority: high
  status: implemented
  verification: untraced
