  id: REQ-SEC-012
  title: Owner-Approved Account Recovery
  description: An active human Space Owner may issue a tuple-bound, one-use recovery approval; the target can replace credentials through a five-minute WebAuthn challenge, while credential generations invalidate stale human sessions and preserve Space agent credentials.
  related_spec:
  - security/authentication-overview.yaml
  - api/rest.md#authentication
  - stories/experimental.yaml
  priority: high
  status: implemented
  verification: traced
