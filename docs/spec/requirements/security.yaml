  id: REQ-SEC-004
  title: Passkey-First Authentication and OIDC Linking
  description: 'Primary user authentication MUST be passkey/WebAuthn with passwordless

    login. Optional external OIDC identity linking MAY be enabled, MUST identify

    users by issuer and subject, and MUST NOT auto-provision uninvited accounts.

    '
  related_spec:
