  id: REQ-SEC-015
  title: Remote CLI Device Authentication
  description: The packaged Linux CLI may authenticate to one Remote Node through browser-approved device authorization, a fresh P-256 device key, opaque short-lived access credentials, rotating refresh credentials, and DPoP. REST credentials omit resource and use the Node issuer audience; MCP credentials use the exact {issuer}/mcp resource and audience. Credentials are Node-bound, action-scoped, and reject cross-resource use. CLI logout is local credential/key deletion; remote CLI asset upload uses the authenticated REST file multipart part, and generic OAuth compatibility remains future scope.
  related_spec:
  - ../../operate/identity-access.md
  - ../architecture/api/rest.md#authentication
  - ../architecture/api/mcp.md#authentication
  priority: high
  status: implemented
  verification: traced
  tests:
  - file: crates/ugoite-cli/src/commands/auth.rs
    cases:
    - dpop_htu_excludes_query_and_fragment
    - dpop_htu_preserves_path
  - file: crates/ugoite-cli/tests/integration_test.rs
    cases:
    - default_device_login_actions_exclude_unapproved_dangerous_actions
  - file: crates/ugoite-server/src/lib.rs
