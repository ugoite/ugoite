  id: REQ-SEC-009
  title: Agent Principals and Scoped Proof-of-Possession Credentials
  description: Automation MUST use sponsored Agent Principals with independent public-key credentials, expiry,
    explicit Space/action grants, opaque short-lived access tokens, and attributable audit records. Agents MUST NOT
    manage members, ownership, or agents. The server MUST require a single-use human approval bound to the exact
    operation, action, canonical resource, actor credential, lifecycle epochs, and 1–300 second expiry for
    entry.delete, sql.delete, asset.delete, and access.put. Approval replay, mismatch, expiry, and ambiguous mutation
    outcomes MUST fail closed and remain auditable.
  related_spec:
  - security/overview.md
  - api/rest.md#authentication
  - api/mcp.md#model-context-protocol-v1
  priority: high
  status: planned
  verification: traced
  tests:
  - file: crates/ugoite-iceberg/src/authorization.rs
  - file: crates/ugoite-identity/src/oauth.rs
  - file: crates/ugoite-server/tests/api_contract.rs
- set_id: REQCAT-SECURITY
  source_file: requirements/security.yaml
  scope: Security controls, integrity protections, and isolation requirements.
  linked_policies:
  - POL-003
  - POL-004
  - POL-010
