  id: REQ-SEC-011
  title: CLI Remote Endpoint Transport Safety
  description: 'CLI server-backed endpoint configuration MUST reject non-loopback

    cleartext `http://` URLs, keep loopback cleartext URLs available for local

    development, fail closed when a saved endpoint is invalid, and refuse to

    treat such endpoints as active topology before any credentialed request can

    be sent to them.

    '
  related_spec:
  - ../architecture/security/overview.md
  priority: high
  status: implemented
  verification: traced
  tests:
  - file: crates/ugoite-cli/tests/test_cli_context_safety.rs
