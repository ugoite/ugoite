    - test_req_sec_012_approval_is_binding_scoped_and_audit_is_completion_only
    - test_req_sec_012_concurrent_reset_winner_and_loser_session
    - test_req_sec_012_replacement_failure_preserves_previous_approval
  - file: crates/ugoite-api-client/src/lib.rs
