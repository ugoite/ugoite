  id: REQ-SEC-014
  title: Account Self-Recovery
  description: 'An active HumanAccount with enrolled recovery TOTP and issued Recovery Codes MUST be able to replace its Node-local credential generation using the exact Account ID, one currently valid Recovery Code, and a valid TOTP code. Successful recovery MUST preserve the HumanAccount and its Space bindings, replace its Passkeys, advance credential_generation, invalidate pre-recovery authentication authority, rotate all Recovery Codes, establish a new authenticated browser session, and emit attributable Node audit state. Recovery replaces credentials, not identity; TOTP remains recovery-only.'
  related_spec:
  - security/overview.md
  - ../architecture/api/rest.md#authentication
  - stories/experimental.yaml
  priority: high
  status: implemented
  verification: traced
  tests:
  - file: crates/ugoite-identity/src/node_identity.rs
    cases:
    - totp_enrollment_distinguishes_invalid_codes_from_internal_state_errors
    - totp_accepts_one_adjacent_step_but_not_two
    - recovery_start_validates_without_consuming_code_or_persisting_plaintext
    - recovery_failures_lock_after_five_attempts_and_lock_valid_credentials
    - changing_recovery_totp_invalidates_pending_account_recovery_challenges
  - file: frontend/src/routes/recover/account.test.tsx
    cases:
    - replaces the Passkey and displays the rotated codes once
  - file: e2e/account-self-recovery.test.ts
    cases:
    - replaces the credential generation and preserves the HumanAccount
- set_id: REQCAT-SECURITY
  source_file: requirements/security.yaml
