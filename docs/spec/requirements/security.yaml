  id: REQ-SEC-012
  title: Owner-Approved Space Access Recovery
  description: An active human Space Owner may issue a tuple-bound, one-use approval for an active human principal in that Space. The target completes a five-minute WebAuthn registration, which creates a fresh HumanAccount and atomically replaces only the target Space Principal binding. The principal ID, membership, role, ACL, resource ownership, audit identity, old account credentials, sessions, and unrelated Space bindings are preserved; the old account simply loses authorization in the recovered Space.
  related_spec:
  - security/authentication-overview.yaml
  - ../architecture/api/rest.md#authentication
  - stories/experimental.yaml
  priority: high
  status: implemented
  verification: traced
  tests:
  - file: e2e/owner-space-recovery.test.ts
    cases:
    - req_sec_012_013_owner_space_access_recovery_supported_journey
  - file: crates/ugoite-server/tests/owner_recovery.rs
    cases:
    - test_req_sec_012_owner_only_space_scope_and_target_binding
    - test_req_sec_012_returns_a_fresh_account_contract
  - file: crates/ugoite-identity/src/node_identity.rs
    cases:
