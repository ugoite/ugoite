  id: REQ-IDX-009
  title: Ugoite SQL JOIN Support
  description: 'Ugoite SQL MUST support DataFusion joins between authorized Form relations.

    JSON-backed entries or asset tables are not part of the SQL surface; typed
    Form columns are the only reference surface.

    '
  related_spec:
  - features/sql.md
