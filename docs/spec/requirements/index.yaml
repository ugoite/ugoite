  id: REQ-IDX-001
  title: Persistent derived-index rebuild
  description: >-
    `ugoite index run` rebuilds registered search-related DerivedRelations from
    current authoritative Entry references. The initial AssetText producer
    publishes the current Iceberg build through its independent
    Relation Head without mutating the main Catalog Head.
