  id: REQ-IDX-008
  title: Ugoite SQL Query Execution
  description: 'Execute read-only DataFusion SQL queries against authorized Iceberg Form relations via the

    existing CLI/core query path and REST SQL-session endpoints. Execution MUST
    enforce authorized relation resolution and reject DDL/DML even when the
    same statement is accepted by syntax-only SQL linting.

    '
  related_spec:
  - features/sql.md
  - ../architecture/api/rest.md#endpoints
  priority: high
  status: implemented
  verification: traced
