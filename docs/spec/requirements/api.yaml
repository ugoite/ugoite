  id: REQ-API-007
  title: Saved SQL template validation
  description: 'Saved SQL entries MUST declare every {{variable_name}} template reference.

    Template execution is rejected until values are bound through DataFusion parameters;

    Ugoite MUST NOT substitute literal text into SQL.

    '
  related_spec:
  - ../architecture/api/rest.md#endpoints
