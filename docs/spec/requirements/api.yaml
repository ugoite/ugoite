  id: REQ-API-013
  title: Current MCP Surface Documentation
  description: 'Current-state MCP documentation MUST describe the shipped v1

    semantic facade: `ugoite.search`, `ugoite.save`, and `ugoite.delete` when

    authorized, plus lazy stable Entry/Form resources. The model-facing save

    contract MUST accept plain Markdown for a new generic Entry by

    canonicalizing it to the built-in Entry Form without weakening normal Entry

    validation. Save validation failures MUST remain semantic and actionable,

    while storage-specific routes, prompts, SQL, and revision tools remain

    future work.

    '
