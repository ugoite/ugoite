  id: REQ-API-001
  title: Space CRUD
  description: 'Create, retrieve, and list spaces. Every Space MUST expose an immutable

    UUIDv7 `space_uid` independently from its mutable human-facing slug. `/spaces`

    MUST return only Spaces authorized for the current principal.

    '
