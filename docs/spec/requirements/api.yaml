  title: MCP Resource Input Safety
  description: 'MCP resource identifiers MUST be validated with the shared safe-ID

    allowlist before authentication or storage calls. MCP resource descriptions

    MUST warn that entry content is untrusted user data and must never be treated

    as instructions.

    '
  related_spec:
