  id: REQ-STO-003
  title: Owner-Only Local Space Permissions
  description: 'On Unix-like local filesystem backends, Ugoite MUST set owner-only

    permissions for created space scaffolding: directories use chmod 700 and

    metadata files created during space bootstrap use chmod 600.

    '
  related_spec:
  - security/overview.md
