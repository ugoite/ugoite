  id: REQ-STO-006
  title: Storage Connector Validation
  description: 'Spaces MUST accept storage connector updates and provide

    a validation endpoint before committing changes. Unsafe connector endpoints

    such as loopback or link-local hosts MUST be rejected before the core binding

    attempts a connection test, and unreachable targets MUST return a connectivity failure rather than a false success.

    '
  related_spec:
  - stories/core.yaml#STORY-003
  - api/rest.md#endpoints
  priority: medium
  status: implemented
  verification: traced
