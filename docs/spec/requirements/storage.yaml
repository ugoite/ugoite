  id: REQ-STO-001
  title: Storage Abstraction Using the Shared OpenDAL Runtime Layer
  description: 'Runtime Space I/O must use the shared Rust storage layer: `ugoite-core` delegates storage mechanics
    through OpenDAL and portable types from `ugoite-domain`. Direct runtime Space access outside that boundary should
    be avoided.'
  related_spec:
  - architecture/overview.md#architecture-overview
  - stories/core.yaml#STORY-003
  priority: high
  status: implemented
  verification: traced
