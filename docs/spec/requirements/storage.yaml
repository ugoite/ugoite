  id: REQ-STO-007
  title: Backend IO Separation & Multi-backend Coverage
  description: Authoritative Space I/O must remain behind the Rust OpenDAL-backed storage/core boundary and be tested
    with local filesystem and in-memory operators. Adapter configuration files and Unix permission setup are bounded
    exceptions, not alternate persistence models.
  related_spec:
  - architecture/overview.md#architecture-overview
  - architecture/decisions.md#adr-006-one-release-image
