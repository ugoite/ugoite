  id: REQ-STO-013
  title: Rebuildable Derived Relations
  description: 'DerivedRelation Heads and immutable Iceberg materializations MUST
    remain under the owning Space prefix. They MUST use exact conditional Head
    publication, remain outside the authoritative Catalog Head and SpaceCheckpoint,
    and be safely rebuildable from authoritative data.'
