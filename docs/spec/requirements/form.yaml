  id: REQ-FORM-009
  title: Mandatory Attribution Metadata
  description: 'All Form-backed rows MUST persist system-managed attribution metadata.

    `author` is the principal that created the Entry and remains stable for its

    lifetime. `updated_by` is the principal that authored the latest revision,

    including create, update, delete, and restore. `deleted_by` is the principal

    that authored the current delete tombstone; it is cleared by restore while

    historical delete revisions retain their value.

    '
  related_spec:
