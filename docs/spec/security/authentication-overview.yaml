version: 0.3
updated: "2026-06-29"
node_identity:
  human_authentication: [passkey, invited_oidc]
  browser_session: {
    kind: opaque_server_side,
    idle_hours: 24,
    absolute_days: 30,
  }
  setup: { random: true, hashed: true, one_use: true, lifetime_minutes: 30 }
  setup_strength:
    accepted: [two_passkeys, passkey_totp_recovery_codes]
  persistence: atomic_opendal_node_control_store
  recovery:
    recovery_code: { hashed: true, one_use: true }
    totp: { encrypted_at_rest: true, sufficient_alone: false }
    passkey_replacement_requires: [recovery_code, totp]
space_identity:
  id: UUIDv7 space_uid
  portable: [principals, memberships, acl, attribution, authorization_audit]
  node_local: [accounts, principal_bindings, sessions, issuer, webauthn_rp]
oauth:
  device_authorization: implemented
  access_token: opaque_hashed_server_side
  access_token_minutes: 5
  refresh_rotation: every_use
  sender_constraint: RFC9449_DPoP
  metadata:
    - /.well-known/oauth-protected-resource
    - /.well-known/oauth-authorization-server
  resource_documentation: "https://ugoite.github.io/ugoite/docs/guide/operate/auth/auth-overview/"
agents:
  sponsor_required: true
  autonomous: explicit_agent_grant
  delegated: agent_grant_intersection_human_permission
prohibited:
  - fixed_password
  - shared_api_key
  - static_bearer
  - default_credential
  - development_authentication_bypass
  - external_oidc_token_as_api_credential
