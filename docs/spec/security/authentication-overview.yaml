version: 0.3
status: implemented
updated: "2026-06-29"
node_identity:
  human_authentication: [passkey, oidc]
  oidc:
    flow: authorization_code
    pkce: S256
    scopes: [openid]
    identity_key: [issuer, subject]
    invitation_required_for_new_accounts: true
    profile_claims_update_account: false
    upstream_tokens_are_api_credentials: false
    provider_lifecycle: [create, list, disable]
    disabled_provider_rejects_in_flight_attempts: true
    federated_session: opaque_browser_session
    linking_requires: recent_passkey
    unlinking_requires: recent_passkey
    first_passkey_bootstrap: invitation_creation_session_only
  browser_session: {
    kind: opaque_server_side,
    idle_hours: 24,
    absolute_days: 30,
  }
  setup: { random: true, hashed: true, one_use: true, lifetime_minutes: 30 }
  setup_strength:
    accepted: [two_passkeys]
  persistence: atomic_opendal_node_control_store
  recovery:
    recovery_code: { hashed: true, one_use: true, consumed_on_start: false, rotated_on_success: true }
    totp: { encrypted_at_rest: true, sufficient_alone: false, digits: 6, period_seconds: 30, clock_skew_steps: 1, replay_tracking: false }
    passkey_replacement_requires: [recovery_code, totp]
    credential_boundary: { field: credential_generation, stale_challenge_fails_closed: true, old_passkeys_removed: true, old_authority_invalidated: true }
    successful_self_recovery: { preserves_human_account: true, preserves_space_identity: true, new_browser_session: true, audit_action: account.recovered }
    owner_approved_space_access:
      authority: active_human_space_owner_with_recent_passkey
      approval_ttl_minutes: 15
      token: { entropy_bits_minimum: 256, hashed_at_rest: true, encrypted_for_one_time_response: true, one_use: true }
      challenge_ttl_minutes: 5
      reset: { fresh_human_account: true, principal_binding_replaced: true, space_identity_preserved: true, unrelated_credentials_preserved: true, plaintext_codes_returned_once: true }
space_identity:
  id: UUIDv7 space_uid
  portable: [principals, memberships, acl, attribution, authorization_audit]
  node_local: [accounts, principal_bindings, sessions, issuer, webauthn_rp]
oauth:
  device_authorization: implemented
  rest_cli: { resource: omitted, audience: issuer, dpop: RFC9449_DPoP }
  mcp: { resource: "{issuer}/mcp", audience: "{issuer}/mcp" }
  access_token: opaque_hashed_server_side
  access_token_minutes: 5
  refresh_rotation: every_use
  sender_constraint: RFC9449_DPoP
  metadata:
    - /.well-known/oauth-protected-resource
    - /.well-known/oauth-authorization-server
  resource_documentation: "https://ugoite.github.io/ugoite/docs/guide/operate/auth/auth-overview/"
agents:
  sponsor_required: true
  autonomous: explicit_agent_grant
  delegated: agent_grant_intersection_human_permission
prohibited:
  - fixed_password
  - shared_api_key
  - static_bearer
  - default_credential
  - development_authentication_bypass
  - external_oidc_token_as_api_credential
