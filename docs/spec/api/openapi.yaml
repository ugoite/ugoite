        "schema": {
          "type": "integer",
          "minimum": 0,
          "default": 0
        }
      },
      "AuditLimit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "Maximum number of audit events to return. Values are bounded to 500.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 500,
          "default": 100
        }
      },
      "AuditAction": {
        "name": "action",
        "in": "query",
        "required": false,
        "description": "Return only events with this exact action.",
