{
  "openapi": "3.1.0",
  "info": {
    "title": "Ugoite Rust Server API",
    "version": "0.1.0",
    "description": "The generated endpoint inventory is authoritative for the server implementation. v0.1 supports mandatory browser authentication with Passkey/WebAuthn, invitation-gated OIDC authentication and account linking, owner-approved Space access recovery, recovery-code + recovery-TOTP Account Self-Recovery, remote CLI device authentication, opaque sessions, Space membership/ACL enforcement, authenticated MCP access, and authorized audit reads. Administrator recovery, managed service-account operations, audit CRUD, and remote CLI asset upload remain reference/future scope. OIDC uses issuer + subject identity keys and never accepts upstream tokens as Ugoite credentials. TOTP is recovery-only."
  },
  "x-ugoite-response-signing": {
    "description": "Eligible materialized /api responses carry the reusable HMAC headers below. The signature is lowercase hexadecimal HMAC-SHA256 over the exact delivered body bytes.",
    "scope": "The default scope uses response_hmac/default.json; /spaces/{space_id}/ use spaces/{space_id}/hmac.json after exactly-once URI decoding and domain validation.",
    "eligible": "The shared API route marker covers materialized infallible JSON/string/bytes/empty bodies up to 8 MiB.",
    "unsigned": [
      "static files",
      "SSE or streaming/fallible bodies",
      "trailer-bearing responses",
      "explicitly unsigned responses",
      "unknown or invalid Space scopes",
      "signing or key-storage failures"
    ],
    "headers": {
      "key_id": {
        "$ref": "#/components/headers/X-Ugoite-Key-Id"
      },
      "signature": {
        "$ref": "#/components/headers/X-Ugoite-Signature"
      }
    }
  },
