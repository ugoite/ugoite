    status: planned
    tasks:
      - description: "Unverified follow-up: define completion outcomes for existing Entry, Form, Asset, search, and SQL journeys"
        done: false
      - description: "Unverified follow-up: define the discoverability and cross-surface consistency contract for browser, core CLI, and remote CLI"
        done: false
      - description: "Unverified follow-up: define the validation-clarity, recovery-completion, and documentation-correctness acceptance bar"
        done: false
  - id: implementation
    status: in_progress
    tasks:
      - description: "Shipped in v0.2.0: Form-first Browser navigation; structured Entry authoring and reads; canonical EntryQuery across Browser, local CLI, and remote API; Saved SQL lifecycle and stateless SQL query; CLI Context selection and durable mutation Receipt output"
        done: true
      - description: "Unverified follow-up: make existing journeys completable and discoverable without new authority or storage semantics"
        done: false
      - description: "Unverified follow-up: align cross-surface behavior and validation presentation while keeping business rules in the shared Rust boundary"
        done: false
      - description: "Unverified follow-up: complete recovery flows to a user-visible done state and keep docs aligned with implementation"
        done: false
  - id: testing
    status: planned
    tasks:
      - description: "Unverified follow-up: cover Product UX outcomes with focused regression tests on existing surfaces"
        done: false
      - description: "Keep manual browser, assistive-technology, and 1k/10k/two-Space acceptance separate from the recorded Entry browser regression evidence"
        done: false
      - description: "Unverified follow-up: keep the diagnostic corpus informational in 0.1.x; gate promotion remains separate v0.2 work"
        done: false
