id: user-controlled-view
version: "0.2"
status: planned
title: "User Controlled View and Experience"
goal: >
  Make Knowledge into portable, inspectable, task-specific Experiences through
  declarative query-driven definitions without creating a second system of
  record or authorization authority.
phases:
  - id: design
    status: planned
    tasks:
      - description: "Define a portable View/Application Definition and query-to-component composition model"
        done: false
      - description: "Design a bounded declarative expression schema stored as Space-owned Knowledge"
        done: false
      - description: "Define shareable definitions, permitted actions, and runtime-state boundaries"
        done: false
  - id: implementation
    status: planned
    tasks:
      - description: "Implement the approved portable definition and renderer without a parallel persistence authority"
        done: false
      - description: "Implement query-driven UI panels in frontend"
        done: false
      - description: "Implement saved and shareable Space-owned definitions"
        done: false
  - id: testing
    status: planned
    tasks:
      - description: "Tests for view definition parsing and rendering"
        done: false
      - description: "Tests for query-to-UI composition and persistence"
        done: false
