channel: alpha
title: Alpha Channel Changelog
doc_path: docs/spec/versions/changelog-alpha.md
summary: 'Alpha releases communicate the earliest validated preview slice of Ugoite so experimentation stays explicit
  and reviewable.

  '
release_notes:
  intro: 'Alpha releases use SemVer prerelease tags such as <version>-alpha.N and are the fastest-moving channel
    for previewing validated changes before broader beta review.

    '
  expectations:
  - Use exact alpha versions or the alpha image alias only for preview and experimentation.
  - Focus notes on explicit risk, experimental guidance, and what needs more validation.
  - Keep stable promises out of the alpha narrative until behavior graduates through beta and stable review.
  added:
  - A Rust-centered eight-crate workspace and one Deno workspace.
  - A single non-root runtime image layout with persistent /data storage.
  - Local CLI core mode, server-backed browser behavior, and the small MCP semantic facade.
  changed:
  - Documentation now distinguishes shipped behavior from browser-local sync and other planned capability.
  - Release notes no longer imply that unpublished artifacts or split frontend/backend images exist.
  planned:
  - A completed operator-supported release with its published artifacts and verified quick starts.
  - Managed Agent Principals/service-account automation, audit CRUD, and browser-local optional sync.
updated: '2026-06-23'
