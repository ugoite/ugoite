channel: beta
title: Beta Channel Changelog
doc_path: docs/architecture/release/changelog-beta.md
summary: 'Beta releases communicate the near-stable prerelease slice of Ugoite for broader validation before operator-facing
  support.

  '
release_notes:
  intro: 'Beta releases use SemVer prerelease tags such as <version>-beta.N and give operators and contributors
    a wider validation window before stable rollout.

    '
  expectations:
  - Use exact beta versions or the beta image alias when validating prerelease behavior.
  - Focus notes on known rollout risk, validation scope, and near-stable changes.
  - Keep experimental alpha-only guidance out of the beta narrative unless it is ready for broader review.
  added:
  - A Rust-centered 12-crate workspace and one Deno workspace.
  - A single non-root runtime image layout with persistent /data storage.
  - Local CLI core mode, server-backed browser behavior, and the small MCP semantic facade.
  changed:
  - Documentation now distinguishes shipped behavior from browser-local sync and other planned capability.
  - Release notes no longer imply that unpublished artifacts or split frontend/backend images exist.
  planned:
  - A completed operator-supported release with its published artifacts and verified quick starts.
  - Managed Agent Principals/service-account automation, audit CRUD, and browser-local optional sync.
updated: '2026-06-23'
