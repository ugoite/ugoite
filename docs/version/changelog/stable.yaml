channel: stable
title: Stable Channel Changelog
doc_path: docs/spec/versions/changelog-stable.md
summary: 'Stable releases communicate the supported, operator-ready slice of Ugoite with durable upgrade and deployment
  guidance.

  '
release_notes:
  intro: 'Stable releases use plain SemVer tags and serve as the long-lived reference point for operators and local-first
    teams that want supported behavior without prerelease risk.

    '
  expectations:
  - Use exact versions from the current published stream and the stable/latest image aliases for supported rollouts.
  - Focus notes on deployable behavior, upgrade impact, and operator guidance.
  - Keep prerelease experiments out of the stable narrative until they are ready for support.
  added:
  - A Rust-centered eight-crate workspace and one Deno workspace.
  - A single non-root runtime image layout with persistent /data storage.
  - Local CLI core mode, server-backed browser behavior, and a resource-first MCP baseline.
  changed:
  - Documentation now distinguishes shipped behavior from browser-local sync and other planned capability.
  - Release notes no longer imply that unpublished artifacts or split frontend/backend images exist.
  planned:
  - Published signed/checksummed container and CLI artifacts.
  - Production passkey/TOTP login, managed service accounts, audit APIs, and browser-local optional sync.
updated: '2026-06-23'
