id: mvp
version: '0.1'
status: completed
title: Minimum Viable Product (MVP)
goal: Establish the operator-owned Space model, Rust application core, local CLI path, server-backed browser, REST
  baseline, and read-only MCP resource.
phases:
- id: design
  status: completed
  tasks:
  - description: Define the Rust workspace and thin-adapter architecture.
    done: true
  - description: Define OpenDAL-backed Space storage and portable directory layout.
    done: true
  - description: Define the resource-first MCP baseline and browser/server boundary.
    done: true
- id: implementation
  status: completed
  tasks:
  - description: Implement the eight-crate Rust workspace and Deno workspace.
    done: true
  - description: Implement Space, Entry, Form, asset, revision, integrity, search, and SQL behavior in Rust.
    done: true
  - description: Implement the Axum REST server and server-backed SolidStart browser.
    done: true
  - description: Implement local/remote CLI modes and one read-only MCP Entry-list resource.
    done: true
- id: testing
  status: completed
  tasks:
  - description: Cover core paths with Rust, Deno/Vitest, and Playwright tests.
    done: true
  - description: Check OpenAPI and architecture boundaries in repository gates.
    done: true
