id: release-preparation
version: '0.1'
status: in_progress
title: Release Preparation
goal: Turn the current single-image and CLI build into a prepared, candidate-verified, operator-ready release.
phases:
- id: container-and-cli-artifacts
  status: in_progress
  tasks:
  - description: Build and locally verify the single non-root runtime image.
    done: true
  - description: Build release server and CLI binaries through the local release gate.
    done: true
  - description: Provide repository-native candidate generation and exact-byte promotion for image, CLI, npm, and Helm artifacts.
    done: true
  - description: Complete a release with published signed/checksummed image and CLI artifacts.
    done: false
- id: operator-documentation
  status: in_progress
  tasks:
  - description: Keep quick-start, authentication, storage, Helm, and troubleshooting docs aligned with implementation.
    done: true
  - description: Provide a post-publication gate for the published quick-start assets.
    done: true
  - description: Validate a published release through both quick starts.
    done: false
- id: release-communication
  status: in_progress
  tasks:
  - description: Provide channel-specific stable, beta, and alpha release-note publication only after artifact and quick-start verification.
    done: true
  - description: Complete a release with published channel-specific notes.
    done: false
