id: user-management
version: '0.1'
status: in_progress
title: User Management
goal: Provide authenticated multi-user Space access while preserving operator-owned storage.
requirement_ids:
- REQ-SEC-003
- REQ-SEC-004
- REQ-SEC-005
- REQ-SEC-006
- REQ-SEC-007
- REQ-SEC-008
- REQ-SEC-009
phases:
- id: design
  status: completed
  tasks:
  - description: Define identities, Space roles, memberships, and credential validation.
    done: true
  - description: Define passkey/TOTP, managed service accounts, and audit history as future capability.
    done: true
- id: implementation
  status: in_progress
  tasks:
  - description: Implement bearer/API-key/signed-token authentication and session cookies.
    done: true
  - description: Implement Space role checks and invitation/accept/role/revoke flows.
    done: true
  - description: Implement development mock OAuth and browser/CLI login UX.
    done: true
  - description: Implement production passkey/TOTP enrollment and login.
    done: false
  - description: Implement managed service-account lifecycle APIs.
    done: false
  - description: Implement audit-log persistence and listing APIs.
    done: false
- id: testing
  status: in_progress
  tasks:
  - description: Cover authentication, membership transitions, and privilege checks.
    done: true
  - description: Cover passkey/TOTP, service-account scope/revocation, and audit completeness.
    done: false
