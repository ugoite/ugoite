phases:
- id: design
  status: completed
  tasks:
  - description: Define identities, Space roles, memberships, invitation lifecycle, and credential validation.
    done: true
  - description: Define the v0.1 supported and future authentication boundary.
    done: true
- id: implementation
  status: completed
  tasks:
  - description: Implement Passkey authentication and opaque server-side sessions.
    done: true
  - description: Implement portable Space principals, roles, invitations, ACLs, and owner-visible audit reads.
    done: true
  - description: Support recovery-code + recovery-TOTP Account Self-Recovery while keeping OIDC linking, administrator account recovery, and agent principals outside the v0.1 support contract.
    done: true
- id: testing
  status: completed
  tasks:
  - description: Trace mandatory authentication, bootstrap, Passkey, Account Self-Recovery, session, membership, ACL, and audit MUST statements to their owning tests.
    done: true
  - description: Run the bootstrap acceptance gate on the shipped browser journey before the normal Playwright suite.
    done: true
  - description: Enforce supported requirement metadata consistency in the required CI lane.
    done: true
