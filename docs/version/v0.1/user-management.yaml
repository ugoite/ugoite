id: user-management
version: '0.1'
status: in_progress
title: User Management
goal: Provide authenticated multi-user Space access while preserving operator-owned storage.
requirement_ids:
- REQ-SEC-003
- REQ-SEC-004
- REQ-SEC-005
- REQ-SEC-006
- REQ-SEC-007
- REQ-SEC-008
- REQ-SEC-009
phases:
- id: design
  status: completed
  tasks:
  - description: Define identities, Space roles, memberships, and credential validation.
    done: true
  - description: Define passkey/TOTP, managed service accounts, and audit history as future capability.
    done: true
- id: implementation
  status: completed
  tasks:
  - description: Implement Passkey authentication and opaque server-side sessions.
    done: true
  - description: Implement portable Space principals, roles, invitations, and resource policies.
    done: true
  - description: Implement OAuth device authorization and sender-constrained CLI credentials.
    done: true
  - description: Implement sponsored agent principals and public-key credentials.
    done: true
  - description: Implement node and Space security audit persistence.
    done: true
- id: testing
  status: completed
  tasks:
  - description: Cover authentication, recovery, membership transitions, and privilege checks.
    done: true
  - description: Cover OAuth constraints, agent lifecycle, ACL leak prevention, and audit completeness.
    done: true
