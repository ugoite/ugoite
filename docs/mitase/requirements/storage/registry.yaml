schema: mitase/authoring/v2
kind: requirements
namespace: storage
category: Space storage boundaries and bootstrap
requirements:
  - id: REQ-STO-004
    title: Space registry management
    description: The spaces/ directory and each Space's current metadata maintain the Space registry, while the service exposes validated local Space locators without fabricating incomplete entries. Remote adapters expose immutable Space UIDs from that metadata.
    priority: high
    status: implemented
    criteria:
      - id: directory-registry
        kind: behavior
        statement: Listing Spaces discovers valid Space directories and returns their identifiers from current metadata-backed Space state.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: service-space-listing
        kind: behavior
        statement: The application service exposes the current validated Space directory locators through the same metadata-backed registry rather than a separate registry source; remote adapters resolve immutable Space UIDs from each locator's metadata.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: portable-storage-config
        kind: quality
        statement: Portable Space storage configuration normalizes local and remote URI forms without making a provider-specific representation the registry authority.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-014#rule.governance]
    bindings:
      - id: registry-verification
        role: verification
        facet: verification
        responsibility: Verify directory-backed Space discovery and service-level Space locator listing through exact Rust tests.
        targets:
          - id: directory-list-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_004_list_spaces_from_directory }
            claims:
              - kind: verifies
                criterion: REQ-STO-004#criterion.directory-registry
                covers: [FEAT-STO-001#binding.space/target.list-spaces]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_004_list_spaces_from_directory } }
              - kind: verifies
                criterion: REQ-STO-004#criterion.service-space-listing
                covers: [FEAT-STO-001#binding.service/target.list-space-ids]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_004_list_spaces_from_directory } }
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers: [FEAT-STO-001#binding.service/target.list-space-ids]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_004_list_spaces_from_directory } }
          - id: domain-storage-config-case
            adapter: rust
            path: crates/ugoite-domain/tests/test_coverage.rs
            selector: { kind: test, name: test_space_req_sto_004_storage_type_and_root_normalizes_local_and_remote_uris }
            claims:
              - kind: verifies
                criterion: REQ-STO-004#criterion.portable-storage-config
                covers: [FEAT-STO-001#binding.domain/target.storage-config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-domain, harness: test_coverage, test: test_space_req_sto_004_storage_type_and_root_normalizes_local_and_remote_uris } }

  - id: REQ-STO-005
    title: Space creation retry and duplicate conflict
    description: The authenticated POST /spaces operation creates a new Space with HTTP 201, returns the existing Space with HTTP 200 only when the same Node account retries an already-bound Space creation, and rejects another account attempting the existing slug with HTTP 409. A complete bootstrap with a missing final Node binding remains recoverable through the same authenticated creation path.
    priority: medium
    status: implemented
    criteria:
      - id: new-space-created
        kind: behavior
        statement: A valid new Space slug creates the Space and returns its immutable identity with HTTP 201.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: bound-account-retry
        kind: behavior
        statement: A retry from the Node account already bound to the Space slug returns the same immutable Space identity with HTTP 200 and does not create another Space.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: duplicate-slug-conflict
        kind: security
        statement: An account that is not already bound to an existing Space slug receives the explicit SPACE_ALREADY_EXISTS conflict with HTTP 409 and cannot claim that slug.
        governed_by: [POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: missing-binding-recovery
        kind: quality
        statement: An already complete Space whose final Node binding is missing can be repaired by the authenticated creation retry without rebuilding or replacing the Space.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
    bindings:
      - id: creation-verification
        role: verification
        facet: verification
        responsibility: Verify the authenticated Space creation outcomes, duplicate admission boundary, recovery behavior, and published OpenAPI contract through exact server tests.
        targets:
          - id: behavior-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::space_creation_api_distinguishes_bound_retry_from_duplicate_slug }
            claims:
              - kind: verifies
                criterion: REQ-STO-005#criterion.new-space-created
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_creation_api_distinguishes_bound_retry_from_duplicate_slug } }
              - kind: verifies
                criterion: REQ-STO-005#criterion.bound-account-retry
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_creation_api_distinguishes_bound_retry_from_duplicate_slug } }
              - kind: verifies
                criterion: REQ-STO-005#criterion.duplicate-slug-conflict
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_creation_api_distinguishes_bound_retry_from_duplicate_slug } }
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers:
                  - FEAT-API-001#binding.space-service-implementation/target.create-space
                  - FEAT-STO-001#binding.space-api/target.create-space-api
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_creation_api_distinguishes_bound_retry_from_duplicate_slug } }
              - kind: verifies
                criterion: REQ-API-001#criterion.stable-space-identity
                covers:
                  - FEAT-API-001#binding.space-service-implementation/target.create-space
                  - FEAT-STO-001#binding.space-api/target.create-space-api
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_creation_api_distinguishes_bound_retry_from_duplicate_slug } }
          - id: recovery-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::space_creation_retry_repairs_a_missing_node_binding }
            claims:
              - kind: verifies
                criterion: REQ-STO-005#criterion.missing-binding-recovery
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_creation_retry_repairs_a_missing_node_binding } }
          - id: openapi-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: issue_2212_openapi_documents_space_creation_outcomes }
            claims:
              - kind: verifies
                criterion: REQ-STO-005#criterion.new-space-created
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2212_openapi_documents_space_creation_outcomes } }
              - kind: verifies
                criterion: REQ-STO-005#criterion.bound-account-retry
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2212_openapi_documents_space_creation_outcomes } }
              - kind: verifies
                criterion: REQ-STO-005#criterion.duplicate-slug-conflict
                covers: [FEAT-STO-001#binding.space-api/target.create-space-api]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2212_openapi_documents_space_creation_outcomes } }
      - id: contract
        role: contract-source
        facet: api
        responsibility: Publish the authenticated POST /spaces request and its creation, retry, and duplicate-conflict responses as the authoritative HTTP contract.
        owns:
          - id: openapi-source
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
        targets:
          - id: create-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces' }

  - id: REQ-STO-006
    title: Storage connector validation
    description: Spaces MUST accept storage connector updates and provide a validation endpoint before committing changes. Unsafe connector endpoints such as loopback or link-local hosts MUST be rejected before the core binding attempts a connection test, and unreachable targets MUST return a connectivity failure rather than a false success.
    priority: medium
    status: implemented
    criteria:
      - id: connector-updates
        kind: behavior
        statement: The Space update surface accepts storage connector metadata without treating that metadata change as a physical data migration.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-014#rule.governance]
      - id: validation-endpoint
        kind: behavior
        statement: A dedicated Space connection-validation endpoint accepts a proposed connector configuration and delegates validation to the shared storage boundary.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-008#rule.governance]
      - id: pre-commit-validation
        kind: quality
        statement: Callers can validate a proposed connector through the validation endpoint before committing a connector update; mandatory sequencing of those two operations remains an explicit contract boundary.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-008#rule.governance]
      - id: supported-connector-config
        kind: behavior
        statement: Storage connection validation rejects unsupported URI schemes and reports a supported local or in-memory configuration as the corresponding connection mode.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-014#rule.governance]
      - id: safe-remote-endpoint
        kind: security
        statement: Storage connection validation rejects loopback, link-local, private, and otherwise unsafe remote endpoints before the connection probe attempts network access.
        governed_by: [POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: explicit-connectivity-failure
        kind: behavior
        statement: An unreachable custom remote storage endpoint returns a connectivity failure and never reports a false successful validation.
        governed_by: [POL-002#rule.governance, POL-008#rule.governance, POL-014#rule.governance]
    bindings:
      - id: connector-verification
        role: verification
        facet: verification
        responsibility: Verify the connector update and validation surfaces plus supported modes, endpoint safety, and typed connectivity failure through exact API, frontend, Iceberg integration, and unit cases. The repository exposes the validation-before-update workflow, while evidence that every update is rejected unless a prior validation succeeds remains unverified in this migration slice.
        targets:
          - id: connector-api-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: issue_2029_openapi_documents_storage_connection_contract }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.connector-updates
                covers: [FEAT-STO-001#binding.connector-api/target.patch-space]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2029_openapi_documents_storage_connection_contract } }
              - kind: verifies
                criterion: REQ-STO-006#criterion.validation-endpoint
                covers: [FEAT-STO-001#binding.connector-api/target.test-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2029_openapi_documents_storage_connection_contract } }
          - id: connector-save-case
            adapter: typescript
            path: frontend/src/components/SpaceSettings.test.tsx
            selector: { kind: test, name: renders storage values and saves only storage configuration }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.connector-updates
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: renders storage values and saves only storage configuration } }
              - kind: verifies
                criterion: REQ-FE-017#criterion.storage-configuration
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: renders storage values and saves only storage configuration } }
              - kind: verifies
                criterion: REQ-FE-060#criterion.topology-separation
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: renders storage values and saves only storage configuration } }
          - id: connector-test-case
            adapter: typescript
            path: frontend/src/components/SpaceSettings.test.tsx
            selector: { kind: test, name: tests the edited storage connection }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.validation-endpoint
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: tests the edited storage connection } }
              - kind: verifies
                criterion: REQ-FE-017#criterion.storage-configuration
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: tests the edited storage connection } }
          - id: unsupported-scheme-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_006_test_storage_connection_unknown_rejects_unsupported_scheme }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.supported-connector-config
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_006_test_storage_connection_unknown_rejects_unsupported_scheme } }
          - id: memory-mode-case
