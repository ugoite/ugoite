                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-query-handle.test.ts, test: pins get and resolve to the selected revision and ignores a stale parameter response } }
    criteria:
      - id: work-state-is-transient
        kind: behavior
        statement: Browser page, scroll, result, and cache state is not saved into a Composition document.
        governed_by: [POL-000#rule.foundation-precedence, POL-002#rule.governance]
