    criteria:
      - id: entry-query-translation
        kind: behavior
        statement: An entry_query source resolves to the existing bounded EntryQuery contract without creating a Composition-specific query engine.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-007#rule.governance]
      - id: used-field-fingerprint
        kind: behavior
        statement: >-
          Each entry_query source-schema fingerprint hashes only its source
          FormId and normalized used-field schema snapshot from
          REQ-COMP-002#criterion.used-field-schema-snapshot: explicitly used
          filter, sort, and projection fields (or all property fields returned
          by preview), plus the fields searched under existing EntryQuery
          text-search semantics when text is present. The snapshot includes
          field IDs and types with typed List item and RowReference target
          metadata. A metric field contributes only when the source projection
          already includes it; a component never changes the query or its
          fingerprint. Unrelated fields, labels, and other Composition document
          content are excluded from this fingerprint.
        governed_by: [POL-007#rule.governance]
      - id: exact-saved-sql-revision
        kind: behavior
        statement: A saved_sql source selects its exact Entry and Revision and never silently falls back to a newer revision.
        governed_by: [POL-014#rule.governance, POL-016#rule.governance]
      - id: saved-sql-result-fingerprint
        kind: behavior
        statement: A resolved saved_sql result fingerprint includes its exact Entry and Revision, normalized ordered expected_result descriptor, used variable schema, and selected metric result column when applicable.
        governed_by: [POL-007#rule.governance, POL-014#rule.governance]
      - id: exact-composition-revision
        kind: behavior
        statement: >-
          Composition resolution reads and authorizes the caller-selected
          EntryId and exact RevisionId before parsing; its typed spec and
          reported Composition revision reference come from that same
          revision, and a missing selected revision never falls back to latest.
        governed_by: [POL-011#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: current-authorization
        kind: behavior
        statement: Composition list, get, resolve, and source execution stay within the existing current-authorization boundaries.
        governed_by: [POL-011#rule.governance]
      - id: concealed-unavailable-references
        kind: behavior
        statement: Missing and denied Composition reads use the same caller-visible generic error; within an authorized Composition, missing and denied source Form or exact Saved SQL references use the same source_unavailable diagnostic without source identifiers or metadata, and field-level schema diagnostics require an authorized source Form read.
        governed_by: [POL-011#rule.governance]
      - id: draft-preview
        kind: behavior
        statement: composition.preview resolves one unsaved candidate document through the same source compilation and current-authorization semantics as a saved revision; plan identity is the draft fingerprint rather than an entry or revision reference, and preview creates no registry, history, or publication state.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-011#rule.governance]
  - id: REQ-COMP-005
    title: Recoverable invalid or unsupported Compositions
    description: Unsupported versions and broken references may prevent execution but do not remove raw inspection, export, or history access.
    priority: high
    status: implemented
    criteria:
      - id: raw-inspection
        kind: behavior
        statement: Unknown Composition versions and invalid or broken references remain available for raw inspection and export.
        governed_by: [POL-014#rule.governance, POL-016#rule.governance]
      - id: history-available
        kind: behavior
        statement: Unsupported versions and broken references do not prevent access to the Composition's existing revision history.
        governed_by: [POL-014#rule.governance, POL-016#rule.governance]
  - id: REQ-COMP-006
    title: Transient Composition runtime state
    description: Browser navigation and query-result state is Work and is not persisted as part of Composition Knowledge.
    priority: medium
    status: implemented
    bindings:
      - id: transient-work-verification
        role: verification
