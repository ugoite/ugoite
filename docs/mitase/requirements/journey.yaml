  - id: REQ-JOURNEY-003
    title: Journey Frontend-only usability
    description: 'Browser-only usability obligations for the journey workflow. These criteria deliberately carry no CLI counterpart: keyboard, focus, and recovery guidance have no meaningful CLI parity, and inventing one would be false evidence.'
    priority: medium
    status: implemented
    criteria:
      - id: conflict-recovery-guidance
        kind: behavior
        statement: After a revision conflict the browser shows refresh and recovery guidance while preserving the edited draft instead of losing it.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
      - id: validation-focus
        kind: behavior
        statement: Failed creation validation moves browser focus to the offending field, marks it invalid, and blocks the mutation without discarding input.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: journey-ux-frontend-verification
        role: verification
        facet: verification
        responsibility: Verify browser-only usability through exact Frontend component tests. No CLI evidence is required or accepted for these criteria.
        targets:
          - id: validation-focus-case
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.test.tsx
            selector: { kind: test, name: 'focuses an empty required asset field before creating an entry' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-003#criterion.validation-focus
                covers: [FEAT-JOURNEY-002#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/EntryDetailPane.test.tsx, test: 'focuses an empty required asset field before creating an entry' } }

  - id: REQ-JOURNEY-004
    title: Locate and recover durable Knowledge
    description: 'JOURNEY-LOCATE-RECOVER-001 carries one locate-and-recover outcome across typed structured Search narrowing, Space Change history, Change revert, recovered search, and reopen. Criteria state durable postconditions, never surface interaction steps; every surface must reach the same outcome with equivalent meaning.'
    priority: high
    status: implemented
    criteria:
      - id: structured-search-narrow
        kind: behavior
        statement: Typed structured Search narrows keyword discovery to the same intended Entry set on every surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: space-change-history
        kind: behavior
        statement: Entry mutations remain observable as append-only Space Change history on every surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: change-revert-append
        kind: behavior
        statement: Reverting a Change appends a new Change preserving all prior revisions and Changes on every surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: recovered-search-reopen
        kind: behavior
        statement: Post-recovery search reflects the recovered state, and reopen reads identical durable history and search outcomes on every surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: locate-recover-frontend-verification
        role: verification
        facet: verification
        responsibility: Verify every locate-and-recover postcondition through the exact server-backed browser journey cases. CLI core and CLI remote evidence attach to the same criteria without duplicating them.
        targets:
          - id: narrow-case
            adapter: typescript
            path: e2e/knowledge-journey.test.ts
            selector: { kind: test, name: 'JOURNEY-LOCATE-RECOVER-001: Structured search narrows keyword discovery' }
            claims:
              - kind: verifies
                criterion: REQ-JOURNEY-004#criterion.structured-search-narrow
                covers:
                  - FEAT-JOURNEY-001#binding.frontend/target.search-api
                runner: { runner: e2e-playwright, arguments: { file: e2e/knowledge-journey.test.ts, test: 'JOURNEY-LOCATE-RECOVER-001: Structured search narrows keyword discovery' } }
          - id: timeline-case
            adapter: typescript
