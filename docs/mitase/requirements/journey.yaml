                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_missing_required_rejected_without_mutation } }
          - id: stale-revision-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_stale_revision_conflicts_without_mutation }
            claims:
              - kind: verifies
