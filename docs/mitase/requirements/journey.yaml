                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_parity_core_missing_form_rejected_without_mutation } }
          - id: entry-delete-core-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
