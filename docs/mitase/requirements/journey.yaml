                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_remote, test: test_parity_remote_restore_unknown_revision_rejected_without_mutation } }
          - id: missing-form-remote-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector: { kind: test, name: test_parity_remote_missing_form_rejected_without_mutation }
