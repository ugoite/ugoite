schema: mitase/spec/v1
kind: requirements
namespace: storage
category: Space storage boundaries and bootstrap
requirements:
  - id: REQ-STO-001
    title: Shared OpenDAL runtime storage boundary
    description: "Runtime Space I/O uses the shared Rust storage boundary: Ugoite core and Iceberg services route storage mechanics through OpenDAL and portable domain types. Local authoritative mutations use the single-process serializer, while non-local mutation paths fail closed unless their exact-read, conditional-write, stale-rejection, and one-winner guarantees are established."
    priority: high
    status: implemented
    criteria:
      - id: shared-opendal-boundary
        kind: behavior
        statement: Runtime Space reads and writes use the shared OpenDAL-backed storage abstraction and do not create a parallel direct-persistence path in the application service.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-014#rule.governance]
      - id: mutation-admission
        kind: quality
        statement: Local authoritative mutations are serialized, and non-local mutations are admitted only when the storage contract can provide exact reads, conditional create or replacement, stale rejection, and one-winner concurrency behavior.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
    bindings:
      - id: storage-boundary-verification
        role: verification
        facet: verification
        responsibility: Verify the shared storage helper boundary and the fail-closed mutation admission rule through exact Rust tests.
        targets:
          - id: json-helper-case
            adapter: rust
            path: crates/ugoite-storage/src/lib.rs
            selector: { kind: symbol, name: tests::test_storage_req_sto_001_json_helpers_use_storage_abstraction }
            claims:
              - kind: verifies
                criterion: REQ-STO-001#criterion.shared-opendal-boundary
                covers: [FEAT-STO-001#binding.opendal/target.storage-helper]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-storage, test: tests::test_storage_req_sto_001_json_helpers_use_storage_abstraction } }
          - id: non-local-admission-case
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: service::tests::non_local_space_mutations_fail_closed_before_storage_writes }
            claims:
              - kind: verifies
                criterion: REQ-STO-001#criterion.mutation-admission
                covers: [FEAT-STO-001#binding.service/target.mutation-admission]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: service::tests::non_local_space_mutations_fail_closed_before_storage_writes } }
          - id: one-winner-case
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: service::tests::concurrent_principal_space_creation_preserves_slug_uniqueness }
            claims:
              - kind: verifies
                criterion: REQ-STO-001#criterion.mutation-admission
                covers: [FEAT-STO-001#binding.service/target.mutation-admission]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: service::tests::concurrent_principal_space_creation_preserves_slug_uniqueness } }

  - id: REQ-STO-002
    title: Space bootstrap directory structure
    description: Creating a Space writes its current metadata and settings, creates the forms, assets, and sql_sessions directories, and bootstraps the built-in Entry Form through the Iceberg-backed Form store.
    priority: high
    status: implemented
    criteria:
      - id: bootstrap-scaffold
        kind: behavior
        statement: Space creation produces meta.json and settings.json, creates forms/, assets/, and sql_sessions/, and persists the built-in Entry Form with the current default settings.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
    bindings:
      - id: bootstrap-verification
        role: verification
        facet: verification
        responsibility: Verify the current Space scaffold and built-in Entry Form through the exact Iceberg integration test.
        targets:
          - id: scaffold-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_002_create_space_scaffolding }
            claims:
              - kind: verifies
                criterion: REQ-STO-002#criterion.bootstrap-scaffold
                covers: [FEAT-STO-001#binding.space/target.create-space]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_002_create_space_scaffolding } }
              - kind: verifies
                criterion: REQ-STO-012#criterion.bootstrap-boundary
                covers: [FEAT-STO-001#binding.space/target.create-space]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_002_create_space_scaffolding } }

  - id: REQ-STO-003
    title: Owner-only local Space permissions
    description: "On Unix-like local filesystem backends, Space bootstrap scaffolding uses owner-only permissions: directories are mode 700 and metadata files created during bootstrap are mode 600."
    priority: medium
    status: implemented
    criteria:
      - id: owner-only-scaffold
        kind: security
        statement: Local Space directories are created with mode 700 and bootstrap metadata files are created with mode 600.
        governed_by: [POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
    bindings:
      - id: permissions-verification
        role: verification
        facet: verification
        responsibility: Verify owner-only modes for the Space root, scaffold directories, and bootstrap metadata through the exact Unix integration tests.
        targets:
          - id: initial-permissions-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_003_local_space_permissions }
            claims:
              - kind: verifies
                criterion: REQ-STO-003#criterion.owner-only-scaffold
                covers: [FEAT-STO-001#binding.space/target.local-permissions]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_003_local_space_permissions } }
          - id: atomic-permissions-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: local_atomic_space_patch_preserves_private_json_modes }
            claims:
              - kind: verifies
                criterion: REQ-STO-003#criterion.owner-only-scaffold
                covers: [FEAT-STO-001#binding.space/target.local-permissions]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: local_atomic_space_patch_preserves_private_json_modes } }

  - id: REQ-STO-004
    title: Space registry management
    description: The spaces/ directory and each Space's current metadata maintain the Space registry, while the service exposes the current Space identifiers without fabricating incomplete entries.
    priority: high
    status: implemented
    criteria:
      - id: directory-registry
        kind: behavior
        statement: Listing Spaces discovers valid Space directories and returns their identifiers from current metadata-backed Space state.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: service-space-listing
        kind: behavior
        statement: The application service exposes the current Space identifiers through the same metadata-backed registry rather than a separate registry source.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: portable-storage-config
        kind: quality
        statement: Portable Space storage configuration normalizes local and remote URI forms without making a provider-specific representation the registry authority.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-014#rule.governance]
    bindings:
      - id: registry-verification
        role: verification
        facet: verification
        responsibility: Verify directory-backed Space discovery and service-level Space identifier listing through exact Rust tests.
        targets:
          - id: directory-list-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_004_list_spaces_from_directory }
            claims:
              - kind: verifies
                criterion: REQ-STO-004#criterion.directory-registry
                covers: [FEAT-STO-001#binding.space/target.list-spaces]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_004_list_spaces_from_directory } }
              - kind: verifies
                criterion: REQ-STO-004#criterion.service-space-listing
                covers: [FEAT-STO-001#binding.service/target.list-space-ids]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_004_list_spaces_from_directory } }
          - id: domain-storage-config-case
            adapter: rust
            path: crates/ugoite-domain/tests/test_coverage.rs
            selector: { kind: test, name: test_space_req_sto_004_storage_type_and_root_normalizes_local_and_remote_uris }
            claims:
              - kind: verifies
                criterion: REQ-STO-004#criterion.portable-storage-config
                covers: [FEAT-STO-001#binding.domain/target.storage-config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-domain, harness: test_coverage, test: test_space_req_sto_004_storage_type_and_root_normalizes_local_and_remote_uris } }

  - id: REQ-STO-007
    title: Backend-neutral Space I/O
    description: Authoritative Space I/O remains behind the Rust OpenDAL-backed storage and core boundary and is exercised with local filesystem and in-memory operators. Adapter configuration and Unix permission setup are bounded integration concerns, not alternate persistence models.
    priority: high
    status: implemented
    criteria:
      - id: backend-neutral-io
        kind: quality
        statement: The shared storage boundary supports the local filesystem and in-memory OpenDAL operators while keeping Space persistence mechanics behind the same abstraction.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-003#rule.governance, POL-014#rule.governance]
    bindings:
      - id: backend-verification
        role: verification
        facet: verification
        responsibility: Verify backend-neutral operator construction and the shared storage helper behavior through exact Rust unit tests.
        targets:
          - id: operator-backends-case
            adapter: rust
            path: crates/ugoite-storage/src/lib.rs
            selector: { kind: symbol, name: tests::operator_from_uri_supports_fs_and_memory }
            claims:
              - kind: verifies
                criterion: REQ-STO-007#criterion.backend-neutral-io
                covers: [FEAT-STO-001#binding.opendal/target.operator-factory]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-storage, test: tests::operator_from_uri_supports_fs_and_memory } }

  - id: REQ-STO-006
    title: Storage connector validation
    description: Spaces MUST accept storage connector updates and provide a validation endpoint before committing changes. Unsafe connector endpoints such as loopback or link-local hosts MUST be rejected before the core binding attempts a connection test, and unreachable targets MUST return a connectivity failure rather than a false success.
    priority: medium
    status: implemented
    criteria:
      - id: connector-updates
        kind: behavior
        statement: The Space update surface accepts storage connector metadata without treating that metadata change as a physical data migration.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-014#rule.governance]
      - id: validation-endpoint
        kind: behavior
        statement: A dedicated Space connection-validation endpoint accepts a proposed connector configuration and delegates validation to the shared storage boundary.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-008#rule.governance]
      - id: pre-commit-validation
        kind: quality
        statement: Callers can validate a proposed connector through the validation endpoint before committing a connector update; mandatory sequencing of those two operations remains an explicit contract boundary.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-008#rule.governance]
      - id: supported-connector-config
        kind: behavior
        statement: Storage connection validation rejects unsupported URI schemes and reports a supported local or in-memory configuration as the corresponding connection mode.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-014#rule.governance]
      - id: safe-remote-endpoint
        kind: security
        statement: Storage connection validation rejects loopback, link-local, private, and otherwise unsafe remote endpoints before the connection probe attempts network access.
        governed_by: [POL-003#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: explicit-connectivity-failure
        kind: behavior
        statement: An unreachable custom remote storage endpoint returns a connectivity failure and never reports a false successful validation.
        governed_by: [POL-002#rule.governance, POL-008#rule.governance, POL-014#rule.governance]
    bindings:
      - id: connector-verification
        role: verification
        facet: verification
        responsibility: Verify the connector update and validation surfaces plus supported modes, endpoint safety, and typed connectivity failure through exact API, frontend, Iceberg integration, and unit cases. The repository exposes the validation-before-update workflow, while evidence that every update is rejected unless a prior validation succeeds remains unverified in this migration slice.
        targets:
          - id: connector-api-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: issue_2029_openapi_documents_storage_connection_contract }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.connector-updates
                covers: [FEAT-STO-001#binding.connector-api/target.patch-space]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2029_openapi_documents_storage_connection_contract } }
              - kind: verifies
                criterion: REQ-STO-006#criterion.validation-endpoint
                covers: [FEAT-STO-001#binding.connector-api/target.test-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: issue_2029_openapi_documents_storage_connection_contract } }
          - id: connector-save-case
            adapter: typescript
            path: frontend/src/components/SpaceSettings.test.tsx
            selector: { kind: test, name: renders storage values and saves only storage configuration }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.connector-updates
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: renders storage values and saves only storage configuration } }
          - id: connector-test-case
            adapter: typescript
            path: frontend/src/components/SpaceSettings.test.tsx
            selector: { kind: test, name: tests the edited storage connection }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.validation-endpoint
                covers: [FEAT-STO-001#binding.connector-ui/target.storage-settings]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SpaceSettings.test.tsx, test: tests the edited storage connection } }
          - id: unsupported-scheme-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_006_test_storage_connection_unknown_rejects_unsupported_scheme }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.supported-connector-config
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_006_test_storage_connection_unknown_rejects_unsupported_scheme } }
          - id: memory-mode-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_002_test_storage_connection_memory }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.supported-connector-config
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_002_test_storage_connection_memory } }
          - id: local-mode-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_002_test_storage_connection_local }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.supported-connector-config
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_002_test_storage_connection_local } }
          - id: blocked-endpoint-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_006_test_storage_connection_rejects_blocked_endpoint }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.safe-remote-endpoint
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_006_test_storage_connection_rejects_blocked_endpoint } }
          - id: blocked-addresses-case
            adapter: rust
            path: crates/ugoite-iceberg/src/space.rs
            selector: { kind: symbol, name: tests::storage_endpoints_reject_private_link_local_and_mapped_addresses }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.safe-remote-endpoint
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: tests::storage_endpoints_reject_private_link_local_and_mapped_addresses } }
          - id: unreachable-endpoint-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_006_test_storage_connection_accepts_custom_s3_endpoint_validation }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.explicit-connectivity-failure
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_006_test_storage_connection_accepts_custom_s3_endpoint_validation } }
          - id: typed-connectivity-failure-case
            adapter: rust
            path: crates/ugoite-iceberg/src/space.rs
            selector: { kind: symbol, name: tests::storage_connection_probe_times_out_without_external_service }
            claims:
              - kind: verifies
                criterion: REQ-STO-006#criterion.explicit-connectivity-failure
                covers: [FEAT-STO-001#binding.connector/target.test-storage-connection]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: tests::storage_connection_probe_times_out_without_external_service } }

  - id: REQ-STO-008
    title: Resilient directory-based Space listing
    description: Listing Spaces ignores incomplete directories that do not contain current metadata and returns valid Spaces without converting those incomplete directories into false entries or whole-list failures.
    priority: high
    status: implemented
    criteria:
      - id: incomplete-directory-filtering
        kind: behavior
        statement: Space discovery ignores directories without meta.json and returns valid Space identifiers only.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-014#rule.governance]
    bindings:
      - id: resilient-listing-verification
        role: verification
        facet: verification
        responsibility: Verify that incomplete Space directories are ignored through the exact Iceberg integration case.
        targets:
          - id: missing-meta-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: test_space_req_sto_008_list_spaces_ignores_missing_meta }
            claims:
              - kind: verifies
                criterion: REQ-STO-008#criterion.incomplete-directory-filtering
                covers:
                  - FEAT-STO-001#binding.space/target.list-spaces
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_008_list_spaces_ignores_missing_meta } }
              - kind: verifies
                criterion: REQ-STO-009#criterion.incomplete-space-filtering
                covers: [FEAT-STO-001#binding.space/target.list-spaces]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: test_space_req_sto_008_list_spaces_ignores_missing_meta } }

  - id: REQ-STO-009
    title: Accessible Space listing API
    description: The authenticated Space listing API returns only Spaces where the caller has read permission, relies on the resilient core listing behavior for incomplete directories, does not infer Space access from node administration, and propagates unexpected storage errors instead of returning false success.
    priority: high
    status: implemented
    criteria:
      - id: authorized-space-listing
        kind: security
        statement: The authenticated Space listing endpoint filters each discovered Space through the caller's read authorization before returning its metadata.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance, POL-014#rule.governance]
      - id: authenticated-listing-contract
        kind: behavior
        statement: The published Space listing operation declares its authenticated JSON success and storage-error response boundary.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: incomplete-space-filtering
        kind: behavior
        statement: The API uses the metadata-backed core listing boundary, so incomplete Space directories are ignored rather than fabricated as accessible entries.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-004#rule.governance]
      - id: storage-error-propagation
        kind: quality
        statement: Unexpected storage errors from Space enumeration or authorized metadata reads are returned as errors rather than converted into an empty or successful response.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-008#rule.governance]
    bindings:
      - id: listing-contract
        role: verification
        facet: verification
        responsibility: Verify the published Space listing operation through the exact server API contract test. Runtime authorization filtering, node-administration exclusion, and unexpected storage-error propagation remain explicit in the server implementation binding but unverified in this migration slice because this contract test inspects the OpenAPI shape only.
        targets:
          - id: visible-spaces-contract-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: test_space_req_sto_009_openapi_documents_authenticated_space_listing }
            claims:
              - kind: verifies
                criterion: REQ-STO-009#criterion.authenticated-listing-contract
                covers: [FEAT-E2E-001#binding.server/target.list-spaces]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: test_space_req_sto_009_openapi_documents_authenticated_space_listing } }

  - id: REQ-STO-010
    title: Mode-appropriate CLI Space identifiers
    description: When endpoint routing is backend or API, Space commands accept remote identifiers without misleading local-root positional arguments. When endpoint routing is core, commands that access local storage require an explicit local root before touching the filesystem.
    priority: medium
    status: implemented
    criteria:
      - id: remote-identifier-routing
        kind: behavior
        statement: Backend and API routing accept a bare remote Space identifier for commands that operate through the server.
        governed_by: [POL-004#rule.governance, POL-005#rule.governance, POL-008#rule.governance]
      - id: explicit-core-root
        kind: security
        statement: Core-mode Space commands require an explicit local root or Space path before accessing local storage.
        governed_by: [POL-001#rule.governance, POL-003#rule.governance, POL-005#rule.governance]
      - id: routing-help-contract
        kind: quality
        statement: CLI help explains the local Space path and remote Space identifier forms for the supported routing modes.
        governed_by: [POL-005#rule.governance, POL-008#rule.governance]
    bindings:
      - id: cli-routing-verification
        role: verification
        facet: verification
        responsibility: Verify core-root requirements, remote identifier routing, and the user-facing routing help through exact CLI integration cases.
        targets:
          - id: core-root-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_create_space_req_sto_010_requires_root_only_in_core_mode }
            claims:
              - kind: verifies
                criterion: REQ-STO-010#criterion.explicit-core-root
                covers: [FEAT-STO-001#binding.routing/target.space-command-routing]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_create_space_req_sto_010_requires_root_only_in_core_mode } }
          - id: remote-id-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_space_list_req_sto_010_accepts_backend_mode_without_local_root }
            claims:
              - kind: verifies
                criterion: REQ-STO-010#criterion.remote-identifier-routing
                covers: [FEAT-STO-001#binding.routing/target.space-command-routing]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_space_list_req_sto_010_accepts_backend_mode_without_local_root } }
          - id: routing-help-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
