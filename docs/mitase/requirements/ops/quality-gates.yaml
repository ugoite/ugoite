schema: mitase/authoring/v2
kind: requirements
namespace: ops
category: Operations, development, and quality-gate requirements
requirements:
  - id: REQ-OPS-002
    title: Container Build Validation
    description: The single runtime image is validated locally by `ci:release`, smoke-tested from the exact candidate digest before publication, and checked for distribution identity and health after publication.
    priority: medium
    status: implemented
    criteria:
      - id: release-container-validation
        kind: behavior
        statement: The candidate workflow builds the runtime image, the publish preflight exercises the exact candidate digest, and the post-publish check exercises the versioned image without rebuilding it.
        governed_by: [POL-003#rule.governance, POL-005#rule.governance, POL-008#rule.governance]
    bindings:
      - id: release-container-verification
        role: evidence
        facet: release-gate
        responsibility: Connect the local `ci:release` task, release workflow, and distribution verifier that provide the current container evidence without adding a second runtime authority.
        targets:
          - id: local-release-gate
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-002#criterion.release-container-validation
          - id: release-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-002#criterion.release-container-validation
          - id: container-smoke
            adapter: declared
            path: scripts/verify-release-distribution.sh
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-002#criterion.release-container-validation

  - id: REQ-OPS-005
    title: Repository Lint and Hygiene Gates
    description: Root checks cover formatting, Rust and Deno linting, architecture and OpenAPI drift, and configured repository artifact hygiene.
    priority: medium
    status: implemented
    criteria:
      - id: repository-quality-gates
        kind: quality
        statement: The root task graph and hosted CI lanes compose the repository formatting, lint, check, test, artifact, and required-result gates that are currently configured.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: repository-quality-verification
        role: verification
        facet: repository-test
        responsibility: Verify the root task and hosted lane composition through the exact repository coverage test. This checks the configured contract and does not claim that the tools execute successfully in every external environment.
        targets:
          - id: quality-gate-composition-test
            adapter: typescript
            path: tools/coverage_gates_test.ts
            selector: { kind: file }
            claims:
              - kind: verifies
                criterion: REQ-OPS-005#criterion.repository-quality-gates
                covers: [FEAT-OPS-001#binding.automation/target.root-mise, FEAT-OPS-001#binding.automation/target.ci-workflow]
                runner: { runner: deno-test-file, arguments: { file: tools/coverage_gates_test.ts, test: CI aggregate tasks own test coverage and lane scheduling } }

  - id: REQ-OPS-006
    title: Rust Quality Gate Parity
    description: Root local and CI gates run workspace formatting, Clippy, checks, and tests with the pinned Rust toolchain.
    priority: medium
    status: implemented
    criteria:
      - id: root-rust-gate
        kind: quality
        statement: The root task graph and hosted Rust lanes retain the configured formatting, Clippy, check, test, and pinned-toolchain quality gate composition.
        governed_by: [POL-002#rule.governance, POL-005#rule.governance, POL-008#rule.governance]
      - id: cli-surface
        kind: behavior
        statement: The CLI configuration helpers and documented entry, form, and search command help retain the current local-run surface.
        governed_by: [POL-002#rule.governance, POL-005#rule.governance]
    bindings:
      - id: rust-quality-verification
        role: verification
        facet: rust-and-task-tests
        responsibility: Verify the configured root Rust gate with the repository composition test and verify the selected CLI configuration/help behavior with exact integration tests. These targets cover the selected surface only; complete Rust quality-gate execution remains owned by the root workflow.
        targets:
          - id: rust-gate-composition-test
            adapter: typescript
            path: tools/coverage_gates_test.ts
            selector: { kind: file }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.root-rust-gate
                covers: [FEAT-OPS-001#binding.automation/target.root-mise, FEAT-OPS-001#binding.automation/target.ci-workflow]
                runner: { runner: deno-test-file, arguments: { file: tools/coverage_gates_test.ts, test: CI aggregate tasks own test coverage and lane scheduling } }
          - id: config-precedence-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_req_ops_006_config_helpers.rs
            selector: { kind: test, name: test_cli_req_ops_006_config_path_precedence_and_home_fallback }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_req_ops_006_config_helpers, test: test_cli_req_ops_006_config_path_precedence_and_home_fallback } }
          - id: config-load-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_req_ops_006_config_helpers.rs
            selector: { kind: test, name: test_cli_req_ops_006_load_config_fails_closed_on_invalid_or_unreadable_data }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_req_ops_006_config_helpers, test: test_cli_req_ops_006_load_config_fails_closed_on_invalid_or_unreadable_data } }
          - id: config-save-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_req_ops_006_config_helpers.rs
            selector: { kind: test, name: test_cli_req_ops_006_save_config_creates_parent_dirs_and_roundtrips }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_req_ops_006_config_helpers, test: test_cli_req_ops_006_save_config_creates_parent_dirs_and_roundtrips } }
          - id: config-path-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_req_ops_006_config_helpers.rs
            selector: { kind: test, name: test_cli_req_ops_006_operator_for_path_supports_file_and_rejects_remote_uris }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_req_ops_006_config_helpers, test: test_cli_req_ops_006_operator_for_path_supports_file_and_rejects_remote_uris } }
          - id: config-space-path-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_req_ops_006_config_helpers.rs
            selector: { kind: test, name: test_cli_req_ops_006_parse_space_path_variants }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_req_ops_006_config_helpers, test: test_cli_req_ops_006_parse_space_path_variants } }
          - id: config-endpoint-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_req_ops_006_config_helpers.rs
            selector: { kind: test, name: test_cli_req_ops_006_endpoint_helpers_cover_base_url_and_space_path }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.config]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_req_ops_006_config_helpers, test: test_cli_req_ops_006_endpoint_helpers_cover_base_url_and_space_path } }
          - id: entry-update-help-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_entry_update_req_ops_006_help_describes_required_inputs }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.help]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_entry_update_req_ops_006_help_describes_required_inputs } }
          - id: entry-create-help-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_entry_create_req_ops_006_help_leads_with_structured_fields }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.help]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_entry_create_req_ops_006_help_leads_with_structured_fields } }
          - id: form-search-help-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_form_and_entry_list_req_ops_006_help_describes_required_inputs }
            claims:
              - kind: verifies
                criterion: REQ-OPS-006#criterion.cli-surface
                covers: [FEAT-OPS-001#binding.cli/target.help]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_form_and_search_req_ops_006_help_describes_required_inputs } }

  - id: REQ-OPS-007
    title: Docsite Quality Gate Parity
    description: Docsite type, build, and behavior tests run through Deno and the root check and test gates.
    priority: medium
    status: implemented
    criteria:
      - id: docsite-gate
        kind: quality
        statement: The root task graph and hosted web lane include the configured docsite type, build, and behavior test gates.
        governed_by: [POL-006#rule.governance, POL-008#rule.governance]
    bindings:
      - id: docsite-quality-verification
        role: verification
        facet: repository-test
        responsibility: Verify the configured docsite lane as part of the shared root task and hosted lane composition test. This records the gate contract without claiming a successful build in every environment.
        targets:
          - id: docsite-gate-composition-test
            adapter: typescript
            path: tools/coverage_gates_test.ts
            selector: { kind: file }
            claims:
              - kind: verifies
                criterion: REQ-OPS-007#criterion.docsite-gate
                covers: [FEAT-OPS-001#binding.automation/target.root-mise, FEAT-OPS-001#binding.automation/target.ci-workflow]
                runner: { runner: deno-test-file, arguments: { file: tools/coverage_gates_test.ts, test: CI aggregate tasks own test coverage and lane scheduling } }

  - id: REQ-OPS-008
    title: PR Template Validation Gates
    description: Non-draft, non-Dependabot pull requests must contain Summary, Related Issue, and Testing sections with a closing issue link.
    priority: medium
    status: implemented
    criteria:
      - id: pr-template-gates
        kind: quality
        statement: The repository defines the required pull-request sections and a trusted workflow validates the closing issue link and knowledge-compatibility classification for eligible pull requests.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: pr-template-gate-evidence
        role: evidence
        facet: pull-request-gate
        responsibility: Connect the public pull-request template and trusted validation workflow to the gate contract. The workflow remains repository tooling and is not executed by Mitase.
        targets:
          - id: pull-request-template
            adapter: declared
            path: .github/pull_request_template.md
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-008#criterion.pr-template-gates
          - id: close-issue-workflow
            adapter: declared
            path: .github/workflows/pr-require-close-issue.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-008#criterion.pr-template-gates

  - id: REQ-OPS-011
    title: Rust Target Cache Discipline
    description: Rust tasks must share the root `CARGO_TARGET_DIR` and use locked dependencies.
    priority: medium
    status: implemented
    criteria:
      - id: rust-cache-discipline
        kind: quality
        statement: Repository-owned Rust task and workflow surfaces use the portable root target directory contract and locked dependency resolution rather than silently creating an alternate repository cache contract.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: rust-cache-evidence
        role: evidence
        facet: rust-build-contract
        responsibility: Connect the root task graph and hosted Rust workflows to the cache and lockfile discipline. Developer-selected intermediate build sharing remains external tooling and is not made a Mitase responsibility.
        targets:
          - id: root-rust-task-graph
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-011#criterion.rust-cache-discipline
          - id: hosted-rust-gates
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-011#criterion.rust-cache-discipline

  - id: REQ-OPS-012
    title: Devcontainer Change Detection
    description: A hosted workflow should build/smoke the devcontainer only when relevant paths change while always emitting a required result. No such workflow is present.
    priority: medium
    status: planned
    criteria:
      - id: devcontainer-change-detection
        kind: quality
        statement: A future hosted devcontainer gate should select relevant changes while always publishing its required result; the current repository does not provide that workflow.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: devcontainer-planned-surface
        role: evidence
        facet: planned-work
        responsibility: Record the current devcontainer configuration and dependency automation as the existing planning surface without claiming that the requested hosted change-detection workflow exists.
        targets:
          - id: devcontainer-config
            adapter: declared
            path: .devcontainer/devcontainer.json
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-012#criterion.devcontainer-change-detection
          - id: devcontainer-dependency-updates
            adapter: declared
            path: .github/dependabot.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-012#criterion.devcontainer-change-detection

  - id: REQ-OPS-013
    title: Native Required Status Check Contract
    description: Required status names must be versioned and match the CI and CodeQL summary jobs.
    priority: medium
    status: implemented
    criteria:
      - id: required-status-contract
        kind: quality
        statement: The repository records the required status contexts and their workflow summary jobs as one versioned contract for pull-request and merge-group validation.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: required-status-evidence
        role: evidence
        facet: hosted-gate-contract
        responsibility: Connect the versioned status-check declaration and the CI, CodeQL, and pull-request workflows that publish the declared summary contexts.
        targets:
          - id: required-status-declaration
            adapter: declared
            path: .github/required-status-checks.json
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
          - id: ci-summary-workflow
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
          - id: codeql-summary-workflow
            adapter: declared
            path: .github/workflows/codeql.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
          - id: pr-gate-workflow
            adapter: declared
            path: .github/workflows/pr-require-close-issue.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract

  - id: REQ-OPS-020
    title: Portable Rust WASM Gates
    description: ugoite-domain, ugoite-api-client, and ugoite-wasm compile for wasm32-unknown-unknown through the root check and release gates.
    priority: medium
    status: implemented
    criteria:
      - id: portable-wasm-gates
        kind: quality
        statement: The root task graph includes locked wasm32-unknown-unknown checks for the portable Rust crates and hosted CI exercises that root gate composition.
        governed_by: [POL-002#rule.governance, POL-005#rule.governance, POL-008#rule.governance]
    bindings:
      - id: portable-wasm-gate-verification
        role: verification
        facet: repository-test
        responsibility: Verify the exact root and hosted task composition that includes the portable WASM checks. The test records the configured gate; it does not move compilation or CI execution into Mitase.
        targets:
          - id: wasm-gate-composition-test
            adapter: typescript
            path: tools/coverage_gates_test.ts
            selector: { kind: test, name: 'CI aggregate tasks own test coverage and lane scheduling' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-020#criterion.portable-wasm-gates
                covers: [FEAT-OPS-001#binding.automation/target.root-mise, FEAT-OPS-001#binding.automation/target.ci-workflow]
                runner: { runner: deno-test-file, arguments: { file: tools/coverage_gates_test.ts, test: CI aggregate tasks own test coverage and lane scheduling } }

  - id: REQ-OPS-021
    title: Frontend Coverage Hard Gate
    description: The required hosted CI job runs the root frontend coverage task, whose Vitest V8 configuration hard-fails all coverage metrics at 100% for the portable Rust/WASM protocol boundary; UI behavior remains covered by frontend behavior tests and E2E.
    priority: medium
    status: implemented
    criteria:
      - id: frontend-coverage-gate
        kind: quality
        statement: The frontend coverage configuration and root task keep the portable Rust/WASM protocol boundary at 100% coverage and are included in the canonical repository test gate.
        governed_by: [POL-002#rule.governance, POL-008#rule.governance]
    bindings:
      - id: frontend-coverage-verification
        role: verification
        facet: frontend-test
        responsibility: Verify the exact frontend coverage configuration and root-task contract through the dedicated coverage-gate test.
        targets:
          - id: frontend-coverage-test
            adapter: typescript
            path: tools/coverage_gates_test.ts
            selector: { kind: test, name: 'REQ-OPS-021: frontend coverage remains a canonical test contract' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-021#criterion.frontend-coverage-gate
                covers: [FEAT-OPS-001#binding.migrated-ops-coverage/target.frontend-coverage-config, FEAT-OPS-001#binding.automation/target.root-mise]
                runner: { runner: deno-test-file, arguments: { file: tools/coverage_gates_test.ts, test: 'REQ-OPS-021: frontend coverage remains a canonical test contract' } }

  - id: REQ-OPS-022
    title: Path-Aware Pull Request E2E Tiering
    description: Hosted CI may select E2E tiers by changed paths while merge and push retain smoke coverage; current CI uses fixed pull-request and merge gates.
    priority: medium
    status: planned
    criteria:
      - id: path-aware-e2e-tiering
        kind: quality
        statement: The repository records the planned path-aware E2E tiering boundary while preserving fixed smoke coverage for pull-request, merge-group, and push validation until a changed-path selector is introduced.
        governed_by: [POL-005#rule.governance, POL-008#rule.governance]
    bindings:
      - id: path-aware-e2e-tiering-evidence
        role: evidence
        facet: planned-work
        responsibility: Preserve the current CI workflow as evidence for the planned tiering criterion without claiming that a hosted changed-path selector already exists.
        targets:
          - id: ci-workflow
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-022#criterion.path-aware-e2e-tiering

  - id: REQ-OPS-024
    title: Docsite Coverage Convenience
    description: "The canonical root and hosted web tasks run the normal docsite behavior/type suite. The separate docsite coverage task remains developer convenience: its Vitest V8 report covers authored source while excluding framework-only wiring and test files, without hard-failing coverage thresholds."
    priority: medium
    status: implemented
    criteria:
      - id: docsite-coverage-gate
        kind: quality
        statement: The docsite coverage configuration and separate root task keep coverage reporting available for authored docsite source, while canonical repository tests use the normal docsite suite and do not make coverage percentage a merge gate.
        governed_by: [POL-006#rule.governance, POL-008#rule.governance]
    bindings:
      - id: docsite-coverage-verification
        role: verification
        facet: docsite-test
        responsibility: Verify the docsite coverage configuration and root-task contract, including the absence of hard coverage thresholds, through the dedicated coverage test.
        targets:
          - id: docsite-coverage-test
            adapter: typescript
            path: tools/coverage_gates_test.ts
            selector: { kind: test, name: 'REQ-OPS-024: docsite coverage remains developer convenience' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-024#criterion.docsite-coverage-gate
                covers: [FEAT-OPS-001#binding.migrated-ops-coverage/target.docsite-coverage-config, FEAT-OPS-001#binding.automation/target.root-mise]
                runner: { runner: deno-test-file, arguments: { file: tools/coverage_gates_test.ts, test: 'REQ-OPS-024: docsite coverage remains developer convenience' } }

