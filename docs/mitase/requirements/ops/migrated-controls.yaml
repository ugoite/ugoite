category: Operations, development, and quality-gate requirements
requirements:
  - id: REQ-OPS-027
    title: "Strict Lockfile Discipline"
    description: "Rust commands must use `--locked` and Deno workflows must use the committed lockfile without silently changing dependency resolution."
    priority: medium
    status: implemented
    criteria:
      - id: migrated-contract
        kind: quality
        statement: "Rust commands must use `--locked` and Deno workflows must use the committed lockfile without silently changing dependency resolution."
        governed_by: []
    bindings:
      - id: req-ops-027-source-evidence
        role: evidence
        facet: repository-artifact
        responsibility: Connect the exact existing source artifacts without inferring full behavioral coverage from file presence.
        targets:
          - id: source-1
            adapter: declared
            path: Cargo.lock
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-027#criterion.migrated-contract
          - id: source-2
            adapter: declared
            path: deno.lock
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-027#criterion.migrated-contract
          - id: source-3
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-027#criterion.migrated-contract
          - id: source-4
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-027#criterion.migrated-contract
