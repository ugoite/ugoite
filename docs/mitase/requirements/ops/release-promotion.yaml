schema: mitase/authoring/v2
kind: requirements
namespace: ops
category: Operations, development, and quality-gate requirements
requirements:
  - id: REQ-OPS-009
    title: Deterministic Release Promotion
    description: An operator-selected verified candidate must keep canonical metadata and published installer paths synchronized with its exact source commit and artifact digests.
    priority: medium
    status: implemented
    criteria:
      - id: deterministic-release-promotion
        kind: quality
        statement: Release candidate creation selects one exact source revision, records candidate and artifact identities, and publication promotes those verified bytes without rebuilding or repackaging.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: deterministic-release-evidence
        role: evidence
        facet: release-promotion
        responsibility: Connect the release contract, candidate workflow, publish workflow, and release implementation to the deterministic promotion boundary. This slice records the existing contract without moving release execution into Mitase.
        targets:
          - id: release-contract
            adapter: declared
            path: docs/architecture/release/release-contract.md
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
          - id: candidate-workflow
            adapter: declared
            path: .github/workflows/release-candidate.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
          - id: publish-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
          - id: release-implementation
            adapter: typescript
            path: tools/release.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion

  - id: REQ-OPS-044
    title: Repository-Native Candidate Promotion
    description: Release preparation uses version.txt as the canonical prepared-version authority, records verified candidate identity from exact manifest bytes, and promotes only matching candidate artifacts without rebuilding or repackaging.
    priority: high
    status: implemented
    criteria:
      - id: repository-native-release-promotion
        kind: quality
        statement: Candidate creation and publication preserve one prepared version, one exact source revision, one manifest-derived candidate identity, and the exact verified artifact bytes across promotion surfaces.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: repository-native-release-evidence
        role: evidence
        facet: release-promotion
        responsibility: Connect the version authority, candidate workflow, publish workflow, and release implementation as generic Artifacts. Release execution remains owned by repository workflows and scripts.
        targets:
          - id: version-authority
            adapter: declared
            path: version.txt
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: candidate-workflow
            adapter: declared
            path: .github/workflows/release-candidate.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: publish-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: release-implementation
            adapter: typescript
            path: tools/release.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: release-verifier-core
            adapter: typescript
            path: tools/release_verify.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-044#criterion.repository-native-release-promotion
      - id: repository-native-release-verification
        role: verification
        facet: release-test
        responsibility: Verify version authority, split workflows, exact candidate identity, tamper detection, and candidate manifest coverage through the exact release-contract tests.
        targets:
          - id: version-authority-test
            adapter: typescript
            path: tools/release_contract_test.ts
            selector: { kind: test, name: 'REQ-OPS-044: version.txt is the only prepared-version authority' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
                covers: [FEAT-OPS-001#binding.repository-native-release/target.version-authority]
                runner: { runner: deno-test-file, arguments: { file: tools/release_contract_test.ts, test: 'REQ-OPS-044: version.txt is the only prepared-version authority' } }
          - id: release-workflow-test
            adapter: typescript
            path: tools/release_contract_test.ts
            selector: { kind: test, name: 'REQ-OPS-044: repository-native release tasks and split workflows are present' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
                covers: [FEAT-OPS-001#binding.repository-native-release/target.candidate-workflow, FEAT-OPS-001#binding.repository-native-release/target.publish-workflow, FEAT-OPS-001#binding.repository-native-release/target.release-implementation]
                runner: { runner: deno-test-file, arguments: { file: tools/release_contract_test.ts, test: 'REQ-OPS-044: repository-native release tasks and split workflows are present' } }
          - id: candidate-identity-test
            adapter: typescript
            path: tools/release_contract_test.ts
            selector: { kind: test, name: 'REQ-OPS-044: candidate ID is the exact manifest digest and tampering fails' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
                covers: [FEAT-OPS-001#binding.repository-native-release/target.release-implementation]
                runner: { runner: deno-test-file, arguments: { file: tools/release_contract_test.ts, test: 'REQ-OPS-044: candidate ID is the exact manifest digest and tampering fails' } }
          - id: candidate-writer-test
            adapter: typescript
            path: tools/release_contract_test.ts
            selector: { kind: test, name: 'REQ-OPS-044: candidate writer records every promotion surface' }
            claims:
              - kind: verifies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
                covers: [FEAT-OPS-001#binding.repository-native-release/target.release-implementation]
                runner: { runner: deno-test-file, arguments: { file: tools/release_contract_test.ts, test: 'REQ-OPS-044: candidate writer records every promotion surface' } }
          - id: verifier-core-test
            adapter: typescript
            path: tools/release_verify_test.ts
            selector: { kind: test, name: release verifier core derives candidate identity from exact manifest bytes }
            claims:
              - kind: verifies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
                covers: [FEAT-OPS-001#binding.repository-native-release/target.release-implementation, FEAT-OPS-001#binding.repository-native-release/target.release-verifier-core]
                runner: { runner: deno-test-file, arguments: { file: tools/release_verify_test.ts, test: release verifier core derives candidate identity from exact manifest bytes } }

  - id: REQ-OPS-025
    title: Release authority outcomes
    description: >-
      Product UX is the sole active v0.2 release authority over the frozen v0.1
      Foundation, Knowledge-to-tools remains a North Star rather than shipped
      acceptance, and the repository drift gate keeps the v0.1/v0.2 trackers and
      active roadmap claims from returning to the obsolete View and AI
      authorities. Implementation plans remain delivery context only; the
      canonical graph remains the semantic source of truth.
    priority: medium
    status: implemented
    criteria:
      - id: product-ux-authority
        kind: quality
        statement: The active v0.2 tracker lists Product UX as the sole milestone authority with completion, discoverability, cross-surface consistency, validation clarity, recovery, and documentation correctness as success, while Knowledge-to-tools stays a North Star rather than shipped acceptance.
        governed_by: [POL-008#rule.governance]
      - id: release-authority-drift-gate
        kind: quality
        statement: The repository gate pins the v0.1/v0.2 trackers, the roadmap claims, and the release pages to the Product UX authority and fails the canonical check path when stale authorities return.
        governed_by: [POL-008#rule.governance]
    bindings:
      - id: authority-verification
        role: verification
        facet: release-authority
        responsibility: Verify the sole-authority tracker shape, the obsolete-authority rejection, and the roadmap claim contract through the exact gate tests.
        targets:
          - id: sole-authority-case
            adapter: rust
            path: crates/xtask/src/main.rs
            selector: { kind: test, name: gate_contract_tests::v02_tracker_with_product_ux_milestone_passes }
            claims:
              - kind: verifies
                criterion: REQ-OPS-025#criterion.product-ux-authority
                covers: [FEAT-OPS-001#binding.release-authority/target.authority-gate]
                runner: { runner: cargo-test-unit, arguments: { package: xtask, test: gate_contract_tests::v02_tracker_with_product_ux_milestone_passes } }
          - id: authority-goal-case
            adapter: rust
            path: crates/xtask/src/main.rs
            selector: { kind: test, name: gate_contract_tests::product_ux_goal_requires_all_dimensions }
            claims:
              - kind: verifies
                criterion: REQ-OPS-025#criterion.product-ux-authority
                covers: [FEAT-OPS-001#binding.release-authority/target.authority-gate, FEAT-OPS-001#binding.release-authority/target.product-ux-milestone]
                runner: { runner: cargo-test-unit, arguments: { package: xtask, test: gate_contract_tests::product_ux_goal_requires_all_dimensions } }
          - id: foundation-case
            adapter: rust
            path: crates/xtask/src/main.rs
            selector: { kind: test, name: gate_contract_tests::v01_tracker_requires_frozen_foundation }
            claims:
              - kind: verifies
                criterion: REQ-OPS-025#criterion.product-ux-authority
                covers: [FEAT-OPS-001#binding.release-authority/target.authority-gate]
                runner: { runner: cargo-test-unit, arguments: { package: xtask, test: gate_contract_tests::v01_tracker_requires_frozen_foundation } }
          - id: stale-authority-case
            adapter: rust
            path: crates/xtask/src/main.rs
            selector: { kind: test, name: gate_contract_tests::v02_tracker_with_returned_view_authority_fails }
            claims:
              - kind: verifies
                criterion: REQ-OPS-025#criterion.release-authority-drift-gate
                covers: [FEAT-OPS-001#binding.release-authority/target.authority-gate]
                runner: { runner: cargo-test-unit, arguments: { package: xtask, test: gate_contract_tests::v02_tracker_with_returned_view_authority_fails } }
          - id: obsolete-case
            adapter: rust
            path: crates/xtask/src/main.rs
            selector: { kind: test, name: gate_contract_tests::obsolete_milestone_presence_fails }
            claims:
              - kind: verifies
                criterion: REQ-OPS-025#criterion.release-authority-drift-gate
                covers: [FEAT-OPS-001#binding.release-authority/target.authority-gate]
                runner: { runner: cargo-test-unit, arguments: { package: xtask, test: gate_contract_tests::obsolete_milestone_presence_fails } }
          - id: roadmap-case
            adapter: rust
            path: crates/xtask/src/main.rs
            selector: { kind: test, name: gate_contract_tests::roadmap_with_returned_view_claim_fails }
            claims:
              - kind: verifies
                criterion: REQ-OPS-025#criterion.release-authority-drift-gate
                covers: [FEAT-OPS-001#binding.release-authority/target.authority-gate, FEAT-OPS-001#binding.release-authority/target.roadmap-claims]
                runner: { runner: cargo-test-unit, arguments: { package: xtask, test: gate_contract_tests::roadmap_with_returned_view_claim_fails } }
