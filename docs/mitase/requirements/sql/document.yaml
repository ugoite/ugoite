schema: mitase/authoring/v2
kind: requirements
namespace: sql
category: Bounded SQL Document source preservation
requirements:
  - id: REQ-SQL-001
    title: SQL Document source and syntax view
    description: Keep one bounded Rust-owned source document for SQL editor syntax inspection without conflating parser success with executor admission.
    priority: high
    status: implemented
    criteria:
      - id: lossless-document-draft
        kind: behavior
        statement: >-
          The bounded Rust SQL Document parser retains the exact SQL source and
          source ranges for tokenized trivia, comments, identifiers, and
          literals, plus parser-provided source ranges where usable spans are
          available for syntax nodes. Each parsed SELECT projection item,
          including wildcard and expression items, is a distinct node linked
          to its SELECT, with a source range covering the item. Nested SELECT
          nodes retain their query and enclosing syntax parent links. It
          preserves invalid drafts for correction, rejects inputs above the
          source-byte or syntax-token limits before AST construction, and
          distinguishes syntax or statement-shape diagnostics. A parsed syntax
          tree alone never means that the SQL executor admits the query.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: source-aware-parameter-rename
        kind: behavior
        statement: >-
          The Rust SQL Document can rename valid named parameter placeholder
          tokens in a supplied draft while preserving every unrelated source
          byte, including strings, comments, and quoted identifiers. Invalid
          names are rejected, no-match input remains unchanged, and edited
          drafts are reparsed so syntax diagnostics remain current; this edit
          does not authorize parameter binding or query execution.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: guarded-edit-transaction
        kind: behavior
        statement: >-
          The bounded Rust SQL Document edit operation applies disjoint
          UTF-8 byte-range replacements atomically against an exact source
          snapshot. Stale snapshots, invalid or overlapping ranges, and
          mismatched preimages reject the whole transaction. A successful
          transaction preserves untouched source bytes, reparses even an
          incomplete draft, and returns a guarded inverse transaction that
          restores the original source; editing does not authorize or execute
          SQL.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: projection-position-bindings
        kind: behavior
        statement: >-
          Reordering or removing a SELECT output field preserves positional
          GROUP BY and ORDER BY references to the remaining fields in the same
          query scope. A referenced removed field, or wildcard/set-operation
          width whose binding cannot be established, rejects the complete edit
          with a stable local diagnostic. Nested query positions remain
          unchanged, and guarded Undo restores every original source byte.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: projection-alias-binding-safety
        kind: behavior
        statement: >-
          The SQL Workspace can add, rename, and remove a SELECT output alias
          through Rust typed document operations. These edits preserve source
          outside the alias, including comments. Renaming or removing an alias
          referenced by ORDER BY, GROUP BY, or HAVING in the same SELECT scope
          rejects the complete edit with a local diagnostic unless the edit
          preserves that reference's meaning. Adding or renaming an alias also
          rejects a same-scope reference capture or duplicate output name when
          the sibling output name is an explicit alias or a simple identifier.
          The editor does not claim to resolve generated names for arbitrary
          output expressions. The
          same guarded operation and inverse are exposed through the portable
          WASM protocol.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: typed-expression-attributes
        kind: behavior
        statement: >-
          The SQL Document editor exposes typed controls for parameterized CAST
          targets (VARCHAR length, DECIMAL precision and signed scale, and
          TIMESTAMP precision), Boolean NOT and runtime-admitted bitwise
          expression operators, and simple-versus-searched CASE operands.
          Semantic edits retain untouched source bytes and comments, support
          guarded inverse edits, and preserve incomplete or planner-invalid
          drafts for correction. The editor does not claim executor admission;
          planning remains authoritative for physical type and operator
          validity. Parameter values remain exact decimal strings across the
          protocol.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: portable-protocol
        kind: behavior
        statement: >-
          The portable WASM domain protocol exposes bounded SQL Document
          parsing, source-aware named-parameter renaming, and atomic guarded
          edits. Each operation matches its native Rust result when the
          serialized response fits the protocol response limit. Invalid edit
          requests return stable error codes, and oversized results return a
          bounded domain_output_too_large error without materializing
          unbounded JSON. Requests beyond each action's bounded envelope are
          rejected before JSON decoding. These actions do not grant executor
          admission or execute the SQL.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
