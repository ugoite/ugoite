schema: mitase/authoring/v2
kind: requirements
namespace: sql
category: Bounded SQL Document source preservation
requirements:
  - id: REQ-SQL-001
    title: SQL Document source and syntax view
    description: Keep one bounded Rust-owned source document for SQL editor syntax inspection without conflating parser success with executor admission.
    priority: high
    status: implemented
    criteria:
      - id: lossless-document-draft
        kind: behavior
        statement: >-
          The bounded Rust SQL Document parser retains the exact SQL source and
          source ranges for tokenized trivia, comments, identifiers, and
          literals, plus parser-provided source ranges where usable spans are
          available for syntax nodes. Each parsed SELECT projection item,
          including wildcard and expression items, is a distinct node linked
          to its SELECT, with a source range covering the item. Nested SELECT
          nodes retain their query and enclosing syntax parent links. It
          preserves invalid drafts for correction, rejects inputs above the
          source-byte or syntax-token limits before AST construction, and
          distinguishes syntax or statement-shape diagnostics. A parsed syntax
          tree alone never means that the SQL executor admits the query.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: source-aware-parameter-rename
        kind: behavior
        statement: >-
          The Rust SQL Document can rename valid named parameter placeholder
          tokens in a supplied draft while preserving every unrelated source
          byte, including strings, comments, and quoted identifiers. Invalid
          names are rejected, no-match input remains unchanged, and edited
          drafts are reparsed so syntax diagnostics remain current; this edit
          does not authorize parameter binding or query execution.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: shared-template-normalization
        kind: behavior
        statement: >-
          Native Rust SQL execution and the browser's actual WASM protocol use
          one Rust Domain normalization operation for the user-facing
          `{{name}}` and `{{ name }}` parameter spellings. It rewrites only
          markers whose opening braces are SQL punctuation tokens; marker-like
          text in strings (including dollar-quoted and triple-quoted strings),
          quoted identifiers, and comments remains byte-for-byte unchanged.
          Existing `$name` placeholders remain supported, and the operation
          returns unique parameter names in first-occurrence order together
          with UTF-8 source and normalized ranges for each rewrite. Malformed
          markers retain stable error codes and messages. Tokenizable but
          syntactically incomplete drafts remain available for the SQL parser's
          ordinary diagnostics; lexer failures leave the source unchanged.
          Frontend code adapts protocol ranges to editor offsets but does not
          parse or generate SQL template semantics.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: guarded-edit-transaction
        kind: behavior
        statement: >-
          The bounded Rust SQL Document edit operation applies disjoint
          UTF-8 byte-range replacements atomically against an exact source
          snapshot. Stale snapshots, invalid or overlapping ranges, and
          mismatched preimages reject the whole transaction. A successful
          transaction preserves untouched source bytes, reparses even an
          incomplete draft, and returns a guarded inverse transaction that
          restores the original source; editing does not authorize or execute
          SQL.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: projection-position-bindings
        kind: behavior
        statement: >-
          Reordering or removing a SELECT output field preserves positional
          GROUP BY and ORDER BY references to the remaining fields in the same
          query scope. A referenced removed field, or wildcard/set-operation
          width whose binding cannot be established, rejects the complete edit
          with a stable local diagnostic. Nested query positions remain
          unchanged, and guarded Undo restores every original source byte.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: projection-alias-binding-safety
        kind: behavior
        statement: >-
          The SQL Workspace can add, rename, and remove a SELECT output alias
          through Rust typed document operations. These edits preserve source
          outside the alias, including comments. Renaming or removing an alias
          referenced by ORDER BY, GROUP BY, or HAVING in the same SELECT scope
          rejects the complete edit with a local diagnostic unless the edit
          preserves that reference's meaning. Same-scope ORDER BY alias
          references include unqualified identifier leaves in expression-shaped
          sort items when no other same-scope reference makes the binding
          ambiguous; qualified source references remain unchanged. Comments
          within an ORDER BY clause and ambiguous same-scope references fail
          closed; comments following the clause are preserved.
          Adding or renaming an alias also
          rejects a same-scope reference capture or duplicate output name when
          the sibling output name is an explicit alias or a simple unqualified
          or qualified column reference, using the final identifier part for
          qualified names.
          The editor does not claim to resolve generated names for arbitrary
          output expressions. The
          same guarded operation and inverse are exposed through the portable
          WASM protocol.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: typed-expression-attributes
        kind: behavior
        statement: >-
          The SQL Document editor exposes typed controls for parameterized CAST
          targets (VARCHAR length, DECIMAL precision and signed scale, and
          TIMESTAMP precision), Boolean NOT and runtime-admitted bitwise
          expression operators, simple-versus-searched CASE operands,
          IS TRUE/FALSE/UNKNOWN and DISTINCT FROM predicates, ILIKE and
          SIMILAR TO predicates, and typed DATE/TIMESTAMP/INTERVAL/hex literal
          values, a typed FILTER toggle for registered aggregate calls, and
          ordinary, ALL, ROLLUP, CUBE, and GROUPING SETS structures with
          explicit per-set expression members; editing an existing GROUPING
          SETS clause preserves each boundary, and an empty grouping set is
          authorable. Composite ROLLUP/CUBE forms that exceed the editor's
          grouping controls retain exact source and disable Apply. New
          aggregate filters use an editable TRUE predicate seed.
          Semantic edits retain untouched source bytes and comments,
          support guarded inverse edits, and preserve incomplete or
          planner-invalid drafts for correction. The editor does not claim executor admission;
          planning remains authoritative for physical type and operator
          validity. Parameter values remain exact decimal strings across the
          protocol.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: array-element-indexing
        kind: behavior
        statement: >-
          The SQL Document tree can add one typed array element access using a
          positive signed-64-bit-range, one-based integer literal to a
          selected source-backed expression. Rust owns the operation, preserves
          the expression source and all source outside its range, and returns
          a guarded undo through the WASM and browser inspector. The inspector
          offers this bounded single-suffix constructor and clears a pending
          index when the SQL source or selected node changes. An aliased
          projection row is not a target; a complete child expression can be
          selected when its source range is exact, preserving the alias. The
          operation does not infer or certify the expression's array type,
          element bounds, or result type; authorized SQL planning and execution
          remain authoritative. It does not promise full nested query or
          collection-access-chain editing.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: array-slicing
        kind: behavior
        statement: >-
          The SQL Document tree can add one fully bounded array slice
          `[start:end]` to a selected source-backed expression using positive
          one-based literals within signed 64-bit range, where start is no
          greater than end. The inspector accepts Rust `i64` decimal-string
          syntax only (optional sign and ASCII digits; no whitespace or radix
          prefixes); Rust remains authoritative for semantic validation. Rust
          owns the typed operation and changes only the
          selected expression range, preserving all source outside it and
          returning a guarded undo through the WASM and browser inspector.
          Empty, reversed, overflowing, injected, or comment-bearing slice
          construction fails closed. The inspector clears pending construction
          bounds when the
          SQL source or selected node changes. The operation does not infer or
          certify the expression's array type, element bounds, or result type;
          authorized SQL planning and execution remain authoritative. This is
          a constructor: it creates a slice around a selected expression.
          Omitted bounds, dynamic bounds, strides, and complete
          collection-access-chain support are outside this bounded constructor.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: array-slice-bound-editing
        kind: behavior
        statement: >-
          When the selected SQL Document node is a terminal fully bounded slice
          whose two bounds are simple decimal integer tokens parseable as Rust
          `i64` and have no stride, the tree editor prepopulates both bounds and can replace
          either or both directly. Rust derives the bound ranges from its AST,
          validates the requested positive one-based range, and atomically
          replaces only changed bound literals; comments and all source around
          the literals remain exact. The transaction returns guarded undo.
          Empty, reversed, overflowing, non-decimal, injected, dynamic,
          omitted-bound, strided, expression-bound, or non-terminal-chain edits
          fail closed or remain unavailable. This criterion covers direct editing of these
          bounded existing slices, not the full admitted slice grammar; runtime
          planning and execution remain authoritative.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: struct-field-access-construction
        kind: behavior
        statement: >-
          The SQL Document tree can add one named Struct field access to a
          selected source-backed expression by emitting the field name as a
          SQL string-literal subscript. Rust rejects an empty field name,
          escapes embedded single quotes, changes only the selected expression
          range, and returns a guarded undo through the WASM and browser
          inspector. The inspector offers only one field-access suffix and
          clears a pending name when the SQL source or selected node changes.
          The operation does not infer or certify the selected value's Struct
          type or field existence; authorized SQL planning and execution
          remain authoritative. It does not claim complete collection access
          chains or support for other Struct construction forms.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: array-literal-element-reordering
        kind: behavior
        statement: >-
          For an eligible direct element of an unaliased ARRAY literal in a
          complete SELECT projection item, the SQL Document tree can move the
          selected element exactly one position up or down when a neighbor
          exists. Rust validates the ARRAY parent and exact source ranges,
          swaps only the two adjacent element expressions, preserves the
          original comma and whitespace between them and every source byte
          outside that span, and returns a guarded undo. Boundary moves,
          comment-bearing projection items, unsupported source ranges, and
          unrecognized separators fail closed; comment-bearing projection
          items do not expose the move controls. The WASM operation returns
          the same native result. For eligible rows that expose the controls,
          boundary moves are disabled and the reason is given in the control's
          accessible name and title. For
          executor-admitted SQL, reordering preserves the corresponding array
          value order; authorized planning and execution remain authoritative
          for admission and result types.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: relational-constructors
        kind: behavior
        statement: >-
          The SQL Document editor exposes typed constructors for DataFusion
          admitted LEFT/RIGHT SEMI and ANTI joins, LIMIT literals, named
          parameters and same-query expressions, and output column aliases on
          CTEs and derived tables. Semi and anti joins require an explicit
          typed ON or USING constraint before Apply is enabled. The
          constructors use guarded source ranges
          and bounded Rust operations; alias references are renamed only when
          their binding is established, respecting nested CTE shadowing and
          rejecting ambiguous unqualified references. Each edit preserves
          source outside its selected ranges and provides a guarded inverse.
          These controls describe editable SQL syntax and do not promise that
          arbitrary drafts pass executor admission.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: portable-protocol
        kind: behavior
        statement: >-
          The portable WASM domain protocol exposes bounded SQL Document
          parsing, source-aware named-parameter renaming, and atomic guarded
          edits. Each operation matches its native Rust result when the
          serialized response fits the protocol response limit. Invalid edit
          requests return stable error codes, and oversized results return a
          bounded domain_output_too_large error without materializing
          unbounded JSON. Requests beyond each action's bounded envelope are
          rejected before JSON decoding. These actions do not grant executor
          admission or execute the SQL.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
    bindings:
      - id: array-element-indexing-verification
        role: verification
        facet: verification
        responsibility: Verify native source preservation and guarded undo, WASM parity, authorized execution, and actual-WASM selection/source reset for the bounded array-index and fixed-bound array-slice constructors.
        targets:
          - id: native-edit-and-undo
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::semantic_value_access_constructs_array_index_and_bounded_slice_losslessly }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-element-indexing, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::semantic_value_access_constructs_array_index_and_bounded_slice_losslessly } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-slicing, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::semantic_value_access_constructs_array_index_and_bounded_slice_losslessly } } }]
          - id: wasm-native-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_array_index_slice_construction_and_bound_edits_match_native_and_undo }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-element-indexing, covers: [FEAT-SQL-001#binding.projection-position-protocol/target.semantic-edit-action], runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_array_index_slice_construction_and_bound_edits_match_native_and_undo } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-slicing, covers: [FEAT-SQL-001#binding.projection-position-protocol/target.semantic-edit-action], runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_array_index_slice_construction_and_bound_edits_match_native_and_undo } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing, covers: [FEAT-SQL-001#binding.projection-position-protocol/target.semantic-edit-action], runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_array_index_slice_construction_and_bound_edits_match_native_and_undo } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.struct-field-access-construction, covers: [FEAT-SQL-001#binding.projection-position-protocol/target.semantic-edit-action], runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_array_index_slice_construction_and_bound_edits_match_native_and_undo } } }]
          - id: authorized-execution
            adapter: rust
            path: crates/ugoite-iceberg/tests/authorized_query.rs
            selector: { kind: test, name: typed_sql_document_existing_array_slice_bounds_edit_and_execute_authorized_query }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-element-indexing, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: authorized_query, test: typed_sql_document_existing_array_slice_bounds_edit_and_execute_authorized_query } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-slicing, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: authorized_query, test: typed_sql_document_existing_array_slice_bounds_edit_and_execute_authorized_query } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: authorized_query, test: typed_sql_document_existing_array_slice_bounds_edit_and_execute_authorized_query } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-literal-element-reordering, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: authorized_query, test: typed_sql_document_existing_array_slice_bounds_edit_and_execute_authorized_query } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.struct-field-access-construction, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: authorized_query, test: typed_sql_document_existing_array_slice_bounds_edit_and_execute_authorized_query } } }]
          - id: browser-selection-source-resets
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.wasm.test.tsx
            selector: { kind: test, name: authors one-based array indexes and fixed-bound slices through actual WASM }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-element-indexing, covers: [FEAT-SQL-001#binding.typed-expression-attributes-frontend/target.tree-editor-controls], runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: authors one-based array indexes and fixed-bound slices through actual WASM } } }, { kind: verifies, criterion: REQ-SQL-001#criterion.array-slicing, covers: [FEAT-SQL-001#binding.typed-expression-attributes-frontend/target.tree-editor-controls], runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: authors one-based array indexes and fixed-bound slices through actual WASM } } }]
          - id: native-slice-bound-edit
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::semantic_array_slice_bound_edit_preserves_comments_and_guarded_undo }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing, covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::semantic_array_slice_bound_edit_preserves_comments_and_guarded_undo } } }]
          - id: browser-slice-bound-edit
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.wasm.test.tsx
            selector: { kind: test, name: edits existing literal slice bounds in place through actual WASM }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing, covers: [FEAT-SQL-001#binding.typed-expression-attributes-frontend/target.tree-editor-controls], runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: edits existing literal slice bounds in place through actual WASM } } }]
          - id: aliased-projection-child
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.wasm.test.tsx
            selector: { kind: test, name: indexes an aliased projection child without changing its alias }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.array-element-indexing, covers: [FEAT-SQL-001#binding.typed-expression-attributes-frontend/target.tree-editor-controls], runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: indexes an aliased projection child without changing its alias } } }]
      - id: nested-comment-alias-parity-verification
        role: verification
        facet: verification
        responsibility: Verify bounded nested SQL alias edits across native Rust, the portable WASM action, the actual browser WASM client, and an authorized query runtime, including an outer ORDER BY alias followed by a trailing comment, exact untouched comment retention, current parse diagnostics, guarded undo, and execution after editing. This scenario does not establish complete SQL corpus coverage; ambiguous references and comments inside ORDER BY expressions remain fail-closed.
        targets:
          - id: nested-source-native-wasm
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_nested_comment_alias_edit_matches_native_and_undoes_exactly }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.lossless-document-draft
                covers: [FEAT-SQL-001#binding.sql-document-core/target.parser]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_nested_comment_alias_edit_matches_native_and_undoes_exactly } }
              - kind: verifies
                criterion: REQ-SQL-001#criterion.relational-constructors
                covers: [FEAT-SQL-001#binding.typed-expression-attributes/target.semantic-expression-edits, FEAT-SQL-001#binding.projection-position-protocol/target.semantic-edit-action]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_nested_comment_alias_edit_matches_native_and_undoes_exactly } }
              - kind: verifies
                criterion: REQ-SQL-001#criterion.projection-alias-binding-safety
                covers: [FEAT-SQL-005#binding.alias-domain/target.typed-alias-operation]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: sql_document_nested_comment_alias_edit_matches_native_and_undoes_exactly } }
          - id: nested-source-actual-wasm-dom
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.wasm.test.tsx
            selector: { kind: test, name: keeps nested SQL trivia and diagnostics through a scoped alias edit and WASM undo }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.relational-constructors
                covers: [FEAT-SQL-001#binding.typed-expression-attributes-frontend/target.tree-editor-controls]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: keeps nested SQL trivia and diagnostics through a scoped alias edit and WASM undo } }
              - kind: verifies
                criterion: REQ-SQL-001#criterion.projection-alias-binding-safety
                covers: [FEAT-SQL-005#binding.alias-editor/target.tree-output-alias]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: keeps nested SQL trivia and diagnostics through a scoped alias edit and WASM undo } }
