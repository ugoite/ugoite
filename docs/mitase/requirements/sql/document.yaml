schema: mitase/authoring/v2
kind: requirements
namespace: sql
category: SQL source document protocol
requirements:
  - id: REQ-SQL-001
    title: Bounded SQL source document contract
    description: Keep the source-preserving Rust SQL document and its published native/WASM protocol stable independently of authoring UI.
    priority: high
    status: implemented
    criteria:
      - id: lossless-document-draft
        kind: behavior
        statement: >-
          The bounded Rust parser retains the exact SQL source, token trivia and
          usable syntax ranges, including distinct projection items and nested
          SELECT ancestry. It preserves invalid drafts for correction and keeps
          parse diagnostics separate from executor admission.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance]
      - id: portable-protocol
        kind: compatibility
        statement: >-
          The existing versioned SQL Document WASM actions and typed protocol
          for parse, parameter rename, and guarded source edits remain available
          with their native behavior. Removing or changing these public actions
          requires a separately planned breaking release.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance]
      - id: shared-template-normalization
        kind: behavior
        statement: >-
          Native Rust SQL execution and the browser's actual WASM protocol use
          one Rust Domain normalization operation for user-facing template
          markers, preserving marker-like text in SQL strings, quoted
          identifiers, and comments.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: bounded-template-protocol
        kind: behavior
        statement: >-
          The portable WASM template-normalization action applies the SQL
          Document source and response limits and returns explicit errors
          instead of partial results when either bound is exceeded.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
