schema: mitase/spec/v1
kind: requirements
namespace: security
category: Server security boundaries
requirements:
  - id: REQ-SEC-001
    title: Loopback-first server binding
    description: The server listens on 127.0.0.1:8000 by default. Non-loopback exposure requires an explicit UGOITE_SERVER_ADDRESS, while the release Compose host port remains bound to loopback.
    priority: high
    status: implemented
    criteria:
      - id: default-loopback
        kind: security
        statement: An unset UGOITE_SERVER_ADDRESS selects 127.0.0.1:8000, and a non-loopback listen address is selected only when the operator explicitly supplies UGOITE_SERVER_ADDRESS.
        governed_by: [POL-003#rule.governance, POL-004#rule.governance, POL-011#rule.governance]
      - id: compose-loopback
        kind: security
        statement: The release Compose host port is published on 127.0.0.1 rather than on all host interfaces.
        governed_by: [POL-003#rule.governance, POL-011#rule.governance]
    bindings:
      - id: listen-boundary-verification
        role: verification
        facet: verification
        responsibility: Verify the default listen address selection and Compose host-port publication through exact repository tests.
        targets:
          - id: default-listen-unit
            adapter: rust
            path: crates/ugoite-server/src/main.rs
            selector: { kind: symbol, name: server_address_tests::req_sec_001_defaults_to_loopback }
            claims:
              - kind: verifies
                criterion: REQ-SEC-001#criterion.default-loopback
                covers: [FEAT-SEC-001#binding.listen-configuration/target.server-entrypoint]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: server_address_tests::req_sec_001_defaults_to_loopback } }
          - id: compose-loopback-integration
            adapter: rust
            path: crates/ugoite-server/tests/security_config.rs
            selector: { kind: test, name: req_sec_001_release_compose_publishes_host_port_on_loopback }
            claims:
              - kind: verifies
                criterion: REQ-SEC-001#criterion.compose-loopback
                covers: [FEAT-SEC-001#binding.listen-configuration/target.release-compose]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: security_config, test: req_sec_001_release_compose_publishes_host_port_on_loopback } }

  - id: REQ-SEC-002
    title: Response security headers
    description: Every application response receives the explicit response security-header policy. HSTS is limited to non-loopback HTTPS public origins so local development does not acquire a TLS-only browser policy.
    priority: high
    status: implemented
    criteria:
      - id: common-header-policy
        kind: security
        statement: Application responses receive the configured CSP, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, and Permissions-Policy values, with CSP excluding unsafe-inline script execution.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: loopback-hsts-boundary
        kind: security
        statement: Strict-Transport-Security is present only for non-loopback HTTPS public origins and is omitted for HTTP, localhost, IPv4-loopback, and IPv6-loopback origins.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
    bindings:
      - id: response-header-verification
        role: verification
        facet: verification
        responsibility: Verify the common response-header policy, loopback HSTS boundary, and representative public, error, static, and CORS responses through exact Rust tests.
        targets:
          - id: common-policy-unit
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: security_headers_tests::req_sec_002_adds_the_common_header_contract }
            claims:
              - kind: verifies
                criterion: REQ-SEC-002#criterion.common-header-policy
                covers: [FEAT-SEC-001#binding.server/target.security-header-policy]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: security_headers_tests::req_sec_002_adds_the_common_header_contract } }
          - id: loopback-hsts-unit
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: security_headers_tests::req_sec_002_omits_hsts_for_local_origins }
            claims:
              - kind: verifies
                criterion: REQ-SEC-002#criterion.loopback-hsts-boundary
                covers: [FEAT-SEC-001#binding.server/target.security-header-policy]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: security_headers_tests::req_sec_002_omits_hsts_for_local_origins } }
          - id: representative-response-integration
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: req_sec_002_covers_metadata_api_error_and_middleware_responses }
            claims:
              - kind: verifies
                criterion: REQ-SEC-002#criterion.common-header-policy
                covers: [FEAT-SEC-001#binding.server/target.security-route-layer]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_002_covers_metadata_api_error_and_middleware_responses } }
          - id: static-response-integration
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: req_sec_002_covers_the_static_browser_root }
            claims:
              - kind: verifies
                criterion: REQ-SEC-002#criterion.common-header-policy
                covers: [FEAT-SEC-001#binding.server/target.security-route-layer]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_002_covers_the_static_browser_root } }
          - id: cors-preflight-integration
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: req_sec_002_keeps_security_headers_on_cors_preflight }
            claims:
              - kind: verifies
                criterion: REQ-SEC-002#criterion.common-header-policy
                covers: [FEAT-SEC-001#binding.server/target.security-route-layer]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_002_keeps_security_headers_on_cors_preflight } }

  - id: REQ-SEC-003
    title: Mandatory authentication at protected boundaries
    description: Every protected REST and MCP request requires an authenticated identity. Localhost mode and explicit remote exposure configuration do not bypass authentication.
    priority: high
    status: implemented
    criteria:
      - id: protected-rest
        kind: security
        statement: An unauthenticated request to a protected REST route is rejected with the standard authentication-required error envelope.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: protected-mcp
        kind: security
        statement: An unauthenticated MCP request is rejected as authentication-required after the transport request has the required protocol shape.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance, POL-015#rule.governance]
    bindings:
      - id: authentication-verification
        role: verification
        facet: verification
        responsibility: Verify that protected REST and MCP requests do not become public in the initialized localhost test mode through exact Rust tests.
        targets:
          - id: rest-authentication-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::req_sec_003_rejects_unauthenticated_rest_requests }
            claims:
              - kind: verifies
                criterion: REQ-SEC-003#criterion.protected-rest
                covers: [FEAT-SEC-001#binding.server/target.authentication-middleware]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::req_sec_003_rejects_unauthenticated_rest_requests } }
          - id: mcp-authentication-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: mcp_v1_transport_rejects_legacy_methods_and_validates_the_wire_shape }
            claims:
              - kind: verifies
                criterion: REQ-SEC-003#criterion.protected-mcp
                covers: [FEAT-SEC-001#binding.server/target.mcp-authentication]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: mcp_v1_transport_rejects_legacy_methods_and_validates_the_wire_shape } }

  - id: REQ-SEC-004
    title: Passwordless Passkey authentication
    description: The supported primary human authenticator is passwordless Passkey/WebAuthn. Registration requests discoverable credentials, and authentication is completed by server-side WebAuthn assertion validation against an enrolled active credential.
    priority: high
    status: implemented
    criteria:
      - id: passwordless-primary
        kind: security
        statement: The browser login flow starts and finishes Passkey authentication and creates the ordinary opaque browser session; passwords and default credentials are not part of the primary login surface.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: discoverable-credentials
        kind: security
        statement: Passkey registration requests discoverable credentials and allocates distinct user handles for additional credentials belonging to the same account.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: server-side-assertion-validation
        kind: security
        statement: The server validates the WebAuthn assertion, resolves the enrolled credential to an active account, and only then creates an authenticated session.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
    bindings:
      - id: passkey-verification
        role: verification
        facet: verification
        responsibility: Verify the discoverable credential contract, browser Passkey login surface, and published authentication operations through exact repository tests.
        targets:
          - id: discoverable-registration-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::added_passkeys_use_distinct_discoverable_user_handles }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.discoverable-credentials
                covers: [FEAT-SEC-002#binding.identity/target.passkey-registration]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::added_passkeys_use_distinct_discoverable_user_handles } }
          - id: server-registration-start-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: test, name: authentication_regression_tests::req_sec_004_server_registration_starts_discoverable_credentials }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.discoverable-credentials
                covers: [FEAT-SEC-002#binding.server/target.passkey-registration-start]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::req_sec_004_server_registration_starts_discoverable_credentials } }
          - id: server-registration-finish-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: test, name: authentication_regression_tests::req_sec_004_server_registration_finish_rejects_invalid_credential }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.discoverable-credentials
                covers: [FEAT-SEC-002#binding.server/target.passkey-registration-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::req_sec_004_server_registration_finish_rejects_invalid_credential } }
          - id: login-route-case
            adapter: typescript
            path: frontend/src/routes/login.test.tsx
            selector: { kind: test, name: keeps the requested route after Passkey login }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.passwordless-primary
                covers: [FEAT-SEC-002#binding.client/target.auth-client, FEAT-SEC-002#binding.client/target.login-route]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/login.test.tsx, test: keeps the requested route after Passkey login } }
          - id: assertion-validation-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::invalid_passkey_assertion_is_rejected_before_session_creation }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.server-side-assertion-validation
                covers: [FEAT-SEC-002#binding.identity/target.passkey-authentication]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::invalid_passkey_assertion_is_rejected_before_session_creation } }
          - id: server-assertion-validation-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: test, name: authentication_regression_tests::req_sec_004_server_authentication_finish_rejects_unverified_assertion }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.server-side-assertion-validation
                covers: [FEAT-SEC-002#binding.server/target.passkey-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::req_sec_004_server_authentication_finish_rejects_unverified_assertion } }
          - id: authentication-surface-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: req_sec_004_openapi_publishes_passkey_surfaces }
            claims:
              - kind: verifies
                criterion: REQ-SEC-004#criterion.passwordless-primary
                covers: [FEAT-SEC-002#binding.server/target.passkey-start]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_004_openapi_publishes_passkey_surfaces } }

  - id: REQ-SEC-005
    title: Initial owner bootstrap controls
    description: Initial setup uses an expiring one-use secret stored only as a hash, creates the administrator account and initial Passkey, emits bootstrap-only recovery-code material once, and establishes an authenticated opaque browser session. Account Self-Recovery is a separate enrolled flow.
    priority: high
    status: implemented
    criteria:
      - id: setup-secret-hash-once
        kind: security
        statement: Node bootstrap creates an expiring setup secret whose persisted representation is only a hash, emits the plaintext only for the initial bootstrap result, and does not emit a second setup result.
        governed_by: [POL-003#rule.governance, POL-004#rule.governance, POL-011#rule.governance]
      - id: initial-owner-passkey
        kind: security
        statement: The setup finish flow validates the one-time secret and Passkey ceremony, creates the active node administrator, and establishes the initial Passkey state without a default identity.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: bootstrap-recovery-material
        kind: security
        statement: Successful initial setup returns bootstrap-only recovery-code material for offline storage and the setup UI does not present it as a reusable login method.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: opaque-bootstrap-session
        kind: security
        statement: Successful setup creates the ordinary opaque browser session, while session expiry and revocation invalidate its server-side authority without exposing a verifier.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
    bindings:
      - id: bootstrap-verification
        role: verification
        facet: verification
        responsibility: Verify setup-secret storage, setup API publication, setup UI continuation, and opaque browser-session behavior through exact repository tests.
        targets:
          - id: setup-secret-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::setup_secret_is_hashed_and_only_emitted_once }
            claims:
              - kind: verifies
                criterion: REQ-SEC-005#criterion.setup-secret-hash-once
                covers: [FEAT-SEC-002#binding.identity/target.setup-secret]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::setup_secret_is_hashed_and_only_emitted_once } }
          - id: setup-registration-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::invalid_setup_passkey_is_rejected_before_owner_creation }
            claims:
              - kind: verifies
                criterion: REQ-SEC-005#criterion.initial-owner-passkey
                covers: [FEAT-SEC-002#binding.identity/target.setup-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::invalid_setup_passkey_is_rejected_before_owner_creation } }
          - id: setup-api-case
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: req_sec_005_openapi_publishes_setup_surfaces }
            claims:
              - kind: verifies
                criterion: REQ-SEC-005#criterion.initial-owner-passkey
                covers: [FEAT-SEC-002#binding.server/target.setup-start, FEAT-SEC-002#binding.server/target.setup-finish]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_005_openapi_publishes_setup_surfaces } }
              - kind: verifies
                criterion: REQ-SEC-005#criterion.bootstrap-recovery-material
                covers: [FEAT-SEC-002#binding.server/target.setup-finish]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_005_openapi_publishes_setup_surfaces } }
              - kind: verifies
                criterion: REQ-SEC-005#criterion.opaque-bootstrap-session
                covers: [FEAT-SEC-002#binding.server/target.setup-finish]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: req_sec_005_openapi_publishes_setup_surfaces } }
          - id: server-setup-registration-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: test, name: authentication_regression_tests::req_sec_005_server_setup_rejects_invalid_registration_before_consuming_secret }
            claims:
              - kind: verifies
                criterion: REQ-SEC-005#criterion.initial-owner-passkey
                covers: [FEAT-SEC-002#binding.server/target.setup-start, FEAT-SEC-002#binding.server/target.setup-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::req_sec_005_server_setup_rejects_invalid_registration_before_consuming_secret } }
          - id: setup-route-case
            adapter: typescript
            path: frontend/src/routes/setup.test.tsx
            selector: { kind: test, name: keeps the protected route after setup strengthening }
            claims:
              - kind: verifies
                criterion: REQ-SEC-005#criterion.bootstrap-recovery-material
                covers: [FEAT-SEC-002#binding.client/target.auth-client, FEAT-SEC-002#binding.client/target.setup-route]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/setup.test.tsx, test: keeps the protected route after setup strengthening } }
          - id: opaque-session-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::browser_sessions_expire_and_are_revoked_without_exposing_verifiers }
            claims:
              - kind: verifies
                criterion: REQ-SEC-005#criterion.opaque-bootstrap-session
                covers: [FEAT-SEC-002#binding.identity/target.session-validation]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::browser_sessions_expire_and_are_revoked_without_exposing_verifiers } }

  - id: REQ-SEC-014
    title: Account Self-Recovery
    description: An active HumanAccount may replace its Node-local Passkey credentials only through an explicitly enrolled recovery-only TOTP and one valid offline Recovery Code, while preserving the HumanAccount and its Space bindings.
    priority: high
    status: implemented
    criteria:
      - id: recovery-factor-enrollment
        kind: security
        statement: Recovery TOTP is explicitly enrolled behind a recent Passkey, is encrypted at rest, and is sufficient only as one factor of Account Self-Recovery; TOTP is not a normal login method.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: dual-factor-recovery
        kind: security
        statement: Recovery start requires the exact Account ID, one currently valid Recovery Code, and a currently valid TOTP code; start does not consume the code or persist its plaintext, and repeated invalid attempts are temporarily locked.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: credential-replacement
        kind: security
        statement: Successful recovery replaces the account's Passkeys, advances credential_generation, rotates all Recovery Codes, preserves the HumanAccount and Space identity, and removes linked OIDC methods from the recovered account.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: stale-authority-invalidation
        kind: security
        statement: Recovery authority is bound to the current credential generation and account lifecycle; pre-recovery sessions and stale recovery challenges fail closed after credential replacement or recovery-factor changes.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
      - id: recovery-audit-attribution
        kind: security
        statement: Successful Account Self-Recovery emits attributable Node audit state without recording Recovery Code plaintext or the TOTP secret, and establishes a new ordinary opaque browser session.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
    bindings:
      - id: account-recovery-verification
        role: verification
        facet: verification
        responsibility: Verify the recovery-only factors, dual-factor ceremony, credential replacement boundary, stale-authority invalidation, audit attribution, and published recovery operations through exact repository tests.
        targets:
          - id: totp-enrollment-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::totp_enrollment_distinguishes_invalid_codes_from_internal_state_errors }
            claims:
              - kind: verifies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
                covers: [FEAT-SEC-003#binding.identity/target.totp-enrollment, FEAT-SEC-003#binding.identity/target.totp-enrollment-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::totp_enrollment_distinguishes_invalid_codes_from_internal_state_errors } }
          - id: totp-window-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::totp_accepts_one_adjacent_step_but_not_two }
            claims:
              - kind: verifies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
                covers: [FEAT-SEC-003#binding.identity/target.totp-enrollment]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::totp_accepts_one_adjacent_step_but_not_two } }
          - id: recovery-crypto-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::recovery_secret_is_authenticated_encryption }
            claims:
              - kind: verifies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
                covers: [FEAT-SEC-003#binding.identity/target.totp-enrollment]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::recovery_secret_is_authenticated_encryption } }
          - id: recovery-start-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::recovery_start_validates_without_consuming_code_or_persisting_plaintext }
            claims:
              - kind: verifies
                criterion: REQ-SEC-014#criterion.dual-factor-recovery
                covers: [FEAT-SEC-003#binding.identity/target.recovery-start]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::recovery_start_validates_without_consuming_code_or_persisting_plaintext } }
              - kind: verifies
                criterion: REQ-SEC-014#criterion.stale-authority-invalidation
                covers: [FEAT-SEC-003#binding.identity/target.recovery-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::recovery_start_validates_without_consuming_code_or_persisting_plaintext } }
          - id: recovery-lock-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::recovery_failures_lock_after_five_attempts_and_lock_valid_credentials }
            claims:
              - kind: verifies
                criterion: REQ-SEC-014#criterion.dual-factor-recovery
                covers: [FEAT-SEC-003#binding.identity/target.recovery-start]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::recovery_failures_lock_after_five_attempts_and_lock_valid_credentials } }
          - id: recovery-totp-change-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::changing_recovery_totp_invalidates_pending_account_recovery_challenges }
            claims:
              - kind: verifies
                criterion: REQ-SEC-014#criterion.stale-authority-invalidation
                covers: [FEAT-SEC-003#binding.identity/target.recovery-finish]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::changing_recovery_totp_invalidates_pending_account_recovery_challenges } }
          - id: recovery-oidc-removal-case
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: test, name: tests::recovery_credential_replacement_removes_oidc_methods }
