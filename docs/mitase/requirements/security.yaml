                criterion: REQ-SEC-016#criterion.exact-external-identity
                covers: [FEAT-SEC-005#binding.identity/target.login-completion]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-identity, test: node_identity::tests::oidc_subject_links_to_exact_existing_account } }
              - kind: verifies
                criterion: REQ-SEC-016#criterion.protected-link-management
