                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx", test: "REQ-UX-ENTRY-HISTORY-001: resolves actor IDs to member names without showing IDs in rows" } }
          - id: history-actor-fallback
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx"
            selector: { kind: test, name: "REQ-UX-ENTRY-HISTORY-001: uses a neutral label when the directory cannot resolve an actor" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx", test: "REQ-UX-ENTRY-HISTORY-001: uses a neutral label when the directory cannot resolve an actor" } }
          - id: actor-view-model-display
            adapter: typescript
            path: frontend/src/lib/entry-history.test.ts
            selector: { kind: test, name: "REQ-UX-ENTRY-HISTORY-001: resolves an actor ID to the member display name" }
            claims:
