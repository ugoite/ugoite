                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/entry-history.test.ts, test: "REQ-UX-ENTRY-HISTORY-001: resolves an actor ID to the member display name" } }
          - id: actor-view-model-fallback
            adapter: typescript
            path: frontend/src/lib/entry-history.test.ts
            selector: { kind: test, name: "REQ-UX-ENTRY-HISTORY-001: uses a neutral label for unresolved actor IDs" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/entry-history.test.ts, test: "REQ-UX-ENTRY-HISTORY-001: uses a neutral label for unresolved actor IDs" } }
          - id: actor-view-model-unknown
            adapter: typescript
            path: frontend/src/lib/entry-history.test.ts
            selector: { kind: test, name: "REQ-UX-ENTRY-HISTORY-001: reports missing actors without inventing identity" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/entry-history.test.ts, test: "REQ-UX-ENTRY-HISTORY-001: reports missing actors without inventing identity" } }
          - id: actor-view-model-raw
            adapter: typescript
            path: frontend/src/lib/entry-history.test.ts
            selector: { kind: test, name: "REQ-UX-ENTRY-HISTORY-001: keeps the raw actor identity available for details" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
