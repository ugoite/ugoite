schema: mitase/authoring/v2
kind: requirements
namespace: ux
category: Selectable list rows and advanced identifier disclosure
requirements:
  - id: REQ-UX-LIST-001
    title: List Rows With Full-Row Activation and Advanced-Only Identifiers
    description: Selectable list rows activate across the full row without a separate boxed chevron, and raw UUIDs or internal identifiers appear only inside explicitly advanced or diagnostic disclosure while primary rows show human-meaningful names.
    priority: high
    status: planned
    criteria:
      - id: full-row-activation
        kind: behavior
        statement: List rows in the RowList primitive activate across the full row without a boxed chevron or Open column.
        governed_by: [POL-UI-006#rule.governance]
      - id: uuids-advanced-only
        kind: behavior
        statement: Primary rows show human-meaningful names while raw UUIDs and internal identifiers appear only inside explicitly advanced or diagnostic disclosure. Dashboard Recent derives the primary Entry label only from title or name fields, with a neutral fallback; the Form name may provide context, while unrelated Entry properties never appear in visible or accessible labels. Browser Konase write approvals use a current-Space preview only when the exact updated Entry is a visible candidate or selected resource; otherwise they retain generic existing-Entry context.
        governed_by: [POL-UI-005#rule.governance]
    bindings:
      - id: row-list-verification
        role: verification
        facet: verification
        responsibility: Verify full-row activation and advanced-only identifiers through exact Vitest cases.
        targets:
          - id: rowlist-full-row
            adapter: typescript
            path: frontend/src/components/RowList.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: activates the full row without a boxed chevron or Open column" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/RowList.test.tsx, test: "REQ-UX-LIST-001: activates the full row without a boxed chevron or Open column" } }
          - id: rowlist-secondary-action
            adapter: typescript
            path: frontend/src/components/RowList.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: keeps secondary actions from triggering row activation" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/RowList.test.tsx, test: "REQ-UX-LIST-001: keeps secondary actions from triggering row activation" } }
          - id: rowlist-keyboard
            adapter: typescript
            path: frontend/src/components/RowList.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: exposes keyboard-operable rows with accessible names and visible focus" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/RowList.test.tsx, test: "REQ-UX-LIST-001: exposes keyboard-operable rows with accessible names and visible focus" } }
          - id: spaces-full-row
            adapter: typescript
            path: frontend/src/routes/spaces/index.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: opens spaces through full-row links with an unboxed secondary settings action" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.spaces-route]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/spaces/index.test.tsx, test: "REQ-UX-LIST-001: opens spaces through full-row links with an unboxed secondary settings action" } }
          - id: spaces-human-readable-identifiers
            adapter: typescript
            path: frontend/src/routes/spaces/index.test.tsx
            selector: { kind: test, name: "REQ-FE-001: uses Space names or slugs without exposing Space UIDs" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.spaces-route-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/spaces/index.test.tsx, test: "REQ-FE-001: uses Space names or slugs without exposing Space UIDs" } }
          - id: space-settings-member-identifiers
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/settings.route.test.tsx"
            selector: { kind: test, name: "renders members with display names while exact IDs stay advanced-only" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.space-settings-members-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/settings.route.test.tsx", test: "renders members with display names while exact IDs stay advanced-only" } }
          - id: entry-rows-compact
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/forms/[form_ref]/entries.test.tsx"
            selector: { kind: test, name: "REQ-UX-LIST-001: keeps Entry IDs out of form rows with compact right-meta dates" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.form-entries-route, FEAT-UX-003#binding.list-baseline/target.form-entries-route-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/forms/[form_ref]/entries.test.tsx", test: "REQ-UX-LIST-001: keeps Entry IDs out of form rows with compact right-meta dates" } }
          - id: account-security-credential-identifiers
            adapter: typescript
            path: frontend/src/routes/settings/security.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: hides passkey and session identifiers from credential lists" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.security-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/settings/security.test.tsx, test: "REQ-UX-LIST-001: hides passkey and session identifiers from credential lists" } }
      - id: history-row-verification
        role: verification
        facet: verification
        responsibility: Verify PR-4 entry-history rows render through RowList with full-row activation and resolve actor labels to member names or a neutral fallback through exact Vitest cases.
