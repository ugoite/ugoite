schema: mitase/authoring/v2
kind: requirements
namespace: entries
category: Entry creation, mutation, revision, and retrieval
requirements:
  - id: REQ-ENTRY-001
    title: Entry creation
    description: Create a structured Entry from Form field values by appending one immutable revision row to the stable Form ID's Iceberg table.
    priority: high
    status: implemented
    criteria:
      - id: creation
        kind: behavior
        statement: Creating an Entry appends one immutable revision row to the stable Form-owned table.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: creation-test
        role: verification
        facet: verification
        responsibility: Verify Entry creation through the exact Iceberg integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: test_entry_req_entry_001_create_entry_basic }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-001#criterion.creation
                covers: [FEAT-ENTRY-001#binding.core/target.create-entry]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: test_entry_req_entry_001_create_entry_basic } }
      - id: backend-creation-test
        role: verification
        facet: verification
        responsibility: Verify Entry creation through the exact backend route test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::entry_routes_keep_input_errors_typed_and_create_atomic }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-001#criterion.creation
                covers: [FEAT-ENTRY-001#binding.backend/target.create-entry]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::entry_routes_keep_input_errors_typed_and_create_atomic } }
      - id: frontend-creation-test
        role: verification
        facet: verification
        responsibility: Verify Entry creation through the exact browser client test.
        targets:
          - id: case
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should create a structured entry" }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-001#criterion.creation
                covers: [FEAT-ENTRY-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should create a structured entry" } }
      - id: mcp-creation-test
        role: verification
        facet: verification
        responsibility: Verify Entry creation through the exact MCP facade test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-server/src/mcp.rs
            selector: { kind: symbol, name: tests::save_accepts_structured_entries }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-001#criterion.creation
                covers: [FEAT-ENTRY-001#binding.mcp/target.save]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: tests::save_accepts_structured_entries } }
  - id: REQ-ENTRY-002
    title: Optimistic concurrency via revisions
    description: Validate parent_revision_id during update; return 409 Conflict on mismatch.
    priority: high
    status: implemented
    criteria:
      - id: parent-revision-validation
        kind: behavior
        statement: Updating an Entry validates its parent revision and rejects a stale parent deterministically.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: conflict-status
        kind: behavior
        statement: At the REST boundary, a parent_revision_id mismatch returns HTTP 409 Conflict.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: concurrency-test
        role: verification
        facet: verification
        responsibility: Verify stale revision rejection through the exact Iceberg integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: test_entry_req_entry_002_update_entry_conflict }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-002#criterion.parent-revision-validation
                covers: [FEAT-ENTRY-001#binding.core/target.update-entry]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: test_entry_req_entry_002_update_entry_conflict } }
  - id: REQ-ENTRY-003
    title: Entry update
    description: Update an Entry and create a new immutable revision.
    priority: high
    status: implemented
    criteria:
      - id: update
        kind: behavior
        statement: Updating an Entry appends a new revision without replacing prior history.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: update-test
        role: verification
        facet: verification
        responsibility: Verify successful revision creation through the exact Iceberg integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: test_entry_req_entry_003_update_entry_success }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-003#criterion.update
                covers: [FEAT-ENTRY-001#binding.core/target.update-entry]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: test_entry_req_entry_003_update_entry_success } }
      - id: backend-update-test
        role: verification
        facet: verification
        responsibility: Verify Entry update through the exact backend route test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::structured_entry_routes_use_the_draft_path }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-003#criterion.update
                covers: [FEAT-ENTRY-001#binding.backend/target.update-entry]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::structured_entry_routes_use_the_draft_path } }
  - id: REQ-ENTRY-004
    title: Entry deletion tombstone
    description: Delete an Entry as a tombstone and exclude it from the current list.
    priority: medium
    status: implemented
    criteria:
      - id: tombstone
        kind: behavior
        statement: Deleting an Entry records a tombstone and removes it from current Entry listings while retaining history.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: tombstone-test
        role: verification
        facet: verification
        responsibility: Verify Entry tombstone behavior through the exact Iceberg integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: test_entry_req_entry_004_delete_entry }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-004#criterion.tombstone
                covers: [FEAT-ENTRY-001#binding.core/target.delete-entry]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: test_entry_req_entry_004_delete_entry } }
      - id: backend-tombstone-test
        role: verification
        facet: verification
        responsibility: Verify Entry tombstone behavior through the exact backend route test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::delete_route_records_the_authenticated_principal_as_actor }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-004#criterion.tombstone
                covers: [FEAT-ENTRY-001#binding.backend/target.delete-entry]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::delete_route_records_the_authenticated_principal_as_actor } }
      - id: frontend-tombstone-test
        role: verification
        facet: verification
        responsibility: Verify Entry tombstone behavior through the exact browser client test.
        targets:
          - id: case
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should remove entry from list" }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-004#criterion.tombstone
                covers: [FEAT-ENTRY-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should remove entry from list" } }
  - id: REQ-ENTRY-005
    title: Entry history and restore
    description: Every save creates an immutable revision, and history can be browsed and restored.
    priority: medium
    status: implemented
    criteria:
      - id: history
        kind: behavior
        statement: Entry history remains browsable and restore appends a new revision without deleting historical revisions.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: history-test
        role: verification
        facet: verification
        responsibility: Verify immutable history append behavior through the exact Iceberg integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: test_entry_req_entry_005_entry_history_append }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-005#criterion.history
                covers: [FEAT-ENTRY-001#binding.core/target.entry-history]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: test_entry_req_entry_005_entry_history_append } }
          - id: restore-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: restore_replays_historical_references_even_when_targets_are_unavailable }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-005#criterion.history
                covers: [FEAT-ENTRY-001#binding.core/target.restore-entry]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: restore_replays_historical_references_even_when_targets_are_unavailable } }
      - id: backend-history-test
        role: verification
        facet: verification
        responsibility: Verify Entry history paging through the exact backend route test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::issue_2746_entry_history_limit_offset_paginates }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-005#criterion.history
                covers: [FEAT-ENTRY-001#binding.backend/target.entry-history]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::issue_2746_entry_history_limit_offset_paginates } }
      - id: frontend-history-test
        role: verification
        facet: verification
        responsibility: Verify Entry history and restore through exact browser client tests.
        targets:
          - id: history-case
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "entryApi.history returns revisions" }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-005#criterion.history
                covers: [FEAT-ENTRY-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "entryApi.history returns revisions" } }
          - id: restore-case
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "entryApi.restore succeeds" }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-005#criterion.history
                covers: [FEAT-ENTRY-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "entryApi.restore succeeds" } }
  - id: REQ-ENTRY-007
    title: Properties in list response
    description: Include Form-owned properties when retrieving the Entry list.
    priority: medium
    status: implemented
    criteria:
      - id: list-properties
        kind: behavior
        statement: Entry list responses include the properties owned by the Entry's Form.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
  - id: REQ-ENTRY-008
    title: Asset upload returns a Form value
    description: Upload binary assets, return an AssetReference, and allow that value only in an asset_reference Form field.
    priority: medium
    status: implemented
    criteria:
      - id: asset-reference-return
        kind: behavior
        statement: Asset upload returns a typed AssetReference suitable for an asset_reference Form field.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: asset-reference-field-only
        kind: behavior
        statement: AssetReference values are accepted only by asset_reference Form fields and are rejected by other field types.
        governed_by: [POL-007#rule.governance, POL-014#rule.governance]
  - id: REQ-ENTRY-009
    title: Asset reference guard
    description: Prevent deleting assets still referenced by current, non-deleted typed Form values.
    priority: low
    status: implemented
    criteria:
      - id: asset-reference-guard
        kind: behavior
        statement: Asset deletion is rejected while a current non-deleted typed Form value still references the asset.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
  - id: REQ-ENTRY-010
    title: Entry read and selection operations
    description: Users and operators can list, select, retrieve, and inspect historical Entry data through the supported Ugoite interfaces.
    priority: medium
    status: implemented
    criteria:
      - id: list-operation
        kind: behavior
        statement: The Entry list operation is available through the service and operator surfaces.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-005#rule.governance, POL-006#rule.governance, POL-013#rule.governance]
      - id: options-operation
        kind: behavior
        statement: Entry reference options are available through the authorized operator surface.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-005#rule.governance, POL-006#rule.governance, POL-011#rule.governance]
      - id: read-operation
        kind: behavior
        statement: The current Entry retrieval operation is available through the service and operator surfaces.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-005#rule.governance, POL-006#rule.governance, POL-013#rule.governance]
      - id: revision-operation
        kind: behavior
        statement: Individual historical Entry revisions are retrievable through the service and operator surfaces.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-005#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
  - id: REQ-ENTRY-011
    title: Title-less Entry canonical model
    description: An Entry has no intrinsic title. A Form does not implicitly acquire a title field or title storage column. Entry identity is the stable entry_id; a human-readable name exists only when the Form defines it as a normal field. The source phrase “UI identification falls back to the stable entry_id” is ambiguous between route identity and visible text; this requirement preserves stable identity and states the Dashboard Recent label contract separately without claiming raw IDs are displayed. Existing title-bearing Space 0.1 remains readable without migration and space_version stays 0.1.
    priority: high
    status: implemented
    criteria:
      - id: no-implicit-title-field
        kind: behavior
        statement: A Form does not implicitly acquire a title field or title storage column; newly created Form storage has no ugoite_entry_title column.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: entry-id-identity
        kind: behavior
        statement: Entry identity is independent from any human-readable Form field; the stable entry_id remains the identity used to address a specific Entry and is never synthesized into a stored title.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance]
      - id: dashboard-recent-label
        kind: behavior
        statement: Dashboard Recent uses a Form-defined Title or Name for the primary label when present and a localized generic Entry label otherwise; the stable entry_id stays in the route target and is not a primary visible label.
        governed_by: [POL-002#rule.governance, POL-UI-005#rule.governance]
      - id: user-defined-title-field
        kind: behavior
        statement: A Form may define Title, Name, Subject, or Summary as a normal field with no Entry-level semantics, including on zero-field Forms which remain valid.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: legacy-read
        kind: behavior
        statement: Existing Space 0.1 Entries and unclaimed physical columns remain readable without migration while space_version stays 0.1.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: titleless-model-test
        role: verification
        facet: verification
        responsibility: Verify the structured Entry identity boundary and Form-defined title field through the existing Entry lifecycle integration test; legacy Space readability remains covered by the existing Space compatibility corpus.
        targets:
          - id: structured-entry-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_entry.rs
            selector: { kind: test, name: entry_list_supports_bounded_offset_pages_in_stable_order }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-011#criterion.no-implicit-title-field
                covers: [FEAT-ENTRY-002#binding.core/target.titleless-model]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: entry_list_supports_bounded_offset_pages_in_stable_order } }
              - kind: verifies
                criterion: REQ-ENTRY-011#criterion.entry-id-identity
                covers: [FEAT-ENTRY-002#binding.core/target.titleless-model]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: entry_list_supports_bounded_offset_pages_in_stable_order } }
              - kind: verifies
                criterion: REQ-ENTRY-011#criterion.user-defined-title-field
                covers: [FEAT-ENTRY-002#binding.core/target.titleless-model]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_entry, test: entry_list_supports_bounded_offset_pages_in_stable_order } }
          - id: legacy-read-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space_version_compat.rs
            selector: { kind: test, name: frozen_space_01_fixture_opens_mutates_reopens_and_preserves_history }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-011#criterion.legacy-read
                covers: [FEAT-ENTRY-002#binding.core/target.titleless-model]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space_version_compat, test: frozen_space_01_fixture_opens_mutates_reopens_and_preserves_history } }
      - id: dashboard-label-verification
        role: verification
        facet: verification
        responsibility: Verify the Dashboard Recent visible label and route identity separately. The original UI-identification wording remains unverified for surfaces outside this explicit page contract.
        targets:
          - id: entry-label-fallback
            adapter: typescript
            path: frontend/src/lib/entry-label.test.ts
            selector: { kind: test, name: uses the generic label when an entry has no properties }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-011#criterion.dashboard-recent-label
                covers: [FEAT-FE-002#binding.frontend/target.entry-display-label-helper]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/entry-label.test.ts, test: uses the generic label when an entry has no properties } }
          - id: dashboard-recent-labels
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/dashboard.test.tsx"
            selector: { kind: test, name: "REQ-UX-LIST-001: gives same-Form Recent links unique ID-free labels" }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-011#criterion.dashboard-recent-label
                covers: [FEAT-FE-002#binding.frontend/target.dashboard-recent-labels]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/dashboard.test.tsx", test: "REQ-UX-LIST-001: gives same-Form Recent links unique ID-free labels" } }
  - id: REQ-ENTRY-012
    title: CLI canonical EntryQuery list
    description: The CLI Entry list command uses the canonical EntryQuery capability for local and remote Spaces, including Form scope, text, typed filters, ordered sorts, projection, and cursor traversal goals.
    priority: high
    status: implemented
    criteria:
      - id: canonical-query
        kind: behavior
        statement: CLI Entry list requests use the canonical entry query DTO and route to entry.query remotely or the same canonical query executor locally.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-005#rule.governance, POL-006#rule.governance, POL-013#rule.governance]
      - id: typed-options
        kind: behavior
        statement: CLI form, text, repeated filter, repeated sort, columns, and limit options preserve EntryQuery scope, capability-approved types, ordered clauses, projection, and traversal semantics without a second query language.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-005#rule.governance, POL-006#rule.governance, POL-013#rule.governance]
      - id: human-machine-output
        kind: behavior
        statement: Machine output retains stable Entry identity while human table output presents bounded Form content or Preview without using a raw Entry ID as the primary label.
        governed_by: [POL-002#rule.governance, POL-005#rule.governance, POL-006#rule.governance]
    bindings:
      - id: cli-query-routing-test
        role: verification
        facet: verification
        responsibility: Verify remote CLI Entry list routing and canonical request serialization through the exact endpoint-routing integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_entry_list_uses_canonical_entry_query_route_and_dto }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-012#criterion.canonical-query
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-query-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_entry_list_uses_canonical_entry_query_route_and_dto } }
      - id: cli-query-options-test
        role: verification
        facet: verification
        responsibility: Verify local CLI EntryQuery option translation, typed filtering, ordered sorting, projection, traversal goal, and human-readable output through the exact core journey test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_cli_entry_list_canonical_query_options }
            claims:
              - kind: verifies
                criterion: REQ-ENTRY-012#criterion.typed-options
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-query-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_cli_entry_list_canonical_query_options } }
              - kind: verifies
                criterion: REQ-ENTRY-012#criterion.human-machine-output
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-query-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_cli_entry_list_canonical_query_options } }
