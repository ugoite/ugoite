schema: mitase/authoring/v2
kind: requirements
namespace: composition
category: Portable Composition documents, execution, and recovery
requirements:
  - id: REQ-COMP-007
    title: Typed reactive Composition variables
    description: Composition v1 pre-release grammar declares typed variables and Input components, supports direct variable-backed Text, and re-evaluates only dependent SQL Sources from a transient typed snapshot. This capability is planned; exact verification evidence is added with its implementation slices.
    priority: high
    status: planned
    criteria:
      - id: typed-variable-declarations
        kind: behavior
        statement: Each Composition variable has a unique stable ID, required type, required flag, optional exact-type default, and optional display metadata. The initial type set is string, boolean, integer, float, date, and timestamp; values are never inferred or implicitly coerced.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: input-component-binding
        kind: behavior
        statement: An Input component references one declared variable and owns no persisted value or setter expression. A required variable without a default has a placed Input, and each placed Input is an ordinary Component referenced once by Layout.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: input-runtime-synchronization
        kind: behavior
        statement: Multiple Inputs bound to the same variable display one shared current raw value and validation state; editing any bound Input updates every other bound Input in the same UI cycle.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: direct-text-binding
        kind: behavior
        statement: Text content is either a literal string or a direct reference to a declared string variable. Text evaluates no expressions, implicit conversions, or SQL results.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: direct-text-reactivity
        kind: behavior
        statement: A valid change to a string variable updates each dependent Text in the same reactive UI cycle without issuing SQL.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: typed-source-binding
        kind: security
        statement: Composition references use the variable form and bind to exact-type SQL variables declared by the pinned Saved SQL revision through the existing typed SQL parameters. SQL text is not rewritten, interpolated, or concatenated, and the stateless SQL parameters and parameter_types contract is unchanged.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: dependency-driven-execution
        kind: behavior
        statement: Core resolves variable-to-Input/Text/Source and Source-to-Metric/Table dependencies independently of component declaration or Layout order; layout edits do not alter the dependency graph.
        governed_by: [POL-004#rule.governance]
      - id: selective-source-refresh
        kind: behavior
        statement: A valid variable change immediately invalidates only dependent SQL Sources and their Metric/Table consumers; an unrelated variable does not issue another SQL request. Debounce, if any, affects only SQL issuing, not input, validation, Text, or stale-result invalidation.
        governed_by: [POL-004#rule.governance]
      - id: stale-result-and-state-safety
        kind: security
        statement: A SQL response is accepted only for its current Composition revision, variable-subset fingerprint, exact Saved SQL revision, and authorization/publication context. Older generations are discarded; pending or failed requests never present prior success as current. Current ACL, bounded execution, NULL/zero/zero-row/multiple-row distinctions, exact numeric handling, and SQL diagnostics remain in force.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: runtime-values-are-transient
        kind: behavior
        statement: Composition Entry revisions persist variable declarations and defaults, Sources, Components, and Layout. Runtime values, raw invalid input, query results, pending state, and errors are Work and are not persisted by preview, use, implicit save, URL, local storage, or server session.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: portable-variable-contract
        kind: quality
        statement: Rust Domain/Core define variable parsing, validation, canonicalization, dependency references, and diagnostics for Native and WASM. Composition DTOs use variables and variable_definitions; one-shot CLI Composition queries use --var; SQL APIs retain parameters and parameter_types. Native and WASM canonical output and fingerprints match.
        governed_by: [POL-004#rule.governance]
      - id: code-free-studio-authoring
        kind: behavior
        statement: Studio can declare typed variables and defaults, place Inputs, bind literal or string-variable Text, and connect exact-type Saved SQL variables without JavaScript, expressions, getters, setters, or event handlers. Saving preserves defaults and never promotes runtime input to Composition Knowledge.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: responsive-accessible-inputs
        kind: quality
        statement: At 390px width, variable Inputs, labels, invalid/loading/results states, and recovery actions remain understandable and operable by keyboard and screen reader; internal variable IDs are not primary labels.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance, POL-UI-005#rule.governance]
    bindings:
      - id: typed-variable-domain-verification
        role: verification
        facet: verification
        responsibility: Verify exact typed Input parsing and defaults, declared Input references and placement, direct string-variable Text references, and variable-form source references in the portable Domain contract.
        targets:
          - id: typed-input-parser-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::typed_input_parser_enforces_the_pinned_lexical_contract }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.typed-variable-declarations
                covers: [FEAT-COMP-008#binding.typed-variable-domain/target.variable-declaration-and-input-parser]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::typed_input_parser_enforces_the_pinned_lexical_contract } }
          - id: typed-variable-default-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::variable_defaults_must_match_the_type_and_lexical_contract }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.typed-variable-declarations
                covers: [FEAT-COMP-008#binding.typed-variable-domain/target.variable-declaration-and-input-parser]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::variable_defaults_must_match_the_type_and_lexical_contract } }
          - id: repeated-input-reference-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::multiple_inputs_can_reference_one_variable }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.input-component-binding
                covers: [FEAT-COMP-008#binding.typed-variable-domain/target.input-component-model]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::multiple_inputs_can_reference_one_variable } }
          - id: declared-input-reference-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::unknown_input_variable_is_invalid }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.input-component-binding
                covers: [FEAT-COMP-008#binding.typed-variable-domain/target.input-component-model]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::unknown_input_variable_is_invalid } }
          - id: direct-text-reference-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::variable_text_requires_a_declared_string_variable }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.direct-text-binding
                covers: [FEAT-COMP-008#binding.typed-variable-domain/target.direct-text-reference-model]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::variable_text_requires_a_declared_string_variable } }
          - id: declared-source-variable-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::unknown_variable_source_references_are_invalid }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.typed-source-binding
                covers: [FEAT-COMP-008#binding.typed-variable-domain/target.source-variable-reference-model]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::unknown_variable_source_references_are_invalid } }
      - id: typed-variable-core-verification
        role: verification
        facet: verification
        responsibility: Verify Core rejects invalid runtime values without fallback, preserves exact SQL variable types, resolves Input/Text references locally, and indexes only semantic variable and source dependencies independent of Layout order.
        targets:
          - id: invalid-runtime-value-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::invalid_supplied_value_does_not_fall_back_to_a_default }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.typed-variable-declarations
                covers: [FEAT-COMP-008#binding.core-typed-variable-resolution/target.runtime-variable-binding]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::invalid_supplied_value_does_not_fall_back_to_a_default } }
          - id: exact-sql-variable-type-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::saved_sql_source_checks_variable_types_and_literal_values }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.typed-source-binding
                covers: [FEAT-COMP-008#binding.core-typed-variable-resolution/target.typed-saved-sql-variable-binding]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::saved_sql_source_checks_variable_types_and_literal_values } }
          - id: local-input-value-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::input_components_resolve_through_semantic_variable_values }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.input-component-binding
                covers: [FEAT-COMP-008#binding.core-typed-variable-resolution/target.local-components-and-dependency-index]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::input_components_resolve_through_semantic_variable_values } }
          - id: local-text-reference-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::dependency_index_is_semantic_and_independent_of_layout_order }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.direct-text-binding
                covers: [FEAT-COMP-008#binding.core-typed-variable-resolution/target.local-components-and-dependency-index]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::dependency_index_is_semantic_and_independent_of_layout_order } }
          - id: semantic-dependency-index-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::dependency_index_is_semantic_and_independent_of_layout_order }
            claims:
              - kind: verifies
                criterion: REQ-COMP-007#criterion.dependency-driven-execution
                covers: [FEAT-COMP-008#binding.core-typed-variable-resolution/target.local-components-and-dependency-index]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::dependency_index_is_semantic_and_independent_of_layout_order } }
