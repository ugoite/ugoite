schema: mitase/authoring/v2
kind: requirements
namespace: composition
category: Portable Composition documents, execution, and recovery
requirements:
  - id: REQ-COMP-007
    title: Typed reactive Composition variables
    description: Composition v1 pre-release grammar declares typed variables and Input components, supports direct variable-backed Text, and re-evaluates only dependent SQL Sources from a transient typed snapshot. This capability is planned; exact verification evidence is added with its implementation slices.
    priority: high
    status: planned
    criteria:
      - id: typed-variable-declarations
        kind: behavior
        statement: Each Composition variable has a unique stable ID, required type, required flag, optional exact-type default, and optional display metadata. The initial type set is string, boolean, integer, float, date, and timestamp; values are never inferred or implicitly coerced.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: typed-input-lexical-contract
        kind: behavior
        statement: Typed Input parsing is locale-independent and follows the bounded per-type lexical grammar and value limits in ADR-023 section 2.1. A finite JSON number with integral spelling (for example, 1) remains a Float value; Saved SQL binding uses the declared Composition and SQL variable types, not the JSON number's spelling. Empty Input is explicitly unset and overrides a declaration default; omission selects the default. Unset is carried separately from typed values and is never SQL NULL. Malformed, over-limit, overflow, non-finite, or underflow-to-zero values remain invalid and cannot be bound to a query. Defaults use the same type and lexical rules.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: input-component-binding
        kind: behavior
        statement: An Input component references one declared variable and owns no persisted value or setter expression. A required variable without a default has a placed Input, and each placed Input is an ordinary Component referenced once by Layout.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: required-variable-unset-diagnostic
        kind: behavior
        statement: Resolving a required unset returns a `variable_missing` diagnostic with its variable ID; the Browser keeps dependent Sources invalid, hides their prior pages, and does not query them until the variable is valid.
        governed_by: [POL-004#rule.governance]
      - id: input-runtime-synchronization
        kind: behavior
        statement: Multiple Inputs bound to the same variable display one shared current raw value and validation state; editing any bound Input updates every other bound Input in the same UI cycle.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: direct-text-binding
        kind: behavior
        statement: Text content is either a literal string or a direct reference to a declared string variable. Text evaluates no expressions, implicit conversions, or SQL results.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: direct-text-reactivity
        kind: behavior
        statement: A valid change to a string variable updates each dependent Text in the same reactive UI cycle without issuing SQL.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: typed-source-binding
        kind: security
        statement: Composition references use the variable form and bind to exact-type SQL variables declared by the pinned Saved SQL revision through the existing typed SQL parameters. SQL text is not rewritten, interpolated, or concatenated, and the stateless SQL parameters and parameter_types contract is unchanged.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: dependency-driven-execution
        kind: behavior
        statement: Core resolves variable-to-Input/Text/Source and Source-to-Metric/Table dependencies independently of component declaration or Layout order; layout edits do not alter the dependency graph.
        governed_by: [POL-004#rule.governance]
      - id: selective-source-refresh
        kind: behavior
        statement: A valid variable change immediately invalidates only dependent SQL Sources and their Metric/Table consumers; an unrelated variable does not issue another SQL request. Debounce, if any, affects only SQL issuing, not input, validation, Text, or stale-result invalidation.
        governed_by: [POL-004#rule.governance]
      - id: stale-result-and-state-safety
        kind: security
        statement: A SQL response is accepted only for its current Space, authorization/publication context, Composition revision, variable-subset fingerprint, and exact Saved SQL revision. Identical variable, source, and component identifiers do not allow results or cache identity to cross Space boundaries. Older generations are discarded; pending or failed requests never present prior success as current. Current ACL, bounded execution, NULL/zero/zero-row/multiple-row distinctions, exact numeric handling, and SQL diagnostics remain in force.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: source-waiting-when-resolution-blocked
        kind: behavior
        statement: After the Browser has a resolved plan, malformed raw input blocks further resolution and SQL requests. An explicitly unset required variable still goes through the resolver for its authoritative missing-variable diagnostic, while dependent Sources remain invalid and are not queried. A changed Source whose own inputs are valid hides its previous result and reports a waiting state while another input blocks the plan; a Source depending on a blocked input stays invalid. Unchanged ready Sources retain their pages and cursors. Pending changes resume after all blocking inputs become valid, and only affected Sources refresh.
        governed_by: [POL-004#rule.governance]
      - id: runtime-values-are-transient
        kind: behavior
        statement: Composition Entry revisions persist variable declarations and defaults, Sources, Components, and Layout. Runtime values, raw invalid input, query results, pending state, and errors are Work and are not persisted by preview, use, implicit save, URL, local storage, or server session.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: portable-variable-contract
        kind: quality
        statement: Rust Domain/Core define variable parsing, validation, canonicalization, dependency references, and diagnostics for Native and WASM. Native and WASM share raw Input outcomes as unset, an exact typed scalar, or invalid. Composition DTOs use variables and variable_definitions; one-shot CLI Composition queries use --var; SQL APIs retain parameters and parameter_types. Native and WASM canonical output and fingerprints match.
        governed_by: [POL-004#rule.governance]
      - id: cli-variable-query
        kind: behavior
        statement: Composition query accepts repeated `--var ID=VALUE`, validates declared values with the shared typed lexical rules, and sends the typed variable map separately from explicit unsets. `--var ID=` explicitly unsets even an unknown ID so Core returns the unknown-variable diagnostic; omission alone selects a default. The prerelease Composition `--param` flag is rejected without a compatibility alias. The same values and unset names reach local Core resolution, remote resolution, and Metric query requests, while SQL `--param` behavior remains unchanged.
        governed_by: [POL-004#rule.governance]
      - id: code-free-studio-authoring
        kind: behavior
        statement: Studio can declare typed variables and defaults, place Inputs, bind literal or string-variable Text, and connect exact-type Saved SQL variables without JavaScript, expressions, getters, setters, or event handlers. Saving preserves defaults and never promotes runtime input to Composition Knowledge.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: studio-variable-identity-presentation
        kind: quality
        statement: Studio creates stable variable IDs internally and uses an authored label or localized declaration ordinal for variable-bound Text and Input names; ordinary visible labels, accessible names, and titles never expose variable IDs.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: studio-filtered-sql-metric-journey
        kind: behavior
        statement: Studio can save and reopen a Composition with an integer minimum bound to an exact Saved SQL revision that returns COUNT(*) and SUM(Amount); minimum 0 displays 3 and 60 for Amount values 10, 20, and 30, and changing the Input to 20 displays 2 and 50 from the dependent SQL result. Reload restores the default without appending a Composition revision.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: responsive-accessible-inputs
        kind: quality
        statement: At 390px width, variable Inputs, labels, invalid/loading/waiting/results states, and recovery actions remain understandable and operable by keyboard and screen reader; internal variable IDs are not primary labels.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance, POL-UI-005#rule.governance]
    bindings:
      - id: typed-variable-domain-verification
        role: verification
        facet: verification
