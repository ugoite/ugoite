schema: mitase/authoring/v2
kind: requirements
namespace: composition
category: Text-first Composition graph and evaluation
requirements:
  - id: REQ-COMP-010
    title: Text-first Composition graph and evaluation
    description: >-
      Define the executable Composition document and graph behavior, and the
      availability of raw Entry history for inspection and recovery.
    priority: high
    status: implemented
    criteria:
      - id: inline-sql-typed-graph
        kind: behavior
        statement: >-
          Composition variables are typed constants, inputs, or inline-SQL
          queries with explicit SQL-parameter-to-variable bindings. A query
          declares either an ordered table result or a scalar result. The
          executable document parser rejects unrecognized query variants.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: table-text-input-components
        kind: behavior
        statement: >-
          Composition components are Table, Text, or Input. Table references
          one table-valued query and renders its result columns in SQL
          projection order without a stored presentation projection. Input
          references one input variable. Unrecognized component variants are rejected.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: rust-parsed-text-templates
        kind: behavior
        statement: >-
          Text content is one plain template string. Rust parses ordered
          literal and `{{variable_id}}` parts, with `\{{` representing a
          literal `{{`. Missing references, table values, and JSON values are
          rejected. Only displayable scalar values are emitted as text; HTML
          or expression evaluation is not performed.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: exact-scalar-query-contract
        kind: behavior
        statement: >-
          A scalar query result succeeds only with exactly one result column
          and one row. Zero rows, a NULL value, multiple rows, multiple columns,
          type drift, and access denial remain distinguishable. No first row or
          column is selected implicitly, and supported integer and decimal
          values retain their exact representation.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: current-query-authority-and-schema
        kind: security
        statement: >-
          Query planning and evaluation recheck current Form identity, ACL,
          Publication, SQL validity, explicit argument types, and the declared
          result descriptor. Resolved page SQL and its Count request use the
          same stable Form relation IDs, so renaming a bound Form or creating a
          same-name replacement cannot retarget the query. Results are bounded
          transient Work; stale or unauthorized values are not exposed as
          current Composition output.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: current-shape-save-validation
        kind: security
        statement: >-
          Before a Composition revision is appended, save validates the current
          executable document and rebuilds each inline query's Form bindings
          and result descriptor from current authorized planning. Submitted
          bindings and schema fingerprints are not trusted as authority.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: append-only-save-history
        kind: security
        statement: >-
          Composition save retains the existing idempotent receipt, stale
          revision conflict, and append-only Entry history behavior. Restore
          remains supported for revisions in the current Composition shape.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: raw-history-remains-readable
        kind: behavior
        statement: >-
          Raw inspect, export, exact-revision reads, and history continue to
          return stored fields and revision metadata for Composition records
          whose document shape is not executable. Reading those records does
          not require migration.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
