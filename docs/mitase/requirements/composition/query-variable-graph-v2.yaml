schema: mitase/authoring/v2
kind: requirements
namespace: composition
category: Typed query variable graph and complete SQL Workspace
requirements:
  - id: REQ-COMP-009
    title: Composition typed query variable graph
    description: Replace the unreleased Composition source and scalar-variable split with a strict typed graph whose SQL query nodes are the only calculation source for display components.
    priority: high
    status: planned
    criteria:
      - id: single-typed-variable-graph
        kind: behavior
        statement: >-
          Composition has one `spec.variables` node list. Each node is exactly
          a typed constant, input, or query. A query returns one typed table or
          scalar value and records explicit SQL-parameter-to-variable bindings.
          SQL parameter names do not bind implicitly to Composition variable
          names, and initial SQL parameters cannot reference table values.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: display-components-reference-variables
        kind: behavior
        statement: >-
          Table, Metric, Text, and Input components refer only to compatible
          variable nodes or literal Text content. Domain validation rejects
          incompatible types, missing references, dependency cycles, duplicate
          names, unused or unplaced inputs, and invalid query arguments.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: exact-query-identities
        kind: security
        statement: >-
          Form-assisted inline SQL uses server-derived Form bindings, while a
          Saved SQL query node pins one exact Entry and revision. Resolution
          rechecks current ACL, Publication, schema, and query revision; an
          unavailable identity fails closed without creating a partial query
          variable or display component. When a Form schema changes, the old
          Composition revision remains non-executable until an authoring
          preview derives the current query descriptor and an explicit save
          appends a repaired Composition revision. Authorized query metadata
          may expose Saved SQL source text only from that exact pinned
          revision; it never substitutes the latest revision.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: scalar-cardinality-is-explicit
        kind: behavior
        statement: >-
          A scalar query succeeds only for exactly one row and one column. The
          runtime distinguishes zero rows, one NULL row, multiple rows,
          multiple columns, type drift, and access denial. It never silently
          chooses a first row or first column.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: query-results-validated-before-preview
        kind: security
        statement: >-
          Core compiles each query request from its explicit variable bindings
          and one evaluation snapshot. Before a SQL page becomes a preview
          value, Core checks that exact request, pinned Saved SQL revision,
          result schema, types, nullability, and scalar or table contract
          against the query's declared return descriptor. A rejected page is
          not retained or rendered. The server-derived selected dependency
          closure is one result publication unit: if any selected query fails,
          no newly computed value, page, or cursor from that closure is exposed.
          Original failure diagnostics are retained and otherwise valid selected
          queries receive an evaluation-aborted diagnostic. Previously accepted
          unselected results may survive only under the same authority snapshot.
          Accepted results remain transient Work.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: authoring-query-metadata-preview
        kind: behavior
        statement: >-
          Authorized authoring preview can resolve query schema while Inputs
          remain unset. Any placeholder used only to plan that preview is
          omitted from returned values and executable requests. Runtime graph
          evaluation still requires real supplied or default Input values and
          reports missing required values.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: snapshot-reactive-execution
        kind: security
        statement: >-
          Query evaluation is stateless and bound to one immutable Composition,
          Publication, authorization, input, SQL revision, and parameter
          fingerprint snapshot. Only affected dependencies are recomputed;
          stale responses are discarded; preview values and results remain
          transient Work and are not materialized as Knowledge.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: strict-save-current-snapshot
        kind: security
        statement: >-
          A Composition save evaluates every query in the current typed
          variable graph against one exact bound Publication and authorization
          snapshot, using supplied transient Input values, declared defaults,
          and explicit unsets. Missing required Inputs, invalid scalar
          cardinality, result type/nullability mismatches, or changed snapshot
          reject the whole save before any Registry, Entry, revision, or Change
          becomes reachable. The exact proof cannot be refreshed during a
          generic append retry. Input values and results are not stored in the
          Composition document, history, or export. A successful retry with the
          same operation and same Work recovers its original receipt before
          revalidating sources, subject to current authorization.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: full-executor-to-gui-sql-coverage
        kind: behavior
        statement: >-
          Every SQL construct admitted by the Rust read-only SQL executor has
          an equivalent typed GUI document operation, diagnostic, and
          round-trip fixture. Parser success alone does not admit a construct;
          unsupported functions and types remain unavailable in both execution
          and the GUI until the complete contract is extended.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: replaced-composition-grammar-fails-closed
        kind: behavior
        statement: >-
          The canonical reader accepts only the new variable-graph grammar and
          does not execute the replaced unreleased Composition grammar through
          a compatibility reader or writer, alias, adapter, fallback, dual-read
          or dual-write path, hidden retained field, compatibility fixture, or
          migration. The replaced schema is outside the v0.1 Knowledge
          compatibility floor. Raw history, inspection, and export continue
          under their existing general Entry contracts and do not make an old
          Composition executable.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: design-picker-normalizes-to-variable
        kind: behavior
        statement: >-
          Design Table and Metric insertion offer Variables, Forms, and Saved
          SQL in one picker. Form and exact-revision Saved SQL choices create
          or exactly reuse a compatible query variable and insert a component
          atomically. The persisted component stores only its variable
          reference; insertion closes the picker without opening an Inspector.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: full-signed-i64-graph-values
        kind: behavior
        statement: >-
          Typed Composition integer constants, defaults, supplied Inputs, SQL
          arguments, and integer results preserve every signed 64-bit value
          exactly from -9223372036854775808 through 9223372036854775807.
          Values outside that range are rejected. Browser serialization keeps
          exact numeric tokens only where the Composition type identifies an
          integer; it rejects already-rounded unsafe JavaScript numbers and
          leaves JSON-typed payloads opaque.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
      - id: table-result-column-presentation
        kind: behavior
        statement: >-
          A Table may persist an ordered display projection whose keys are
          exact names from its bound query result and whose headings are
          presentation metadata for those result columns. The projection does
          not change query SQL, aliases, result schema, or the Table
          component's identity. Duplicate or unknown keys are rejected, and a
          key made unavailable by a changed query remains visibly unresolved
          until repaired; it never selects another column by position or
          heading. A Form-derived initial projection uses the Form's visible
          field headings while retaining the resolved query's exact result
          keys and authorized Form binding.
        governed_by: [
          POL-000#rule.foundation-precedence,
          POL-004#rule.governance,
        ]
    bindings:
      - id: query-result-validation-verification
        role: verification
        facet: verification
        responsibility: Verify descriptor validation and stateless evaluation snapshots. Server-side dependency closure, executor exclusion, browser response ordering, Space switching, source ACL revocation, and same-browser principal changes have explicit test evidence; CI execution evidence is still pending for this candidate.
        targets:
          - id: core-query-result-preview-boundary
            adapter: rust
            path: crates/ugoite-core/tests/composition_query_evaluation.rs
            selector:
              kind: test
              name: only_descriptor_validated_query_values_reach_the_complete_preview
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.query-result-validation/target.composition-query-evaluation,
                ]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-core
                    harness: composition_query_evaluation
                    test: only_descriptor_validated_query_values_reach_the_complete_preview
          - id: saved-sql-request-coordinates
            adapter: rust
            path: crates/ugoite-core/tests/composition_query_evaluation.rs
            selector:
              kind: test
              name: evaluation_rejects_requests_with_unbound_parameters_or_stale_snapshot_ids
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.query-result-validation/target.composition-query-evaluation,
                ]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-core
                    harness: composition_query_evaluation
                    test: evaluation_rejects_requests_with_unbound_parameters_or_stale_snapshot_ids
          - id: table-page-continuations
            adapter: rust
            path: crates/ugoite-core/tests/composition_query_evaluation.rs
            selector:
              kind: test
              name: table_pages_are_validated_and_keep_bounded_continuation_metadata
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.query-result-validation/target.composition-query-evaluation,
                ]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-core
                    harness: composition_query_evaluation
                    test: table_pages_are_validated_and_keep_bounded_continuation_metadata
          - id: query-selection-closure
            adapter: rust
            path: crates/ugoite-core/tests/composition_query_evaluation.rs
            selector:
              kind: test
              name: requested_queries_expand_dependencies_and_reject_unselected_or_unknown_nodes
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.query-result-validation/target.composition-query-evaluation,
                ]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-core
                    harness: composition_query_evaluation
                    test: requested_queries_expand_dependencies_and_reject_unselected_or_unknown_nodes
          - id: unrelated-query-exclusion
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector:
              kind: test
              name: graph_evaluation_does_not_execute_an_unrequested_query_branch
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-iceberg
                    harness: test_composition_preview
                    test: graph_evaluation_does_not_execute_an_unrequested_query_branch
          - id: stale-browser-evaluation
            adapter: typescript
            path: e2e/composition-stale-response.test.ts
            selector:
              kind: test
              name: a late evaluation for an earlier input cannot replace current graph values
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner:
                  runner: e2e-playwright
                  arguments:
                    file: e2e/composition-stale-response.test.ts
                    test: a late evaluation for an earlier input cannot replace current graph values
          - id: browser-principal-isolation
            adapter: typescript
            path: e2e/composition-source-acl-isolation.test.ts
            selector:
              kind: test
              name: switching principal in one BrowserContext clears prior graph results
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner:
                  runner: e2e-playwright
                  arguments:
                    file: e2e/composition-source-acl-isolation.test.ts
                    test: switching principal in one BrowserContext clears prior graph results
          - id: browser-source-revocation
            adapter: typescript
            path: e2e/composition-source-acl-isolation.test.ts
            selector:
              kind: test
              name: evaluate rechecks Form and exact Saved SQL access after revocation
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.exact-query-identities
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner:
                  runner: e2e-playwright
                  arguments:
                    file: e2e/composition-source-acl-isolation.test.ts
                    test: evaluate rechecks Form and exact Saved SQL access after revocation
          - id: saved-form-schema-drift
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector:
              kind: test
              name: saved_graph_fails_closed_when_form_schema_changes
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.exact-query-identities
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-iceberg
                    harness: test_composition_preview
                    test: saved_graph_fails_closed_when_form_schema_changes
