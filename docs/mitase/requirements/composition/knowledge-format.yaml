schema: mitase/authoring/v2
kind: requirements
namespace: composition
category: Portable Composition documents, execution, and recovery
requirements:
  - id: REQ-COMP-001
    title: Composition is Space-owned Knowledge
    description: A Composition is stored as one Entry revision in its user-owned Space and uses the existing revision, restore, receipt, and conflict contract; it does not acquire a separate database or hidden catalog as authority.
    priority: high
    status: implemented
    criteria:
      - id: space-authority
        kind: behavior
        statement: A Composition's authoritative document is owned by its Space and is not duplicated into a separate authoritative catalog.
        governed_by: [POL-000#rule.foundation-precedence]
      - id: one-entry-revision
        kind: behavior
        statement: Each saved Composition is represented by one Entry revision and inherits the existing append-only history, restore, receipt, and stale-write conflict behavior.
        governed_by: [POL-000#rule.foundation-precedence, POL-014#rule.governance, POL-016#rule.governance]
    bindings:
      - id: composition-update-history-verification
        role: verification
        facet: verification
        responsibility: Verify Browser Composition updates save as the next revision with composition and base revision identity, historical revisions restore append-only with a stable retry key navigating to the new revision, and stale bases surface conflicts without rewriting history or leaving the route.
        targets:
          - id: edit-stale-base-case
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/edit.test.tsx"
            selector: { kind: test, name: surfaces a stale base conflict without leaving the route }
            claims:
              - kind: verifies
                criterion: REQ-COMP-001#criterion.one-entry-revision
                covers:
                  - FEAT-COMP-007#binding.composition-revision-lifecycle/target.browser-edit-route
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/edit.test.tsx", test: "surfaces a stale base conflict without leaving the route" } }
          - id: restore-append-case
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx"
            selector: { kind: test, name: restores a historical revision with source base and a stable retry key }
            claims:
              - kind: verifies
                criterion: REQ-COMP-001#criterion.one-entry-revision
                covers:
                  - FEAT-COMP-007#binding.composition-revision-lifecycle/target.browser-restore
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: "restores a historical revision with source base and a stable retry key" } }
          - id: restore-stale-base-case
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx"
            selector: { kind: test, name: surfaces a stale base conflict with a recovery link to history }
            claims:
              - kind: verifies
                criterion: REQ-COMP-001#criterion.one-entry-revision
                covers:
                  - FEAT-COMP-007#binding.composition-revision-lifecycle/target.browser-restore
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: "surfaces a stale base conflict with a recovery link to history" } }
  - id: REQ-COMP-002
    title: Restricted portable Composition format
    description: The v0.2.2 Composition exchange format is restricted `.ugcomp.yaml` v1, with a typed envelope and spec, dashboard as its only executable kind, and Rust semantics shared by native and WASM surfaces.
    priority: high
    status: implemented
    bindings:
      - id: display-label-verification
        role: verification
        facet: verification
        responsibility: Verify optional display labels round-trip through canonical YAML and the fingerprint natively and in WASM, and typed metric references canonicalize with unknown value-field shapes rejected identically.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: tests::composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.optional-display-labels
                covers:
                  - FEAT-COMP-001#binding.display-label-domain/target.parameter-display-label
                  - FEAT-COMP-001#binding.display-label-domain/target.component-display-label
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::composition_canonicalization_matches_the_native_domain_contract } }
              - kind: verifies
                criterion: REQ-COMP-002#criterion.typed-metric-value-field
                covers:
                  - FEAT-COMP-001#binding.metric-value-field-domain/target.metric-value-field-type
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::composition_canonicalization_matches_the_native_domain_contract } }
      - id: envelope-verification
        role: verification
        facet: verification
        responsibility: Verify the fixed envelope marker, version, name, tags, dashboard kind, and empty spec through the shared domain unit test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::document_uses_the_portable_envelope_field_names }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.typed-dashboard-model
                covers:
                  - FEAT-COMP-001#binding.portable-envelope-domain/target.composition-document-type
                  - FEAT-COMP-001#binding.portable-envelope-domain/target.composition-format-marker-type
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::document_uses_the_portable_envelope_field_names } }
      - id: tag-verification
        role: verification
        facet: verification
        responsibility: Verify document tags round-trip as the same ordered Entry metadata tags on a saved Composition revision.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition.rs
            selector: { kind: test, name: composition_save_persists_canonical_carrier_and_receipt }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.composition-tags
                covers:
                  - FEAT-COMP-001#binding.portable-envelope-domain/target.composition-document-type
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition, test: composition_save_persists_canonical_carrier_and_receipt } }
      - id: result-descriptor-verification
        role: verification
        facet: verification
        responsibility: Verify ordered Saved SQL result descriptors are tracked deterministically in the resolved result fingerprint.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::saved_sql_schema_fingerprint_tracks_ordered_result_descriptors }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.saved-sql-result-descriptor
                covers:
                  - FEAT-COMP-001#binding.portable-envelope-domain/target.saved-sql-result-column-type
                  - FEAT-COMP-001#binding.portable-envelope-domain/target.saved-sql-result-field-types
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::saved_sql_schema_fingerprint_tracks_ordered_result_descriptors } }
      - id: layout-verification
        role: verification
        facet: verification
        responsibility: Verify unreferenced components are rejected during layout validation, which canonicalization invokes.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::unreferenced_components_are_invalid }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.ordered-components
                  - FEAT-COMP-001#binding.component-layout-domain/target.canonical-layout-validation
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::unreferenced_components_are_invalid } }
      - id: flow-layout-verification
        role: verification
        facet: verification
        responsibility: Verify empty layouts and rows, duplicate row IDs, parameter control placement, and the text style enum through the shared domain unit tests.
        targets:
          - id: empty-layout-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::empty_layout_is_rejected }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.empty-layout-rejected
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-layout
                  - FEAT-COMP-001#binding.component-layout-domain/target.canonical-layout-validation
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::empty_layout_is_rejected } }
          - id: empty-row-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::empty_rows_are_rejected }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.empty-layout-rejected
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-row
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::empty_rows_are_rejected } }
          - id: duplicate-row-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::duplicate_row_ids_are_rejected }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-row
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-layout
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::duplicate_row_ids_are_rejected } }
          - id: required-parameter-control-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::required_parameter_without_default_needs_a_layout_control }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-item
                  - FEAT-COMP-001#binding.component-layout-domain/target.ordered-components
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::required_parameter_without_default_needs_a_layout_control } }
          - id: unknown-parameter-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::unknown_parameter_references_are_invalid }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-item
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::unknown_parameter_references_are_invalid } }
          - id: duplicate-parameter-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::duplicate_parameter_placements_are_invalid }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.flow-item
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::duplicate_parameter_placements_are_invalid } }
          - id: text-style-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::text_style_enum_values_round_trip }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.text-style-enum
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.text-style
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::text_style_enum_values_round_trip } }
          - id: unknown-style-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::unknown_text_styles_and_layout_kinds_are_rejected }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.text-style-enum
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.text-style
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::unknown_text_styles_and_layout_kinds_are_rejected } }
          - id: placement-order-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::placed_parameters_come_first_in_layout_order }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.ordered-parameters
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::placed_parameters_come_first_in_layout_order } }
          - id: invalid-placement-order-case
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: tests::unknown_and_duplicate_parameter_placements_have_no_order }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.ordered-parameters
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::unknown_and_duplicate_parameter_placements_have_no_order } }
      - id: layout-binding-verification
        role: verification
        facet: verification
        responsibility: Verify layout-ordered component bindings with interleaved text and parameter items and semantic parameter values for placed controls through the Core resolver exercising the shared Domain ordering.
        targets:
          - id: interleaved-order-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::layout_order_interleaves_text_and_parameter_items_across_rows }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.ordered-components
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::layout_order_interleaves_text_and_parameter_items_across_rows } }
          - id: parameter-values-case
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: tests::parameter_items_resolve_through_semantic_parameter_values }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-001#binding.component-layout-domain/target.ordered-components
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition::tests::parameter_items_resolve_through_semantic_parameter_values } }
      - id: flow-renderer-verification
        role: verification
        facet: verification
        responsibility: Verify the Browser flow renderer composes layout rows and items in order with interleaved parameter controls, fixed text styles without source fetch, and text bindings joined by component id.
        targets:
          - id: flow-row-order-case
            adapter: typescript
            path: frontend/src/components/DashboardFlowRenderer.test.tsx
            selector: { kind: test, name: renders rows in order with parameter controls interleaved }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-004#binding.browser-query-runtime/target.browser-dashboard-flow-renderer
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/DashboardFlowRenderer.test.tsx, test: "renders rows in order with parameter controls interleaved" } }
          - id: flow-parameter-control-case
            adapter: typescript
            path: frontend/src/components/DashboardFlowRenderer.test.tsx
            selector: { kind: test, name: binds parameter changes to transient work state }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-004#binding.browser-query-runtime/target.browser-parameter-control
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/DashboardFlowRenderer.test.tsx, test: "binds parameter changes to transient work state" } }
          - id: flow-text-style-case
            adapter: typescript
            path: frontend/src/components/DashboardFlowRenderer.test.tsx
            selector: { kind: test, name: renders each text style without fetching sources }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.text-style-enum
                covers:
                  - FEAT-COMP-004#binding.browser-query-runtime/target.browser-flow-text
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/DashboardFlowRenderer.test.tsx, test: "renders each text style without fetching sources" } }
          - id: renderer-text-binding-case
            adapter: typescript
            path: frontend/src/components/CompositionRenderer.test.tsx
            selector: { kind: test, name: renders text bindings from joined declarations without source requests }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.text-style-enum
                covers:
                  - FEAT-COMP-004#binding.browser-query-runtime/target.browser-composition-renderer
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionRenderer.test.tsx, test: "renders text bindings from joined declarations without source requests" } }
      - id: design-canvas-verification
        role: verification
        facet: verification
        responsibility: Verify the Design canvas maps every block operation onto the draft document through the single draft channel — transient selection, text insertion with exact-once placement, existing-parameter placement, keyboard-operable row and item reorder without cross-row moves, declaration removal with parameter unplacement, and query-stable layout edits without extra queries.
        targets:
          - id: design-canvas-selection-case
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: selects canvas blocks without touching the draft }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "selects canvas blocks without touching the draft" } }
          - id: design-canvas-text-insertion-case
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: inserts text blocks declared and placed exactly once }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "inserts text blocks declared and placed exactly once" } }
              - kind: verifies
                criterion: REQ-COMP-002#criterion.text-style-enum
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "inserts text blocks declared and placed exactly once" } }
          - id: design-canvas-parameter-placement-case
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: places existing parameter controls without creating parameters }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "places existing parameter controls without creating parameters" } }
          - id: design-canvas-reorder-case
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: reorders rows and items with keyboard-operable buttons }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "reorders rows and items with keyboard-operable buttons" } }
          - id: design-canvas-remove-case
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: removes component declarations and unplaces parameter controls }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "removes component declarations and unplaces parameter controls" } }
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "removes component declarations and unplaces parameter controls" } }
          - id: design-canvas-no-refetch-case
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: routes block operations through the draft channel without extra queries }
            claims:
              - kind: verifies
                criterion: REQ-COMP-004#criterion.used-field-fingerprint
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: "routes block operations through the draft channel without extra queries" } }
          - id: design-canvas-draft-moves-case
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: reorders rows and items within rows only }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: "reorders rows and items within rows only" } }
          - id: design-canvas-draft-query-stable-case
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: keeps layout-only edits query-stable without refetching sources }
            claims:
              - kind: verifies
                criterion: REQ-COMP-004#criterion.used-field-fingerprint
                covers:
                  - FEAT-COMP-005#binding.studio-design-runtime/target.browser-design-canvas
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: "keeps layout-only edits query-stable without refetching sources" } }
      - id: studio-seed-readiness-verification
        role: verification
        facet: verification
        responsibility: Verify Studio seeds carry a default Table with a single-row layout plus mapped variables with controls placed only when variables exist, one-shot route consumption with no zero-display path, and the save gate blocking on name, refs, and layout with source-only drafts unable to save and the disabled Save carrying its reason.
        targets:
          - id: studio-form-seed-case
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: seeds a form entry point with an entry-query source and a default table }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
                covers:
                  - FEAT-COMP-006#binding.studio-data-runtime/target.browser-studio-seed
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: "seeds a form entry point with an entry-query source and a default table" } }
          - id: studio-saved-sql-seed-case
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: seeds a saved sql entry point with mapped variables and placed controls }
            claims:
              - kind: verifies
                criterion: REQ-COMP-004#criterion.exact-saved-sql-revision
                covers:
                  - FEAT-COMP-006#binding.studio-data-runtime/target.browser-studio-seed
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: "seeds a saved sql entry point with mapped variables and placed controls" } }
              - kind: verifies
                criterion: REQ-COMP-002#criterion.parameter-placement
                covers:
                  - FEAT-COMP-006#binding.studio-data-runtime/target.browser-studio-seed
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: "seeds a saved sql entry point with mapped variables and placed controls" } }
          - id: studio-seed-without-variables-case
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: seeds saved sql without variables with a table and no parameter controls }
            claims:
              - kind: verifies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
