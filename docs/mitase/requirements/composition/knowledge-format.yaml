    criteria:
      - id: typed-dashboard-model
        kind: behavior
        statement: The Composition v1 model represents its fixed envelope marker, version, name, Entry tags, dashboard kind, parameters, sources, components, and flow layout as typed Rust domain values.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: composition-tags
        kind: behavior
        statement: The document tags are the sole Composition tag value and must equal the ordered EntryMetadata.tags stored on its Entry revision.
        governed_by: [POL-000#rule.foundation-precedence, POL-007#rule.governance]
      - id: saved-sql-result-descriptor
        kind: behavior
        statement: A saved_sql source declares ordered expected_result columns with unique non-empty names and portable logical types; json columns may be rendered in tables but are not scalar metric values.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: server-typed-result-descriptor
        kind: behavior
        statement: Browser save-as-tool stores the sql.query result_schema column types unchanged in the saved_sql expected_result; columns absent from the descriptor keep the json fallback, and the Browser never infers types from row values.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: optional-display-labels
        kind: behavior
        statement: Composition parameters and Metric/Table components may carry optional display labels; present labels round-trip through canonical YAML and the semantic fingerprint, do not replace stable IDs or change source and query binding semantics, and absent labels remain omitted from canonical output.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: typed-metric-value-field
        kind: behavior
        statement: A metric value reference distinguishes an EntryQuery property by stable FieldId from a Saved SQL output column by its exact result name; resolution requires the value-field kind to match its source.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: metric-runtime-values
        kind: behavior
        statement: >-
          Metric date values are valid Gregorian dates in normalized YYYY-MM-DD
          form. Metric timestamp values are normalized local timestamps in
          YYYY-MM-DDTHH:MM or YYYY-MM-DDTHH:MM:SS[.fraction] form, or valid
          RFC 3339 timestamps with an explicit UTC designator or numeric offset.
          Fractions are limited to nine digits; normalized local fractions have
          no trailing zeroes. Malformed strings produce
          metric_result_type_mismatch through the shared Rust domain evaluator.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: ordered-component-layout
        kind: behavior
        statement: The flow layout defines component order by layout row-array order and item order; row IDs and component IDs are unique, each component is placed exactly once, duplicate row IDs, unknown references, duplicate references, unreferenced components, and empty rows produce invalid_composition, and the empty layout is invalid.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: text-style-enum
        kind: behavior
        statement: A text component carries inline text and one fixed style of title, heading, body, or caption; unknown styles are rejected, and text has no source binding.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: parameter-placement
        kind: behavior
        statement: The layout places parameter controls bound to declared parameter IDs; unknown or duplicate parameter references produce invalid_composition, and a required parameter without a default and without a layout control produces invalid_composition.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: empty-layout-rejected
        kind: behavior
        statement: A Composition layout with no rows, or with any row carrying no items, is rejected with invalid_composition during canonicalization.
        governed_by: [POL-002#rule.governance, POL-007#rule.governance]
      - id: restricted-yaml
        kind: behavior
        statement: Composition parsing rejects duplicate keys, multiple documents, anchors, aliases, merge keys, custom tags, implicit timestamp interpretation, and unknown fields.
        governed_by: [POL-011#rule.governance]
      - id: bounded-parser
        kind: quality
        statement: Composition parsing enforces measured limits for input bytes, nesting depth, and collection lengths in native and wasm32 builds.
        governed_by: [POL-011#rule.governance]
      - id: deterministic-diagnostics
        kind: behavior
        statement: Unsupported format versions and invalid Composition documents produce stable diagnostic codes independent of UI messages.
        governed_by: [POL-014#rule.governance]
      - id: used-field-schema-snapshot
        kind: behavior
        statement: >-
          An entry_query source records a FieldId and FieldType snapshot for
          property fields used by its filters, sort, and projection; a preview
          projection records all current property fields returned by preview.
          An EntryQuery metric must reference a field in an explicit source
          projection and never widens the source query. Preview does not promise
          a scalar result field for a metric. The snapshot includes List item
          and RowReference target
          metadata when present. When text search is present, it also includes
          every text-searchable property field under existing EntryQuery
          semantics, excluding binary, list, object_list, and asset_reference
          fields from the text-search expansion.
        governed_by: [POL-007#rule.governance]
  - id: REQ-COMP-003
    title: Canonical Composition representation
    description: Canonical YAML and the document-level semantic Composition fingerprint derive from the complete normalized typed Composition value rather than source formatting; this identity is distinct from each entry_query source-schema fingerprint.
    priority: high
    status: implemented
    criteria:
      - id: canonical-yaml
        kind: behavior
        statement: Canonical YAML uses schema field order, block style, two-space indentation, LF line endings, and no BOM; comments are not preserved.
        governed_by: [POL-001#rule.governance, POL-007#rule.governance]
      - id: semantic-fingerprint
        kind: behavior
        statement: The document-level Composition fingerprint is SHA-256 over the complete normalized typed CompositionDocument, including its envelope, Entry tags, expected_result descriptors, and spec, so formatting-only changes do not alter it while any semantic document change does.
        governed_by: [POL-007#rule.governance]
      - id: wasm-parity
        kind: behavior
        statement: Native Rust and WASM produce identical canonical YAML, semantic fingerprints, and diagnostic codes for the shared Composition fixtures.
        governed_by: [POL-001#rule.governance, POL-007#rule.governance]
