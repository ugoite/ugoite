            claims:
              - kind: verifies
                criterion: REQ-API-016#criterion.partial-output-is-failure
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_sql_stateless_cli, test: cli_sql_export_max_rows_does_not_publish_partial_file } }
          - id: remote-continuation
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_sql_export_reuses_stateless_route_and_continuation }
            claims:
              - kind: verifies
                criterion: REQ-API-016#criterion.stateless-query-only
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_sql_export_reuses_stateless_route_and_continuation } }
              - kind: verifies
                criterion: REQ-API-016#criterion.local-remote-parity
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_sql_export_reuses_stateless_route_and_continuation } }
          - id: remote-failure
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_sql_export_discards_file_after_remote_failure_without_leaking_token }
            claims:
              - kind: verifies
                criterion: REQ-API-016#criterion.partial-output-is-failure
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_sql_export_discards_file_after_remote_failure_without_leaking_token } }
      - id: backend-verification
        role: verification
