schema: mitase/authoring/v2
kind: requirements
namespace: api
category: API contracts and operator surfaces
requirements:
  - id: REQ-API-001
    title: Space CRUD
    description: Create, retrieve, and list Spaces. Every Space exposes an immutable UUIDv7 space_uid independently from its mutable human-facing slug, and the list operation returns only Spaces authorized for the current principal.
    priority: high
    status: implemented
    criteria:
      - id: space-lifecycle
        kind: behavior
        statement: The supported API surfaces create, retrieve, and list Spaces.
        governed_by: [POL-004#rule.governance, POL-005#rule.governance]
      - id: stable-space-identity
        kind: quality
        statement: Every Space exposes an immutable UUIDv7 space_uid independently from its mutable human-facing slug.
        governed_by: [POL-001#rule.governance, POL-004#rule.governance]
      - id: authorized-space-list
        kind: security
        statement: Space listing returns only Spaces authorized for the current principal.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance]
    bindings:
      - id: frontend-crud-verification
        role: verification
        facet: verification
        responsibility: Verify the frontend Space list and create adapters through exact MSW-backed Vitest cases; authorization filtering and immutable space_uid remain separate evidence.
        targets:
          - id: list-spaces
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should return all spaces" }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.space-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should return all spaces" } }
          - id: create-space
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should create a new space" }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.space-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should create a new space" } }
          - id: get-space
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "spaceApi.get returns a space" }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.space-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "spaceApi.get returns a space" } }
      - id: identity-verification
        role: verification
        facet: verification
        responsibility: Verify immutable Space metadata identity and UUIDv7 validation through the exact Iceberg integration case.
        targets:
          - id: metadata-identity
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_space.rs
            selector: { kind: test, name: space_metadata_identity_must_match_directory_and_uuidv7_contract }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.stable-space-identity
                covers: [FEAT-API-001#binding.space-service-implementation/target.get-space]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_space, test: space_metadata_identity_must_match_directory_and_uuidv7_contract } }
      - id: space-read-verification
        role: verification
        facet: verification
        responsibility: Verify the authenticated Space list and retrieve handlers through the exact server contract case.
        targets:
          - id: list-and-retrieve-space
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::space_read_api_returns_authorized_spaces_and_immutable_identity }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers:
                  - FEAT-STO-001#binding.service/target.list-space-ids
                  - FEAT-E2E-001#binding.server/target.list-spaces
                  - FEAT-API-001#binding.space-service-implementation/target.get-space
                  - FEAT-API-001#binding.space-backend-implementation/target.get-space
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_read_api_returns_authorized_spaces_and_immutable_identity } }
              - kind: verifies
                criterion: REQ-API-001#criterion.stable-space-identity
                covers:
                  - FEAT-API-001#binding.space-service-implementation/target.get-space
                  - FEAT-API-001#binding.space-backend-implementation/target.get-space
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::space_read_api_returns_authorized_spaces_and_immutable_identity } }
      - id: cli-verification
        role: verification
        facet: verification
        responsibility: Verify the CLI Space create routing through exact recording-server integration cases for backend and API modes.
        targets:
          - id: backend-create-space
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_create_space_req_api_001_routes_to_backend_post_spaces }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers: [FEAT-STO-001#binding.routing/target.space-command-routing]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_create_space_req_api_001_routes_to_backend_post_spaces } }
          - id: api-create-space
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_create_space_req_api_001_routes_to_api_post_spaces }
            claims:
              - kind: verifies
                criterion: REQ-API-001#criterion.space-lifecycle
                covers: [FEAT-STO-001#binding.routing/target.space-command-routing]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_create_space_req_api_001_routes_to_api_post_spaces } }
  - id: REQ-API-002
    title: Entry CRUD
    description: The API exposes creation, retrieval, update, and deletion of Entries while preserving the Entry lifecycle and revision semantics owned by the Entry domain.
    priority: high
    status: implemented
    criteria:
      - id: entry-lifecycle
        kind: behavior
        statement: The API exposes create, retrieve, update, and delete operations for Entries.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
    bindings:
      - id: service-verification
        role: verification
        facet: verification
        responsibility: Verify the service Entry create, list, retrieve, and delegated update paths through exact Rust integration cases; deletion and full authorization policy coverage remain separate evidence.
        targets:
          - id: create-and-list-entries
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_service.rs
            selector: { kind: test, name: test_service_boundary_covers_primary_adapter_operations }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers:
                  - FEAT-API-001#binding.service-implementation/target.create-entry
                  - FEAT-API-001#binding.service-implementation/target.list-entries
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_service, test: test_service_boundary_covers_primary_adapter_operations } }
          - id: retrieve-and-authorized-update
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_service.rs
            selector: { kind: test, name: authorized_entry_writes_apply_form_entry_and_delegated_principal_policies }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers:
                  - FEAT-API-001#binding.service-implementation/target.get-entry
                  - FEAT-API-001#binding.service-implementation/target.create-entry-authorized
                  - FEAT-API-001#binding.service-implementation/target.update-entry-authorized
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_service, test: authorized_entry_writes_apply_form_entry_and_delegated_principal_policies } }
      - id: backend-verification
        role: verification
        facet: verification
        responsibility: Verify the backend Entry create, retrieve, update, and delete handlers through exact Rust route tests; CLI and frontend evidence remain separate bindings.
        targets:
          - id: create-and-update-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::entry_routes_keep_input_errors_typed_and_create_atomic }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers:
                  - FEAT-API-001#binding.backend-implementation/target.create-entry
                  - FEAT-API-001#binding.backend-implementation/target.update-entry
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::entry_routes_keep_input_errors_typed_and_create_atomic } }
          - id: retrieve-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::issue_2037_authenticated_rest_apply_supports_create_update_remove }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.backend-implementation/target.get-entry]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::issue_2037_authenticated_rest_apply_supports_create_update_remove } }
          - id: delete-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::delete_route_records_the_authenticated_principal_as_actor }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.backend-implementation/target.delete-entry]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::delete_route_records_the_authenticated_principal_as_actor } }
      - id: frontend-crud-verification
        role: verification
        facet: verification
        responsibility: Verify the frontend Entry list, create, retrieve, update, and delete adapters through exact MSW-backed Vitest cases.
        targets:
          - id: list-entries
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should return all entries in space" }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should return all entries in space" } }
          - id: create-entry
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should create a structured entry" }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should create a structured entry" } }
          - id: get-entry
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should return full entry content" }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should return full entry content" } }
          - id: update-entry
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "entryApi.update throws generic error on non-409 failure" }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "entryApi.update throws generic error on non-409 failure" } }
          - id: delete-entry
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should remove entry from list" }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should remove entry from list" } }
      - id: cli-verification
        role: verification
        facet: verification
        responsibility: Verify the CLI Entry create routing through the exact recording-server integration case.
        targets:
          - id: create-entry
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_entry_create_req_api_002_routes_to_backend_post_entries }
            claims:
              - kind: verifies
                criterion: REQ-API-002#criterion.entry-lifecycle
                covers: [FEAT-API-001#binding.cli-implementation/target.entry-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_entry_create_req_api_002_routes_to_backend_post_entries } }

  - id: REQ-API-003
    title: MCP resource content framing
    description: MCP resource responses label Entry content as user-supplied untrusted data and strip raw HTML or script-like constructs before returning JSON payloads to AI clients.
    priority: high
    status: implemented
    criteria:
      - id: untrusted-content
        kind: security
        statement: MCP resource responses frame Entry content as untrusted user data and sanitize raw HTML or script-like constructs before returning it to an AI client.
        governed_by: [POL-010#rule.governance, POL-015#rule.governance]

  - id: REQ-API-004
    title: Feature registry consistency
    description: API feature registry entries must match implemented backend and frontend paths, files, and functions. The canonical Feature graph supersedes the legacy registry as migration completes.
    priority: high
    status: implemented
    criteria:
      - id: implementation-alignment
        kind: quality
        statement: API Feature bindings identify the implemented backend and frontend artifacts they govern.
        governed_by: [POL-008#rule.governance, POL-013#rule.governance]

  - id: REQ-API-005
    title: Requirements traceability automation
    description: Requirements and tests should be linked by stable Requirement and Criterion IDs and validated automatically. Complete repository-wide coverage remains a migration target.
    priority: high
    status: planned
    criteria:
      - id: stable-traceability
        kind: operational
        statement: API verification claims use stable Requirement and Criterion IDs and are validated by the Mitase repository gate.
        governed_by: [POL-008#rule.governance, POL-009#rule.governance]

  - id: REQ-API-006
    title: Saved SQL CRUD
    description: The API exposes CRUD operations for saved SQL entries, including validation of SQL variable objects.
    priority: high
    status: implemented
    criteria:
      - id: saved-sql-lifecycle
        kind: behavior
        statement: The supported API and CLI surfaces create, retrieve, update, and delete saved SQL entries.
        governed_by: [POL-004#rule.governance, POL-005#rule.governance]
      - id: saved-sql-variable-validation
        kind: behavior
        statement: Saved SQL operations validate their SQL variable objects before persistence or execution.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: saved-sql-name-field
        kind: behavior
        statement: The saved-SQL display name is a normal optional Form field; nameless historical records remain valid without a table rewrite.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance, POL-007#rule.governance]
    bindings:
      - id: saved-sql-verification
        role: verification
        facet: verification
        responsibility: Verify saved SQL CRUD through the exact Iceberg integration case; CLI and adapter coverage remains a separate migration slice.
        targets:
          - id: iceberg-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_saved_sql.rs
            selector: { kind: test, name: test_saved_sql_req_api_006_crud }
            claims:
              - kind: verifies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
                covers:
                  - FEAT-API-001#binding.core/target.list-sql
                  - FEAT-API-001#binding.core/target.get-sql
                  - FEAT-API-001#binding.core/target.create-sql
                  - FEAT-API-001#binding.core/target.update-sql
                  - FEAT-API-001#binding.core/target.delete-sql
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_saved_sql, test: test_saved_sql_req_api_006_crud } }
      - id: name-field-verification
        role: verification
        facet: verification
        responsibility: Verify the saved-SQL name field and nameless historical records through the exact Iceberg integration case.
        targets:
          - id: name-field-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_saved_sql.rs
            selector: { kind: test, name: saved_sql_name_is_a_normal_field }
            claims:
              - kind: verifies
                criterion: REQ-API-006#criterion.saved-sql-name-field
                covers:
                  - FEAT-API-001#binding.core/target.list-sql
                  - FEAT-API-001#binding.core/target.get-sql
                  - FEAT-API-001#binding.core/target.create-sql
                  - FEAT-API-001#binding.core/target.update-sql
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_saved_sql, test: saved_sql_name_is_a_normal_field } }
      - id: cli-verification
        role: verification
        facet: verification
        responsibility: Verify the CLI saved SQL lifecycle and remote request contracts through exact integration cases.
        targets:
          - id: lifecycle
            adapter: rust
            path: crates/ugoite-cli/tests/test_saved_sql.rs
            selector: { kind: test, name: test_saved_sql_req_api_006_crud }
            claims:
              - kind: verifies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_saved_sql, test: test_saved_sql_req_api_006_crud } }
          - id: remote-create
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_saved_sql_create_req_api_006_uses_server_generated_id }
            claims:
              - kind: verifies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_saved_sql_create_req_api_006_uses_server_generated_id } }
          - id: remote-update
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_saved_sql_update_req_api_006_sends_parent_revision_without_author }
            claims:
              - kind: verifies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_saved_sql_update_req_api_006_sends_parent_revision_without_author } }

  - id: REQ-API-007
    title: Saved SQL template validation
    description: Saved SQL entries declare every {{variable_name}} template reference. Template execution is rejected until values are bound through DataFusion parameters; Ugoite never substitutes literal text into SQL.
    priority: high
    status: implemented
    criteria:
      - id: declared-template-bindings
        kind: behavior
        statement: Saved SQL validation requires every template reference to be declared before execution.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: parameterized-execution
        kind: security
        statement: SQL template values are bound through DataFusion parameters and are never substituted as literal SQL text.
        governed_by: [POL-001#rule.governance, POL-011#rule.governance]
    bindings:
      - id: template-verification
        role: verification
        facet: verification
        responsibility: Verify saved SQL template rejection through the exact Iceberg integration case; the CLI path remains explicitly unverified.
        targets:
          - id: iceberg-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_saved_sql.rs
            selector: { kind: test, name: test_saved_sql_req_api_007_validation_errors }
            claims:
              - kind: verifies
                criterion: REQ-API-007#criterion.declared-template-bindings
                covers: [FEAT-API-001#binding.core/target.create-sql]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_saved_sql, test: test_saved_sql_req_api_007_validation_errors } }

  - id: REQ-API-008
    title: SQL session query API
    description: The API creates SQL query sessions and exposes status, count, and paged rows. Session metadata persists one PublicationRef, result rows are evaluated from that fixed coordinate, and no stream endpoint is shipped.
    priority: high
    status: implemented
    criteria:
      - id: fixed-publication-coordinate
        kind: quality
        statement: A SQL session evaluates its result rows from the single PublicationRef persisted when the session is created.
        governed_by: [POL-001#rule.governance, POL-004#rule.governance]
      - id: paged-session-results
        kind: behavior
        statement: The API exposes SQL session status, count, and paged row reads without shipping a stream endpoint.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: read-only-authorized-execution
        kind: security
        statement: SQL session creation resolves only authorized Form relations and rejects non-read-only DDL or DML before a session is created.
        governed_by: [POL-001#rule.governance, POL-011#rule.governance, POL-012#rule.governance]
    bindings:
      - id: sql-session-verification
        role: verification
        facet: verification
        responsibility: Verify SQL session creation and fixed-coordinate pagination through the exact Iceberg integration cases.
        targets:
          - id: lifecycle-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_sql_sessions.rs
            selector: { kind: test, name: test_sql_sessions_req_api_008_end_to_end }
            claims:
              - kind: verifies
                criterion: REQ-API-008#criterion.fixed-publication-coordinate
                covers:
                  - FEAT-API-001#binding.core/target.create-sql-session
                  - FEAT-API-001#binding.core/target.get-sql-session-status
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_sql_sessions, test: test_sql_sessions_req_api_008_end_to_end } }
              - kind: verifies
                criterion: REQ-API-007#criterion.parameterized-execution
                covers: [FEAT-API-001#binding.core/target.create-sql-session]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_sql_sessions, test: test_sql_sessions_req_api_008_end_to_end } }
              - kind: verifies
                criterion: REQ-STO-012#criterion.lazy-path-boundary
                covers: [FEAT-API-001#binding.core/target.create-sql-session]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_sql_sessions, test: test_sql_sessions_req_api_008_end_to_end } }
          - id: pagination-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_sql_sessions.rs
            selector: { kind: test, name: test_sql_sessions_req_api_008_scopes_rows_before_limit }
            claims:
              - kind: verifies
                criterion: REQ-API-008#criterion.paged-session-results
                covers:
                  - FEAT-API-001#binding.core/target.count-sql-session
                  - FEAT-API-001#binding.core/target.rows-sql-session
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_sql_sessions, test: test_sql_sessions_req_api_008_scopes_rows_before_limit } }
          - id: read-only-dml-case
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::issue_2297_rest_sql_sessions_reject_non_read_only_dml_before_creation }
            claims:
              - kind: verifies
                criterion: REQ-API-008#criterion.read-only-authorized-execution
                covers: [FEAT-API-001#binding.core/target.create-sql-session]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::issue_2297_rest_sql_sessions_reject_non_read_only_dml_before_creation } }

  - id: REQ-API-009
    title: Sample data Space generation
    description: "The API is intended to provide a way to generate a sample-data Space from a small set of inputs: Space slug, scenario, Entry count, and seed. Backend REST exposure is currently unshipped; core implementation and tests remain retained for future re-exposure."
    priority: medium
    status: planned
    criteria:
      - id: sample-space-inputs
        kind: behavior
        statement: A future sample-data operation accepts Space slug, scenario, Entry count, and seed as explicit inputs.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance]

  - id: REQ-API-010
    title: Sample data scenarios and asynchronous jobs
    description: The API is intended to expose a catalog of sample-data scenarios and asynchronous sample-data generation jobs with status reporting. Backend REST exposure is currently unshipped.
    priority: medium
    status: planned
    criteria:
      - id: sample-job-lifecycle
        kind: behavior
        statement: A future sample-data API exposes scenario discovery and asynchronous generation job status.
        governed_by: [POL-002#rule.governance, POL-004#rule.governance]

  - id: REQ-API-011
    title: Portable user preferences API
    description: The API exposes authenticated GET /preferences/me and PATCH /preferences/me operations for portable user preferences, including selected Space and locale. selected_space_id inputs are validated and dependency failures are returned explicitly.
    priority: medium
    status: implemented
    criteria:
      - id: preferences-roundtrip
        kind: behavior
        statement: Authenticated callers can retrieve and patch the current user's portable preferences through the supported API operations.
        governed_by: [POL-004#rule.governance, POL-006#rule.governance]
      - id: selected-space-validation
        kind: behavior
        statement: Preference updates validate selected_space_id and return an explicit error when preference storage fails.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]

  - id: REQ-API-012
    title: MCP resource input safety
    description: MCP resource identifiers are validated with the shared safe-ID allowlist before authentication or storage calls. MCP resource descriptions warn that Entry content is untrusted user data and must never be treated as instructions.
    priority: high
    status: implemented
    criteria:
      - id: safe-resource-identifiers
        kind: security
        statement: MCP resource identifiers pass the shared safe-ID validation before authentication or storage access.
        governed_by: [POL-011#rule.governance, POL-015#rule.governance]
      - id: instruction-boundary
        kind: security
        statement: MCP resource descriptions distinguish untrusted Entry content from instructions.
        governed_by: [POL-010#rule.governance, POL-015#rule.governance]

  - id: REQ-API-013
    title: Current MCP surface documentation
    description: "Current-state MCP documentation describes the shipped v1 semantic facade: ugoite.search, ugoite.save, and authorized ugoite.delete, plus lazy stable Entry/Form resources. ugoite.save creates a structured Entry without id or updates one opaque Entry with id using form, fields, tags, and optional extra_attributes values; a declared Markdown Form field remains ordinary Markdown text and the Entry itself is never submitted as a Markdown document. Storage-specific routes, prompts, SQL, and revision tools remain future work."
    priority: medium
    status: implemented
    criteria:
      - id: shipped-mcp-facade
        kind: documentation
        statement: Current MCP documentation describes the shipped search, save, delete, and lazy Entry/Form resource facade and separates future capabilities.
        governed_by: [POL-015#rule.governance]

  - id: REQ-API-014
    title: Operator surface positioning guide
    description: Specification documentation positions MCP as the governed AI-facing operator surface, CLI as the explicit human and automation surface, and REST as the application and frontend integration surface. The small stable MCP v1 scope remains distinct from broader future capabilities.
    priority: medium
    status: implemented
    criteria:
      - id: surface-roles
        kind: documentation
        statement: The API documentation assigns distinct roles to MCP, CLI, and REST and preserves the stable MCP v1 boundary.
        governed_by: [POL-004#rule.governance, POL-005#rule.governance, POL-015#rule.governance]
  - id: REQ-API-015
    title: Stateless SQL query CLI
    description: The CLI exposes canonical read-only SQL page and count operations using the stateless SqlQuery contract in both local and remote mode.
    priority: high
    status: implemented
    criteria:
      - id: canonical-sql-page
        kind: behavior
        statement: '`ugoite sql query` submits SqlQueryRequest with SQL, parameters, limit, and optional continuation and returns the canonical page envelope.'
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: canonical-sql-count
        kind: behavior
        statement: '`ugoite sql count` submits a separate SqlQueryCountRequest and returns an explicit count without coupling it to page retrieval.'
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: local-remote-parity
        kind: quality
        statement: Local and remote CLI SQL operations use the same canonical request and response DTOs.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
      - id: ordered-pagination
        kind: security
        statement: A SQL page that exceeds its limit must have an explicit ORDER BY; unordered results are rejected instead of silently discarding rows or issuing an unsafe continuation.
        governed_by: [POL-004#rule.governance, POL-008#rule.governance]
    bindings:
      - id: cli-verification
        role: verification
        facet: verification
        responsibility: Verify canonical stateless SQL page and count routing plus local execution through exact CLI integration cases.
        targets:
          - id: remote-page
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_sql_query_uses_stateless_route_and_dto }
            claims:
              - kind: verifies
                criterion: REQ-API-015#criterion.canonical-sql-page
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_sql_query_uses_stateless_route_and_dto } }
              - kind: verifies
                criterion: REQ-API-015#criterion.local-remote-parity
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_sql_query_uses_stateless_route_and_dto } }
          - id: remote-count
            adapter: rust
            path: crates/ugoite-cli/tests/test_cli_endpoint_routing.rs
            selector: { kind: test, name: test_sql_query_count_uses_separate_stateless_route }
            claims:
              - kind: verifies
                criterion: REQ-API-015#criterion.canonical-sql-count
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_cli_endpoint_routing, test: test_sql_query_count_uses_separate_stateless_route } }
          - id: local-page-and-count
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_core.rs
            selector: { kind: test, name: test_cli_sql_query_and_count_use_stateless_local_contract }
            claims:
              - kind: verifies
                criterion: REQ-API-015#criterion.canonical-sql-page
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_cli_sql_query_and_count_use_stateless_local_contract } }
              - kind: verifies
                criterion: REQ-API-015#criterion.canonical-sql-count
                covers: [FEAT-API-001#binding.cli-implementation/target.sql-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_journey_core, test: test_cli_sql_query_and_count_use_stateless_local_contract } }
      - id: backend-verification
        role: verification
        facet: verification
        responsibility: Verify that unordered SQL results exceeding a page limit are rejected instead of silently truncated.
        targets:
          - id: ordered-pagination
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: authentication_regression_tests::stateless_sql_query_pins_publication_and_separates_count }
            claims:
              - kind: verifies
                criterion: REQ-API-015#criterion.canonical-sql-page
                covers: [FEAT-API-001#binding.backend-implementation/target.query-sql]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::stateless_sql_query_pins_publication_and_separates_count } }
              - kind: verifies
                criterion: REQ-API-015#criterion.canonical-sql-count
                covers: [FEAT-API-001#binding.backend-implementation/target.count-sql]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::stateless_sql_query_pins_publication_and_separates_count } }
              - kind: verifies
                criterion: REQ-API-015#criterion.ordered-pagination
                covers: [FEAT-API-001#binding.backend-implementation/target.query-sql]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::stateless_sql_query_pins_publication_and_separates_count } }
