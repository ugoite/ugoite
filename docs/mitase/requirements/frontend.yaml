  - id: REQ-FE-062
    title: Saved SQL Detail Route Actions
    description: The saved SQL detail route loads and presents the saved query text and metadata, then exposes a stateless variable-free result flow or the variable-input flow.
    priority: medium
    status: implemented
    criteria:
      - id: detail-summary
        kind: behavior
        statement: The saved SQL detail route displays the saved query name, timestamps, variables, and query text. For user-query entries it allows the saved query name and SQL body to be edited; search-history entries remain read-only.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: supported-actions
        kind: behavior
        statement: A variable-free saved query uses the canonical stateless SQL query API and routes to SQL results, while a query with variables links to the existing variable-input flow.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: revision-aware-save
        kind: behavior
        statement: Saving a user-query edit derives variables from the SQL body and uses the currently loaded revision as the optimistic concurrency base, then uses the returned revision for subsequent saves. Search-history entries remain read-only.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: delete
        kind: behavior
        statement: The saved SQL detail route requires the shared destructive confirmation before deleting a user-query entry and returns to the Saved SQL list after a successful deletion. Search-history entries remain read-only.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: search-history-read-only
        kind: behavior
        statement: Search-history entries remain read-only in the Saved SQL detail route, which retains their derived display label and does not expose saved-query editing or deletion actions.
