  - id: REQ-FE-065
    title: Searchable Row Reference Picker
    description: Create-entry flows for row_reference fields let users search and choose target-form entries by human-readable metadata while storing the stable referenced entry_id and blocking submission until a typed search is resolved to a saved target entry.
    priority: medium
    status: implemented
    criteria:
      - id: search-and-store
        kind: behavior
        statement: Web and chat create-entry modes let users search a target Form and store the selected stable entry_id rather than the display label.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: submission-guard
        kind: security
        statement: A row_reference search that has not been resolved to a selected target entry blocks web and chat submission.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: bounded-lookup
        kind: behavior
        statement: Row-reference lookup requests are scoped to the target Form, use the bounded picker limit, omit blank keyword queries, and surface backend failures to the picker.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: protocol-binding
        kind: behavior
        statement: Row-reference lookup protocol requests preserve the immutable Space ID and encode the target Form, limit, and optional keyword as the supported entry.options request.
