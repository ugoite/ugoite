schema: mitase/spec/v1
kind: requirements
namespace: search
category: Search behavior and discoverability
requirements:
  - id: REQ-SRCH-001
    title: Keyword search
    description: Users must be able to search entries by keyword.
    priority: high
    status: implemented
    criteria:
      - id: keyword-search
        kind: behavior
        statement: Users can search current authorized entries by keyword and receive matching entry summaries.
        governed_by: [POL-012#rule.governance, POL-011#rule.governance, POL-016#rule.governance]
      - id: http-search-operation
        kind: behavior
        statement: The Search HTTP operation enforces Space read authorization and returns matching Entry summaries through the documented route.
        governed_by: [POL-004#rule.governance, POL-011#rule.governance, POL-012#rule.governance, POL-016#rule.governance]
    bindings:
      - id: keyword-test
        role: verification
        facet: verification
        responsibility: Verify keyword search behavior through the existing exact Iceberg integration test.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_search.rs
            selector: { kind: test, name: test_search_req_srch_001_keyword_search }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-001#criterion.keyword-search
                covers: [FEAT-SRCH-001#binding.core/target.search-entries]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_search, test: test_search_req_srch_001_keyword_search } }
  - id: REQ-SRCH-002
    title: Content-scan search implementation
    description: Keyword search scans current Entry rows and the authorized AssetText projection. AssetText is an internal derived Iceberg relation; missing, stale, or corrupt derived state degrades to native Entry search. A persistent inverted index is still absent.
    priority: medium
    status: implemented
    criteria:
      - id: current-entry-scan
        kind: behavior
        statement: Keyword search scans current Entry content for matching keywords.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: authorized-assettext-projection
        kind: behavior
        statement: Keyword search includes matching content from the authorized AssetText projection.
        governed_by: [POL-012#rule.governance, POL-011#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: missing-derived-fallback
        kind: behavior
        statement: Search falls back to native current Entry search when the AssetText projection is missing.
        governed_by: [POL-012#rule.governance, POL-011#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: stale-derived-fallback
        kind: behavior
        statement: Search falls back to native current Entry search when the AssetText projection is stale.
        governed_by: [POL-012#rule.governance, POL-011#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: corrupt-derived-fallback
        kind: behavior
        statement: Search falls back to native current Entry search when the AssetText projection is corrupt or unavailable.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
    bindings:
      - id: content-scan-test
        role: verification
        facet: verification
        responsibility: Verify current Entry content scanning, authorized AssetText projection, and missing, stale, and corrupt derived-state fallback behavior through the exact domain and integration tests.
        targets:
          - id: case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_search.rs
            selector: { kind: test, name: test_search_req_srch_002_fallback_scan }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-002#criterion.current-entry-scan
                covers: [FEAT-SRCH-001#binding.core/target.search-entries]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_search, test: test_search_req_srch_002_fallback_scan } }
              - kind: verifies
                criterion: REQ-SRCH-002#criterion.missing-derived-fallback
                covers: [FEAT-SRCH-001#binding.core/target.search-entries]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_search, test: test_search_req_srch_002_fallback_scan } }
          - id: stale-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_search.rs
            selector: { kind: test, name: test_search_req_srch_002_stale_derived_fallback }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-002#criterion.stale-derived-fallback
                covers: [FEAT-SRCH-001#binding.core/target.search-entries]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_search, test: test_search_req_srch_002_stale_derived_fallback } }
          - id: corrupt-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_search.rs
            selector: { kind: test, name: test_search_req_srch_002_corrupt_derived_fallback }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-002#criterion.corrupt-derived-fallback
                covers: [FEAT-SRCH-001#binding.core/target.search-entries]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_search, test: test_search_req_srch_002_corrupt_derived_fallback } }
  - id: REQ-SRCH-003
    title: Ugoite SQL lint and completion rules
    description: The system MUST provide shared Ugoite SQL linting and completion rules for UI and CLI usage, sourced from a common config in the project root.
    priority: medium
    status: implemented
    criteria:
      - id: sql-rules
        kind: behavior
        statement: Shared SQL linting and completion rules are available to UI and CLI surfaces from common project configuration.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
  - id: REQ-SRCH-004
    title: Keyword-first search route
    description: The /spaces/{space_id}/search route MUST present direct keyword entry search as the default experience so users can find entries without first managing saved queries or writing SQL.
    priority: high
    status: implemented
    criteria:
      - id: keyword-first-route
        kind: behavior
        statement: The Search route presents direct keyword search as the default experience.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: no-prerequisite-query-management
        kind: behavior
        statement: Direct keyword search is usable without requiring users to create saved queries or write SQL first.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
    bindings:
      - id: frontend-test
        role: verification
        facet: verification
        responsibility: Verify the keyword-first Search route through the exact frontend test.
        targets:
          - id: case
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/search.test.tsx
            selector: { kind: test, name: 'REQ-SRCH-004: runs a direct keyword search and renders matching entries' }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-004#criterion.keyword-first-route
                covers:
                  - FEAT-SRCH-001#binding.frontend/target.search-api
                  - FEAT-SRCH-001#binding.frontend/target.search-route
                runner: { runner: frontend-vitest, arguments: { test: "REQ-SRCH-004: runs a direct keyword search and renders matching entries" } }
  - id: REQ-SRCH-005
    title: Structured search reuse through shared query infrastructure
    description: The search route MUST offer advanced structured conditions that compile into the shared SQL or query execution path, and advanced searches MUST remain reusable from a human-readable search-history UI instead of exposing raw query management as the primary workflow.
    priority: high
    status: implemented
    criteria:
      - id: structured-search-reuse
        kind: behavior
        statement: Advanced search compiles structured conditions into the shared query path and keeps the resulting search reusable through human-readable history.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: history-not-raw-query-workflow
        kind: behavior
        statement: Search history remains human-readable and reusable without making raw query management the primary workflow.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
    bindings:
      - id: frontend-test
        role: verification
        facet: verification
        responsibility: Verify advanced Search compilation and human-readable history reuse through exact frontend tests.
        targets:
          - id: compile-case
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/search.test.tsx
            selector: { kind: test, name: 'REQ-SRCH-005: advanced search compiles filters into saved SQL and runs a shared session' }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-005#criterion.structured-search-reuse
                covers:
                  - FEAT-SRCH-001#binding.frontend/target.search-route
                  - FEAT-SRCH-001#binding.frontend/target.advanced-query-builder
                runner: { runner: frontend-vitest, arguments: { test: "REQ-SRCH-005: advanced search compiles filters into saved SQL and runs a shared session" } }
          - id: history-case
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/search.test.tsx
            selector: { kind: test, name: 'REQ-SRCH-005: saved history entries rerun directly or open variable input when needed' }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-005#criterion.structured-search-reuse
                covers: [FEAT-SRCH-001#binding.frontend/target.search-route]
                runner: { runner: frontend-vitest, arguments: { test: "REQ-SRCH-005: saved history entries rerun directly or open variable input when needed" } }
  - id: REQ-SRCH-006
    title: Structured query operation
    description: Users and operators can submit a structured query for a Space and receive the matching results through the supported Ugoite interfaces.
    priority: high
    status: implemented
    criteria:
      - id: query-operation
        kind: behavior
        statement: The structured query operation accepts its documented request shape and returns a result set for the selected Space.
        governed_by: [POL-012#rule.governance, POL-014#rule.governance, POL-016#rule.governance]
      - id: core-query-execution
        kind: behavior
        statement: The core query path executes structured filters and SQL payloads against Form relations, including self-joins.
        governed_by: [POL-001#rule.governance, POL-012#rule.governance, POL-014#rule.governance]
    bindings:
      - id: query-verification
        role: verification
        facet: verification
        responsibility: Verify the canonical core query entry point through exact structured-query, SQL-filter, and SQL-self-join integration cases.
        targets:
          - id: structured-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_index.rs
            selector: { kind: test, name: test_index_req_idx_003_query_index }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.query-operation
                covers: [FEAT-SRCH-001#binding.core/target.query-index]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_003_query_index } }
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.core-query-execution
                covers: [FEAT-SRCH-001#binding.core/target.query-index]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_003_query_index } }
          - id: sql-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_index.rs
            selector: { kind: test, name: test_index_req_idx_008_query_sql }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.query-operation
                covers: [FEAT-SRCH-001#binding.core/target.query-index]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_008_query_sql } }
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.core-query-execution
                covers: [FEAT-SRCH-001#binding.core/target.query-index]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_008_query_sql } }
          - id: join-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_index.rs
            selector: { kind: test, name: test_index_req_idx_009_query_sql_joins }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.query-operation
                covers: [FEAT-SRCH-001#binding.core/target.query-index]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_009_query_sql_joins } }
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.core-query-execution
                covers: [FEAT-SRCH-001#binding.core/target.query-index]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_009_query_sql_joins } }
          - id: cli-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_indexer.rs
            selector: { kind: test, name: test_query_index }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-006#criterion.query-operation
                covers: [FEAT-SRCH-001#binding.cli-implementation/target.query-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_indexer, test: test_query_index } }
  - id: REQ-SRCH-007
    title: Derived relation maintenance
    description: The index operator surface rebuilds the current AssetText DerivedRelation from authoritative Entry references, while derived parsing and word-count helpers remain separate concerns.
    priority: high
    status: implemented
    criteria:
      - id: derived-rebuild
        kind: behavior
        statement: An explicit index rebuild publishes the current AssetText DerivedRelation without creating a legacy ad-hoc index file.
        governed_by: [POL-001#rule.governance, POL-002#rule.governance, POL-012#rule.governance, POL-014#rule.governance]
      - id: derived-boundary
        kind: quality
        statement: AssetText rebuild keeps the current derived relation distinct from a persistent inverted-index artifact.
        governed_by: [POL-001#rule.governance, POL-012#rule.governance, POL-014#rule.governance]
      - id: word-count-separation
        kind: quality
        statement: Word counts are computed by a shared pure text helper independently of derived-relation rebuild orchestration.
        governed_by: [POL-002#rule.governance, POL-012#rule.governance, POL-014#rule.governance]
    bindings:
      - id: derived-verification
        role: verification
        facet: verification
        responsibility: Verify derived-relation publication, the absence of legacy inverted-index files, and the separation of rebuild and word-count helpers through exact Rust integration cases.
        targets:
          - id: rebuild-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_index.rs
            selector: { kind: test, name: test_index_req_idx_001_reindex_writes_index_files }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.derived-rebuild
                covers: [FEAT-SRCH-001#binding.derived/target.reindex]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_001_reindex_writes_index_files } }
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.derived-boundary
                covers: [FEAT-SRCH-001#binding.derived/target.reindex]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_001_reindex_writes_index_files } }
          - id: no-inverted-index-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_index.rs
            selector: { kind: test, name: test_index_req_idx_004_inverted_index_generation }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.derived-boundary
                covers: [FEAT-SRCH-001#binding.derived/target.reindex]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_004_inverted_index_generation } }
          - id: cli-rebuild-case
            adapter: rust
            path: crates/ugoite-cli/tests/test_indexer.rs
            selector: { kind: test, name: test_indexer_run_once }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.derived-rebuild
                covers: [FEAT-SRCH-001#binding.cli-implementation/target.index-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_indexer, test: test_indexer_run_once } }
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.derived-boundary
                covers: [FEAT-SRCH-001#binding.cli-implementation/target.index-command]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-cli, harness: test_indexer, test: test_indexer_run_once } }
          - id: word-count-case
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_index.rs
            selector: { kind: test, name: test_index_req_idx_005_word_count }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.word-count-separation
                covers: [FEAT-SRCH-001#binding.derived/target.word-count]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_index, test: test_index_req_idx_005_word_count } }
          - id: portable-word-count-case
            adapter: rust
            path: crates/ugoite-domain/tests/test_text.rs
            selector: { kind: test, name: test_text_req_idx_005_word_count_portable }
            claims:
              - kind: verifies
                criterion: REQ-SRCH-007#criterion.word-count-separation
                covers: [FEAT-SRCH-001#binding.derived/target.word-count]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-domain, harness: test_text, test: test_text_req_idx_005_word_count_portable } }
  - id: REQ-SRCH-008
    title: Future incremental index maintenance
    description: A persistent inverted index and a durable watch loop remain future capabilities. The current product uses explicit AssetText rebuilds and does not claim either capability.
    priority: low
    status: planned
    criteria:
      - id: persistent-inverted-index
        kind: behavior
        statement: A persistent inverted index is not part of the current Search product boundary and requires a future explicit design decision.
        governed_by: [POL-002#rule.governance, POL-012#rule.governance, POL-014#rule.governance]
      - id: watch-loop
        kind: operational
        statement: A durable incremental watch loop is future work; current derived maintenance is initiated explicitly by the index command.
        governed_by: [POL-003#rule.governance, POL-005#rule.governance, POL-012#rule.governance]
