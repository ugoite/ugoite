schema: mitase/authoring/v2
kind: requirements
namespace: ux
category: Interaction structure, list, localization, responsive, and restore baselines (PR-1, no UI change)
requirements:
  - id: REQ-UX-NAV-001
    title: Single Back Control With Single Context and Single Shell
    description: Surfaces expose exactly one operative back control in the back chain, state their Space, Form, or Entry context once, and inherit navigation from the designated global and Space shells without parallel route-level navigation chrome.
    priority: high
    status: planned
    criteria:
      - id: single-back-control
        kind: behavior
        statement: Each surface exposes exactly one operative back control in its back chain; the same back intent is not duplicated across links or buttons on the same surface.
        governed_by: [POL-UI-001#rule.governance]
      - id: no-duplicate-context
        kind: behavior
        statement: A surface states its Space, Form, or Entry context once and does not repeat the same identity in a competing header or subtitle on the same surface.
        governed_by: [POL-UI-002#rule.governance]
      - id: single-shell-ownership
        kind: behavior
        statement: Navigation controls live in the designated global and Space shells; routes do not add parallel navigation chrome duplicating shell destinations.
        governed_by: [POL-UI-011#rule.governance]
    bindings:
      - id: back-control-verification
        role: verification
        facet: verification
        responsibility: Verify each nested Entry, SQL, and Form surface exposes exactly one positional back control through exact Vitest cases, including the Info and saved-SQL detail routes.
        targets:
          - id: back-link-label
            adapter: typescript
            path: frontend/src/components/BackLink.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: renders a positional back label with the destination as accessible name and tooltip" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.back-link-control]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/BackLink.test.tsx, test: "REQ-UX-NAV-001: renders a positional back label with the destination as accessible name and tooltip" } }
          - id: back-link-ja-label
            adapter: typescript
            path: frontend/src/components/BackLink.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: uses the Japanese short label" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.back-link-control]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/BackLink.test.tsx, test: "REQ-UX-NAV-001: uses the Japanese short label" } }
          - id: history-single-back
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: exposes exactly one back control to the entry" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.entry-history-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx", test: "REQ-UX-NAV-001: exposes exactly one back control to the entry" } }
          - id: revision-single-back
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/[entry_id]/history/[revision_id].test.tsx"
            selector: { kind: test, name: "REQ-UX-NAV-001: exposes exactly one back control to history" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.entry-revision-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/[revision_id].test.tsx", test: "REQ-UX-NAV-001: exposes exactly one back control to history" } }
          - id: space-history-settings-back
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/history.test.tsx
            selector: { kind: test, name: "PR6: reaches space history from Settings and backs to Settings only" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.back-link-control]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/history.test.tsx", test: "PR6: reaches space history from Settings and backs to Settings only" } }
          - id: sql-new-single-back
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/queries/new.test.tsx
            selector: { kind: test, name: "PR6: backs to Saved SQL once and reports diagnostics with line and column" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.back-link-control]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/queries/new.test.tsx", test: "PR6: backs to Saved SQL once and reports diagnostics with line and column" } }
          - id: sql-variables-single-back
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/queries/[query_id]/variables.test.tsx"
            selector: { kind: test, name: "PR6: backs to the saved query once with typed variable inputs" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.back-link-control]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/queries/[query_id]/variables.test.tsx", test: "PR6: backs to the saved query once with typed variable inputs" } }
          - id: info-single-back
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/entries/[entry_id]/info.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: exposes exactly one back control to the entry" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.entry-info-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/info.test.tsx", test: "REQ-UX-NAV-001: exposes exactly one back control to the entry" } }
          - id: sql-detail-single-back
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/sql/[sql_id].test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: exposes exactly one back control to saved SQL" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.sql-detail-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/sql/[sql_id].test.tsx", test: "REQ-UX-NAV-001: exposes exactly one back control to saved SQL" } }
          - id: form-types-single-back
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/forms/types.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: exposes exactly one back control to forms" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.form-types-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/forms/types.test.tsx", test: "REQ-UX-NAV-001: exposes exactly one back control to forms" } }
      - id: single-context-verification
        role: verification
        facet: verification
        responsibility: Verify the Space index, dashboard, auth, and form family surfaces state their context once with no competing header through exact Vitest cases.
        targets:
          - id: join-single-context
            adapter: typescript
            path: frontend/src/routes/spaces/join.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: states the join context once without a competing title" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.join-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/spaces/join.test.tsx, test: "REQ-UX-NAV-001: states the join context once without a competing title" } }
          - id: setup-single-context
            adapter: typescript
            path: frontend/src/routes/setup.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: states the setup task once with a one-line onboarding note" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.setup-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/setup.test.tsx, test: "REQ-UX-NAV-001: states the setup task once with a one-line onboarding note" } }
          - id: form-types-single-context
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/forms/types.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: states the form context once without a competing header" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
                covers: [FEAT-UX-007#binding.back-control-implementation/target.form-types-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/forms/types.test.tsx", test: "REQ-UX-NAV-001: states the form context once without a competing header" } }
          - id: dashboard-single-context
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/dashboard.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: states the Space context once without a competing header" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
                covers: [FEAT-UX-001#binding.navigation-baseline/target.space-dashboard-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/dashboard.test.tsx", test: "REQ-UX-NAV-001: states the Space context once without a competing header" } }
          - id: spaces-index-single-context
            adapter: typescript
            path: frontend/src/routes/spaces/index.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: states the Spaces context once without a competing title" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
                covers: [FEAT-UX-001#binding.navigation-baseline/target.spaces-index-route]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/spaces/index.test.tsx, test: "REQ-UX-NAV-001: states the Spaces context once without a competing title" } }
      - id: shell-ownership-verification
        role: verification
        facet: verification
        responsibility: Verify the global shell owns the single Spaces destination with no parallel About chrome through exact Vitest cases.
        targets:
          - id: global-shell-spaces-only
            adapter: typescript
            path: frontend/src/components/GlobalShell.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: keeps global navigation limited to Spaces without an About entry" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
                covers: [FEAT-UX-005#binding.responsive-baseline/target.global-shell-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/GlobalShell.test.tsx, test: "REQ-UX-NAV-001: keeps global navigation limited to Spaces without an About entry" } }
          - id: global-shell-router-spaces-only
            adapter: typescript
            path: frontend/src/components/GlobalShell.navigation.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: exposes only Spaces in global navigation" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
                covers: [FEAT-UX-005#binding.responsive-baseline/target.global-shell-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/GlobalShell.navigation.test.tsx, test: "REQ-UX-NAV-001: exposes only Spaces in global navigation" } }
  - id: REQ-UX-ENTRY-001
    title: Entry Workspace Without Decoration
    description: The Entry workspace uses plain structure for explanation and metadata, reserves card containers for actionable or selectable groupings, renders explicit async states, and derives editor guidance from the active Form without inventing field headings.
    priority: high
    status: planned
    criteria:
      - id: no-decorative-cards
        kind: behavior
        statement: Card containers appear only when they group an operative action or a distinct selectable record; static explanation or metadata uses plain structure without card chrome.
        governed_by: [POL-UI-003#rule.governance]
      - id: explicit-async-states
        kind: behavior
        statement: Asynchronous Entry list and detail surfaces render explicit loading, empty, and error states instead of silent blank output.
        governed_by: [POL-UI-009#rule.governance]
      - id: form-derived-guidance
        kind: behavior
        statement: Editor guidance derives from the active Form fields and explains unstructured Forms without fabricating field headings or examples.
        governed_by: [POL-UI-010#rule.guidance]
    bindings:
      - id: entry-list-slice-verification
        role: verification
        facet: verification
        responsibility: Verify the Entry list first slice (positional back link with list-adjacent create action) through exact Vitest cases.
        targets:
          - id: entry-scoped-back-create
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/index.test.tsx"
            selector: { kind: test, name: "REQ-UX-ENTRY-001: renders form-scoped entries with a positional back link and list-adjacent create action" }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
                covers: [FEAT-UX-008#binding.row-list-implementation/target.entries-index-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/index.test.tsx", test: "REQ-UX-ENTRY-001: renders form-scoped entries with a positional back link and list-adjacent create action" } }
      - id: entry-save-state-verification
        role: verification
        facet: verification
        responsibility: Verify PR-4 entry detail save states announce without layout shift and confirm transiently (no permanent saved chip) through exact Vitest cases.
        targets:
          - id: entry-save-announcement
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.test.tsx
            selector: { kind: test, name: "PR4: announces saving without layout shift and toasts success transiently" }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-001#criterion.explicit-async-states
                covers: [FEAT-UX-002#binding.entry-baseline/target.entry-detail-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/EntryDetailPane.test.tsx, test: "PR4: announces saving without layout shift and toasts success transiently" } }
      - id: form-dialog-structure-verification
        role: verification
        facet: verification
        responsibility: Verify PR-7 form create/edit dialogs render fields as plain FieldStack rows without card sections and derive editor guidance from the active Form through exact Vitest cases.
        targets:
          - id: create-field-stack-rows
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-UX-ENTRY-001: renders create-form fields as plain FieldStack rows without card sections" }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.form-dialog-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-UX-ENTRY-001: renders create-form fields as plain FieldStack rows without card sections" } }
          - id: edit-field-stack-rows
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-UX-ENTRY-001: renders edit-form fields as plain FieldStack rows without card sections" }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.form-dialog-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-UX-ENTRY-001: renders edit-form fields as plain FieldStack rows without card sections" } }
          - id: field-stack-primitive-rows
            adapter: typescript
            path: frontend/src/components/FieldStack.test.tsx
            selector: { kind: test, name: "REQ-UX-ENTRY-001: renders field editors as plain list rows without card chrome" }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.form-dialog-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/FieldStack.test.tsx, test: "REQ-UX-ENTRY-001: renders field editors as plain list rows without card chrome" } }
          - id: entry-guidance-derived
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-053: renders English entry guidance across input modes" }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-001#criterion.form-derived-guidance
                covers: [FEAT-UX-009#binding.auth-form-implementation/target.form-dialog-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-053: renders English entry guidance across input modes" } }
  - id: REQ-UX-LIST-001
    title: List Rows With Full-Row Activation and Advanced-Only Identifiers
    description: Selectable list rows activate across the full row without a separate boxed chevron, and raw UUIDs or internal identifiers appear only inside explicitly advanced or diagnostic disclosure while primary rows show human-meaningful names.
    priority: high
    status: planned
    criteria:
      - id: full-row-activation
        kind: behavior
        statement: Selectable rows activate across the full row and do not add a separate boxed chevron control duplicating the row activation.
        governed_by: [POL-UI-006#rule.governance]
      - id: uuids-advanced-only
        kind: behavior
        statement: Primary rows show human-meaningful names while raw UUIDs and internal identifiers appear only inside explicitly advanced or diagnostic disclosure.
        governed_by: [POL-UI-005#rule.governance]
    bindings:
      - id: row-list-verification
        role: verification
        facet: verification
        responsibility: Verify full-row activation and advanced-only identifiers through exact Vitest cases.
        targets:
          - id: rowlist-full-row
            adapter: typescript
            path: frontend/src/components/RowList.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: activates the full row without a boxed chevron or Open column" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/RowList.test.tsx, test: "REQ-UX-LIST-001: activates the full row without a boxed chevron or Open column" } }
          - id: rowlist-secondary-action
            adapter: typescript
            path: frontend/src/components/RowList.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: keeps secondary actions from triggering row activation" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/RowList.test.tsx, test: "REQ-UX-LIST-001: keeps secondary actions from triggering row activation" } }
          - id: rowlist-keyboard
            adapter: typescript
            path: frontend/src/components/RowList.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: exposes keyboard-operable rows with accessible names and visible focus" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/RowList.test.tsx, test: "REQ-UX-LIST-001: exposes keyboard-operable rows with accessible names and visible focus" } }
          - id: spaces-full-row
            adapter: typescript
            path: frontend/src/routes/spaces/index.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: opens spaces through full-row links with an unboxed secondary settings action" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.spaces-route]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/spaces/index.test.tsx, test: "REQ-UX-LIST-001: opens spaces through full-row links with an unboxed secondary settings action" } }
          - id: entry-rows-compact
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/index.test.tsx"
            selector: { kind: test, name: "REQ-UX-LIST-001: renders entry rows without type chips and with compact right-meta dates" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.entries-index-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/index.test.tsx", test: "REQ-UX-LIST-001: renders entry rows without type chips and with compact right-meta dates" } }
      - id: history-row-verification
        role: verification
        facet: verification
        responsibility: Verify PR-4 entry-history rows render through RowList with full-row activation and actor display names (raw UUIDs only in advanced disclosure) through exact Vitest cases.
        targets:
          - id: history-rows-rowlist
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx"
            selector: { kind: test, name: "PR4: renders history rows through RowList with full-row activation" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx", test: "PR4: renders history rows through RowList with full-row activation" } }
          - id: history-actor-display
