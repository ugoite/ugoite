                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx", test: "REQ-UX-ENTRY-002: resolves actor UUIDs to member display names and never shows raw UUIDs in rows" } }
          - id: history-actor-fallback
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx"
            selector: { kind: test, name: "REQ-UX-ENTRY-002: falls back to a stable short actor form when the directory cannot resolve" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx", test: "REQ-UX-ENTRY-002: falls back to a stable short actor form when the directory cannot resolve" } }
          - id: actor-view-model-display
            adapter: typescript
            path: frontend/src/lib/entry-history.test.ts
            selector: { kind: test, name: "REQ-UX-ENTRY-002: resolves an actor UUID fixture to the member display name" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-008#binding.row-list-implementation/target.row-list-primitive]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/entry-history.test.ts, test: "REQ-UX-ENTRY-002: resolves an actor UUID fixture to the member display name" } }
          - id: actor-view-model-short
            adapter: typescript
            path: frontend/src/lib/entry-history.test.ts
            selector: { kind: test, name: "REQ-UX-ENTRY-002: keeps short human-meaningful actor values as-is" }
