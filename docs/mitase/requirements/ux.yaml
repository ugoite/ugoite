schema: mitase/authoring/v2
kind: requirements
namespace: ux
category: Interaction structure, list, localization, responsive, and restore baselines (PR-1, no UI change)
requirements:
  - id: REQ-UX-NAV-001
    title: Single Back Control With Single Context and Single Shell
    description: Surfaces expose exactly one operative back control in the back chain, state their Space, Form, or Entry context once, and inherit navigation from the designated global and Space shells without parallel route-level navigation chrome.
    priority: high
    status: planned
    criteria:
      - id: single-back-control
        kind: behavior
        statement: Each surface exposes exactly one operative back control in its back chain; the same back intent is not duplicated across links or buttons on the same surface.
        governed_by: [POL-UI-001#rule.governance]
      - id: back-control-presentation
        kind: behavior
        statement: When the page context already establishes its hierarchical destination, the shared back control presents a 44px circular chevron-left link without visible Back copy and keeps the destination-specific localized name available to assistive technology and on hover.
        governed_by: [POL-UI-001#rule.governance, POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: back-control-leading-position
        kind: behavior
        statement: Each nested surface places its single back control first at the leading edge of the page header, before the page title or other header content.
        governed_by: [POL-UI-001#rule.governance, POL-UI-002#rule.governance]
      - id: no-duplicate-context
        kind: behavior
        statement: Each piece of information on a surface has one visible owner. Context established by shell navigation, a heading, a selected object, or a field label is not restated by another heading, eyebrow, explanation, placeholder, action label, or shortcut; a second presentation is appropriate only when it communicates a distinct operation, state, or subject.
        governed_by: [POL-UI-002#rule.governance]
      - id: single-shell-ownership
        kind: behavior
        statement: The global shell exposes only the Spaces destination without parallel entries, and Space shells own Space navigation; routes add no parallel navigation chrome duplicating shell destinations.
        governed_by: [POL-UI-011#rule.governance]
    bindings:
      - id: back-control-verification
        role: verification
        facet: verification
        responsibility: Verify the shared icon-only back presentation preserves the localized destination name, tooltip, focus ring, and 44px target, and nested surfaces expose exactly one back control through exact Vitest cases.
