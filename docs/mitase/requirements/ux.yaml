  - id: REQ-UX-DISMISS-001
    title: Compact Dismiss Controls
    description: Dialog and inline error dismissals use compact named controls while preserving the content and existing dismissal behavior.
    priority: medium
    status: planned
    criteria:
      - id: close-control-presentation
        kind: behavior
        statement: Dismiss controls use the shared 44px icon-only button with a visible keyboard focus ring and a localized accessible name; close actions use the close icon and stay distinct from hierarchical back navigation.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: history-detail-dismissal
        kind: behavior
        statement: The Space History detail dialog closes through the shared close control while retaining Escape and backdrop dismissal, focus trapping, and focus return to the opener.
        governed_by: [POL-UI-007#rule.governance]
      - id: inline-error-dismissal
        kind: behavior
        statement: The dismissible FormTable error alert exposes the error content and clears only that alert when its close control is activated.
