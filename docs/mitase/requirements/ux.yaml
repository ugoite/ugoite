          - id: back-link-label
            adapter: typescript
            path: frontend/src/components/BackLink.test.tsx
            selector: { kind: test, name: "REQ-UX-NAV-001: renders the destination-named icon-only positional control" }
            claims:
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
                covers: [FEAT-UX-007#binding.back-control-implementation/target.back-link-control]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/BackLink.test.tsx, test: "REQ-UX-NAV-001: renders the destination-named icon-only positional control" } }
              - kind: verifies
                criterion: REQ-UX-NAV-001#criterion.back-control-presentation
