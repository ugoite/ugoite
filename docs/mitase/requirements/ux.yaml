            path: "frontend/src/routes/spaces/[space_id]/entries/[entry_id]/history/index.test.tsx"
            selector: { kind: test, name: "REQ-UX-ENTRY-002: resolves actor UUIDs to member display names and never shows raw UUIDs in rows" }
            claims:
