  - id: REQ-UX-PAGINATION-001
    title: Compact Result Pagination
    description: Paged-result navigation uses compact localized directional controls while page ownership remains with the calling controller or route.
    priority: medium
    status: planned
    criteria:
      - id: directional-control-presentation
        kind: behavior
        statement: Previous and Next navigation presents a 44px icon-only chevron-left or chevron-right with a localized accessible name and matching title.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: paging-state
        kind: behavior
        statement: An unavailable direction is disabled, busy results disable both directions, and a single-page result exposes no pagination navigation.
        governed_by: [POL-UI-007#rule.governance]
      - id: surface-owner-behavior
        kind: behavior
        statement: FormTable and Space History detail delegate page availability and changes to their existing controller or cursor operations; history loading is announced in a separate status.
        governed_by: [POL-UI-007#rule.governance]
    bindings:
      - id: pagination-verification
        role: verification
        facet: verification
        responsibility: Verify localized icon controls, target size, busy and single-page states, and unchanged FormTable and Space History paging ownership through exact frontend cases.
