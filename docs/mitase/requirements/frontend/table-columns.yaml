schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Form-backed table columns
requirements:
  - id: REQ-FE-075
    title: Form-backed Table Columns
    description: FormTable uses Form fields as its default columns and lets users add localized Created and Updated columns through an accessible column picker.
    priority: medium
    status: implemented
    criteria:
      - id: shared-column-picker
        kind: behavior
        statement: FormTable provides an icon-only localized Columns action. Its dialog offers optional timestamps beside the Form columns without field or Entry IDs, uses localized Cancel and Apply actions, traps focus, returns focus to the trigger, and has no explanatory copy.
        governed_by: [POL-UI-001#rule.governance, POL-UI-002#rule.governance, POL-UI-007#rule.governance, POL-UI-012#rule.governance]
      - id: form-table-columns
        kind: behavior
        statement: FormTable keeps Form fields as its default columns on desktop and mobile. Created and Updated are optional and hidden by default. Copying a selection follows the currently visible columns.
        governed_by: [POL-UI-002#rule.governance, POL-UI-003#rule.governance, POL-UI-007#rule.governance]
    bindings:
      - id: column-picker-verification
        role: verification
        facet: verification
        responsibility: Verify FormTable's default columns, optional timestamps, and shared picker behavior.
        targets:
          - id: form-table-columns
            adapter: typescript
            path: frontend/src/components/FormTable.test.tsx
            selector: { kind: test, name: keeps Form fields as the default columns and lets users add timestamps }
            claims:
              - kind: verifies
                criterion: REQ-FE-075#criterion.form-table-columns
                covers: [FEAT-FE-005#binding.frontend/target.form-table]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/FormTable.test.tsx, test: keeps Form fields as the default columns and lets users add timestamps } }
              - kind: verifies
                criterion: REQ-FE-075#criterion.shared-column-picker
                covers:
                  - FEAT-FE-015#binding.frontend/target.shared-column-picker
                  - FEAT-FE-005#binding.frontend/target.form-table
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/FormTable.test.tsx, test: keeps Form fields as the default columns and lets users add timestamps } }
          - id: form-table-specification
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-075: declares FormTable's optional timestamps and column picker" }
            claims:
              - kind: verifies
                criterion: REQ-FE-075#criterion.form-table-columns
                covers: [FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-component-contract]
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-075: declares FormTable's optional timestamps and column picker" } }
              - kind: verifies
                criterion: REQ-FE-075#criterion.shared-column-picker
                covers: [FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-component-contract]
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-075: declares FormTable's optional timestamps and column picker" } }
          - id: column-picker-focus-and-identifiers
            adapter: typescript
            path: frontend/src/components/FormTable.test.tsx
            selector: { kind: test, name: traps focus in the Columns dialog and returns it to the trigger }
            claims:
              - kind: verifies
                criterion: REQ-FE-075#criterion.shared-column-picker
                covers: [FEAT-FE-015#binding.frontend/target.shared-column-picker]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/FormTable.test.tsx, test: traps focus in the Columns dialog and returns it to the trigger } }
