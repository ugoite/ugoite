schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Text-first Composition Studio
requirements:
  - id: REQ-FE-083
    title: Text-first Composition Studio
    description: >-
      Define the browser authoring and reader boundary for the current
      Composition graph, using concise placement and controls from the Ugoite
      UI policies.
    priority: high
    status: implemented
    criteria:
      - id: design-and-variables-modes
        kind: behavior
        statement: >-
          Composition Studio opens in Design and exposes only Design and
          Variables modes. Design inserts only Text, Table, and Input
          components; it does not offer Metric or Saved SQL binding pickers.
        governed_by: [POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: text-is-edited-in-place
        kind: behavior
        statement: >-
          Authors edit a Text template in its canvas position and choose its
          Title, Heading, Body, or Caption style with a compact adjacent
          control. Editing supports line breaks and IME composition. Escape
          exits editing without discarding the draft, and moving focus outside
          the inline editor closes it without losing edits.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: reader-is-read-only
        kind: behavior
        statement: >-
          Reader displays validated Composition values without authoring modes,
          selection controls, or editing controls. Text is emitted as text
          nodes rather than HTML or evaluated markup.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: reader-table-scroll-stays-local
        kind: behavior
        statement: >-
          When a projected SQL Table is wider than the viewport, its own
          scroll region exposes every result column without widening the page.
          Other rendered values, including scalar Text, remain visible and the
          read-only Reader exposes no inspector or authoring controls.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: variable-creation-completes-pending-placement
        kind: behavior
        statement: >-
          When Design needs a Table, creating its SQL query keeps the author in
          Variables until lint and an authorized Check succeed. Use returns to
          the originating Design position and places the Table without running
          the query. Existing Table references change in place. Cancel or
          failed creation leaves the previous variable, component, and layout
          intact.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: input-creation-places-once
        kind: behavior
        statement: >-
          Creating an Input from Design or a SQL marker opens the Variables
          name and type, required, and default editor. Use commits one input
          variable and its first Design component, and SQL marker creation
          commits its explicit typed binding and returns to the SQL editor.
          Creation from Variables places the component and stays in Variables.
          Cancel leaves no variable, component, or binding; current input
          values remain transient Work.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: duplicate-variable-name-is-rejected
        kind: behavior
        statement: >-
          The Variables editor rejects a query variable name already used in
          the Composition draft and keeps Add unavailable until the name is
          unique.
        governed_by: [POL-UI-002#rule.governance]
      - id: variable-name-is-suggested
        kind: behavior
        statement: >-
          Variable creation starts with the next unique suggested name for its
          kind or SQL marker. The suggestion remains editable and duplicate
          names remain rejected.
        governed_by: [POL-UI-002#rule.governance]
      - id: table-picker-focus-restoration
        kind: behavior
        statement: >-
          The Table binding picker owns one modal, makes the background inert
          while open, and returns keyboard focus to its opener when dismissed
          with Escape.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: variables-show-local-sql-diagnostics
        kind: behavior
        statement: >-
          SQL variables keep their authored SQL source in one editor. Lint,
          authorized schema check, and explicit execution have distinct
          outcomes; parameter bindings and errors are presented next to the
          relevant SQL or variable control without a separate arguments page.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: editor-work-is-scope-bound
        kind: behavior
        statement: >-
          Pending Composition editor work belongs to the current Space, route
          target and base revision, and authenticated account. A detected
          scope change discards pending creation, selection, editor validity,
          checks, and results; an old asynchronous response cannot update the
          new draft. A save preflight is not dispatched after its scope
          changes. An already-sent save and its receipt remain bound to the
          original route and principal, and an uncertain retry is exposed only
          to that principal.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: design-evaluation-has-current-state
        kind: behavior
        statement: >-
          After a Table is placed, Design distinguishes evaluation in progress,
          a successful empty Table, populated results, and current execution or
          authorization failure. Invalidating a query clears its stale result
          and failure while it is reevaluated; a current failure stays visible
          until a successful evaluation. Check and Use do not execute SQL.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: sql-arguments-bind-locally
        kind: behavior
        statement: >-
          Each Rust-parsed SQL `{{name}}` marker has one adjacent selector for
          a typed scalar graph variable. Creating a variable from that marker
          creates the variable and binding together only while the owning SQL
          remains unchanged. A manual unbind stays local to that query while
          its marker exists; an explicit reconnect clears it, and Rust-parsed
          marker removal clears only that query's unbind state. Query deletion
          or an editor scope change discards this transient state. Composition
          does not expose Structure, Columns, Filter, Sort, or Arguments SQL
          construction controls; an optional authorized Form source remains
          available for a blank query.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
