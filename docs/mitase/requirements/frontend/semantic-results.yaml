schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-068
    title: Semantic Result Surface Rendering
    description: Semantic result surfaces render already-fetched pages with a shared visual and interaction vocabulary while preserving surface-owned row semantics and controller-owned paging. UI consistency does not require one generic result component.
    priority: medium
    status: implemented
    criteria:
      - id: native-page-rows
        kind: behavior
        statement: Every row in the already-fetched page is rendered as a native table row; changing table rendering does not change page requests or represent a server total.
        governed_by: [POL-006#rule.governance]
      - id: semantic-row-ownership
        kind: behavior
        statement: Entry, Saved SQL, History Change, and Composition source rows keep surface-owned selection and open semantics; shared presentation never reinterprets one surface row as another surface row.
        governed_by: [POL-006#rule.governance]
      - id: shared-result-visual-language
        kind: behavior
        statement: Result surfaces share header typography, row height, dividers, cell padding, scroll containment, focus rings, and Previous/Next touch targets without sharing row semantics or paging state.
        governed_by: [POL-006#rule.governance]
      - id: source-native-table-visual-details
        kind: behavior
        statement: SQL and EntryQuery native tables use legible headers and shared cell spacing, right-align numeric columns with tabular figures, render null values as an em dash, and truncate long cell text to one line while keeping the complete value available in text and a title.
        governed_by: [POL-006#rule.governance]
      - id: table-identity-keyboard-scroll
        kind: behavior
        statement: SQL and EntryQuery result viewports are keyboard-focusable named regions with a visible focus indicator, and their native tables carry the surface-localized or component-provided table name; row actions and pagination remain keyboard-operable with 44px action targets.
        governed_by: [POL-006#rule.governance]
      - id: controller-owned-paging
        kind: behavior
        statement: Cursors, continuations, request generation, fetch, retry identity, and query identity stay in the surface controller or query handle; table presenters render the current page only.
        governed_by: [POL-006#rule.governance]
      - id: keyboard-row-navigation
        kind: behavior
        statement: Native table headers and cells remain available, and keyboard focus can move between row actions.
        governed_by: [POL-006#rule.governance]
      - id: local-horizontal-overflow
        kind: behavior
        statement: Horizontal scrolling is contained in the result viewport; pages do not overflow horizontally at 320px, 390px, or the 640 CSS-pixel layout width corresponding to 200% zoom at 1280px, and narrow one- or two-column tables fit without a fixed giant minimum width.
        governed_by: [POL-006#rule.governance]
      - id: no-redundant-result-explanation
        kind: behavior
        statement: A result surface gives query identity, results, and operative controls their visible owners without persistent explanatory copy that repeats already-established context or the result's transient state.
        governed_by: [POL-UI-002#rule.governance]
    bindings:
      - id: result-surface-verification
        role: verification
        facet: verification
        responsibility: Verify complete native row rendering, shared visual language, row actions, and keyboard focus using deterministic component tests.
