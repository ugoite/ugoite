schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-040
    title: UI Specification Registry Validation
    description: The declarative frontend UI page registry remains consistent with its supported component vocabulary, implemented routes, and shared Space chrome.
    priority: high
    status: implemented
    criteria:
      - id: registry-shape
        kind: quality
        statement: UI page YAML declares required page metadata, supported component types, and links to existing page identifiers.
        governed_by: [POL-006#rule.governance, POL-008#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: route-coverage
        kind: quality
        statement: Every documented UI page maps to an implemented frontend route, every implemented Space route is documented, and implemented page declarations do not retain placeholder route content.
        governed_by: [POL-006#rule.governance, POL-008#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: shared-chrome
        kind: behavior
        statement: The shared Space chrome declaration keeps the sidebar, workspace top bar, and mobile navigation at the approved positions, dimensions, and destinations.
        governed_by: [POL-006#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: ui-registry-verification
        role: verification
        facet: verification
        responsibility: Verify the declarative UI page registry, route coverage, dashboard Recent count contract, placeholder guard, and shared Space chrome through exact frontend tests.
        targets:
          - id: page-metadata
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: loads UI page specs" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers:
                  - FEAT-FE-013#binding.frontend/target.page-registry
                  - FEAT-FE-013#binding.frontend/target.page-space-assets
                  - FEAT-FE-013#binding.frontend/target.page-space-asset-detail
                  - FEAT-FE-013#binding.frontend/target.page-space-dashboard
                  - FEAT-FE-013#binding.frontend/target.page-space-compositions
                  - FEAT-FE-013#binding.frontend/target.page-space-composition-revision
                  - FEAT-FE-013#binding.frontend/target.page-space-entries-object
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-detail
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-history
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-new
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-revision
                  - FEAT-FE-013#binding.frontend/target.page-space-form-grid
                  - FEAT-FE-013#binding.frontend/target.page-space-form-entries
                  - FEAT-FE-013#binding.frontend/target.page-space-form-types
                  - FEAT-FE-013#binding.frontend/target.page-space-query-create
                  - FEAT-FE-013#binding.frontend/target.page-space-query-variables
                  - FEAT-FE-013#binding.frontend/target.page-space-search
                  - FEAT-FE-013#binding.frontend/target.page-space-settings
                  - FEAT-FE-013#binding.frontend/target.page-space-sql-detail
                  - FEAT-FE-013#binding.frontend/target.page-space-sql
                  - FEAT-FE-013#binding.frontend/target.page-space-test-connection
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: loads UI page specs" } }
          - id: entry-history-identity-contract
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: {
              kind: test,
              name: "REQ-UX-ENTRY-HISTORY-001: documents actor labels and collapsed revision identifiers",
            }
            claims:
              - kind: verifies
                criterion: REQ-UX-ENTRY-HISTORY-001#criterion.actor-labels
                covers:
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-history
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-revision
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/spec/ui-pages.test.ts,
                    test: "REQ-UX-ENTRY-HISTORY-001: documents actor labels and collapsed revision identifiers",
                  },
                }
              - kind: verifies
                criterion: REQ-UX-ENTRY-HISTORY-001#criterion.revision-identifiers
                covers: [FEAT-FE-013#binding.frontend/target.page-space-entry-revision]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/spec/ui-pages.test.ts,
                    test: "REQ-UX-ENTRY-HISTORY-001: documents actor labels and collapsed revision identifiers",
                  },
                }
          - id: dashboard-recent-list-contract
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: declares the dashboard Recent maximum after duplicate suppression" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers: [FEAT-FE-013#binding.frontend/target.page-space-dashboard]
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: declares the dashboard Recent maximum after duplicate suppression" } }
              - kind: verifies
                criterion: REQ-UX-DASH-001#criterion.recent-count-bound
                covers: [FEAT-FE-013#binding.frontend/target.page-space-dashboard]
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: declares the dashboard Recent maximum after duplicate suppression" } }
          - id: global-shell-account-entry-contract
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: declares GlobalShell account entry states" }
            claims:
