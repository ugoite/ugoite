schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-040
    title: UI Specification Registry Validation
    description: Declarative frontend UI page and shared component contracts use supported vocabulary and valid references while recording the shared Space chrome structure.
    priority: high
    status: implemented
    criteria:
      - id: registry-shape
        kind: quality
        statement: UI page and shared component YAML declare their required metadata, supported UI vocabulary, and links to existing page identifiers.
        governed_by: [POL-006#rule.governance, POL-008#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: shared-chrome
        kind: behavior
        statement: The shared Space chrome declaration specifies the sidebar, workspace top bar, and mobile navigation positions, dimensions, and destinations. Runtime parity with those values remains unverified; this registry suite does not test rendered chrome.
        governed_by: [POL-006#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: ui-registry-verification
        role: verification
        facet: verification
        responsibility: Verify page metadata, page and shared-component IDs and types, component YAML references, page links, and implementation evidence references through exact frontend tests.
        targets:
          - id: page-metadata
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: loads UI page specs" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers:
                  - FEAT-FE-013#binding.frontend/target.page-registry
                  - FEAT-FE-013#binding.frontend/target.page-space-assets
                  - FEAT-FE-013#binding.frontend/target.page-space-asset-detail
                  - FEAT-FE-013#binding.frontend/target.page-space-dashboard
                  - FEAT-FE-013#binding.frontend/target.page-space-compositions
                  - FEAT-FE-013#binding.frontend/target.page-space-composition-revision
                  - FEAT-FE-013#binding.frontend/target.page-space-entries-object
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-detail
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-history
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-new
                  - FEAT-FE-013#binding.frontend/target.page-space-entry-revision
                  - FEAT-FE-013#binding.frontend/target.page-space-form-grid
                  - FEAT-FE-013#binding.frontend/target.page-space-form-entries
                  - FEAT-FE-013#binding.frontend/target.page-space-form-types
                  - FEAT-FE-013#binding.frontend/target.page-space-query-create
                  - FEAT-FE-013#binding.frontend/target.page-space-query-variables
                  - FEAT-FE-013#binding.frontend/target.page-space-search
                  - FEAT-FE-013#binding.frontend/target.page-space-settings
                  - FEAT-FE-013#binding.frontend/target.page-space-sql-detail
                  - FEAT-FE-013#binding.frontend/target.page-space-sql
                  - FEAT-FE-013#binding.frontend/target.page-space-test-connection
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: loads UI page specs" } }
          - id: component-types
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: validates component types" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers: [FEAT-FE-013#binding.frontend/target.page-registry]
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: validates component types" } }
          - id: shared-component-structure
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: validates shared component structure and references" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers:
                  - FEAT-FE-013#binding.frontend/target.component-invitation-join
                  - FEAT-FE-013#binding.frontend/target.component-device-approval
                  - FEAT-FE-013#binding.frontend/target.component-account-recovery
                  - FEAT-FE-013#binding.frontend/target.component-step-up
                  - FEAT-FE-013#binding.frontend/target.component-login
                  - FEAT-FE-013#binding.frontend/target.global-shell-account-entry
                  - FEAT-FE-013#binding.frontend/target.component-space-selection
                  - FEAT-FE-013#binding.frontend/target.component-space-settings
                  - FEAT-FE-013#binding.frontend/target.component-shared-sql-workspace
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: validates shared component structure and references" } }
          - id: page-links
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: validates page links" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers: [FEAT-FE-013#binding.frontend/target.page-registry]
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: validates page links" } }
          - id: settings-contract
            adapter: typescript
            path: frontend/src/spec/ui-pages.test.ts
            selector: { kind: test, name: "REQ-FE-040: validates Space Settings implementation references" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers:
                  - FEAT-FE-013#binding.frontend/target.page-space-settings
                  - FEAT-FE-013#binding.frontend/target.component-space-settings
                runner: { runner: frontend-vitest-file, arguments: { file: src/spec/ui-pages.test.ts, test: "REQ-FE-040: validates Space Settings implementation references" } }
          - id: invitation-join-contract
            adapter: typescript
            path: frontend/src/routes/spaces/join.test.tsx
            selector: { kind: test, name: "REQ-FE-040: matches the invitation Join declaration to the rendered route" }
            claims:
              - kind: verifies
                criterion: REQ-FE-040#criterion.registry-shape
                covers: [FEAT-FE-013#binding.frontend/target.component-invitation-join]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/spaces/join.test.tsx, test: "REQ-FE-040: matches the invitation Join declaration to the rendered route" } }
