schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-070
    title: Composition Studio Authoring
    description: |
      Composition Studio lets the Browser combine existing Space-owned Knowledge (Saved SQL revisions, Form views, parameters) into a reusable Tool with multiple data sources, table and exact-scalar metric displays, labels, tags, side-effect-free live preview, and exact-revision edit. Richness is typed, reproducible combination of existing Knowledge, not free-form layout. The Browser never owns Composition semantics. Drafts canonicalize through the shared Rust/WASM contract, metric evaluation stays exact-scalar without Browser aggregation, and SQL types stay server-owned without Browser inference. Verification bindings for the draft Work state land with this change; route, picker, preview, and edit-surface verification lands with the Studio implementation, and the remaining criteria stay an explicit evidence gap until then.
    priority: high
    status: planned
    criteria:
      - id: structure-first-authoring
        kind: behavior
        statement: The Studio steady state shows the operative structure (tool name, Data, Display, Parameters, Tags, Preview, Save) without explanatory paragraphs; prose appears only to instruct the next ambiguous operation, recover from errors, warn, disambiguate unavailability, or show one empty-state next action.
        governed_by: [POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: no-persistent-explanatory-copy
        kind: behavior
        statement: Steady-state Studio and saved-Tool surfaces carry no product explanation, tutorial paragraph, repeated context sentence, persistent success prose, or primary-path internal identifiers; each datum keeps one visible owner and each navigation or mutation intent keeps exactly one operative control per surface.
        governed_by: [POL-UI-001#rule.governance, POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: entry-query-field-labels
        kind: behavior
        statement: EntryQuery field labels in the Composition Data editor use transient Form field names whenever live Form metadata resolves a field; otherwise they use localized schema ordinals, including distinct deterministic ordinals for unresolved references missing from the schema snapshot. While metadata is loading, absent, or unavailable, labels use the schema ordinal fallback. Raw numeric field IDs stay in query data and never render in field, filter, sort, projection, or dialog labels.
        governed_by: [POL-UI-005#rule.governance]
      - id: source-authoring
        kind: behavior
        statement: A Tool pins one or more exact sources (Saved SQL at an exact revision, EntryQuery from an existing Form view or Form-scoped query control) with full-row selection, reorder controls, and a guarded remove that blocks while displays reference the source instead of cascading silently. EntryQuery editors prefer transient Form field names whenever live metadata resolves a field; unresolved fields use localized ordinals, with distinct deterministic ordinals for unresolved references absent from the schema snapshot, while raw field IDs stay in query data only.
        governed_by: [POL-UI-002#rule.governance, POL-UI-006#rule.governance, POL-UI-007#rule.governance]
      - id: display-authoring
        kind: behavior
        statement: Displays are table or exact-scalar metric components only; a table renders through the source-native Entry or SQL presenter, saved EntryQuery tables use Form labels or Form field keys as headings while reading values by the stable field key, and missing Form metadata falls back to projected row keys without exposing field IDs. A metric selects one scalar-compatible field or column with an optional label, and several displays may share one source without duplicate fetching.
        governed_by: [POL-UI-002#rule.governance, POL-UI-006#rule.governance]
      - id: typed-parameter-binding
        kind: behavior
        statement: Parameters use the existing Composition parameter grammar with labels, defaults, and date/month/timestamp inputs. Studio parameter rows prefer the declared human label and fall back to the user-authored parameter name that binds references; Saved SQL variables and EntryQuery filter values bind to parameters by reference, and type compatibility is decided by the Rust-owned capability and diagnostics, never by Browser inference.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: side-effect-free-preview
        kind: behavior
        statement: Unsaved drafts preview through a side-effect-free resolution that parses the candidate document, applies current source authorization, resolves through the shared Core resolver, and executes only the existing entry.query and sql.query operations without creating registry, history, or publication state.
        governed_by: [POL-UI-009#rule.governance]
      - id: exact-revision-edit
        kind: behavior
        statement: Editing opens the exact saved revision through composition.get and composition.lint normalization, treating omitted empty optional parameter and Saved SQL variable collections as empty editor state while refusing malformed explicit-null collections, saves with the exact composition and base revision identity plus idempotency, and appends a new revision on success; stale bases conflict and uncertain saves retry the identical payload and key.
        governed_by: [POL-UI-008#rule.governance, POL-UI-009#rule.governance]
      - id: mobile-one-column
        kind: quality
        statement: At 390px width (and 320px effective zoom width) the Studio is one column with reachable primary actions, touch-sized controls, no page-level horizontal overflow, and tables scrolling inside their own viewport; reorder and all operations remain available without hover-only or drag-only interaction.
        governed_by: [POL-UI-004#rule.governance, POL-UI-007#rule.governance]
      - id: accessible-icon-actions
        kind: quality
        statement: Every icon action carries an accessible name, tooltip or title where the visible label collapses, a 44px target, and a focus order matching the visual order.
        governed_by: [POL-UI-007#rule.governance, POL-UI-012#rule.governance]
    bindings:
      - id: draft-model-verification
        role: verification
        facet: verification
        responsibility: Verify the Studio draft Work state (stable identities, blocked removes, keyboard-operable reorder, typed document assembly, shared-contract canonicalization) through exact frontend unit tests. Route, picker, preview, and edit-surface verification lands with the Studio implementation.
        targets:
          - id: draft-identities
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: builds stable draft identities without owning semantics }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.source-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-draft-model]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: builds stable draft identities without owning semantics } }
              - kind: verifies
                criterion: REQ-FE-070#criterion.display-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-draft-model]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: builds stable draft identities without owning semantics } }
          - id: draft-blocked-remove
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: blocks source removal while displays reference it }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.source-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-draft-model]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: blocks source removal while displays reference it } }
          - id: draft-reorder
            adapter: typescript
            path: frontend/src/lib/composition-draft.test.ts
            selector: { kind: test, name: reorders sources and displays by keyboard-operable moves }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.source-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-draft-model]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: reorders sources and displays by keyboard-operable moves } }
              - kind: verifies
                criterion: REQ-FE-070#criterion.display-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-draft-model]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: reorders sources and displays by keyboard-operable moves } }
      - id: preview-handle-verification
        role: verification
        facet: verification
        responsibility: Verify draft preview execution identity, stale-response guards, parameter re-preview, and error surfacing through exact frontend unit tests.
        targets:
          - id: preview-fingerprint-identity
