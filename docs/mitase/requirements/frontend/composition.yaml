                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: reorders sources and displays by keyboard-operable moves } }
      - id: preview-handle-verification
        role: verification
        facet: verification
        responsibility: Verify draft preview execution identity, stale-response guards, parameter re-preview, and error surfacing through exact frontend unit tests.
