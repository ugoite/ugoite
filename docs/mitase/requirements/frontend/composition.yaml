                criterion: REQ-FE-070#criterion.source-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-draft-model]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-draft.test.ts, test: builds stable draft identities without owning semantics } }
