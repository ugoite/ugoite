                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-preview-handle.test.ts, test: surfaces preview errors without stale overwrite } }
      - id: studio-edit-verification
        role: verification
        facet: verification
        responsibility: Verify exact-revision edit (open the exact saved revision through composition.get and composition.lint normalization, restore the shared studio draft while treating omitted empty optional parameter and Saved SQL variable collections as empty, save with the exact composition and base revision identity plus idempotency, and refuse malformed explicit-null collections or other invalid documents without opening the studio) through exact frontend unit tests.
