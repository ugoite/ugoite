schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-070
    title: Composition Studio Authoring
    description: |
      Composition Studio combines existing Space-owned Knowledge (Saved SQL revisions, Form views, and parameters) into a reusable Tool with multiple data sources, displays, labels, tags, side-effect-free preview, and exact-revision edit. Metrics use typed Form aggregate operations or a Saved SQL scalar column. Metric authoring uses the shared Rust Domain capability through WASM and previews through the server metric query operation. Richness is a typed, reproducible combination of existing Knowledge, not free-form layout. The Browser never owns Composition semantics or aggregates fetched rows. Drafts canonicalize through the shared Rust/WASM contract. Metric authoring is verified by focused frontend tests; result presentation and the saved metric journey remain evidence gaps tracked by #4105 and #4106.

    priority: high
    status: planned
    criteria:
      - id: structure-first-authoring
        kind: behavior
        statement: The Studio steady state shows the operative structure (tool name, Data, Display, Parameters, Tags, Preview, Save) without explanatory paragraphs; Data mode separates Sources, Parameters, and Tags into localized tabs, with Parameters shown only when a source exists; prose appears only to instruct the next ambiguous operation, recover from errors, warn, disambiguate unavailability, or show one empty-state next action.
        governed_by: [POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: no-persistent-explanatory-copy
        kind: behavior
        statement: Steady-state Studio and saved-Tool surfaces carry no product explanation, tutorial paragraph, repeated context sentence, persistent success prose, or primary-path internal identifiers; each datum keeps one visible owner and each navigation or mutation intent keeps exactly one operative control per surface.
        governed_by: [POL-UI-001#rule.governance, POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: entry-query-field-labels
        kind: behavior
        statement: EntryQuery field labels use transient human Form labels, non-generated query-capability names, or human Form field keys when available. Generated ordinals are never shown; when no human name or key resolves, the editor uses a localized unavailable-name label instead of an ID or generated ordinal. Metric field choices are omitted until a human name resolves. Raw numeric field IDs stay in query data and never render in field, filter, sort, projection, Metric, or dialog labels, including while Form metadata loads or fails.

        governed_by: [POL-UI-005#rule.governance]
      - id: source-authoring
        kind: behavior
        statement: A Tool pins one or more exact sources (Saved SQL at an exact revision, EntryQuery from an existing Form view or Form-scoped query control) with full-row selection, reorder controls, and a guarded remove that blocks while displays reference the source instead of cascading silently. New Form sources initially project up to 64 projectable fields, while the projection editor keeps selected fields removable and disables unchecked fields at capacity. EntryQuery aggregate bindings stay independent of this table projection. EntryQuery editors prefer transient human Form names or field keys whenever live metadata resolves a field, ignore generated ordinal names, and use a localized unavailable-name label when no human name is available; raw field IDs stay in query data only.
        governed_by: [POL-UI-002#rule.governance, POL-UI-006#rule.governance, POL-UI-007#rule.governance]
      - id: display-authoring
        kind: behavior
        statement: Design insertion offers Text and Data even when the canvas has no sources. Data opens Table and Metric choices, listing current Composition sources first and allowing Forms or Saved SQL to be browsed. Selecting a current source in Table mode immediately adds a table; choosing a catalog source in Table mode adds that source and table together. Opaque source, Entry, revision, and field IDs stay out of visible labels. A table renders through the source-native Entry or SQL presenter, saved EntryQuery tables use Form labels or Form field keys as headings while reading values by the stable field key, and missing Form metadata falls back to projected row keys without exposing field IDs. Table labels are optional Inspector edits after insertion, and several displays may share one source without duplicate fetching; metric authoring follows the separate metric-authoring criterion.

        governed_by: [POL-UI-002#rule.governance, POL-UI-006#rule.governance]
      - id: metric-authoring
        kind: behavior
        statement: Metric creation follows source, calculation, a compatible field or column when required, preview, then insertion. Form metrics support count_rows, count_values, sum, avg, min, and max; count_rows has no field, count_values counts non-NULL values, and field compatibility is decided by the shared Rust Domain capability exposed through WASM. Saved SQL metrics use sql_scalar against an exact saved revision and selected output column. The Inspector edits the metric name, source, calculation, field or column, and optional display format. Save stays disabled until every Metric has its required field or output column, and incomplete edits remain available without reaching canonicalization. Numeric results support an explicit unit and minimum decimal places as presentation-only metadata; these do not change query semantics and are cleared when a result becomes nonnumeric. Draft preview calls composition.metric.query with a draft target; saved metric rendering resolves against its saved revision. Both use the server metric query operation, not browser aggregation. Labels use human Form names and user-authored SQL column names; opaque identifiers never render, and steady-state surfaces contain no explanatory paragraphs.
        governed_by: [POL-UI-001#rule.governance, POL-UI-002#rule.governance, POL-UI-005#rule.governance, POL-UI-006#rule.governance, POL-UI-007#rule.governance]
      - id: metric-result-presentation
        kind: behavior
        statement: Metric presentation distinguishes loading, zero matching rows, NULL, numeric zero, stale source, unavailable source, invalid result, and execution error, with one relevant recovery action. Saved SQL metric results require exactly one row and the selected output column; zero or multiple rows offer a direct Edit or Table action. Metric values are independent of Table pagination. Integer and Decimal results remain exact; optional unit and fraction-digit metadata is never inferred, and exact results are not silently rounded or lose precision.
        governed_by: [POL-UI-001#rule.governance, POL-UI-007#rule.governance, POL-UI-009#rule.governance, POL-UI-012#rule.governance]
      - id: metric-saved-lifecycle
        kind: behavior
        statement: Saving, closing, and reopening a Composition retains metric definitions and resolves their current values again; adding or updating matching source entries changes the metric result while changing a Table page does not.
        governed_by: [POL-UI-009#rule.governance]
      - id: typed-parameter-binding
        kind: behavior
        statement: Parameters use the existing Composition parameter grammar with labels, defaults, and date/month/timestamp inputs. Studio parameter rows prefer the declared human label and fall back to the user-authored parameter name that binds references; Saved SQL variables and EntryQuery filter values bind to parameters by reference, and type compatibility is decided by the Rust-owned capability and diagnostics, never by Browser inference.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: side-effect-free-preview
        kind: behavior
        statement: Unsaved drafts preview through side-effect-free operations that parse the candidate document, apply current source authorization, and resolve through the shared Core resolver without creating registry, history, or publication state. Table previews use the existing entry.query and sql.query operations; one selected Metric uses the bounded composition.metric.query operation, and Browser code never aggregates fetched records.
        governed_by: [POL-UI-009#rule.governance]
      - id: exact-revision-edit
        kind: behavior
        statement: Editing opens the exact saved revision through composition.get and composition.lint normalization, treats omitted empty optional parameter and Saved SQL variable collections as empty editor state, and refuses malformed explicit-null collections or untyped legacy Metric definitions without conversion; saves with the exact composition and base revision identity plus idempotency and appends a new revision on success; stale bases conflict and uncertain saves retry the identical payload and key.
        governed_by: [POL-UI-008#rule.governance, POL-UI-009#rule.governance]
      - id: mobile-one-column
        kind: quality
        statement: At 390px width (and 320px effective zoom width) the Studio is one column with reachable primary actions, touch-sized controls, no page-level horizontal overflow, and tables scrolling inside their own viewport; reorder and all operations remain available without hover-only or drag-only interaction.
        governed_by: [POL-UI-004#rule.governance, POL-UI-007#rule.governance]
      - id: accessible-icon-actions
        kind: quality
        statement: Every icon action carries an accessible name, tooltip or title where the visible label collapses, a 44px target, and a focus order matching the visual order.
        governed_by: [POL-UI-007#rule.governance, POL-UI-012#rule.governance]
    bindings:
      - id: draft-model-verification
        role: verification
        facet: verification
        responsibility: Verify the Studio draft Work state (stable identities, blocked removes, keyboard-operable reorder, typed document assembly, and shared-contract canonicalization) through exact frontend unit tests. Metric authoring, result presentation, and the saved metric journey remain explicit verification gaps until #4104–#4106 land.
