    bindings:
      - id: verification
        role: verification
        facet: verification
        responsibility: >-
          Verify shared text editing, adapter ownership, transient typed values,
          human Form identity guards, explicit preview and paging, current plan
          state, accessibility, and control sizes through exact tests.
        targets:
          - id: shared-workspace-contract
            adapter: typescript
            path: frontend/src/components/SQLWorkspace.test.tsx
            selector: { kind: test, name: "REQ-FE-080: keeps SQL editing controlled and passes the accessible name" }
            claims:
              - kind: verifies
                criterion: REQ-FE-081#criterion.shared-text-authoring
                covers: [FEAT-FE-008#binding.frontend/target.sql-workspace]
