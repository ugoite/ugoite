  - id: REQ-FE-080
    title: Shared SQL Workspace
    description: >-
      Historical contract retained with its original criteria. Saved SQL
      authoring has moved to direct text editing under REQ-FE-081, so criteria
      that depended on its retired syntax-construction controls remain explicit
      evidence gaps rather than narrowed claims. Composition query-variable
      controls remain under REQ-FE-079 and retain their Structure Toolbar until
      its planned migration is implemented.
    priority: high
    status: deprecated
    criteria:
      - id: shared-editor-and-preview
        kind: behavior
        statement: >-
          New Saved SQL, Saved SQL detail/edit, and Composition inline SQL use
          one shared SQL Workspace for typed variables, structured query
          operations, direct SQL editing, preview, and paged native results.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: workspace-presentation-api
        kind: behavior
        statement: >-
          The reusable Workspace is a controlled presentation component. It
          accepts SQL, schema, diagnostics, preview results, and explicit action
          callbacks from its owner without implementing persistence or query
          transport itself.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: adapter-owned-persistence-and-execution
        kind: behavior
        statement: >-
          The owning route or Composition source adapter supplies SQL state,
          schema, transient parameter values, query preview, count, and page
          continuation. It owns persistence and execution; the shared Workspace
          presents those capabilities without creating another SQL authority.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: transient-typed-parameters
        kind: behavior
        statement: >-
          The shared Workspace presents declared typed parameters using their
          transient Work values or declared defaults. Unset values remain
          unset instead of being coerced or silently replaced by a default, and
          the Workspace does not persist parameter values.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: adapter-supplied-structured-actions
        kind: behavior
        statement: >-
          The Workspace renders only structured action capabilities supplied by
          its owner and dispatches explicit callbacks. Activating a control does
          not silently rewrite the SQL text.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: safe-structured-operations
        kind: behavior
        statement: >-
          Structured SQL operations are enabled only for syntax that the shared
          parser/capability model can safely round-trip. Directly edited SQL
          remains authoritative; unsupported syntax stays editable in the code
          editor and a structured rewrite requires explicit diff confirmation.
          SQL analysis can use trusted metadata for reserved Forms already
          referenced by directly authored SQL. The Form relation chooser
          applies the same user-creatable Form eligibility rule as entry
          creation.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: task-oriented-result-fields
        kind: behavior
        statement: >-
          Shared SQL Columns presents ordered result fields and authorized
          human field labels directly, without requiring statement or syntax
          node selection. Users can add, remove and move supported fields and
          use guarded Undo and Redo. Complex or ambiguous
          edits remain available through an explicit advanced action without
          silently replacing source. Pending operations cannot cross host
          identity, and field controls retain focus during a reorder.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: complete-wildcard-output-schema
        kind: behavior
        statement: >-
          Structured wildcard expansion uses complete output column names and
          order from current authorized planning for that exact projection,
          rather than reconstructing outputs from a partial Form context.
          Ambiguous projection scope, unavailable or duplicate names, and
          stale SQL, host or parameter snapshots leave source unchanged in
          both primary and advanced editors. Planning does not execute rows.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: human-form-name-binding
        kind: behavior
        statement: >-
          Form selection authors SQL with the quoted human Form name and carries
          its immutable Form ID as a compare-only guard through plan, page,
          count, preview, and save. Rust resolves the name against the current
          readable Form snapshot and rejects a guard mismatch. Unguarded
          first-use human names remain valid; unchanged exact-base bindings stay
          pinned, and a different guard rebinds only when it matches the
          currently readable Form. Saved SQL exact revisions use their stored
          bindings and reject draft guards.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: explicit-preview-count-and-paging
        kind: behavior
        statement: >-
          The Workspace makes preview and total counting explicit actions and
          delegates page continuation to its owner. It presents loading,
          failure, empty, and typed result states without retaining a stale
          result as the current preview. The owner explicitly marks a result
          current only while it matches the SQL and transient parameter values
          used to run it; results without that confirmation stay hidden.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: current-plan-run-state
        kind: behavior
        statement: >-
          When a Workspace owner supplies planner state, Run Query is enabled
          only for a current successful plan. Pending, rejected, and stale
          planner states disable it and expose a concise accessible reason.
          Once SQL no longer matches the current result, Count rows and page
          continuation are unavailable until a current preview exists. A host
          that owns planning through another workflow may omit planner state
          and continues to control Run Query through its own preview callback
          and disabled state.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: editor-accessibility-and-wrapping
        kind: quality
        statement: >-
          The shared SQL editor exposes an accessible name and wraps long lines
          in the Workspace while preserving the SQL editor's existing default
          behavior for other consumers.
        governed_by: [POL-UI-004#rule.governance, POL-UI-005#rule.governance]
      - id: mobile-sql-editor-and-results
        kind: quality
        statement: >-
          SQL inputs use at least 16px text at narrow widths, only result tables
          scroll horizontally, icon-only actions have accessible names and
          at least 44px targets. Primary actions remain reachable without
          wrapped or horizontal page overflow.
        governed_by: [POL-UI-004#rule.governance, POL-UI-005#rule.governance, POL-UI-007#rule.governance]
      - id: workspace-control-size-rules
        kind: quality
        statement: >-
          Shared Workspace SQL and variable inputs use at least 16px text, and
          primary, paging, and icon-only actions use at least 44px targets.
        governed_by: [POL-UI-004#rule.governance, POL-UI-005#rule.governance]

  - id: REQ-FE-081
    title: Text-first SQL authoring
    description: >-
      Saved SQL authoring uses directly editable text with Rust-backed static
      diagnostics. A selected Form can seed a blank Saved SQL draft with
      explicit projectable fields and an identity guard; no Saved SQL control
      edits SQL syntax piecemeal or overwrites an edited draft. Composition
      query-variable controls remain specified separately by REQ-FE-079.
    priority: high
    status: implemented
    criteria:
      - id: shared-text-authoring
        kind: behavior
        statement: >-
          New Saved SQL and Saved SQL detail/edit use the shared direct text
          editor and its static SQL diagnostics. The Workspace exposes only
          owner-supplied actions and preview controls; persistence and query
          execution remain with the owning route. Composition query variables
          retain their host-owned Structure Toolbar under REQ-FE-079 until its
          planned migration is implemented.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: blank-form-source-starter
        kind: behavior
        statement: >-
          On Saved SQL creation, a Form starter is available only while the
          SQL draft is the blank starter. Selecting a readable Form inserts
          Rust-generated SQL with
          explicit user-projectable columns and a human-readable Form relation,
          and carries the exact Form ID as a binding guard. The seed is dropped
          if the SQL or host scope changes before it resolves; it cannot replace
          an edited SQL draft.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
