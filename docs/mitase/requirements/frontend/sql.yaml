  - id: REQ-FE-080
    title: Shared SQL Workspace
    description: >-
      SQL authoring surfaces share one controlled editing and preview Workspace;
      route adapters own persistence and query execution while SQL remains the
      authoritative source.
    priority: high
    status: implemented
    criteria:
      - id: shared-editor-and-preview
        kind: behavior
        statement: >-
          New Saved SQL, Saved SQL detail/edit, and Composition inline SQL use
          one shared SQL Workspace for typed variables, structured query
          operations, direct SQL editing, preview, and paged native results.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: workspace-presentation-api
        kind: behavior
        statement: >-
          The reusable Workspace is a controlled presentation component. It
          accepts SQL, schema, diagnostics, preview results, and explicit action
          callbacks from its owner without implementing persistence or query
          transport itself.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: adapter-owned-persistence-and-execution
        kind: behavior
        statement: >-
          The owning route or Composition source adapter supplies SQL state,
          schema, transient parameter values, query preview, count, and page
          continuation. It owns persistence and execution; the shared Workspace
          presents those capabilities without creating another SQL authority.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: transient-typed-parameters
        kind: behavior
        statement: >-
          The shared Workspace presents declared typed parameters using their
          transient Work values or declared defaults. Unset values remain
          unset instead of being coerced or silently replaced by a default, and
          the Workspace does not persist parameter values.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: adapter-supplied-structured-actions
        kind: behavior
        statement: >-
          The Workspace renders only structured action capabilities supplied by
          its owner and dispatches explicit callbacks. Activating a control does
          not silently rewrite the SQL text.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: safe-structured-operations
        kind: behavior
        statement: >-
          Structured SQL operations are enabled only for syntax that the shared
          parser/capability model can safely round-trip. Directly edited SQL
          remains authoritative; unsupported syntax stays editable in the code
          editor and a structured rewrite requires explicit diff confirmation.
          SQL analysis can use trusted metadata for reserved Forms already
          referenced by directly authored SQL. The Form relation chooser
          applies the same user-creatable Form eligibility rule as entry
          creation.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: explicit-preview-count-and-paging
        kind: behavior
        statement: >-
          The Workspace makes preview and total counting explicit actions and
          delegates page continuation to its owner. It presents loading,
          failure, empty, and typed result states without retaining a stale
          result as the current preview. The owner explicitly marks a result
          current only while it matches the SQL and transient parameter values
          used to run it; results without that confirmation stay hidden.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: editor-accessibility-and-wrapping
        kind: quality
        statement: >-
          The shared SQL editor exposes an accessible name and wraps long lines
          in the Workspace while preserving the SQL editor's existing default
          behavior for other consumers.
        governed_by: [POL-UI-004#rule.governance, POL-UI-005#rule.governance]
      - id: mobile-sql-editor-and-results
        kind: quality
        statement: >-
          SQL inputs use at least 16px text at narrow widths, only result tables
          scroll horizontally, icon-only actions have accessible names and
          at least 44px targets. Primary actions remain reachable without
          wrapped or horizontal page overflow.
        governed_by: [POL-UI-004#rule.governance, POL-UI-005#rule.governance, POL-UI-007#rule.governance]
      - id: workspace-control-size-rules
        kind: quality
        statement: >-
          Shared Workspace SQL and variable inputs use at least 16px text, and
          primary, paging, and icon-only actions use at least 44px targets.
        governed_by: [POL-UI-004#rule.governance, POL-UI-005#rule.governance]
    bindings:
      - id: verification
        role: verification
        facet: verification
        responsibility: Verify shared SQL presentation, adapter ownership, structured capabilities, transient parameters, paging, accessibility, and control sizes with focused frontend tests.
        targets:
          - id: workspace-presentation-contract
            adapter: typescript
            path: frontend/src/components/SQLWorkspace.test.tsx
            selector: { kind: test, name: "REQ-FE-080: keeps SQL editing controlled and passes the accessible name" }
            claims:
              - kind: verifies
                criterion: REQ-FE-080#criterion.shared-editor-and-preview
                covers: [FEAT-FE-008#binding.frontend/target.sql-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SQLWorkspace.test.tsx, test: "REQ-FE-080: keeps SQL editing controlled and passes the accessible name" } }
              - kind: verifies
                criterion: REQ-FE-080#criterion.workspace-presentation-api
                covers: [FEAT-FE-008#binding.frontend/target.sql-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SQLWorkspace.test.tsx, test: "REQ-FE-080: keeps SQL editing controlled and passes the accessible name" } }
              - kind: verifies
                criterion: REQ-FE-080#criterion.editor-accessibility-and-wrapping
