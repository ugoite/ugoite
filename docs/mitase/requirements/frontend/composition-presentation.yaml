schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Composition user-facing identities
requirements:
  - id: REQ-FE-077
    title: Composition User-Facing Identities
    description: Composition parameter keys and revision IDs are stable internal references. User-facing labels use authored human names or localized ordinal labels; revision identity remains in navigation state.
    priority: medium
    status: planned
    criteria:
      - id: parameter-display-names
        kind: behavior
        statement: Composition parameter surfaces use an authored human label when present and otherwise a localized ordinal based on declaration order. Stable parameter keys remain binding-only and never appear as labels in the parameter list, design palette, placement inspector, runtime control, or saved revision.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: history-hides-revision-identifiers
        kind: behavior
        statement: Composition History shows operation, timestamp, and current-revision state without rendering Revision ID values or a Technical details disclosure. Exact revision identity stays in the internal route target.
        governed_by: [POL-UI-005#rule.governance]
    bindings:
      - id: composition-presentation-verification
        role: verification
        facet: verification
        responsibility: Verify localized parameter labels and hidden revision identifiers through exact frontend tests.
        targets:
          - id: parameter-list-ordinal-label
            adapter: typescript
            path: frontend/src/components/CompositionParameterList.test.tsx
            selector: { kind: test, name: uses localized ordinal labels instead of unlabeled parameter keys }
            claims:
              - kind: verifies
                criterion: REQ-FE-077#criterion.parameter-display-names
                covers: [FEAT-FE-014#binding.frontend/target.composition-parameter-list]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionParameterList.test.tsx, test: uses localized ordinal labels instead of unlabeled parameter keys } }
          - id: parameter-palette-ordinal-label
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.test.tsx
            selector: { kind: test, name: uses localized ordinals for unlabeled parameter palette entries }
            claims:
              - kind: verifies
                criterion: REQ-FE-077#criterion.parameter-display-names
                covers: [FEAT-FE-014#binding.frontend/target.composition-design-canvas]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDesignCanvas.test.tsx, test: uses localized ordinals for unlabeled parameter palette entries } }
          - id: parameter-inspector-ordinal-label
            adapter: typescript
            path: frontend/src/components/CompositionInspector.test.tsx
            selector: { kind: test, name: uses localized ordinal labels for unlabeled parameter placement }
            claims:
              - kind: verifies
                criterion: REQ-FE-077#criterion.parameter-display-names
                covers: [FEAT-FE-014#binding.frontend/target.composition-inspector]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionInspector.test.tsx, test: uses localized ordinal labels for unlabeled parameter placement } }
          - id: parameter-runtime-ordinal-label
            adapter: typescript
            path: frontend/src/components/DashboardFlowRenderer.test.tsx
            selector: { kind: test, name: uses localized ordinal labels for unlabeled runtime parameters }
            claims:
              - kind: verifies
                criterion: REQ-FE-077#criterion.parameter-display-names
                covers: [FEAT-FE-014#binding.frontend/target.composition-parameter-control]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/DashboardFlowRenderer.test.tsx, test: uses localized ordinal labels for unlabeled runtime parameters } }
          - id: parameter-saved-revision-ordinal-label
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
            selector: { kind: test, name: uses localized ordinals for unlabeled placed and unplaced parameters }
            claims:
              - kind: verifies
                criterion: REQ-FE-077#criterion.parameter-display-names
                covers: [FEAT-FE-014#binding.frontend/target.composition-use-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: uses localized ordinals for unlabeled placed and unplaced parameters } }
          - id: history-revision-identifiers-hidden
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/history.test.tsx
            selector: { kind: test, name: lists revisions with human labels and opens the exact revision }
            claims:
              - kind: verifies
                criterion: REQ-FE-077#criterion.history-hides-revision-identifiers
                covers: [FEAT-FE-014#binding.frontend/target.composition-history-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/history.test.tsx", test: lists revisions with human labels and opens the exact revision } }
