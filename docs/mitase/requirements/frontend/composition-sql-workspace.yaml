schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Typed variable graph Composition Studio
requirements:
  - id: REQ-FE-079
    title: Composition Studio graph interactions
    description: The Composition Studio presents a strict typed variable graph, uses the shared SQL Workspace for query variables, and keeps design bindings accessible and structure-first.
    priority: high
    status: planned
    criteria:
      - id: composition-uses-shared-workspace
        kind: behavior
        statement: >-
          Every Composition query variable uses the shared SQL Workspace with
          the same action and diagnostic behavior as Saved SQL authoring. The
          query node owns one SQL string; the host supplies authorized schema,
          evaluation, and parameter binding state.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: composition-no-label-or-tag-fields
        kind: behavior
        statement: >-
          Composition has one typed variable graph and no source collection,
          component source reference, tags, or user-editable labels. Table,
          Metric, Text, and Input store only their compatible variable
          reference or literal Text content. Save keeps a visible text label.
        governed_by: [POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: composition-structure-first-steady-state
        kind: behavior
        statement: >-
          The Studio exposes only Design and Variables modes. The selected mode
          owns its visible name; the panel does not repeat it as a heading.
          The Variables panel presents the typed graph and selected editor
          without explanatory paragraphs or decorative cards.
        governed_by: [POL-UI-002#rule.governance, POL-UI-003#rule.governance]
      - id: form-selection-creates-inline-sql
        kind: behavior
        statement: >-
          Choosing a Form for a Table resolves or exactly reuses a query
          variable equivalent to SELECT * FROM that Form and atomically adds a
          Table that references only the new variable. The Form ID binding and
          result descriptor are server-derived.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-006#rule.governance]
      - id: sql-toolbar-keeps-query-meanings
        kind: behavior
        statement: >-
          Query variables expose the shared Form/relation, columns, filter,
          sort, structure, and arguments actions. Creating or editing one
          action preserves the meaning of unrelated SQL clauses and does not
          silently replace the SQL document.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: sql-filter-adds-typed-parameter
        kind: behavior
        statement: >-
          Filtering a fresh Form query can create a typed SQL parameter, and
          supplies its generated name and scalar type to the host before the
          SQL edit is applied.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: composition-filter-can-add-sql-arguments
        kind: behavior
        statement: >-
          SQL arguments can be added from an empty query and from an expression
          that needs one. SQL parameter names bind explicitly to compatible
          graph variables; unused, missing, or incompatible bindings block
          save and execution with a local diagnostic.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: design-components-use-semantic-values
        kind: behavior
        statement: >-
          Input references an input variable, Text contains literal content or
          a string scalar reference, Table references a table result, and
          Metric references a display-compatible scalar. Domain validation
          rechecks these bindings when saving.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: composition-insertion-completes-before-edit
        kind: behavior
        statement: >-
          Inserting a component commits its placement, closes the picker, and
          leaves the canvas visible without opening an Inspector. This applies
          to Form and Saved SQL query-variable creation as well as literal
          Text and Input.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: composition-table-source-change-is-explicit
        kind: behavior
        statement: >-
          Selecting a placed Table or Metric exposes one variable-reference
          action. Changing it opens the same Variables, Forms, and Saved SQL
          picker and updates only that component reference; it never mutates a
          shared query variable.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: composition-table-and-metric-use-sql-results
        kind: behavior
        statement: >-
          Table renders a bounded table<Row> variable. Metric renders a
          compatible scalar variable whose query result was validated by Core.
          Empty, NULL, cardinality, unavailable, and execution-error states
          remain distinct; the browser does not aggregate pages.
        governed_by: [POL-000#rule.foundation-precedence, POL-004#rule.governance]
      - id: composition-binding-identifiers-stay-internal
        kind: quality
        statement: >-
          Binding-only component and query identifiers stay out of ordinary
          primary-path labels. Meaningful variable names, Form field names,
          SQL output aliases, Text content, and accessible names remain visible
          where they identify the value or operation.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance]
      - id: composition-mobile-workspace-accessibility
        kind: quality
        statement: >-
          At 320px, 375px, and 390px widths, variable selection uses a
          keyboard-operable drawer. Escape closes it, focus returns to its
          opener, icon actions have accessible names and visible focus, and
          interactive targets are at least 44px. Save keeps visible text.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance, POL-UI-007#rule.governance]
      - id: composition-runtime-input-accessibility
        kind: quality
        statement: >-
          At a 390px viewport, runtime Input components keep their visible and
          accessible variable names, provide at least 44px controls, follow
          component order during keyboard navigation, and cause no page-level
          horizontal overflow.
        governed_by: [POL-UI-002#rule.governance, POL-UI-005#rule.governance, POL-UI-007#rule.governance]
      - id: composition-mode-context-singular
        kind: quality
        statement: >-
          Design and Variables tab controls are the only visible owners of
          those mode names. Their panels do not repeat the selected mode as a
          visible heading and retain accessible tab relationships.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: composition-source-rows-show-name-once
        kind: quality
        statement: >-
          The variable rail presents each variable name once with its minimal
          kind icon. It does not add a common SQL subtitle, repeated type label,
          UUID, or explanatory row copy.
        governed_by: [POL-UI-002#rule.governance, POL-UI-006#rule.governance]
      - id: composition-mobile-overlays-are-exclusive
        kind: behavior
        statement: >-
          The binding picker and variable drawer have one modal focus owner.
          Opening one closes the other in the same transition. Escape or
          Cancel removes modal inert state, closes the overlay, and restores
          focus to a visible control.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: composition-history-hides-revision-identifiers
        kind: behavior
        statement: >-
          Composition History shows operation, timestamp, and current-revision
          state without rendering revision IDs or technical-detail disclosures.
          Exact revision identity stays in the internal route target.
        governed_by: [POL-UI-005#rule.governance]
      - id: composition-text-inspector-literal-editing
        kind: behavior
        statement: >-
          Selecting a Text component exposes a multiline literal editor and
          style control without a redundant Content selector or repeated
          visible heading.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
      - id: composition-text-inspector-variable-binding
        kind: behavior
        statement: >-
          Text can explicitly reference only a string scalar variable and can
          return to literal editing. The selected variable name appears once;
          it is never inferred from matching names.
        governed_by: [POL-UI-002#rule.governance, POL-UI-007#rule.governance]
    bindings:
      - id: graph-draft-and-atomic-bindings
        role: verification
        facet: verification
        responsibility: Verify strict graph-only serialization, typed bindings, atomic Form and Saved SQL insertion, explicit aggregate choice, and reference-only rebinding. The broader Composition SQL argument requirement remains unverified because no current test covers host-side variable and Input creation in the same draft update.
        targets:
          - id: graph-draft-shape
            adapter: typescript
            path: frontend/src/lib/composition-variable-binding.test.ts
            selector: { kind: test, name: "serializes only the strict Composition document envelope and spec" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-no-label-or-tag-fields
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-draft]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-variable-binding.test.ts, test: "serializes only the strict Composition document envelope and spec" } }
          - id: form-table-picker
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.test.tsx
            selector: { kind: test, name: "inserts a Form table with only a variable reference" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.form-selection-creates-inline-sql
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-variable-binding-picker]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionVariableBindingPicker.test.tsx, test: "inserts a Form table with only a variable reference" } }
          - id: form-metric-picker
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.test.tsx
            selector: { kind: test, name: "requires explicit aggregate selection for a Form metric" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.form-selection-creates-inline-sql
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-variable-binding-picker]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionVariableBindingPicker.test.tsx, test: "requires explicit aggregate selection for a Form metric" } }
          - id: saved-sql-picker
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.test.tsx
            selector: { kind: test, name: "pins exact Saved SQL revision and chosen scalar column" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-variable-binding-picker]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionVariableBindingPicker.test.tsx, test: "pins exact Saved SQL revision and chosen scalar column" } }
          - id: query-workspace-and-evaluation
            adapter: typescript
            path: frontend/src/components/CompositionStudioSync.test.tsx
            selector: { kind: test, name: "runs the selected query through the graph evaluator" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-uses-shared-workspace
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-data-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionStudioSync.test.tsx, test: "runs the selected query through the graph evaluator" } }
          - id: composition-filter-creates-typed-sql-arguments
            adapter: typescript
            path: frontend/src/components/SqlStructureToolbar.test.tsx
            selector: { kind: test, name: "creates a typed argument when filtering a fresh Form query" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.sql-filter-adds-typed-parameter
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.sql-structure-toolbar]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlStructureToolbar.test.tsx, test: "creates a typed argument when filtering a fresh Form query" } }
          - id: mode-and-insertion
            adapter: typescript
            path: frontend/src/components/CompositionStudioSync.test.tsx
            selector: { kind: test, name: "offers only Design and Variables and inserts a Table without opening an Inspector" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-mode-context-singular
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-studio]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionStudioSync.test.tsx, test: "offers only Design and Variables and inserts a Table without opening an Inspector" } }
          - id: reference-rebinding
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.test.tsx
            selector: { kind: test, name: "uses the same picker to change only an existing component reference" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-table-source-change-is-explicit
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-variable-binding-picker]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionVariableBindingPicker.test.tsx, test: "uses the same picker to change only an existing component reference" } }
          - id: narrow-focus-restoration
            adapter: typescript
            path: frontend/src/components/CompositionStudioMobile.test.tsx
            selector: { kind: test, name: "keeps one modal owner and restores focus after Escape" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-mobile-overlays-are-exclusive
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-studio]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionStudioMobile.test.tsx, test: "keeps one modal owner and restores focus after Escape" } }
          - id: runtime-input-mobile-accessibility
            adapter: typescript
            path: e2e/composition-invalid-variable-input.test.ts
            selector: { kind: test, name: "invalid_raw_input_blocks_query_and_stale_result" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-runtime-input-accessibility
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-result-renderer]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-invalid-variable-input.test.ts, test: "invalid_raw_input_blocks_query_and_stale_result" } }
