schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Typed variable graph Composition Studio
requirements:
  - id: REQ-FE-082
    title: Composition SQL templates and Form seeds
    description: >-
      Composition SQL source uses Rust-owned template normalization and typed
      bindings. Form-derived SQL uses explicit projectable user-data columns;
      the browser does not add metadata or wildcard fallbacks.
    priority: high
    status: implemented
    criteria:
      - id: inline-template-parameters
        kind: behavior
        statement: >-
          Composition inline SQL stores its authored source with `{{name}}`
          references. Rust derives the execution SQL before graph validation
          and request compilation, and preserves marker-like text in strings,
          quoted identifiers, and comments. Every discovered parameter has one
          explicit binding to a compatible scalar graph variable; malformed,
          missing, unused, or incompatible bindings fail before query
          execution.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-002#rule.governance]
      - id: form-seed-projectable-columns
        kind: behavior
        statement: >-
          A SQL Form seed explicitly projects every supplied
          projectable user-data column in source order, uses quoted identifiers
          and unique aliases, and excludes metadata fields from the projection.
          The generated SQL contains no `SELECT *` or synthetic `LIMIT`.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-006#rule.governance]
      - id: form-seed-without-projectable-columns
        kind: behavior
        statement: >-
          A Form with no projectable user-data columns returns the typed Rust
          diagnostic. The SQL editor applies no partial seed, and metadata
          such as `_ugoite_id` is not added as a fallback projection.
        governed_by: [POL-000#rule.foundation-precedence, POL-UI-006#rule.governance]
