          - id: projectable-snapshot-fields
            adapter: typescript
            path: frontend/src/components/CompositionDataWorkspace.test.tsx
            selector:
              kind: test
              name: omits nonprojectable Form fields from the projection choices
            claims:
              - kind: verifies
                criterion: REQ-FE-074#criterion.source-design-entry
                covers: [
