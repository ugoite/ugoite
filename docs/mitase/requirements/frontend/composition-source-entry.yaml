          - id: route-source-first-table
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/new.test.tsx
            selector:
              kind: test
              name: adds a source and its initial table together from Design
            claims:
              - kind: verifies
                criterion: REQ-FE-074#criterion.source-design-entry
                covers: [
                  FEAT-COMP-005#binding.studio-design-runtime/target.browser-studio-mode,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: "src/routes/spaces/[space_id]/compositions/new.test.tsx",
                    test: adds a source and its initial table together from Design,
                  },
                }
