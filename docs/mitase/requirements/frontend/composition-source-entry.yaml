  - id: REQ-FE-077
    title: Form-assisted Saved SQL Summary Authoring
    description: A no-code summary flow helps users create ordinary Saved SQL from a Form and then use its declared result column in a Metric.
    priority: medium
    status: planned
    criteria:
      - id: form-summary-is-saved-sql
        kind: behavior
        statement: >-
          When Studio offers Form-assisted summary authoring, the user can choose
          a Form, a common calculation such as COUNT, SUM, or AVG, and its field
          when required. The
          flow creates and saves an ordinary SQL query as Space Knowledge, then
          selects its exact Saved SQL revision and declared result column for the
          Metric. No operation, Form FieldId, generated expression, or hidden
          aggregation setting is persisted in the Metric. The same Saved SQL
          result remains available to Table and future result-display
          components.
        governed_by: [POL-UI-002#rule.governance, POL-UI-006#rule.governance]
