category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-074
    title: Composition Design Source Entry
    description: Design is the source-authoring entry point for adding or reusing Composition data sources.
    priority: medium
    status: implemented
    criteria:
      - id: source-design-entry
        kind: behavior
        statement: >-
          Design insertion always offers Text and Data, including on an empty
          canvas. Data opens Table and Metric choices and lists sources already
          referenced by the Composition before catalog sources. Selecting an
          existing source in Table mode immediately inserts a table without a
          label step. Browsing a Form or exact Saved SQL revision in Table mode
          adds that source and its table together. Metric mode offers Saved SQL
          sources and lets the user choose one declared displayable output
          column. Form-assisted summaries, when offered, create an ordinary
          Saved SQL source before Metric selection; calculations never become
          Metric settings. A newly browsed Saved SQL source enters the same
          setup flow. The user previews the configured Metric through the server
          before insertion; a failed preview does not add a display. A Saved SQL
          Metric requires exactly one result row, and the chosen column must be
          a displayable scalar; other columns in that row may be used by other
          Metrics or a Table. EntryQuery sources remain Table queries and do not
          supply Metric values. Metric choices never show field IDs or generated
          ordinals. Component labels are omitted during
          insertion and remain optional Inspector edits after selection. New
          Form sources initially project up to 64 projectable Form fields and
          omit Created and Updated system fields, while their snapshot includes
          every Composition-expressible Form field up to the document collection
          limit so later projection, filter, and sort edits stay resolvable.
          Filter and sort choices are limited to fields present in the source
          snapshot. Projection choices include only projectable snapshot fields,
          while already-selected nonprojectable fields remain available for
          removal. Preview remains the fallback when no Form field is projectable,
          and can be selected only when the source snapshot covers every current
          Form field. The Data Sources sidebar lists only Composition-referenced
          sources; one footer action opens the Form or Saved SQL picker to add a
          source without creating a display, and the selected source can be
          removed only while no display references it.

        governed_by: [
          POL-UI-002#rule.governance,
          POL-UI-006#rule.governance,
          POL-UI-007#rule.governance,
        ]
    bindings:
      - id: design-source-entry-verification
        role: verification
        facet: verification
        responsibility: Verify the Design source picker, one-step source creation and reuse, and single source-action ownership with focused frontend tests.
        targets:
          - id: current-composition-source-order
            adapter: typescript
            path: frontend/src/components/CompositionSourcePicker.test.tsx
            selector:
              kind: test
              name: puts current Composition sources first and activates them by hidden draft identity
            claims:
              - kind: verifies
                criterion: REQ-FE-074#criterion.source-design-entry
                covers: [
                  FEAT-COMP-005#binding.studio-design-runtime/target.browser-studio-source-picker,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/CompositionSourcePicker.test.tsx,
                    test: puts current Composition sources first and activates them by hidden draft identity,
                  },
                }

          - id: current-source-reuse
            adapter: typescript
            path: frontend/src/components/CompositionStudioSync.test.tsx
            selector:
              kind: test
              name: puts current sources first and reuses one from Design
            claims:
              - kind: verifies
                criterion: REQ-FE-074#criterion.source-design-entry
                covers: [
                  FEAT-COMP-005#binding.studio-design-runtime/target.browser-studio-mode,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/CompositionStudioSync.test.tsx,
                    test: puts current sources first and reuses one from Design,
