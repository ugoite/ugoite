schema: mitase/authoring/v2
kind: requirements
namespace: frontend
category: Frontend route, component, and interaction requirements
requirements:
  - id: REQ-FE-005
    title: Markdown Editor
    description: The frontend provides a Markdown editor with editing, preview, save, and safe rendered-preview behavior for Entry content.
    priority: high
    status: implemented
    criteria:
      - id: edit-preview-save
        kind: behavior
        statement: The Markdown editor exposes editable content, a rendered preview, and explicit save behavior including the supported keyboard shortcut.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: safe-preview
        kind: security
        statement: Rendered Markdown preview preserves supported formatting while treating raw HTML as text rather than executable markup.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: markdown-editor-verification
        role: verification
        facet: verification
        responsibility: Verify safe preview rendering through the exact frontend test.
        targets:
          - id: preview-safety
            adapter: typescript
            path: frontend/src/lib/markdown.test.ts
            selector: { kind: test, name: "escapes raw HTML while keeping simple formatting" }
            claims:
              - kind: verifies
                criterion: REQ-FE-005#criterion.safe-preview
                covers: [FEAT-FE-003#binding.frontend/target.markdown-utils]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/markdown.test.ts, test: "escapes raw HTML while keeping simple formatting" } }
  - id: REQ-FE-005A
    title: Editor Content Graceful Handling
    description: The editor treats missing Markdown content as empty content, keeps new-entry draft content available immediately, and remains safe when previewing missing content.
    priority: high
    status: implemented
    criteria:
      - id: missing-content
        kind: quality
        statement: Undefined or null editor content is rendered as an empty string and never as the literal text "undefined" or "null".
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
      - id: new-entry-preview
        kind: behavior
        statement: New-entry draft content is available without waiting for a persisted Entry resource, and preview mode remains renderable when content is missing.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
  - id: REQ-FE-006
    title: Optimistic Updates
    description: Supported frontend mutations may update the current UI optimistically while the same server-backed request completes; this does not introduce offline storage or background synchronization.
    priority: high
    status: implemented
    criteria:
      - id: server-backed-optimistic-mutation
        kind: behavior
        statement: Supported Entry mutations reflect the expected result in the current UI before the server-backed request completes, while remaining part of the same request flow rather than an offline synchronization system.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
  - id: REQ-FE-009
    title: Conflict Refresh Guidance
    description: On a revision conflict, the frontend informs the user, keeps the current draft visible, and requires an explicit refresh before loading the latest server revision.
    priority: high
    status: implemented
    criteria:
      - id: conflict-guidance
        kind: behavior
        statement: A revision conflict is surfaced in the editor without replacing the current draft, and refreshing is an explicit user action.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: conflict-verification
        role: verification
        facet: verification
        responsibility: Verify conflict messaging and draft-preserving refresh guidance through exact frontend tests.
        targets:
          - id: structured-entry-conflict
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.safety.test.tsx
            selector: { kind: test, name: "keeps the user draft on 409, shows the server revision, and re-saves on the adopted base" }
            claims:
              - kind: verifies
                criterion: REQ-FE-009#criterion.conflict-guidance
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/EntryDetailPane.safety.test.tsx, test: "keeps the user draft on 409, shows the server revision, and re-saves on the adopted base" } }
              - kind: verifies
                criterion: REQ-JOURNEY-003#criterion.conflict-recovery-guidance
                covers: [FEAT-JOURNEY-002#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/EntryDetailPane.safety.test.tsx, test: "keeps the user draft on 409, shows the server revision, and re-saves on the adopted base" } }
  - id: REQ-FE-010
    title: Editor Content Persistence During Save
    description: Saving an Entry sends the edited Markdown without reloading or overwriting the current editor draft.
    priority: high
    status: implemented
    criteria:
      - id: preserve-draft
        kind: behavior
        statement: The editor does not replace the current draft during or after a save; edits made while a save is in flight remain unsaved until explicitly saved.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: save-preservation-verification
        role: verification
        facet: verification
        responsibility: Verify save completion and draft preservation through exact Entry detail tests.
        targets:
          - id: structured-draft-navigation
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.safety.test.tsx
            selector: { kind: test, name: "confirms unsaved-work navigation through the shared dialog, never window.confirm" }
            claims:
              - kind: verifies
                criterion: REQ-FE-010#criterion.preserve-draft
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/EntryDetailPane.safety.test.tsx, test: "confirms unsaved-work navigation through the shared dialog, never window.confirm" } }
  - id: REQ-FE-011
    title: Editor Content Sync on Entry Switch and Explicit Refresh
    description: The editor loads server content when the selected Entry changes or the user explicitly refreshes, while preserving the current draft during unrelated resource updates and save completion.
    priority: high
    status: implemented
    criteria:
      - id: selection-and-refresh-sync
        kind: behavior
        statement: Entry selection changes and an explicit Refresh action replace the editor content with the selected server revision; unrelated save completion does not implicitly replace the draft.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: editor-sync-verification
        role: verification
        facet: verification
        responsibility: Verify selected-entry and explicit-refresh synchronization through exact Entry detail tests.
        targets:
          - id: structured-draft-session
            adapter: typescript
            path: frontend/src/lib/create-entry-draft-session.test.ts
            selector: { kind: test, name: "keeps independent structured work for each Form and returns copies" }
            claims:
              - kind: verifies
                criterion: REQ-FE-011#criterion.selection-and-refresh-sync
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/create-entry-draft-session.test.ts, test: "keeps independent structured work for each Form and returns copies" } }
          # PR4 (UX #2866) removed the explicit Refresh action: the single
          # detail action bar carries save/history/info/delete only. The
          # selection-sync target above still verifies the criterion's
          # selection half; refresh coverage is an explicit evidence gap
          # until the requirement is migrated.
  - id: REQ-FE-012
    title: Consecutive Save Support
    description: Multiple consecutive saves on the same Entry use the revision returned by each successful save as the parent revision for the next update.
    priority: high
    status: implemented
    criteria:
      - id: consecutive-saves
        kind: behavior
        statement: A sequence of successful Entry saves advances the local revision identity so every subsequent save uses the current server revision.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
  - id: REQ-FE-013
    title: Save Must Actually Persist to Server
    description: Saving an Entry sends the current edited Markdown and the current parent revision to the server so the edited content is persisted.
    priority: high
    status: implemented
    criteria:
      - id: server-persistence
        kind: behavior
        statement: The Entry save request contains the current editor Markdown and the revision identity required for server persistence.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: server-persistence-verification
        role: verification
        facet: verification
        responsibility: Verify the current editor Markdown and parent revision are sent during save through the exact Entry detail test.
        targets:
          - id: structured-entry-save
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "should update entry with correct parent_revision_id" }
            claims:
              - kind: verifies
                criterion: REQ-FE-013#criterion.server-persistence
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should update entry with correct parent_revision_id" } }
              - kind: verifies
                criterion: REQ-ENTRY-003#criterion.update
                covers: [FEAT-ENTRY-001#binding.frontend-implementation/target.entry-api]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "should update entry with correct parent_revision_id" } }
  - id: REQ-FE-038
    title: Form Validation Feedback in Editor
    description: Form validation failures are shown as readable warnings while the current Entry draft remains available for correction.
    priority: high
    status: implemented
    criteria:
      - id: validation-feedback
        kind: behavior
        statement: A save rejected by Form validation produces readable field or validation messages in the Entry editor.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: validation-feedback-verification
        role: verification
        facet: verification
        responsibility: Verify Form validation warning rendering through the exact Entry detail test.
        targets:
          - id: structured-validation
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-037: blocks submission when required fields are empty" }
            claims:
              - kind: verifies
                criterion: REQ-FE-038#criterion.validation-feedback
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-037: blocks submission when required fields are empty" } }
  - id: REQ-FE-052
    title: Form-Aware Entry Editor Guidance
    description: Entry editor guidance is derived from the active Form and does not invent field headings when a Form has no suitable structured fields.
    priority: medium
    status: implemented
    criteria:
      - id: form-derived-guidance
        kind: behavior
        statement: The editor uses the active Form's fields for guidance, preserves typed values, and explains an unstructured Form without a fabricated field example.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: form-guidance-verification
        role: verification
        facet: verification
        responsibility: Verify Form-derived editor guidance and typed controls through exact frontend tests.
        targets:
          - id: form-fields
            adapter: typescript
            path: frontend/src/lib/client.test.ts
            selector: { kind: test, name: "entryApi.createFromWebform creates entry" }
            claims:
              - kind: verifies
                criterion: REQ-FE-052#criterion.form-derived-guidance
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/client.test.ts, test: "entryApi.createFromWebform creates entry" } }
          - id: no-structured-fields
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "#2876: renders the no-columns empty state as plain FieldStack-adjacent text without card chrome" }
            claims:
              - kind: verifies
                criterion: REQ-FE-052#criterion.form-derived-guidance
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "#2876: renders the no-columns empty state as plain FieldStack-adjacent text without card chrome" } }
          - id: new-entry-form-route
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/new.test.tsx"
            selector: { kind: test, name: "reuses the shared editor and prefers the Form requested by the route" }
            claims:
              - kind: verifies
                criterion: REQ-FE-052#criterion.form-derived-guidance
                covers: [FEAT-FE-003#binding.frontend/target.new-entry-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/entries/new.test.tsx", test: "reuses the shared editor and prefers the Form requested by the route" } }
  - id: REQ-FE-053
    title: Entry Workflow Guidance Localization
    description: Entry creation and editing guidance uses the active frontend locale consistently for hints, warnings, and helper actions.
    priority: medium
    status: implemented
    criteria:
      - id: localized-guidance
        kind: behavior
        statement: The default English workflow does not display Japanese-only guidance, while the Japanese workflow renders localized Entry editor guidance.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: localization-verification
        role: verification
        facet: verification
        responsibility: Verify localized Entry editor guidance and warnings through exact frontend tests.
        targets:
          - id: localized-warnings
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-053: keeps web-form guidance free of Markdown-only instructions" }
            claims:
              - kind: verifies
                criterion: REQ-FE-053#criterion.localized-guidance
                covers: [FEAT-FE-003#binding.frontend/target.entry-detail-pane]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-053: keeps web-form guidance free of Markdown-only instructions" } }
  - id: REQ-FE-057
    title: Full Create-Entry Chat Flow
    description: Chat-mode entry creation walks through optional and required Form fields predictably, keeps completion rules explicit, and submits the collected answers.
    priority: medium
    status: implemented
    criteria:
      - id: chat-flow
        kind: behavior
        statement: Chat mode lets users answer, skip, review, and navigate optional fields while requiring non-empty answers for required fields before submitting collected entry input.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-013#rule.governance, POL-014#rule.governance]
    bindings:
      - id: chat-flow-verification
        role: verification
        facet: verification
        responsibility: Verify the complete chat question flow, required-field guardrails, review navigation, optional-field skipping, and submission through exact frontend tests.
        targets:
          - id: optional-fields
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat mode walks through optional fields instead of only required ones" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat mode walks through optional fields instead of only required ones" } }
          - id: deprecated-required
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat mode treats deprecated required fields as optional" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat mode treats deprecated required fields as optional" } }
          - id: step-pills
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat step pills react to answers and current step" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat step pills react to answers and current step" } }
          - id: review-navigation
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat step pills let users jump back to answered questions" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat step pills let users jump back to answered questions" } }
          - id: required-advance
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat mode blocks advancing past an empty required field" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat mode blocks advancing past an empty required field" } }
          - id: required-skip
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat mode blocks skipping a required field" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat mode blocks skipping a required field" } }
          - id: submit-answers
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: chat mode submits answered required and optional fields" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: chat mode submits answered required and optional fields" } }
          - id: clear-optional
            adapter: typescript
            path: frontend/src/components/create-dialogs.test.tsx
            selector: { kind: test, name: "REQ-FE-057: skipping an optional chat field clears its draft answer" }
            claims:
              - kind: verifies
                criterion: REQ-FE-057#criterion.chat-flow
                covers: [FEAT-FE-004#binding.frontend/target.entry-dialog]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/create-dialogs.test.tsx, test: "REQ-FE-057: skipping an optional chat field clears its draft answer" } }
