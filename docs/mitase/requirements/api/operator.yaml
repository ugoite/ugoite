  - id: REQ-API-017
    title: Konase Host write confirmation and outcome
    description: A Konase Host must preserve the per-call user authorization and confirmed-outcome boundary when temporary model Context leads to a proposed Knowledge mutation. Selected read Context does not authorize a write.
    priority: high
    status: implemented
    criteria:
      - id: request-scoped-write-approval
        kind: security
        statement: Before dispatching a model-requested Knowledge write, the Host requires a one-time explicit approval bound to the active Work, request ID, Space, operation, and original argument snapshot; denial, missing confirmation, expiry, disposal, or a changed Space prevents dispatch.
        governed_by: [POL-010#rule.governance, POL-011#rule.governance, POL-015#rule.governance]
      - id: receipt-gated-knowledge-outcome
        kind: behavior
        statement: The Host reports a Knowledge mutation as saved and exposes Work Undo only after validating the corresponding MCP mutation receipt; a model response, approval, missing receipt, or malformed receipt does not establish success, and a later failed write does not erase an earlier confirmed mutation.
        governed_by: [POL-010#rule.governance, POL-011#rule.governance, POL-015#rule.governance]
    bindings:
      - id: host-write-verification
        role: verification
        facet: verification
        responsibility: Verify the independent one-time approval and receipt-gated outcome across the CLI Host, Browser Host, and Browser panel.
        targets:
          - id: cli-approval-denial
            adapter: rust
            path: crates/ugoite-cli/src/commands/konase.rs
            selector: { kind: test, name: tests::denied_noninteractive_write_sends_no_mcp_call }
            claims:
              - kind: verifies
                criterion: REQ-API-017#criterion.request-scoped-write-approval
                covers: [FEAT-API-001#binding.konase-host/target.cli-write-host]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-cli, test: tests::denied_noninteractive_write_sends_no_mcp_call } }
          - id: cli-receipt-validation
            adapter: rust
            path: crates/ugoite-cli/src/commands/konase.rs
            selector: { kind: test, name: tests::save_and_undo_receipts_must_match_the_mutation_contract }
            claims:
              - kind: verifies
                criterion: REQ-API-017#criterion.receipt-gated-knowledge-outcome
                covers: [FEAT-API-001#binding.konase-host/target.cli-write-host]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-cli, test: tests::save_and_undo_receipts_must_match_the_mutation_contract } }
          - id: browser-approval-denial
            adapter: typescript
            path: frontend/src/lib/konase/host.test.ts
            selector: { kind: test, name: "denies a write without dispatch and consumes each approval once" }
            claims:
              - kind: verifies
                criterion: REQ-API-017#criterion.request-scoped-write-approval
                covers: [FEAT-API-001#binding.konase-host/target.browser-write-host]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/konase/host.test.ts, test: "denies a write without dispatch and consumes each approval once" } }
          - id: browser-receipt-and-undo
            adapter: typescript
            path: frontend/src/lib/konase/host.test.ts
            selector: { kind: test, name: "does not report saved or undoable when a save receipt is missing" }
