schema: mitase/authoring/v2
kind: requirements
namespace: e2e
category: Browser smoke, cross-layer integration, and navigation stability
requirements:
  - id: REQ-E2E-001
    title: Browser HTML boundary
    description: Public and authenticated browser routes return real HTML documents, and the root response declares the HTML media type.
    priority: high
    status: implemented
    criteria:
      - id: html-document
        kind: behavior
        statement: The browser root route returns a complete HTML document with a DOCTYPE.
        governed_by: [POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: html-content-type
        kind: behavior
        statement: The browser root response declares a text/html content type.
        governed_by: [POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: browser-smoke-verification
        role: verification
        facet: verification
        responsibility: Verify the root browser document and response media type through exact Playwright smoke cases.
        targets:
          - id: doctype-case
            adapter: typescript
            path: e2e/smoke.test.ts
            selector: { kind: test, name: GET / returns HTML with DOCTYPE }
            claims:
              - kind: verifies
                criterion: REQ-E2E-001#criterion.html-document
                covers: [FEAT-E2E-001#binding.frontend/target.root-route]
                runner: { runner: e2e-playwright, arguments: { file: e2e/smoke.test.ts, test: GET / returns HTML with DOCTYPE } }
          - id: content-type-case
            adapter: typescript
            path: e2e/smoke.test.ts
            selector: { kind: test, name: GET / has correct content-type }
            claims:
              - kind: verifies
                criterion: REQ-E2E-001#criterion.html-content-type
                covers: [FEAT-E2E-001#binding.frontend/target.root-route]
                runner: { runner: e2e-playwright, arguments: { file: e2e/smoke.test.ts, test: GET / has correct content-type } }

  - id: REQ-E2E-002
    title: API and frontend integration
    description: 'The browser and server work together across Space and Entry routes: the browser renders an Entry returned by the API, and the Spaces and Entries API surfaces return list data that the browser can use.'
    priority: high
    status: implemented
    criteria:
      - id: entry-route
        kind: behavior
        statement: A newly created Entry can be opened through its browser route and rendered as an HTML document with its title and Form navigation.
        governed_by: [POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: space-and-entry-lists
        kind: behavior
        statement: The Space and Entry list operations return successful JSON arrays that can seed the browser-backed workflow.
        governed_by: [POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: api-frontend-verification
        role: verification
        facet: verification
        responsibility: Verify the server-backed browser route and list responses through exact Playwright smoke cases.
        targets:
          - id: entry-route-case
            adapter: typescript
            path: e2e/smoke.test.ts
            selector: { kind: test, name: GET /spaces/:space_id/entries/:id returns HTML }
            claims:
              - kind: verifies
                criterion: REQ-E2E-002#criterion.entry-route
                covers:
                  - FEAT-E2E-001#binding.frontend/target.entry-route
                runner: { runner: e2e-playwright, arguments: { file: e2e/smoke.test.ts, test: GET /spaces/:space_id/entries/:id returns HTML } }
          - id: space-list-case
            adapter: typescript
            path: e2e/smoke.test.ts
            selector: { kind: test, name: GET /spaces returns list }
            claims:
              - kind: verifies
                criterion: REQ-E2E-002#criterion.space-and-entry-lists
                covers:
                  - FEAT-E2E-001#binding.server/target.list-spaces
                runner: { runner: e2e-playwright, arguments: { file: e2e/smoke.test.ts, test: GET /spaces returns list } }
          - id: entry-list-case
            adapter: typescript
            path: e2e/smoke.test.ts
            selector: { kind: test, name: GET /spaces/:space_id/entries returns list }
            claims:
              - kind: verifies
                criterion: REQ-E2E-002#criterion.space-and-entry-lists
                covers:
                  - FEAT-E2E-001#binding.server/target.list-entries
                runner: { runner: e2e-playwright, arguments: { file: e2e/smoke.test.ts, test: GET /spaces/:space_id/entries returns list } }

  - id: REQ-E2E-003
    title: Fixed surface palette UI flows
    description: The UI keeps the approved v5 surface palette usable across the operating system light and dark color modes, including Space navigation and the dashboard route.
    priority: high
    status: implemented
    criteria:
      - id: fixed-palette-workflows
        kind: behavior
        statement: The dashboard remains usable with the single approved v5 surface palette; product-specific theme variants are not part of the v0.1 UI contract.
        governed_by: [POL-004#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
      - id: system-color-mode
        kind: quality
        statement: The fixed surface palette follows the operating system's light or dark color preference without losing the active Space workflow.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
      - id: responsive-mobile-workflows
        kind: quality
        statement: The server-backed Space workflow remains usable at 390x844 and 360x800, with mobile navigation, one-column Entry layout, wrapping Form controls, safe-area spacing, and touch-sized controls.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
    bindings:
      - id: surface-verification
        role: verification
        facet: verification
        responsibility: Verify the fixed surface palette, Space navigation, and operating system light/dark color modes through exact Playwright cases.
        targets:
          - id: light-mode-case
            adapter: typescript
            path: e2e/ui-surface.test.ts
            selector: { kind: test, name: 'REQ-E2E-003: the fixed surface palette follows the light system color mode' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-003#criterion.fixed-palette-workflows
                covers:
                  - FEAT-E2E-002#binding.application/target.fixed-palette
                runner: { runner: e2e-playwright, arguments: { file: e2e/ui-surface.test.ts, test: 'REQ-E2E-003: the fixed surface palette follows the light system color mode' } }
              - kind: verifies
                criterion: REQ-E2E-003#criterion.system-color-mode
                covers:
                  - FEAT-E2E-002#binding.application/target.system-color-mode
                runner: { runner: e2e-playwright, arguments: { file: e2e/ui-surface.test.ts, test: 'REQ-E2E-003: the fixed surface palette follows the light system color mode' } }
          - id: mobile-390-case
            adapter: typescript
            path: e2e/ui-mobile-regression.test.ts
            selector: { kind: test, name: 'REQ-E2E-003: preserves the Space UI at 390x844' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-003#criterion.responsive-mobile-workflows
                covers:
                  - FEAT-E2E-002#binding.application/target.mobile-regression
                runner: { runner: e2e-playwright, arguments: { file: e2e/ui-mobile-regression.test.ts, test: 'REQ-E2E-003: preserves the Space UI at 390x844' } }
          - id: mobile-360-case
            adapter: typescript
            path: e2e/ui-mobile-regression.test.ts
            selector: { kind: test, name: 'REQ-E2E-003: preserves the Space UI at 360x800' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-003#criterion.responsive-mobile-workflows
                covers:
                  - FEAT-E2E-002#binding.application/target.mobile-regression
                runner: { runner: e2e-playwright, arguments: { file: e2e/ui-mobile-regression.test.ts, test: 'REQ-E2E-003: preserves the Space UI at 360x800' } }
          - id: dark-mode-case
            adapter: typescript
            path: e2e/ui-surface.test.ts
            selector: { kind: test, name: 'REQ-E2E-003: the fixed surface palette follows the dark system color mode' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-003#criterion.fixed-palette-workflows
                covers:
                  - FEAT-E2E-002#binding.application/target.fixed-palette
                runner: { runner: e2e-playwright, arguments: { file: e2e/ui-surface.test.ts, test: 'REQ-E2E-003: the fixed surface palette follows the dark system color mode' } }
              - kind: verifies
                criterion: REQ-E2E-003#criterion.system-color-mode
                covers:
                  - FEAT-E2E-002#binding.application/target.system-color-mode
                runner: { runner: e2e-playwright, arguments: { file: e2e/ui-surface.test.ts, test: 'REQ-E2E-003: the fixed surface palette follows the dark system color mode' } }

  - id: REQ-E2E-004
    title: Dynamic navigation stability
    description: Traversing the current browser routes must not produce browser console errors, runtime page errors, or SolidJS fallback screens.
    priority: high
    status: implemented
    criteria:
      - id: route-traversal
        kind: behavior
        statement: Dynamic traversal visits at least the seeded Space routes and discovered internal links without falling into a missing-page or framework fallback screen.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
      - id: console-stability
        kind: quality
        statement: Dynamic traversal completes without browser console errors.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
      - id: runtime-stability
        kind: quality
        statement: Dynamic traversal completes without uncaught browser runtime errors.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: navigation-verification
        role: verification
        facet: verification
        responsibility: Verify route traversal and browser/runtime error invariants through the exact dynamic-navigation Playwright case.
        targets:
          - id: traversal-case
            adapter: typescript
            path: e2e/navigation.test.ts
            selector: { kind: test, name: 'REQ-E2E-004: dynamic traversal has no console or SolidJS errors' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-004#criterion.route-traversal
                covers:
                  - FEAT-E2E-001#binding.frontend/target.spaces-route
                  - FEAT-E2E-001#binding.frontend/target.entry-route
                runner: { runner: e2e-playwright, arguments: { file: e2e/navigation.test.ts, test: 'REQ-E2E-004: dynamic traversal has no console or SolidJS errors' } }
              - kind: verifies
                criterion: REQ-E2E-004#criterion.console-stability
                covers: [FEAT-E2E-001#binding.frontend/target.spaces-route]
                runner: { runner: e2e-playwright, arguments: { file: e2e/navigation.test.ts, test: 'REQ-E2E-004: dynamic traversal has no console or SolidJS errors' } }
              - kind: verifies
                criterion: REQ-E2E-004#criterion.runtime-stability
                covers: [FEAT-E2E-001#binding.frontend/target.spaces-route]
                runner: { runner: e2e-playwright, arguments: { file: e2e/navigation.test.ts, test: 'REQ-E2E-004: dynamic traversal has no console or SolidJS errors' } }

  - id: REQ-E2E-005
    title: Canonical docsite navigation
    description: The documentation homepage and Get started path expose the canonical Ugoite information architecture at both small and desktop viewports.
    priority: high
    status: implemented
    criteria:
      - id: mobile-sidebar
        kind: behavior
        statement: At a small viewport, the documentation homepage exposes links to the canonical Ugoite documentation paths.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance, POL-014#rule.governance]
      - id: desktop-sidebar
        kind: quality
        statement: At a desktop viewport, the documentation homepage exposes links to the canonical Ugoite documentation paths.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance]
      - id: beginner-path
        kind: behavior
        statement: The Get started page exposes the canonical Quickstart path for the documented beginner journey.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
      - id: homepage-navigation
        kind: behavior
        statement: The documentation homepage preserves its hero content and canonical top-level paths at both mobile and desktop viewport sizes.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: responsive-navigation-verification
        role: verification
        facet: verification
        responsibility: Verify canonical documentation route reachability at small and desktop viewport sizes through one Ugoite-owned Playwright smoke case.
        targets:
          - id: canonical-paths-case
            adapter: typescript
            path: e2e/docsite-mobile-nav.test.ts
            selector: { kind: test, name: 'REQ-E2E-005: homepage exposes canonical documentation paths' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-005#criterion.mobile-sidebar
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-mobile-nav.test.ts, test: 'REQ-E2E-005: homepage exposes canonical documentation paths' } }
              - kind: verifies
                criterion: REQ-E2E-005#criterion.desktop-sidebar
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-mobile-nav.test.ts, test: 'REQ-E2E-005: homepage exposes canonical documentation paths' } }
              - kind: verifies
                criterion: REQ-E2E-009#criterion.desktop-layout
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-mobile-nav.test.ts, test: 'REQ-E2E-005: homepage exposes canonical documentation paths' } }
              - kind: verifies
                criterion: REQ-E2E-005#criterion.beginner-path
                covers:
                  - FEAT-E2E-002#binding.docsite/target.docsite-config
                  - FEAT-E2E-002#binding.docsite/target.get-started-path
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-mobile-nav.test.ts, test: 'REQ-E2E-005: homepage exposes canonical documentation paths' } }
              - kind: verifies
                criterion: REQ-E2E-005#criterion.homepage-navigation
                covers:
                  - FEAT-E2E-002#binding.docsite/target.homepage
                  - FEAT-E2E-002#binding.docsite/target.docsite-config
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-mobile-nav.test.ts, test: 'REQ-E2E-005: homepage exposes canonical documentation paths' } }
              - kind: verifies
                criterion: REQ-E2E-009#criterion.responsive-layout
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-mobile-nav.test.ts, test: 'REQ-E2E-005: homepage exposes canonical documentation paths' } }

  - id: REQ-E2E-006
    title: Docsite internal link integrity
    description: Docsite internal page links resolve without 404 responses under a non-root base path, and the build shell loads the repository-level docs directory directly through the native Starlight and Sätteri pipeline.
    priority: high
    status: implemented
    criteria:
      - id: base-path-integrity
        kind: behavior
        statement: Internal docsite links remain within the configured non-root base path and resolve without 404 responses.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance]
      - id: repository-docs-source
        kind: quality
        statement: The docsite content loader and Starlight integration read the repository-level docs directory directly without a hand-authored second route tree.
        governed_by: [POL-006#rule.governance, POL-013#rule.governance]
      - id: link-rewrite
        kind: behavior
        statement: Repository Markdown links are rewritten to Starlight directory routes while external links remain unchanged.
        governed_by: [POL-006#rule.governance, POL-013#rule.governance]
    bindings:
      - id: link-integrity-verification
        role: verification
        facet: verification
        responsibility: Verify non-root docsite crawling, direct repository docs loading, and Sätteri link rewriting through exact Vitest and Playwright cases.
        targets:
          - id: crawl-case
            adapter: typescript
            path: e2e/docsite-links.test.ts
            selector: { kind: test, name: 'REQ-E2E-006: docsite internal page links resolve without 404s' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-006#criterion.base-path-integrity
                covers: [FEAT-E2E-002#binding.docsite/target.link-rewriter]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-links.test.ts, test: 'REQ-E2E-006: docsite internal page links resolve without 404s' } }
          - id: loader-case
            adapter: typescript
            path: docsite/src/ssot.test.ts
            selector: { kind: test, name: 'Starlight loads the repository docs directory directly' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-006#criterion.repository-docs-source
                covers:
                  - FEAT-E2E-002#binding.docsite/target.content-config
                  - FEAT-E2E-002#binding.docsite/target.docs-source
                runner: { runner: docsite-vitest, arguments: { test: 'Starlight loads the repository docs directory directly' } }
          - id: pipeline-case
            adapter: typescript
            path: docsite/src/ssot.test.ts
            selector: { kind: test, name: "external docs use Starlight's native Sätteri pipeline" }
            claims:
              - kind: verifies
                criterion: REQ-E2E-006#criterion.repository-docs-source
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: docsite-vitest, arguments: { test: "external docs use Starlight's native Sätteri pipeline" } }
          - id: rewrite-case
            adapter: typescript
            path: docsite/src/ssot.test.ts
            selector: { kind: test, name: 'REQ-E2E-006: Sätteri link plugin rewrites authored links' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-006#criterion.link-rewrite
                covers: [FEAT-E2E-002#binding.docsite/target.link-rewriter]
                runner: { runner: docsite-vitest, arguments: { test: 'REQ-E2E-006: Sätteri link plugin rewrites authored links' } }

  - id: REQ-E2E-007
    title: Framework-owned docsite theme controls
    description: The docsite uses Starlight's single light, dark, and system color-mode selector and does not maintain product-specific theme-switching code.
    priority: medium
    status: implemented
    criteria:
      - id: single-framework-selector
        kind: behavior
        statement: The docsite exposes exactly one Starlight light, dark, and auto selector and persists its selected mode through the framework-owned preference.
        governed_by: [POL-006#rule.governance, POL-014#rule.governance]
      - id: no-product-selector
        kind: quality
        statement: The docsite does not expose product-specific theme-selector attributes alongside Starlight's framework-owned selector.
        governed_by: [POL-006#rule.governance, POL-013#rule.governance]
    bindings:
      - id: theme-controls-verification
        role: verification
        facet: verification
        responsibility: Verify the single Starlight selector, its three modes, persistence, and absence of product-specific selector controls through the exact Playwright case.
        targets:
          - id: selector-case
            adapter: typescript
            path: e2e/docsite-theme-controls.test.ts
            selector: { kind: test, name: 'REQ-E2E-007: Starlight owns the single light/dark/auto selector' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-007#criterion.single-framework-selector
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-theme-controls.test.ts, test: 'REQ-E2E-007: Starlight owns the single light/dark/auto selector' } }
              - kind: verifies
                criterion: REQ-E2E-007#criterion.no-product-selector
                covers: [FEAT-E2E-002#binding.docsite/target.docsite-config]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-theme-controls.test.ts, test: 'REQ-E2E-007: Starlight owns the single light/dark/auto selector' } }

  - id: REQ-E2E-008
    title: Canonical documentation landing page
    description: The canonical docs/index.md landing page explains Ugoite, exposes concrete operator and developer start paths, and states the current browser boundary and source-of-truth rules.
    priority: high
    status: implemented
    criteria:
      - id: landing-content
        kind: behavior
        statement: The documentation landing page identifies Ugoite and communicates its durable Knowledge boundary, current browser boundary, and source-of-truth rules.
        governed_by: [POL-001#rule.governance, POL-006#rule.governance, POL-013#rule.governance]
      - id: start-paths
        kind: behavior
        statement: The documentation landing page exposes the canonical Get started, Vision, GitHub, and top-level documentation paths, and its primary action opens Get started.
        governed_by: [POL-005#rule.governance, POL-006#rule.governance, POL-014#rule.governance]
    bindings:
      - id: landing-verification
        role: verification
        facet: verification
        responsibility: Verify the canonical landing content and primary Get started navigation through exact docsite assertions.
        targets:
          - id: landing-case
            adapter: typescript
            path: e2e/docsite-onboarding.test.ts
            selector: { kind: test, name: 'REQ-E2E-008: the canonical docs landing page gives users concrete start paths' }
            claims:
              - kind: verifies
                criterion: REQ-E2E-008#criterion.landing-content
                covers: [FEAT-E2E-002#binding.docsite/target.homepage]
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-onboarding.test.ts, test: 'REQ-E2E-008: the canonical docs landing page gives users concrete start paths' } }
              - kind: verifies
                criterion: REQ-E2E-008#criterion.start-paths
                covers:
                  - FEAT-E2E-002#binding.docsite/target.homepage
                  - FEAT-E2E-002#binding.docsite/target.get-started-path
                runner: { runner: e2e-playwright, arguments: { file: e2e/docsite-onboarding.test.ts, test: 'REQ-E2E-008: the canonical docs landing page gives users concrete start paths' } }
  - id: REQ-E2E-009
    title: Responsive canonical documentation navigation
    description: Ugoite's documentation homepage keeps its canonical navigation paths reachable at desktop and small viewport sizes without making Starlight layout internals a product contract.
    priority: high
    status: implemented
    criteria:
      - id: desktop-layout
        kind: quality
        statement: A desktop documentation homepage renders the canonical Ugoite navigation paths and a readable primary heading.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance]
      - id: responsive-layout
        kind: quality
        statement: A small documentation viewport renders the same canonical Ugoite navigation paths without requiring framework-specific selectors.
        governed_by: [POL-006#rule.governance, POL-009#rule.governance]
