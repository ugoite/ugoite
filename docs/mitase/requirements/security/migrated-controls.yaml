  - id: REQ-SEC-013
    title: "Durable Recovery Audit Delivery"
    description: "Successful Space binding recovery persists one canonical, secret-free recovery.space_binding_replaced event in the Node outbox, then delivers it to the Space audit chain with restart-safe exactly-once event identity. Completion is independent from delivery and reports delivered or pending without reissuing credentials or recovery codes."
