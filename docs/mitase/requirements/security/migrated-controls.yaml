  - id: REQ-SEC-011
    title: "CLI Remote Endpoint Transport Safety"
    description: "CLI server-backed endpoint configuration MUST reject non-loopback cleartext `http://` URLs, keep loopback cleartext URLs available for local development, fail closed when a saved endpoint is invalid, and refuse to treat such endpoints as active topology before any credentialed request can be sent to them."
    priority: high
    status: implemented
