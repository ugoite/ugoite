schema: mitase/authoring/v2
kind: requirements
namespace: security
category: Security controls, integrity protections, and isolation requirements
requirements:
  - id: REQ-SEC-009
    title: "Agent Principals and Scoped Proof-of-Possession Credentials"
    description: "Automation MUST use sponsored Agent Principals with independent public-key credentials, expiry, explicit Space/action grants, opaque short-lived access tokens, and attributable audit records. Agents MUST NOT manage members, ownership, or agents. The server MUST require a single-use human approval bound to the exact operation, action, canonical resource, actor credential, lifecycle epochs, and 1–300 second expiry for entry.delete, sql.delete, asset.delete, and access.put. Approval replay, mismatch, expiry, and ambiguous mutation outcomes MUST fail closed and remain auditable."
    priority: high
    status: planned
    criteria:
      - id: migrated-contract
        kind: security
        statement: "Automation MUST use sponsored Agent Principals with independent public-key credentials, expiry, explicit Space/action grants, opaque short-lived access tokens, and attributable audit records. Agents MUST NOT manage members, ownership, or agents. The server MUST require a single-use human approval bound to the exact operation, action, canonical resource, actor credential, lifecycle epochs, and 1–300 second expiry for entry.delete, sql.delete, asset.delete, and access.put. Approval replay, mismatch, expiry, and ambiguous mutation outcomes MUST fail closed and remain auditable."
        governed_by: []
      - id: exact-verification-gap
        kind: quality
        statement: No exact repository test currently verifies the complete sponsored Agent Principal and tuple-bound single-use approval contract; this capability remains planned and unverified.
        governed_by: []

  - id: REQ-SEC-010
    title: "Credentialed CORS Allowlist"
    description: "The Rust server is same-origin by default. When UGOITE_CORS_ALLOWED_ORIGINS is set to a non-empty, comma-separated list, credentialed browser responses use exact origin allowlisting. Preflight responses advertise only GET, POST, PUT, PATCH, DELETE, and OPTIONS plus Accept, Authorization, Content-Type, Idempotency-Key, DPoP, and X-Request-Id plus the MCP protocol headers; no wildcard is used. An unlisted origin does not receive Access-Control-Allow-Origin. This browser CORS permission is separate from CSRF protection: cookie-authenticated unsafe requests still require the canonical UGOITE_PUBLIC_ORIGIN."
    priority: high
    status: implemented
    criteria:
      - id: migrated-contract
        kind: security
        statement: "The Rust server is same-origin by default. When UGOITE_CORS_ALLOWED_ORIGINS is set to a non-empty, comma-separated list, credentialed browser responses use exact origin allowlisting. Preflight responses advertise only GET, POST, PUT, PATCH, DELETE, and OPTIONS plus Accept, Authorization, Content-Type, Idempotency-Key, DPoP, and X-Request-Id plus the MCP protocol headers; no wildcard is used. An unlisted origin does not receive Access-Control-Allow-Origin. This browser CORS permission is separate from CSRF protection: cookie-authenticated unsafe requests still require the canonical UGOITE_PUBLIC_ORIGIN."
        governed_by: []
    bindings:
