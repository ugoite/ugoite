category: Security controls, integrity protections, and isolation requirements
requirements:
  - id: REQ-SEC-009
    title: "Agent Principals and Scoped Proof-of-Possession Credentials"
    description: "Automation MUST use sponsored Agent Principals with independent public-key credentials, expiry, explicit Space/action grants, opaque short-lived access tokens, and attributable audit records. Agents MUST NOT manage members, ownership, or agents. The server MUST require a single-use human approval bound to the exact operation, action, canonical resource, actor credential, lifecycle epochs, and 1–300 second expiry for entry.delete, sql.delete, asset.delete, and access.put. Approval replay, mismatch, expiry, and ambiguous mutation outcomes MUST fail closed and remain auditable."
    priority: high
    status: planned
    criteria:
      - id: migrated-contract
        kind: security
        statement: "Automation MUST use sponsored Agent Principals with independent public-key credentials, expiry, explicit Space/action grants, opaque short-lived access tokens, and attributable audit records. Agents MUST NOT manage members, ownership, or agents. The server MUST require a single-use human approval bound to the exact operation, action, canonical resource, actor credential, lifecycle epochs, and 1–300 second expiry for entry.delete, sql.delete, asset.delete, and access.put. Approval replay, mismatch, expiry, and ambiguous mutation outcomes MUST fail closed and remain auditable."
        governed_by: [POL-003#rule.governance, POL-004#rule.governance, POL-010#rule.governance, POL-011#rule.governance]
