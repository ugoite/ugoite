schema: mitase/authoring/v2
kind: policies
namespace: product
category: Implementation Policies
policies:
  - id: POL-001
    title: Storage and Query Portability
    summary: Keep storage and query surfaces portable and vendor-neutral.
    description: Users choose where their Knowledge lives. Portability protects that freedom through open storage layouts, SQL capabilities, and indexing contracts that can be reimplemented without trapping data or query workflows inside a single provider.
    rules:
      - id: governance
        level: should
        statement: This policy keeps storage layouts, SQL capabilities, and indexing contracts portable across backends and deployment environments. It protects user freedom by favoring open abstractions that can be reused, audited, and evolved without trapping data or query workflows inside a single provider.
        governed_by: [PHIL-000#principle.user-owned-knowledge, PHIL-000#principle.stable-foundation, PHIL-001#principle.product-design-principle, PHIL-003#principle.product-design-principle]
    bindings:
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the canonical architecture and data portability references for this policy.
        targets:
          - id: architecture-overview
            adapter: declared
            path: docs/architecture/contracts/overview.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-001#rule.governance }]
          - id: data-model-overview
            adapter: declared
            path: docs/architecture/data-model/overview.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-001#rule.governance }]
          - id: feature-sql
            adapter: declared
            path: docs/spec/features/sql.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-001#rule.governance }]
  - id: POL-002
    title: Rust Core as Canonical Logic Layer
    summary: Concentrate durable business logic in ugoite-core and reuse it from adapters.
    description: Adapters multiply over time across backend, CLI, and future integrations, while product meaning must stay singular. Concentrating durable logic in ugoite-core keeps every surface executing the same rules instead of drifting into incompatible implementations.
    rules:
      - id: governance
        level: must
        statement: This policy treats ugoite-core as the durable source of product logic so adapters do not drift into incompatible implementations. It supports portable architecture and continuously verifiable behavior by reusing the same core rules from backend, CLI, and future integrations.
        governed_by: [PHIL-000#principle.tools-without-authority, PHIL-000#principle.stable-foundation, PHIL-001#principle.product-design-principle, PHIL-003#principle.product-design-principle]
    bindings:
      - id: core-logic-boundary
        role: evidence
        facet: implementation-boundary
        responsibility: Record the canonical durable-logic responsibility at the Ugoite core source.
        targets:
          - id: core-logic-boundary
            adapter: declared
            path: crates/ugoite-core/src/lib.rs
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: POL-002#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the architecture and API references that define the durable core logic boundary.
        targets:
          - id: architecture-overview
            adapter: declared
            path: docs/architecture/contracts/overview.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-002#rule.governance }]
          - id: architecture-decisions
            adapter: declared
            path: docs/architecture/contracts/decisions.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-002#rule.governance }]
          - id: api-rest
            adapter: declared
            path: docs/architecture/api/rest.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-002#rule.governance }]
  - id: POL-004
    title: Backend as Thin API Adapter
    summary: Keep backend responsibility focused on protocol and orchestration boundaries.
    description: A backend that owns business rules becomes a second product. Restricting it to translation, orchestration, and security boundaries keeps deployments light and every operator surface on the same core behavior without API-layer lock-in.
    rules:
      - id: governance
        level: must
        statement: This policy limits the backend to interface translation, orchestration, and security boundaries instead of duplicating durable business rules. It keeps deployments lighter and preserves freedom to reuse the same core behavior across multiple operator surfaces without API-layer lock-in.
        governed_by: [PHIL-000#principle.tools-without-authority, PHIL-000#principle.stable-foundation, PHIL-001#principle.product-design-principle, PHIL-002#principle.product-design-principle]
    bindings:
      - id: backend-adapter-boundary
        role: evidence
        facet: implementation-boundary
        responsibility: Record the thin backend adapter responsibility at the server source.
        targets:
          - id: backend-adapter-boundary
            adapter: declared
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: POL-004#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the interface, REST, OpenAPI, and operator-surface references for the thin backend boundary.
        targets:
          - id: architecture-interface
            adapter: declared
            path: docs/architecture/contracts/frontend-backend-interface.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-004#rule.governance }]
          - id: api-rest
            adapter: declared
            path: docs/architecture/api/rest.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-004#rule.governance }]
          - id: api-openapi
            adapter: declared
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-004#rule.governance }]
          - id: api-surfaces
            adapter: declared
            path: docs/architecture/api/operator-surfaces.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-004#rule.governance }]
  - id: POL-006
    title: Frontend Contract Discipline
    summary: Keep frontend behavior aligned with API contracts and shared UI specifications.
    description: Client-side parallel rules stay invisible until they diverge. Requiring the frontend to follow shared contracts makes drift visible early through typed interfaces, specifications, and tests.
    rules:
      - id: governance
        level: must
        statement: This policy requires the frontend to follow shared contracts and documented UI behavior instead of inventing parallel rules in the client. It supports durable verification and trusted AI-assisted work by making contract drift visible through typed interfaces, specs, and tests.
        governed_by: [PHIL-000#principle.tools-without-authority, PHIL-000#principle.stable-foundation, PHIL-003#principle.product-design-principle, PHIL-004#principle.product-design-principle]
    bindings:
      - id: frontend-contract-boundary
        role: evidence
        facet: implementation-boundary
        responsibility: Record the shared EntryQuery frontend contract at its typed portable-protocol boundary.
        targets:
          - id: frontend-contract-boundary
            adapter: declared
            path: frontend/src/lib/entry-query.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: POL-006#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the frontend interface and UI references for this policy.
        targets:
          - id: architecture-interface
            adapter: declared
            path: docs/architecture/contracts/frontend-backend-interface.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-006#rule.governance }]
          - id: ui-overview
            adapter: declared
            path: docs/spec/ui/index.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-006#rule.governance }]
          - id: ui-pages
            adapter: declared
            path: docs/spec/ui/pages/space-home.yaml
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-006#rule.governance }]
  - id: POL-007
    title: Form and Entry Schema Governance
    summary: Enforce stable, typed entry/form behavior through documented schema contracts.
    description: Structured content outlives any single surface. Explicit schema contracts for forms, entries, and assets keep the data model portable and durable as surfaces evolve around it.
    rules:
      - id: governance
        level: must
        statement: This policy stabilizes the product's structured content model through explicit schema contracts for forms, entries, and assets. It makes the data model portable and durable by ensuring that product behavior stays tied to documented rules instead of ad hoc field handling.
        governed_by: [PHIL-000#principle.user-owned-knowledge, PHIL-000#principle.stable-foundation, PHIL-001#principle.product-design-principle, PHIL-003#principle.product-design-principle]
    bindings:
      - id: schema-governance-boundary
        role: evidence
        facet: knowledge-schema
        responsibility: Record the typed Form and Entry schema responsibility at the durable Iceberg model.
        targets:
          - id: schema-governance-boundary
            adapter: declared
            path: crates/ugoite-iceberg/src/form.rs
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: POL-007#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the data-model, core-story, and UI references for typed Entry and Form schema governance.
        targets:
          - id: data-model-schema
            adapter: declared
            path: docs/architecture/data-model/file-schemas.yaml
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-007#rule.governance }]
          - id: stories-core
            adapter: declared
            path: docs/spec/stories/core.yaml
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-007#rule.governance }]
          - id: ui-pages
            adapter: declared
            path: docs/spec/ui/index.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-007#rule.governance }]
  - id: POL-012
    title: Search and Form References as Core Knowledge Operations
    summary: Treat search and typed Form references as first-class capabilities.
    description: Retrieval is how users reach their Knowledge. Treating search and typed Form references as core capabilities rather than conveniences keeps searchable, typed structure inside the canonical system design.
    rules:
      - id: governance
        level: must
        statement: This policy elevates retrieval and Form-owned cross-reference behavior into core product capabilities rather than optional convenience features. It supports user freedom and durable knowledge rules by making searchable, typed structure part of the canonical system design.
        governed_by: [PHIL-000#principle.user-owned-knowledge, PHIL-000#principle.tools-without-authority, PHIL-000#principle.stable-foundation, PHIL-001#principle.product-design-principle, PHIL-003#principle.product-design-principle]
    bindings:
      - id: search-knowledge-boundary
        role: evidence
        facet: knowledge-operation
        responsibility: Record the current authorized Search and derived-state boundary at the core search implementation.
        targets:
          - id: search-knowledge-boundary
            adapter: declared
            path: crates/ugoite-iceberg/src/search.rs
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: POL-012#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the feature registry, advanced-story, and REST references for Search and Form knowledge operations.
        targets:
          - id: features-registry
            adapter: declared
            path: docs/spec/features/index.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-012#rule.governance }]
          - id: stories-advanced
            adapter: declared
            path: docs/spec/stories/advanced.yaml
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-012#rule.governance }]
          - id: api-rest
            adapter: declared
            path: docs/architecture/api/rest.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-012#rule.governance }]
  - id: POL-014
    title: Compatibility Through Explicit Evolution
    summary: Manage change using explicit deprecation and migration guidance across layers.
    description: >-
      Change is inevitable; silent breakage is not. Explicit evolution through
      visible deprecation and migration guidance keeps the semantic boundary
      intact while encodings, APIs, and UI internals evolve, with the
      compatibility review and canonical fixture evidence gating risky changes.
    rules:
      - id: governance
        level: must
        statement: >-
          This policy manages change through visible evolution rather than
          silent breakage between layers. For the v0.1 Foundation Freeze, the
          protected compatibility boundary is semantic: user-owned Knowledge
          recoverability, unique catalog authority, append-only Knowledge
          history, and thin adapter boundaries must survive later
          implementations. Physical encodings, crate APIs, and UI internals
          are not frozen by that promise. Changes that can affect the semantic
          boundary require the v0.1 Knowledge Compatibility Review and
          canonical fixture evidence before merge.
        governed_by: [PHIL-000#principle.user-owned-knowledge, PHIL-000#principle.stable-foundation, PHIL-001#principle.product-design-principle, PHIL-003#principle.product-design-principle]
    bindings:
      - id: compatibility-review-gate
        role: enforcement
        facet: compatibility
        responsibility: Enforce the explicit Knowledge compatibility review at the trusted repository validator.
        targets:
          - id: compatibility-review-gate
            adapter: declared
            path: tools/knowledge_compatibility.ts
            selector: { kind: file }
            claims:
              - kind: enforces
                rule: POL-014#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the architecture, API, directory, and compatibility references for explicit evolution.
        targets:
          - id: architecture-decisions
            adapter: declared
            path: docs/architecture/contracts/decisions.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-014#rule.governance }]
          - id: architecture-future-proofing
            adapter: declared
            path: docs/architecture/contracts/future-proofing.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-014#rule.governance }]
          - id: api-openapi
            adapter: declared
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-014#rule.governance }]
          - id: data-model-directory
            adapter: declared
            path: docs/architecture/data-model/directory-structure.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-014#rule.governance }]
          - id: knowledge-compatibility
            adapter: declared
            path: docs/architecture/release/v0.1-knowledge-compatibility.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-014#rule.governance }]
