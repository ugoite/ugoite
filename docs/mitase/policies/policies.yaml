        facet: localization
        responsibility: Record the shared locale dictionary carrying the authoritative copy.
        targets:
          - id: locale-dictionary
            adapter: declared
            path: frontend/src/lib/i18n.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: POL-I18N-001#rule.governance
      - id: design-references
        role: documentation
        facet: design-reference
        responsibility: Preserve the UI overview and route inventory references for dictionary localization.
        targets:
          - id: ui-overview
            adapter: declared
            path: docs/spec/ui/index.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-I18N-001#rule.governance }]
          - id: route-inventory
            adapter: declared
            path: docs/spec/ui/ux-route-inventory.md
            selector: { kind: file }
            claims: [{ kind: documents, anchor: POL-I18N-001#rule.governance }]
