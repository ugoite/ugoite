schema: mitase/spec/v1
kind: features
namespace: e2e
category: Browser smoke and navigation surfaces
features:
  - id: FEAT-E2E-001
    title: Browser smoke and dynamic navigation
    summary: Connect the browser routes, server-backed Space and Entry operations, OpenAPI contracts, and exact Playwright smoke/navigation evidence.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep the shipped browser routes connected to the HTML boundary and server-backed Space and Entry workflow.
        targets:
          - id: root-route
            adapter: typescript
            path: frontend/src/routes/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-001#criterion.html-document
              - kind: satisfies
                criterion: REQ-E2E-001#criterion.html-content-type
          - id: spaces-route
            adapter: typescript
            path: frontend/src/routes/spaces/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-004#criterion.route-traversal
              - kind: satisfies
                criterion: REQ-E2E-004#criterion.console-stability
              - kind: satisfies
                criterion: REQ-E2E-004#criterion.runtime-stability
          - id: entry-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/entries/[entry_id].tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-002#criterion.entry-route
              - kind: satisfies
                criterion: REQ-E2E-004#criterion.route-traversal
      - id: server
        role: implementation
        facet: backend
        responsibility: Expose the Space and Entry list/read operations used by the browser-backed smoke workflow.
        targets:
          - id: list-spaces
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: list_spaces }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-002#criterion.space-and-entry-lists
              - kind: satisfies
                criterion: REQ-STO-009#criterion.authenticated-listing-contract
          - id: list-entries
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: list_entries }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-002#criterion.space-and-entry-lists
      - id: server-read
        role: operation
        facet: backend
        responsibility: Keep the server Entry read adapter connected to the browser route used by the E2E smoke workflow.
        targets:
          - id: get-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_entry }
      - id: contract
        role: contract-source
        facet: api
        responsibility: Define the authoritative Space and Entry HTTP operations exercised by the E2E smoke workflow.
        owns:
          - id: openapi-source
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
        targets:
          - id: list-spaces
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: /spaces }
          - id: list-entries
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/entries' }
          - id: get-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/entries/{entry_id}' }

  - id: FEAT-E2E-002
    title: Docsite and UI acceptance surfaces
    summary: Connect the supported UI themes, Starlight docsite shell, repository documentation sources, and exact docsite Playwright/Vitest evidence.
    status: implemented
    bindings:
      - id: application
        role: implementation
        facet: frontend
        responsibility: Keep the supported UI theme workflow connected to the Space dashboard, search, query, Entry, and settings routes.
        targets:
          - id: theme-dashboard
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/dashboard.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-003#criterion.theme-workflows
              - kind: satisfies
                criterion: REQ-E2E-003#criterion.color-mode-stability
          - id: theme-search
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/search.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-003#criterion.theme-workflows
          - id: theme-entry
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/entries.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-003#criterion.theme-workflows
          - id: theme-query
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/queries/new.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-003#criterion.theme-workflows
          - id: theme-settings
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/settings.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-003#criterion.color-mode-stability
      - id: docsite
        role: implementation
        facet: docsite
        responsibility: Keep the Starlight shell, repository docs loader, link processor, canonical landing page, and documented navigation structure connected as one docsite surface.
        targets:
          - id: docsite-config
            adapter: declared
            path: docsite/astro.config.mjs
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-006#criterion.repository-docs-source
              - kind: satisfies
                criterion: REQ-E2E-005#criterion.mobile-sidebar
              - kind: satisfies
                criterion: REQ-E2E-005#criterion.desktop-sidebar
              - kind: satisfies
                criterion: REQ-E2E-005#criterion.beginner-path
              - kind: satisfies
                criterion: REQ-E2E-005#criterion.homepage-navigation
              - kind: satisfies
                criterion: REQ-E2E-007#criterion.single-framework-selector
              - kind: satisfies
                criterion: REQ-E2E-007#criterion.no-product-selector
              - kind: satisfies
                criterion: REQ-E2E-009#criterion.desktop-layout
              - kind: satisfies
                criterion: REQ-E2E-009#criterion.responsive-layout
          - id: content-config
            adapter: declared
            path: docsite/src/content.config.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-006#criterion.repository-docs-source
          - id: docs-source
            adapter: declared
            path: docsite/src/docs-ssot.mjs
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-006#criterion.repository-docs-source
          - id: link-rewriter
            adapter: declared
            path: docsite/src/satteri-doc-links.mjs
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-006#criterion.base-path-integrity
              - kind: satisfies
                criterion: REQ-E2E-006#criterion.link-rewrite
          - id: homepage
            adapter: declared
            path: docs/index.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-005#criterion.homepage-navigation
              - kind: satisfies
                criterion: REQ-E2E-008#criterion.landing-content
              - kind: satisfies
                criterion: REQ-E2E-008#criterion.start-paths
          - id: quickstart
            adapter: declared
            path: docs/guide/start/container-quickstart.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-E2E-008#criterion.start-paths
