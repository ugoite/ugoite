  - id: FEAT-UX-007
    title: Shared positional back control
    summary: Provide the shared BackLink as a 44px circular chevron-left link to the hierarchical parent, first at each nested surface's leading header edge, with no repeated visible Back copy and a localized destination name for assistive technology and hover discovery.
