schema: mitase/authoring/v2
kind: features
namespace: ux
category: Interaction structure, list, localization, responsive, and restore baselines (PR-1, no UI change)
features:
  - id: FEAT-UX-001
    title: Navigation structure baseline
    summary: Record the shipped shell, back-chain, context, and route-inventory surfaces satisfying the navigation criteria without changing UI behavior.
    status: planned
    bindings:
      - id: navigation-baseline
        role: implementation
        facet: frontend
        responsibility: Keep the navigation baseline connected to the shipped shells and the route inventory record.
        targets:
          - id: global-shell-surface
            adapter: typescript
            path: frontend/src/components/GlobalShell.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
          - id: space-shell-surface
            adapter: typescript
            path: frontend/src/components/SpaceShell.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
          - id: space-dashboard-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/dashboard.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
          - id: spaces-index-route
            adapter: typescript
            path: frontend/src/routes/spaces/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
          - id: route-inventory-record
            adapter: declared
            path: docs/spec/ui/ux-route-inventory.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
  - id: FEAT-UX-002
    title: Entry workspace baseline
    summary: Record the shared Entry workspace and list surfaces, including the Entry task identity, ordinary Form-defined fields, decoration rules, async states, and form-derived guidance.
    status: planned
    bindings:
      - id: entry-baseline
        role: implementation
        facet: frontend
        responsibility: Keep the current Entry detail and list surfaces connected to the route inventory, with Form-defined values remaining ordinary fields rather than Entry identities.
        targets:
          - id: entry-detail-surface
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.form-derived-guidance
          - id: entry-list-surface
            adapter: typescript
            path: frontend/src/components/EntryList.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.explicit-async-states
          - id: route-inventory-record
            adapter: declared
            path: docs/spec/ui/ux-route-inventory.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.explicit-async-states
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.form-derived-guidance
  - id: FEAT-UX-003
    title: List interaction baseline
    summary: Record that Space, Entry, Asset, Browser Konase, account Security, approval, and audit surfaces keep opaque identifiers out of primary labels, with credential and audit target IDs available only in closed technical details when needed.
    status: planned
    bindings:
      - id: list-baseline
        role: implementation
        facet: frontend
        responsibility: Keep the list interaction baseline connected to live Space, dashboard, form-entry, Asset detail, Browser Konase, account Security, and Space audit target disclosure surfaces plus their UI specifications.
        targets:
          - id: spaces-route-surface
            adapter: typescript
            path: frontend/src/routes/spaces/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: dashboard-entry-surface
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/dashboard.tsx"
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: form-entries-route-surface
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/forms/[form_ref]/entries.tsx"
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: asset-entry-reference-surface
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/assets/[asset_id].tsx"
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: konase-panel-surface
            adapter: typescript
            path: frontend/src/components/konase/KonasePanel.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: account-security-route
            adapter: typescript
            path: frontend/src/routes/settings/security.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: audit-log-viewer-surface
            adapter: typescript
            path: frontend/src/components/AuditLogViewer.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-AUDIT-001#criterion.resolved-actor-display
              - kind: satisfies
                criterion: REQ-UX-AUDIT-001#criterion.target-id-in-details
          - id: konase-panel-specification
            adapter: declared
            path: docs/spec/ui/components/konase-panel.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: account-security-specification
            adapter: declared
            path: docs/spec/ui/components/account-security.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
          - id: action-bar-surface
            adapter: typescript
            path: frontend/src/components/ActionIconBar.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-002#criterion.one-row-action-bar
          - id: route-inventory-record
            adapter: declared
            path: docs/spec/ui/ux-route-inventory.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.full-row-activation
              - kind: satisfies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
              - kind: satisfies
                criterion: REQ-UX-LIST-002#criterion.one-row-action-bar
      - id: dashboard-entry-identifier-verification
        role: verification
        facet: verification
        responsibility: Verify same-Form dashboard Entries use distinct human-facing labels, suppress duplicate generic labels, ignore unrelated Entry properties, and retain exact Entry IDs only in route targets.
        targets:
          - id: dashboard-entry-labels
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/dashboard.test.tsx"
            selector: { kind: test, name: "REQ-UX-LIST-001: gives same-Form Recent links unique ID-free labels" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.dashboard-entry-surface]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/dashboard.test.tsx", test: "REQ-UX-LIST-001: gives same-Form Recent links unique ID-free labels" } }
      - id: konase-resource-label-verification
        role: verification
        facet: verification
        responsibility: Verify Browser Konase uses human-readable candidate, selected-resource, and Context-preview labels while preserving stable URIs as internal resource identity.
        targets:
          - id: konase-resource-labels-and-preview
            adapter: typescript
            path: frontend/src/components/konase/KonasePanel.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: keeps resource URIs internal and shows human-readable Context preview labels" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.konase-panel-surface, FEAT-UX-003#binding.list-baseline/target.konase-panel-specification]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/konase/KonasePanel.test.tsx, test: "REQ-UX-LIST-001: keeps resource URIs internal and shows human-readable Context preview labels" } }
      - id: konase-write-approval-target-verification
        role: verification
        facet: verification
        responsibility: Verify write approval shows current Space and Form context, uses a preview only for the exact updated Entry among visible current-Space candidates or selected resources, falls back to existing-Entry context, keeps opaque target IDs in collapsed technical details, and retains the exact request-bound approval.
        targets:
          - id: konase-readable-write-target
            adapter: typescript
            path: frontend/src/components/konase/KonasePanel.test.tsx
            selector: { kind: test, name: "keeps update targets readable and reveals opaque IDs only on demand" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.konase-panel-surface, FEAT-UX-003#binding.list-baseline/target.konase-panel-specification]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/konase/KonasePanel.test.tsx, test: "keeps update targets readable and reveals opaque IDs only on demand" } }
          - id: konase-exact-updated-entry-label
            adapter: typescript
            path: frontend/src/components/konase/KonasePanel.test.tsx
            selector: { kind: test, name: "uses the current candidate label for the exact updated Entry" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.konase-panel-surface, FEAT-UX-003#binding.list-baseline/target.konase-panel-specification]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/konase/KonasePanel.test.tsx, test: "uses the current candidate label for the exact updated Entry" } }
          - id: konase-selected-entry-approval-label
            adapter: typescript
            path: frontend/src/components/konase/KonasePanel.test.tsx
            selector: { kind: test, name: "uses a selected Entry label after paging away from its candidate row" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.konase-panel-surface, FEAT-UX-003#binding.list-baseline/target.konase-panel-specification]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/konase/KonasePanel.test.tsx, test: "uses a selected Entry label after paging away from its candidate row" } }
      - id: account-security-identifier-verification
        role: verification
        facet: verification
        responsibility: Verify passkey and session identifiers stay in closed technical details, while ordinary labels and revoke actions use localized one-based labels and requests retain the exact identifiers.
        targets:
          - id: passkey-row-identities
            adapter: typescript
            path: frontend/src/routes/settings/security.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: keeps passkey IDs out of ordinary rows and revokes by exact credential identity" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.account-security-route, FEAT-UX-003#binding.list-baseline/target.account-security-specification]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/settings/security.test.tsx, test: "REQ-UX-LIST-001: keeps passkey IDs out of ordinary rows and revokes by exact credential identity" } }
          - id: session-row-identities
            adapter: typescript
            path: frontend/src/routes/settings/security.test.tsx
            selector: { kind: test, name: "REQ-UX-LIST-001: keeps session IDs out of ordinary rows and revokes by exact session identity" }
            claims:
              - kind: verifies
                criterion: REQ-UX-LIST-001#criterion.uuids-advanced-only
                covers: [FEAT-UX-003#binding.list-baseline/target.account-security-route, FEAT-UX-003#binding.list-baseline/target.account-security-specification]
                runner: { runner: frontend-vitest-file, arguments: { file: src/routes/settings/security.test.tsx, test: "REQ-UX-LIST-001: keeps session IDs out of ordinary rows and revokes by exact session identity" } }
  - id: FEAT-UX-004
