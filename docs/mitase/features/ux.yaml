schema: mitase/authoring/v2
kind: features
namespace: ux
category: Interaction structure, list, localization, responsive, and restore baselines (PR-1, no UI change)
features:
  - id: FEAT-UX-001
    title: Navigation structure baseline
    summary: Record the shipped shell, back-chain, context, and route-inventory surfaces satisfying the navigation criteria without changing UI behavior.
    status: planned
    bindings:
      - id: navigation-baseline
        role: implementation
        facet: frontend
        responsibility: Keep the navigation baseline connected to the shipped shells and the route inventory record.
        targets:
          - id: global-shell-surface
            adapter: typescript
            path: frontend/src/components/GlobalShell.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
          - id: space-shell-surface
            adapter: typescript
            path: frontend/src/components/SpaceShell.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
          - id: space-dashboard-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/dashboard.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
          - id: spaces-index-route
            adapter: typescript
            path: frontend/src/routes/spaces/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
          - id: route-inventory-record
            adapter: declared
            path: docs/spec/ui/ux-route-inventory.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-back-control
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.no-duplicate-context
              - kind: satisfies
                criterion: REQ-UX-NAV-001#criterion.single-shell-ownership
  - id: FEAT-UX-002
    title: Entry workspace baseline
    summary: Record the shared Entry workspace and list surfaces, including the Entry task identity, ordinary Form-defined fields, decoration rules, async states, and form-derived guidance.
    status: planned
    bindings:
      - id: entry-baseline
        role: implementation
        facet: frontend
        responsibility: Keep the current Entry detail and list surfaces connected to the route inventory, with Form-defined values remaining ordinary fields rather than Entry identities.
        targets:
          - id: entry-detail-surface
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.form-derived-guidance
          - id: entry-list-surface
            adapter: typescript
            path: frontend/src/components/EntryList.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.explicit-async-states
          - id: route-inventory-record
            adapter: declared
            path: docs/spec/ui/ux-route-inventory.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.no-decorative-cards
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.explicit-async-states
              - kind: satisfies
                criterion: REQ-UX-ENTRY-001#criterion.form-derived-guidance
