schema: mitase/spec/v1
kind: features
namespace: frontend
category: Frontend Space selection and preference surfaces
features:
  - id: FEAT-FE-001
    title: Space selection and portable preference persistence
    summary: Connect the browser Space selector, deterministic authorized Space store, portable preference hydration, local fallback, and the /spaces route to exact frontend verification evidence.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep Space selection and portable selected-Space preference behavior connected to the shipped frontend components, stores, local fallback, and route.
        targets:
          - id: space-selector
            adapter: typescript
            path: frontend/src/components/SpaceSelector.tsx
            selector: { kind: symbol, name: SpaceSelector }
            claims:
              - kind: satisfies
                criterion: REQ-FE-001#criterion.authorized-space-selection
              - kind: satisfies
                criterion: REQ-FE-001#criterion.switch-space
          - id: space-store
            adapter: typescript
            path: frontend/src/lib/space-store.ts
            selector: { kind: symbol, name: createSpaceStore }
            claims:
              - kind: satisfies
                criterion: REQ-FE-001#criterion.authorized-space-selection
              - kind: satisfies
                criterion: REQ-FE-002#criterion.no-implicit-creation
              - kind: satisfies
                criterion: REQ-FE-003#criterion.portable-selection
          - id: portable-preferences-store
            adapter: typescript
            path: frontend/src/lib/preferences-store.ts
            selector: { kind: symbol, name: initializePortablePreferences }
            claims:
              - kind: satisfies
                criterion: REQ-FE-003#criterion.portable-selection
              - kind: satisfies
                criterion: REQ-FE-003#criterion.local-fallback
          - id: local-preferences
            adapter: typescript
            path: frontend/src/lib/preferences-local.ts
            selector: { kind: symbol, name: readLocalPreferences }
            claims:
              - kind: satisfies
                criterion: REQ-FE-003#criterion.local-fallback
          - id: spaces-route
            adapter: typescript
            path: frontend/src/routes/spaces/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-001#criterion.authorized-space-selection
              - kind: satisfies
                criterion: REQ-FE-002#criterion.no-implicit-creation
              - kind: satisfies
                criterion: REQ-FE-002#criterion.explicit-create-action
  - id: FEAT-FE-002
    title: Entry browsing and selection
    summary: Connect Entry list rendering, selected-entry highlighting, selection callbacks, and the plain Entries route to exact frontend verification evidence.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep Entry browsing and selection behavior connected to the shipped frontend list components and route.
        targets:
          - id: entry-list
            adapter: typescript
            path: frontend/src/components/EntryList.tsx
            selector: { kind: symbol, name: EntryList }
            claims:
              - kind: satisfies
                criterion: REQ-FE-004#criterion.display
              - kind: satisfies
                criterion: REQ-FE-008#criterion.selection
          - id: list-panel
            adapter: typescript
            path: frontend/src/components/ListPanel.tsx
            selector: { kind: symbol, name: ListPanel }
            claims:
              - kind: satisfies
                criterion: REQ-FE-004#criterion.display
              - kind: satisfies
                criterion: REQ-FE-008#criterion.selection
          - id: entry-store
            adapter: typescript
            path: frontend/src/lib/entry-store.ts
            selector: { kind: symbol, name: createEntryStore }
            claims:
              - kind: satisfies
                criterion: REQ-FE-008#criterion.selection
          - id: entries-route
            adapter: typescript
            path: "frontend/src/routes/spaces/[space_id]/entries/index.tsx"
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-004#criterion.display
              - kind: satisfies
                criterion: REQ-FE-008#criterion.selection
