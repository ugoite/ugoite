schema: mitase/authoring/v2
kind: features
namespace: frontend
category: Text-first SQL Workspace
features:
  - id: FEAT-FE-008
    title: Text-first Saved SQL Workspace
    summary: Share direct SQL text editing, static diagnostics, explicit preview actions, and a guarded Form starter across Saved SQL routes.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep SQL text editing and auxiliary actions in the shared workspace; seed only a blank draft from a readable Form and preserve its exact identity guard.
        targets:
          - id: sql-workspace
            adapter: typescript
            path: frontend/src/components/SQLWorkspace.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-081#criterion.shared-text-authoring
              - kind: satisfies
                criterion: REQ-FE-081#criterion.workspace-presentation-api
              - kind: satisfies
                criterion: REQ-FE-081#criterion.adapter-owned-persistence-and-execution
              - kind: satisfies
                criterion: REQ-FE-081#criterion.adapter-owned-persistence-and-execution
              - kind: satisfies
                criterion: REQ-FE-081#criterion.transient-typed-parameters
              - kind: satisfies
                criterion: REQ-FE-081#criterion.explicit-preview-count-and-paging
              - kind: satisfies
                criterion: REQ-FE-081#criterion.current-plan-run-state
              - kind: satisfies
                criterion: REQ-FE-081#criterion.editor-accessibility-and-wrapping
          - id: sql-workspace-layout
            adapter: declared
            path: frontend/src/app.css
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-081#criterion.mobile-sql-editor-and-results
              - kind: satisfies
                criterion: REQ-FE-081#criterion.workspace-control-size-rules
          - id: form-source-control
            adapter: typescript
            path: frontend/src/components/SqlFormSourceControl.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-081#criterion.blank-form-source-starter
      - id: form-name-binding-service
        role: implementation
        facet: service
        responsibility: Resolve a human Form name against the current readable Form snapshot and compare the submitted immutable Form identity.
        targets:
          - id: sql-form-name-binding
            adapter: rust
            path: crates/ugoite-iceberg/src/service/sql_execution.rs
            selector: { kind: symbol, name: bind_human_form_names }
            claims:
              - kind: satisfies
                criterion: REQ-FE-081#criterion.human-form-name-binding
          - id: saved-sql-parent-binding
            adapter: rust
            path: crates/ugoite-iceberg/src/saved_sql.rs
            selector: { kind: symbol, name: derive_form_bindings }
            claims:
              - kind: satisfies
                criterion: REQ-FE-081#criterion.human-form-name-binding
      - id: form-name-binding-rest-contract
        role: contract-source
        facet: api
        responsibility: Publish compare-only Form guard properties on stateless SQL query, plan, and count request schemas.
        targets:
          - id: sql-query-guard-contract
            adapter: declared
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
      - id: form-name-binding-api
        role: implementation
        facet: api
        responsibility: Expose the guarded human Form-name request contract through the Rust server's published REST interface.
        targets:
          - id: sql-query-guard-schema
            adapter: declared
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-081#criterion.human-form-name-binding
      - id: verification
        role: verification
        facet: verification
        responsibility: Verify the text-only shared workspace actions and the Form starter's blank-draft guard, explicit projection, human relation, and exact identity.
        targets:
          - id: workspace-actions
            adapter: typescript
            path: frontend/src/components/SQLWorkspace.test.tsx
            selector: { kind: file }
            claims:
              - kind: verifies
                criterion: REQ-FE-081#criterion.shared-text-authoring
                covers: [FEAT-FE-008#binding.frontend/target.sql-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SQLWorkspace.test.tsx, test: "renders the adapter's copy action without SQL syntax actions" } }
          - id: form-source-starter
            adapter: typescript
            path: frontend/src/components/SqlFormSourceControl.test.tsx
            selector: { kind: file }
            claims:
              - kind: verifies
                criterion: REQ-FE-081#criterion.blank-form-source-starter
                covers: [FEAT-FE-008#binding.frontend/target.form-source-control]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlFormSourceControl.test.tsx, test: "provides a Form starter without SQL construction actions" } }
          - id: form-source-identity-and-projection
            adapter: typescript
            path: frontend/src/components/SqlFormSourceControl.test.tsx
            selector: { kind: file }
            claims:
              - kind: verifies
                criterion: REQ-FE-081#criterion.blank-form-source-starter
                covers: [FEAT-FE-008#binding.frontend/target.form-source-control]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlFormSourceControl.test.tsx, test: "seeds explicit projectable columns and retains the selected Form identity" } }
          - id: form-binding-api-contract
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: openapi_documents_stateless_sql_form_binding_guards }
            claims:
              - kind: verifies
                criterion: REQ-FE-081#criterion.human-form-name-binding
                covers: [FEAT-FE-008#binding.form-name-binding-api/target.sql-query-guard-schema]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: openapi_documents_stateless_sql_form_binding_guards } }
    contracts:
      - id: human-form-name-binding
        kind: http
        source: FEAT-FE-008#binding.form-name-binding-rest-contract/target.sql-query-guard-contract
        participants:
          - target: FEAT-FE-008#binding.frontend/target.form-source-control
            role: client
          - target: FEAT-SQL-003#binding.frontend/target.planning-state
            role: client
          - target: FEAT-FE-008#binding.form-name-binding-service/target.sql-form-name-binding
            role: service
          - target: FEAT-FE-008#binding.form-name-binding-api/target.sql-query-guard-schema
            role: server-contract
        guarantees: [REQ-FE-081#criterion.human-form-name-binding]
