schema: mitase/authoring/v2
kind: features
namespace: frontend
category: Shared SQL Workspace
features:
  - id: FEAT-FE-008
    title: Shared SQL Workspace component
    summary: Provide a controlled SQL editing and preview surface for SQL route and Composition adapters to reuse.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep the shared SQL editing, transient parameter presentation, explicit preview actions, adapter capabilities, and workspace control sizes connected to reusable frontend components.
        targets:
          - id: sql-workspace
            adapter: typescript
            path: frontend/src/components/SQLWorkspace.tsx
            selector: { kind: symbol, name: SQLWorkspace }
            claims:
              - kind: satisfies
                criterion: REQ-FE-080#criterion.shared-editor-and-preview
              - kind: satisfies
                criterion: REQ-FE-080#criterion.workspace-presentation-api
              - kind: satisfies
                criterion: REQ-FE-080#criterion.adapter-owned-persistence-and-execution
              - kind: satisfies
                criterion: REQ-FE-080#criterion.transient-typed-parameters
              - kind: satisfies
                criterion: REQ-FE-080#criterion.adapter-supplied-structured-actions
              - kind: satisfies
                criterion: REQ-FE-080#criterion.explicit-preview-count-and-paging
              - kind: satisfies
                criterion: REQ-FE-080#criterion.editor-accessibility-and-wrapping
          - id: sql-workspace-layout
            adapter: declared
            path: frontend/src/app.css
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-080#criterion.mobile-sql-editor-and-results
              - kind: satisfies
                criterion: REQ-FE-080#criterion.workspace-control-size-rules
          - id: sql-structure-toolbar
            adapter: typescript
            path: frontend/src/components/SqlStructureToolbar.tsx
            selector: { kind: symbol, name: SqlStructureToolbar }
            claims:
              - kind: satisfies
                criterion: REQ-FE-080#criterion.safe-structured-operations
          - id: sql-form-picker
            adapter: typescript
            path: frontend/src/components/SqlFormPicker.tsx
            selector: { kind: symbol, name: SqlFormPicker }
            claims:
              - kind: satisfies
                criterion: REQ-FE-080#criterion.safe-structured-operations
          - id: sql-structure-context
            adapter: typescript
            path: frontend/src/lib/sql.ts
            selector: { kind: symbol, name: buildSqlStructureContexts }
            claims:
              - kind: satisfies
                criterion: REQ-FE-080#criterion.safe-structured-operations
      - id: rust-structure-capabilities
        role: evidence
        facet: domain
        responsibility: Parse the guarded SQL Document, dispatch typed semantic transactions through WASM, and preserve source and undo without granting execution admission.
        targets:
          - id: sql-structure-analysis
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: parse_sql_document }
            claims:
              - kind: evidences
                anchor: REQ-FE-080#criterion.safe-structured-operations
          - id: sql-structure-proposal
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: apply_sql_document_semantic_edit_transaction }
            claims:
              - kind: evidences
                anchor: REQ-FE-080#criterion.safe-structured-operations
          - id: sql-structure-wasm-protocol
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: invoke_domain }
            claims:
              - kind: evidences
                anchor: REQ-FE-080#criterion.safe-structured-operations
          - id: sql-structure-frontend-protocol
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.ts
            selector: { kind: symbol, name: applySqlDocumentSemanticEditTransaction }
            claims:
              - kind: evidences
                anchor: REQ-FE-080#criterion.safe-structured-operations
      - id: form-picker-verification
        role: verification
        facet: verification
        responsibility: Verify direct Form selection against the actual Rust WASM parser and semantic transactions, including source preservation and invalid drafts.
        targets:
          - id: empty-form
            adapter: typescript
            path: frontend/src/components/SqlFormPicker.test.tsx
            selector: { kind: test, name: "starts an empty query by choosing a human-labelled Form without a syntax tree" }
            claims:
              - kind: verifies
                criterion: REQ-FE-080#criterion.safe-structured-operations
                covers: [FEAT-FE-008#binding.frontend/target.sql-form-picker]
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFormPicker.test.tsx
                    test: "starts an empty query by choosing a human-labelled Form without a syntax tree"
          - id: preserve-sql
            adapter: typescript
            path: frontend/src/components/SqlFormPicker.test.tsx
            selector: { kind: test, name: "replaces a source while preserving aliases, comments, columns, predicates and ordering" }
            claims:
              - kind: verifies
                criterion: REQ-FE-080#criterion.safe-structured-operations
                covers: [FEAT-FE-008#binding.frontend/target.sql-form-picker]
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFormPicker.test.tsx
                    test: "replaces a source while preserving aliases, comments, columns, predicates and ordering"
          - id: invalid-draft
            adapter: typescript
            path: frontend/src/components/SqlFormPicker.test.tsx
            selector: { kind: test, name: "keeps an invalid draft and opens explicit advanced editing" }
            claims:
              - kind: verifies
                criterion: REQ-FE-080#criterion.safe-structured-operations
                covers: [FEAT-FE-008#binding.frontend/target.sql-form-picker]
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFormPicker.test.tsx
                    test: "keeps an invalid draft and opens explicit advanced editing"
