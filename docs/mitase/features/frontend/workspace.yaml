              - kind: satisfies
                criterion: REQ-FE-067#criterion.timestamp-range
      - id: form-entry-browser-specification
        role: contract-source
        facet: frontend
        responsibility: Define the canonical UI contract for the Form-scoped Entry browser and its native table, selection, trailing action, query controls, and responsive behavior.
        targets:
          - id: entry-browser-component-specification
            adapter: declared
            path: docs/spec/ui/components/entry-browser.yaml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-FE-067#criterion.table-selection-open-action
              - kind: evidences
                anchor: REQ-FE-067#criterion.form-switch-results
              - kind: evidences
                anchor: REQ-FE-067#criterion.mobile-table-overflow-and-action
              - kind: evidences
                anchor: REQ-FE-067#criterion.timestamp-range
              - kind: evidences
                anchor: REQ-FE-065#criterion.confirm-action
