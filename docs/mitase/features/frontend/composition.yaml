schema: mitase/authoring/v2
kind: features
namespace: frontend
category: Frontend Space selection and preference surfaces
features:
  - id: FEAT-FE-014
    title: Composition Studio contract
    summary: Connect the planned Composition Studio authoring contract (structure-first multi-source authoring, typed parameter binding, side-effect-free preview, exact-revision edit) to its declarative component specification while implementation and verification land in later changes.
    status: planned
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep the Studio authoring contract connected to the declared Studio component specification that the New, Edit, and History routes implement.
        targets:
          - id: composition-studio-contract
            adapter: declared
            path: docs/spec/ui/components/composition-studio.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.no-persistent-explanatory-copy
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.typed-parameter-binding
              - kind: satisfies
                criterion: REQ-FE-070#criterion.side-effect-free-preview
              - kind: satisfies
                criterion: REQ-FE-070#criterion.exact-revision-edit
              - kind: satisfies
                criterion: REQ-FE-070#criterion.mobile-one-column
              - kind: satisfies
                criterion: REQ-FE-070#criterion.accessible-icon-actions
              - kind: satisfies
                criterion: REQ-FE-070#criterion.entry-query-field-labels
          - id: composition-draft-model
            adapter: typescript
            path: frontend/src/lib/composition-draft.ts
            selector: { kind: symbol, name: createEmptyDraft }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
          - id: composition-data-workspace
            adapter: typescript
            path: frontend/src/components/CompositionDataWorkspace.tsx
            selector: { kind: symbol, name: CompositionDataWorkspace }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
          - id: composition-source-navigator
            adapter: typescript
            path: frontend/src/components/SourceNavigator.tsx
            selector: { kind: symbol, name: SourceNavigator }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
          - id: composition-entry-query-source-editor
            adapter: typescript
            path: frontend/src/components/EntryQuerySourceEditor.tsx
            selector: { kind: symbol, name: EntryQuerySourceEditor }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
          - id: composition-form-field-name
            adapter: typescript
            path: frontend/src/lib/composition-field-name.ts
            selector: { kind: symbol, name: compositionFormFieldName }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.entry-query-field-labels
          - id: composition-preview-handle
            adapter: typescript
            path: frontend/src/lib/composition-preview-handle.ts
            selector: { kind: symbol, name: createCompositionPreviewHandle }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.side-effect-free-preview
          - id: composition-display-picker
            adapter: typescript
            path: frontend/src/components/CompositionDisplayPicker.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-inspector
            adapter: typescript
            path: frontend/src/components/CompositionInspector.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-design-canvas
            adapter: typescript
            path: frontend/src/components/CompositionDesignCanvas.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-parameter-list
            adapter: typescript
            path: frontend/src/components/CompositionParameterList.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.typed-parameter-binding
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.no-persistent-explanatory-copy
          - id: composition-use-surface
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.display-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.accessible-icon-actions
          - id: composition-studio-shell
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/new.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-studio
            adapter: typescript
            path: frontend/src/components/CompositionStudio.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.exact-revision-edit
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-edit-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/edit.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.exact-revision-edit
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-source-picker
            adapter: typescript
            path: frontend/src/components/CompositionSourcePicker.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: source-row-labels
            adapter: typescript
            path: frontend/src/components/SourceRowLabels.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: composition-history-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/history.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.accessible-icon-actions
              - kind: satisfies
                criterion: REQ-FE-070#criterion.exact-revision-edit
          - id: composition-list-new
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/index.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.no-persistent-explanatory-copy
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: dashboard-saved-tools-new
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/dashboard.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.no-persistent-explanatory-copy
              - kind: satisfies
                criterion: REQ-FE-070#criterion.structure-first-authoring
          - id: saved-sql-studio-seed
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/sql/[sql_id]/run.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
          - id: entry-query-studio-seed
            adapter: typescript
            path: frontend/src/components/EntryQuerySaveAsTool.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
          - id: composition-studio-seed
            adapter: typescript
            path: frontend/src/lib/composition-draft.ts
            selector: { kind: symbol, name: applyStudioSeed }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.source-authoring
              - kind: satisfies
                criterion: REQ-FE-070#criterion.typed-parameter-binding
          - id: composition-studio-mobile
            adapter: typescript
            path: frontend/src/components/CompositionInspectorSheet.tsx
            selector: { kind: symbol, name: CompositionInspectorSheet }
            claims:
              - kind: satisfies
                criterion: REQ-FE-070#criterion.mobile-one-column
      - id: source-navigator-verification
        role: verification
        facet: verification
        responsibility: Verify long source names remain available as a native title and full accessible name while source, Entry, and revision identifiers stay out of the navigator row.
        targets:
          - id: source-navigator-human-name
            adapter: typescript
            path: frontend/src/components/CompositionDataWorkspace.test.tsx
            selector: { kind: test, name: "keeps long navigator names available without exposing source identifiers" }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.source-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-source-navigator]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionDataWorkspace.test.tsx, test: "keeps long navigator names available without exposing source identifiers" } }
      - id: entry-query-metric-preview-verification
        role: verification
        facet: verification
        responsibility: Verify the Studio EntryQuery metric journey adds a scalar Form field through the display picker and renders the live Entry value in the canvas preview.
        targets:
          - id: entry-query-metric-preview
            adapter: typescript
            path: e2e/composition-studio-journey.test.ts
            selector: { kind: test, name: Composition Studio builds a reusable tool from existing knowledge }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.display-authoring
                covers: [FEAT-FE-014#binding.frontend/target.composition-display-picker]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-studio-journey.test.ts, test: Composition Studio builds a reusable tool from existing knowledge } }
      - id: composition-picker-name-verification
        role: verification
        facet: verification
        responsibility: Verify long human source names visibly ellipsize while remaining available to assistive technology and native titles, with stable identifiers kept out of labels.
        targets:
          - id: source-picker-long-names
            adapter: typescript
            path: frontend/src/components/CompositionSourcePicker.test.tsx
            selector: {
              kind: test,
              name: "keeps long source names available on picker rows without identifiers",
            }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.source-authoring
                covers: [
                  FEAT-FE-014#binding.frontend/target.composition-source-picker,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/CompositionSourcePicker.test.tsx,
                    test: "keeps long source names available on picker rows without identifiers",
                  },
                }
          - id: display-picker-long-names
            adapter: typescript
            path: frontend/src/components/CompositionDisplayPicker.test.tsx
            selector: {
              kind: test,
              name: "keeps full source names available for selectable and unavailable rows",
            }
            claims:
              - kind: verifies
                criterion: REQ-FE-070#criterion.display-authoring
                covers: [
                  FEAT-FE-014#binding.frontend/target.composition-display-picker,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/CompositionDisplayPicker.test.tsx,
                    test: "keeps full source names available for selectable and unavailable rows",
                  },
                }
