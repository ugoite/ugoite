schema: mitase/authoring/v2
kind: features
namespace: composition
category: Saved, portable Composition documents
features:
  - id: FEAT-COMP-001
    title: Composition Knowledge and semantic contract
    summary: Define restricted, portable Composition documents as Space-owned Knowledge with shared Rust semantics and bounded execution through existing query contracts.
    status: planned
    bindings:
      - id: contract
        role: contract-source
        facet: domain
        responsibility: Define the Composition v1 document, semantic authority, recovery boundary, and transient Work boundary without claiming the planned persistence or UI behavior is already implemented.
        targets:
          - id: composition-contract
            adapter: declared
            path: docs/architecture/contracts/composition.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-001#criterion.space-authority
              - kind: documents
                anchor: REQ-COMP-002#criterion.typed-dashboard-model
              - kind: documents
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: documents
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
              - kind: documents
                anchor: REQ-COMP-002#criterion.ordered-component-layout
              - kind: documents
                anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
              - kind: documents
                anchor: REQ-COMP-003#criterion.canonical-yaml
              - kind: documents
                anchor: REQ-COMP-003#criterion.semantic-fingerprint
              - kind: documents
                anchor: REQ-COMP-003#criterion.wasm-parity
              - kind: documents
                anchor: REQ-COMP-004#criterion.entry-query-translation
              - kind: documents
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
              - kind: documents
                anchor: REQ-COMP-004#criterion.exact-composition-revision
              - kind: documents
                anchor: REQ-COMP-004#criterion.concealed-unavailable-references
              - kind: documents
                anchor: REQ-COMP-005#criterion.raw-inspection
              - kind: documents
                anchor: REQ-COMP-006#criterion.work-state-is-transient
          - id: monthly-expense-fixture
            adapter: declared
            path: crates/ugoite-domain/tests/fixtures/composition/monthly-expense.ugcomp.yaml
            selector: { kind: file }
          - id: monthly-expense-labeled-fixture
            adapter: declared
            path: crates/ugoite-domain/tests/fixtures/composition/monthly-expense-labeled.ugcomp.yaml
            selector: { kind: file }
          - id: metric-value-fields-fixture
            adapter: declared
            path: crates/ugoite-domain/tests/fixtures/composition/metric-value-fields.ugcomp.yaml
            selector: { kind: file }
      - id: display-label-domain
        role: implementation
        facet: domain
        responsibility: Represent optional Composition display labels without changing stable IDs or source and query binding semantics.
        targets:
          - id: parameter-display-label
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionParameter }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.optional-display-labels
          - id: component-display-label
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionComponent }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.optional-display-labels
      - id: display-label-domain-tests
        role: evidence
        facet: domain-tests
        responsibility: Prove labels are preserved in canonical YAML and document fingerprints while unlabeled documents retain their existing canonical contract, including native/WASM parity.
        targets:
          - id: labeled-canonical-golden
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: labeled_monthly_expense_canonical_bytes_and_fingerprint_match_golden_fixtures }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.semantic-fingerprint
          - id: unlabeled-canonical-golden
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: monthly_expense_canonical_bytes_and_fingerprint_match_golden_fixtures }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.canonical-yaml
          - id: wasm-label-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
          - id: wasm32-label-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
      - id: metric-value-field-domain
        role: implementation
        facet: domain
        responsibility: Model EntryQuery metric properties by stable FieldId and Saved SQL metric output by exact column name.
        targets:
          - id: metric-value-field-type
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionMetricValueField }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.typed-metric-value-field
      - id: metric-value-field-contract-evidence
        role: evidence
        facet: domain-tests
        responsibility: Verify typed metric references canonicalize and retain distinct stable identities through native and WASM execution.
        targets:
          - id: metric-value-fields-canonical-golden
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: metric_value_fields_canonical_bytes_and_fingerprint_match_golden_fixtures }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
          - id: invalid-metric-value-field-shapes
            adapter: rust
            path: crates/ugoite-domain/src/composition/yaml.rs
            selector: { kind: symbol, name: rejects_ambiguous_or_unknown_metric_value_field_shapes }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
          - id: wasm-metric-value-field-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
          - id: wasm32-metric-value-field-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
      - id: component-layout-domain
        role: implementation
        facet: domain
        responsibility: Expose section-ordered component references and reject incomplete or ambiguous component layouts during canonicalization.
        targets:
          - id: ordered-components
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: components_in_render_order }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
          - id: canonical-layout-validation
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: normalize_composition_document }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
      - id: component-layout-domain-tests
        role: evidence
        facet: domain-tests
        responsibility: Exercise section ordering, complete and unique references, the valid empty layout, canonical rejection of invalid component layouts, and native/WASM diagnostic parity.
        targets:
          - id: section-reference-order
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: components_follow_section_and_reference_order }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: empty-layout
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: empty_component_layout_is_valid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: duplicate-component-id
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: duplicate_component_ids_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: duplicate-component-reference
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: duplicate_component_references_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: unknown-component-reference
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: unknown_component_references_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: unreferenced-component
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: unreferenced_components_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: canonical-invalid-layout
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: canonicalization_rejects_unreferenced_components }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: wasm-invalid-layout-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: wasm32-invalid-layout-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
      - id: entry-query-resolver
        role: implementation
        facet: core
        responsibility: Compile entry_query sources against the current Form and fingerprint only the schema fields used by the existing EntryQuery contract.
        targets:
          - id: compile-entry-query-source
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: compile_entry_query_source }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-004#criterion.entry-query-translation
              - kind: satisfies
                criterion: REQ-COMP-004#criterion.used-field-fingerprint
      - id: entry-query-fingerprint-evidence
        role: evidence
        facet: core-tests
        responsibility: Preserve focused evidence for excluding unrelated schema fields and matching the text-search expansion defined by existing EntryQuery semantics.
        targets:
          - id: ignores-unreferenced-fields
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: entry_query_fingerprint_ignores_unreferenced_schema_fields }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
          - id: text-search-fields
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: text_search_fingerprints_only_fields_searched_by_entry_query }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
          - id: added-searchable-field
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: new_text_search_field_changes_source_schema }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
      - id: cli-raw-inspection-source-evidence
        role: evidence
        facet: cli
        responsibility: Show the CLI read and raw-output paths as partial evidence for inspection behavior; these source bindings do not establish export or history behavior.
        targets:
          - id: inspect-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
          - id: inspect-read-path
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: read_composition }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
          - id: inspect-raw-output
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: raw_spec_output }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
      - id: cli-raw-inspection-evidence
        role: evidence
        facet: cli-tests
        responsibility: Preserve focused CLI evidence for raw-read projection, raw-carrier output, and exact revision selection, including the no-fallback case. These selectors cover inspection behavior only; they do not establish export or history evidence.
        targets:
          - id: portable-read-projection
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: local_raw_projection_matches_the_portable_composition_read_dto }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
          - id: raw-carrier-output
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: raw_spec_output_preserves_strings_and_represents_non_string_carriers }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
          - id: exact-revision-selection
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: inspect_selects_only_the_requested_composition_revision }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
          - id: missing-revision-no-fallback
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: inspect_missing_exact_revision_does_not_fall_back_to_latest }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
          - id: inspect-cli-arguments
            adapter: rust
            path: crates/ugoite-cli/src/main.rs
            selector: { kind: symbol, name: composition_inspect_accepts_exact_revision_and_raw_output_without_becoming_a_write }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
