schema: mitase/authoring/v2
kind: features
namespace: composition
category: Saved, portable Composition documents
features:
  - id: FEAT-COMP-001
    title: Composition Knowledge and semantic contract
    summary: Define restricted, portable Composition documents as Space-owned Knowledge with shared Rust semantics and bounded execution through existing query contracts.
    status: planned
    bindings:
      - id: contract
        role: contract-source
        facet: domain
        responsibility: Define the Composition v1 document, semantic authority, recovery boundary, and transient Work boundary without claiming the planned persistence or UI behavior is already implemented.
        targets:
          - id: composition-contract
            adapter: declared
            path: docs/architecture/contracts/composition.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-001#criterion.space-authority
              - kind: documents
                anchor: REQ-COMP-002#criterion.typed-dashboard-model
              - kind: documents
                anchor: REQ-COMP-002#criterion.composition-tags
              - kind: documents
                anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
              - kind: documents
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: documents
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
              - kind: documents
                anchor: REQ-COMP-002#criterion.metric-runtime-values
              - kind: documents
                anchor: REQ-COMP-002#criterion.ordered-component-layout
              - kind: documents
                anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
              - kind: documents
                anchor: REQ-COMP-003#criterion.canonical-yaml
              - kind: documents
                anchor: REQ-COMP-003#criterion.semantic-fingerprint
              - kind: documents
                anchor: REQ-COMP-003#criterion.wasm-parity
              - kind: documents
                anchor: REQ-COMP-004#criterion.entry-query-translation
              - kind: documents
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
              - kind: documents
                anchor: REQ-COMP-004#criterion.saved-sql-result-fingerprint
              - kind: documents
                anchor: REQ-COMP-004#criterion.exact-composition-revision
              - kind: documents
                anchor: REQ-COMP-004#criterion.concealed-unavailable-references
              - kind: documents
                anchor: REQ-COMP-005#criterion.raw-inspection
              - kind: documents
                anchor: REQ-COMP-006#criterion.work-state-is-transient
          - id: monthly-expense-fixture
            adapter: declared
            path: crates/ugoite-domain/tests/fixtures/composition/monthly-expense.ugcomp.yaml
            selector: { kind: file }
          - id: monthly-expense-labeled-fixture
            adapter: declared
            path: crates/ugoite-domain/tests/fixtures/composition/monthly-expense-labeled.ugcomp.yaml
            selector: { kind: file }
          - id: metric-value-fields-fixture
            adapter: declared
            path: crates/ugoite-domain/tests/fixtures/composition/metric-value-fields.ugcomp.yaml
            selector: { kind: file }
      - id: portable-envelope-domain
        role: implementation
        facet: domain
        responsibility: Represent the fixed Composition envelope, Entry tags, and ordered Saved SQL result descriptors as typed Rust values.
        targets:
          - id: composition-document-type
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionDocument }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.typed-dashboard-model
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.composition-tags
          - id: composition-format-marker-type
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionFormat }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.typed-dashboard-model
          - id: saved-sql-result-column-type
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionResultColumn }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.saved-sql-result-descriptor
          - id: saved-sql-result-field-types
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionResultFieldType }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.saved-sql-result-descriptor
      - id: portable-envelope-domain-evidence
        role: evidence
        facet: domain-tests
        responsibility: Verify the fixed envelope, ordered result descriptors, restrictions, and semantic fingerprint inputs in the shared Rust contract.
        targets:
          - id: portable-envelope-fields
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: document_uses_the_portable_envelope_field_names }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-dashboard-model
              - kind: evidences
                anchor: REQ-COMP-002#criterion.composition-tags
          - id: ordered-result-descriptor-validation
            adapter: rust
            path: crates/ugoite-domain/src/composition/yaml.rs
            selector: { kind: symbol, name: preserves_ordered_saved_sql_result_descriptors_and_rejects_ambiguous_names }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
          - id: restricted-envelope-yaml
            adapter: rust
            path: crates/ugoite-domain/src/composition/yaml.rs
            selector: { kind: symbol, name: rejects_restricted_or_ambiguous_yaml_constructs }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.restricted-yaml
          - id: bounded-envelope-collections
            adapter: rust
            path: crates/ugoite-domain/src/composition/yaml.rs
            selector: { kind: symbol, name: enforces_the_per_collection_item_limit }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.bounded-parser
          - id: envelope-fingerprint-inputs
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: tags_and_saved_sql_result_descriptor_are_semantic_fingerprint_inputs }
            claims:
              - kind: evidences
                anchor: REQ-COMP-003#criterion.semantic-fingerprint
      - id: composition-tag-storage-evidence
        role: evidence
        facet: iceberg-tests
        responsibility: Verify that document tags round-trip as the same ordered Entry metadata tags on a saved Composition revision.
        targets:
          - id: composition-tag-entry-identity
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition.rs
            selector: { kind: symbol, name: composition_save_persists_canonical_carrier_and_receipt }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.composition-tags
      - id: portable-envelope-wasm-parity
        role: evidence
        facet: wasm-tests
        responsibility: Keep the fixed marker, tags, ordered result descriptors, canonical bytes, fingerprint, and diagnostics aligned between native Rust and WASM.
        targets:
          - id: native-envelope-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.composition-tags
              - kind: evidences
                anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
          - id: wasm32-envelope-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.composition-tags
              - kind: evidences
                anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
      - id: display-label-domain
        role: implementation
        facet: domain
        responsibility: Represent optional Composition display labels without changing stable IDs or source and query binding semantics.
        targets:
          - id: parameter-display-label
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionParameter }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.optional-display-labels
          - id: component-display-label
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionComponent }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.optional-display-labels
      - id: display-label-domain-tests
        role: evidence
        facet: domain-tests
        responsibility: Prove labels are preserved in canonical YAML and document fingerprints while unlabeled documents retain their existing canonical contract, including native/WASM parity.
        targets:
          - id: labeled-canonical-golden
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: labeled_monthly_expense_canonical_bytes_and_fingerprint_match_golden_fixtures }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.semantic-fingerprint
          - id: unlabeled-canonical-golden
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: monthly_expense_canonical_bytes_and_fingerprint_match_golden_fixtures }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.canonical-yaml
          - id: wasm-label-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
          - id: wasm32-label-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.optional-display-labels
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
      - id: metric-value-field-domain
        role: implementation
        facet: domain
        responsibility: Model EntryQuery metric properties by stable FieldId and Saved SQL metric output by exact column name.
        targets:
          - id: metric-value-field-type
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionMetricValueField }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.typed-metric-value-field
      - id: metric-runtime-value-domain
        role: implementation
        facet: domain
        responsibility: Validate selected date and timestamp metric values with the shared Rust domain semantics.
        targets:
          - id: metric-runtime-value-validator
            adapter: rust
            path: crates/ugoite-domain/src/composition_metric.rs
            selector: { kind: symbol, name: evaluate_composition_metric_page }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.metric-runtime-values
      - id: metric-runtime-value-evidence
        role: evidence
        facet: domain-tests
        responsibility: Verify accepted normalized date/time values and stable rejection of invalid calendar, clock, precision, and offset forms.
        targets:
          - id: accepted-metric-date-time-values
            adapter: rust
            path: crates/ugoite-domain/src/composition_metric.rs
            selector: { kind: symbol, name: accepts_normalized_composition_metric_dates_and_timestamps }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.metric-runtime-values
          - id: rejected-metric-date-time-values
            adapter: rust
            path: crates/ugoite-domain/src/composition_metric.rs
            selector: { kind: symbol, name: rejects_malformed_or_non_normalized_composition_metric_dates_and_timestamps }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.metric-runtime-values
      - id: metric-value-field-contract-evidence
        role: evidence
        facet: domain-tests
        responsibility: Verify typed metric references canonicalize and retain distinct stable identities through native and WASM execution.
        targets:
          - id: metric-value-fields-canonical-golden
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: metric_value_fields_canonical_bytes_and_fingerprint_match_golden_fixtures }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
          - id: invalid-metric-value-field-shapes
            adapter: rust
            path: crates/ugoite-domain/src/composition/yaml.rs
            selector: { kind: symbol, name: rejects_ambiguous_or_unknown_metric_value_field_shapes }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
          - id: wasm-metric-value-field-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
          - id: wasm32-metric-value-field-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
              - kind: evidences
                anchor: REQ-COMP-003#criterion.wasm-parity
      - id: component-layout-domain
        role: implementation
        facet: domain
        responsibility: Expose section-ordered component references and reject incomplete or ambiguous component layouts during canonicalization.
        targets:
          - id: ordered-components
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: components_in_render_order }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
          - id: canonical-layout-validation
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: normalize_composition_document }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.ordered-component-layout
      - id: component-layout-domain-tests
        role: evidence
        facet: domain-tests
        responsibility: Exercise section ordering, complete and unique references, the valid empty layout, canonical rejection of invalid component layouts, and native/WASM diagnostic parity.
        targets:
          - id: section-reference-order
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: components_follow_section_and_reference_order }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: empty-layout
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: empty_component_layout_is_valid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: duplicate-component-id
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: duplicate_component_ids_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: duplicate-component-reference
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: duplicate_component_references_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: unknown-component-reference
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: unknown_component_references_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: unreferenced-component
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: unreferenced_components_are_invalid }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: canonical-invalid-layout
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: symbol, name: canonicalization_rejects_unreferenced_components }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: wasm-invalid-layout-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: composition_canonicalization_matches_the_native_domain_contract }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
          - id: wasm32-invalid-layout-parity
            adapter: typescript
            path: crates/ugoite-wasm/tests/composition_parity.ts
            selector: { kind: symbol, name: main }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.ordered-component-layout
      - id: entry-query-resolver
        role: implementation
        facet: core
        responsibility: Compile entry_query sources against the current Form and fingerprint only the schema fields used by the existing EntryQuery contract.
        targets:
          - id: compile-entry-query-source
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: compile_entry_query_source }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-004#criterion.entry-query-translation
              - kind: satisfies
                criterion: REQ-COMP-004#criterion.used-field-fingerprint
      - id: entry-query-fingerprint-evidence
        role: evidence
        facet: core-tests
        responsibility: Preserve focused evidence for excluding unrelated schema fields and matching the text-search expansion defined by existing EntryQuery semantics.
        targets:
          - id: ignores-unreferenced-fields
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: entry_query_fingerprint_ignores_unreferenced_schema_fields }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
          - id: text-search-fields
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: text_search_fingerprints_only_fields_searched_by_entry_query }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
          - id: added-searchable-field
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: new_text_search_field_changes_source_schema }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.used-field-fingerprint
      - id: entry-query-current-authorization-evidence
        role: evidence
        facet: iceberg-tests
        responsibility: Show that a Composition-resolved source request does not grant source access, revocation before the first query page returns no rows, and a continuation after access changes fails closed.
        targets:
          - id: source-resolution-and-continuation-current-authorization
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_query_authorization.rs
            selector: { kind: symbol, name: source_resolution_and_continuation_recheck_current_authorization }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.current-authorization
      - id: saved-sql-resolver
        role: implementation
        facet: core
        responsibility: Compile Saved SQL sources through the exact current revision descriptor and fingerprint the ordered output contract, used variables, and selected metric columns.
        targets:
          - id: compile-exact-saved-sql-source
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: compile_saved_sql_source }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-004#criterion.exact-saved-sql-revision
          - id: fingerprint-resolved-saved-sql-source
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: compile_saved_sql_source_with_metric_columns }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-004#criterion.saved-sql-result-fingerprint
      - id: saved-sql-resolver-evidence
        role: evidence
        facet: core-tests
        responsibility: Verify exact stateless SQL request compilation, rejection of a missing or mismatched current revision descriptor, and deterministic fingerprint inputs including metric selection.
        targets:
          - id: exact-stateless-sql-request
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_source_compiles_to_the_exact_stateless_sql_request }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.exact-saved-sql-revision
          - id: missing-or-mismatched-exact-revision
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_source_requires_the_exact_current_revision_descriptor }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.exact-saved-sql-revision
          - id: used-variable-schema-fingerprint
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_schema_fingerprint_tracks_variable_types_deterministically }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.saved-sql-result-fingerprint
          - id: ordered-result-descriptor-fingerprint
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_schema_fingerprint_tracks_ordered_result_descriptors }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.saved-sql-result-fingerprint
          - id: selected-metric-column-fingerprint
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_result_fingerprint_tracks_selected_metric_column }
            claims:
              - kind: evidences
                anchor: REQ-COMP-004#criterion.saved-sql-result-fingerprint
      - id: metric-page-validation
        role: implementation
        facet: core
        responsibility: Bind metrics to typed source fields or result columns and validate an already-authorized complete query page through the shared Domain evaluator.
        targets:
          - id: entry-metric-page-adapter
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: evaluate_entry_metric_page }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.metric-runtime-values
          - id: saved-sql-metric-page-adapter
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: evaluate_saved_sql_metric_page }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-002#criterion.metric-runtime-values
      - id: metric-page-validation-evidence
        role: evidence
        facet: core-tests
        responsibility: Verify scalar descriptor checks and exact one-row, complete-page validation for EntryQuery and Saved SQL metric results.
        targets:
          - id: sql-metric-column-before-revision-lookup
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_metric_selector_requires_one_declared_scalar_column_before_revision_lookup }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
          - id: entry-metric-current-field-type
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: entry_metric_rejects_a_current_non_scalar_form_field }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
          - id: entry-metric-complete-scalar-page
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: entry_metric_page_adapter_checks_one_complete_scalar_row }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.metric-runtime-values
          - id: saved-sql-metric-alias-and-scalar-page
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: saved_sql_metric_page_adapter_checks_exact_alias_and_scalar_shape }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
          - id: metric-page-binding-kind
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: metric_page_adapter_rejects_wrong_binding_kind }
            claims:
              - kind: evidences
                anchor: REQ-COMP-002#criterion.typed-metric-value-field
      - id: cli-raw-inspection-source-evidence
        role: evidence
        facet: cli
        responsibility: Show the CLI read and raw-output paths as partial evidence for inspection behavior; these source bindings do not establish export or history behavior.
        targets:
          - id: inspect-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: evidences
                anchor: REQ-COMP-005#criterion.raw-inspection
