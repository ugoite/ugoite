schema: mitase/spec/v1
kind: features
namespace: security
category: Server security boundary surfaces
features:
  - id: FEAT-SEC-001
    title: Server security boundary
    summary: Connect loopback-first server configuration, response security headers, mandatory REST/MCP authentication, deployment artifacts, and exact verification evidence without introducing a Ugoite-specific specification kind.
    status: implemented
    bindings:
      - id: server
        role: implementation
        facet: backend
        responsibility: Enforce the response security-header policy and authenticated boundary for protected REST and MCP requests.
        targets:
          - id: security-header-policy
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: SecurityHeadersPolicy }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-002#criterion.common-header-policy
              - kind: satisfies
                criterion: REQ-SEC-002#criterion.loopback-hsts-boundary
          - id: security-route-layer
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: app_layers }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-002#criterion.common-header-policy
          - id: authentication-middleware
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: require_auth }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-003#criterion.protected-rest
          - id: mcp-authentication
            adapter: rust
            path: crates/ugoite-server/src/mcp.rs
            selector: { kind: symbol, name: authenticate }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-003#criterion.protected-mcp
      - id: listen-configuration
        role: implementation
        facet: deployment
        responsibility: Keep the server's explicit listen-address override and loopback default visible at the process and operator configuration boundaries.
        targets:
          - id: server-entrypoint
            adapter: rust
            path: crates/ugoite-server/src/main.rs
            selector: { kind: symbol, name: server_address_from }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-001#criterion.default-loopback
          - id: release-compose
            adapter: declared
            path: docker-compose.release.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-001#criterion.compose-loopback
      - id: contract
        role: contract-source
        facet: api
        responsibility: Keep the authoritative OpenAPI artifact connected to the protected REST operation surface; detailed authentication operation coverage remains part of the next Security migration slices.
        owns:
          - id: openapi-source
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
        targets:
          - id: protected-space-list
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: /spaces }

  - id: FEAT-SEC-002
    title: Human Passkey and initial bootstrap
    summary: Connect the passwordless Passkey/WebAuthn authentication flow and initial node-owner bootstrap across identity state, server handlers, browser routes, OpenAPI operations, and exact verification artifacts.
    status: implemented
    bindings:
      - id: identity
        role: implementation
        facet: identity
        responsibility: Enforce discoverable Passkey registration, server-side assertion validation, one-time setup-secret handling, initial administrator creation, recovery-code emission, and opaque session creation.
        targets:
          - id: passkey-registration
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: start_add_passkey }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.discoverable-credentials
          - id: passkey-authentication
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: finish_authentication }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.server-side-assertion-validation
          - id: setup-secret
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: bootstrap_if_needed }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.setup-secret-hash-once
          - id: setup-finish
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: finish_setup_registration }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.initial-owner-passkey
          - id: session-validation
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: authenticate_session }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.opaque-bootstrap-session
      - id: server
        role: implementation
        facet: backend
        responsibility: Expose the Passkey login and setup ceremonies through the server's public authentication boundary.
        targets:
          - id: passkey-start
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: auth_passkey_start }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.passwordless-primary
          - id: passkey-registration-start
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: start_add_passkey }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.discoverable-credentials
          - id: passkey-registration-finish
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: finish_add_passkey }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.discoverable-credentials
          - id: passkey-finish
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: auth_passkey_finish }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.server-side-assertion-validation
          - id: setup-start
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: auth_setup_start }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.initial-owner-passkey
          - id: setup-finish
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: auth_setup_finish }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.initial-owner-passkey
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.bootstrap-recovery-material
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.opaque-bootstrap-session
      - id: client
        role: implementation
        facet: frontend
        responsibility: Keep the browser Passkey login and initial setup journeys connected to the server authentication API while preserving the requested post-authentication route.
        targets:
          - id: auth-client
            adapter: typescript
            path: frontend/src/lib/auth-api.ts
            selector: { kind: symbol, name: authApi }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.passwordless-primary
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.bootstrap-recovery-material
          - id: login-route
            adapter: typescript
            path: frontend/src/routes/login.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-004#criterion.passwordless-primary
          - id: setup-route
            adapter: typescript
            path: frontend/src/routes/setup.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-005#criterion.bootstrap-recovery-material
      - id: contract
        role: contract-source
        facet: api
        responsibility: Keep the public OpenAPI authentication operations connected to the Passkey and setup handlers.
        targets:
          - id: setup-start
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/setup/start }
          - id: setup-finish
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/setup/finish }
          - id: passkey-start
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/passkey/start }
          - id: passkey-finish
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/passkey/finish }
          - id: passkey-registration-start
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/passkeys/start }
          - id: passkey-registration-finish
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/passkeys/finish }
    contracts:
      - id: passkey-authentication
        kind: http
        source: FEAT-SEC-002#binding.contract/target.passkey-start
        participants:
          - target: FEAT-SEC-002#binding.identity/target.passkey-authentication
            role: identity
          - target: FEAT-SEC-002#binding.server/target.passkey-start
            role: backend
          - target: FEAT-SEC-002#binding.server/target.passkey-finish
            role: backend
          - target: FEAT-SEC-002#binding.client/target.auth-client
            role: client
          - target: FEAT-SEC-002#binding.client/target.login-route
            role: route
        guarantees:
          - REQ-SEC-004#criterion.passwordless-primary
          - REQ-SEC-004#criterion.server-side-assertion-validation
      - id: passkey-registration
        kind: http
        source: FEAT-SEC-002#binding.contract/target.passkey-registration-start
        participants:
          - target: FEAT-SEC-002#binding.identity/target.passkey-registration
            role: identity
          - target: FEAT-SEC-002#binding.server/target.passkey-registration-start
            role: backend
          - target: FEAT-SEC-002#binding.server/target.passkey-registration-finish
            role: backend
        guarantees: [REQ-SEC-004#criterion.discoverable-credentials]
      - id: initial-bootstrap
        kind: http
        source: FEAT-SEC-002#binding.contract/target.setup-start
        participants:
          - target: FEAT-SEC-002#binding.identity/target.setup-secret
            role: identity
          - target: FEAT-SEC-002#binding.identity/target.setup-finish
            role: identity
          - target: FEAT-SEC-002#binding.server/target.setup-start
            role: backend
          - target: FEAT-SEC-002#binding.server/target.setup-finish
            role: backend
          - target: FEAT-SEC-002#binding.client/target.auth-client
            role: client
          - target: FEAT-SEC-002#binding.client/target.setup-route
            role: route
          - target: FEAT-SEC-002#binding.identity/target.session-validation
            role: session
        guarantees:
          - REQ-SEC-005#criterion.setup-secret-hash-once
          - REQ-SEC-005#criterion.initial-owner-passkey
          - REQ-SEC-005#criterion.bootstrap-recovery-material
          - REQ-SEC-005#criterion.opaque-bootstrap-session

  - id: FEAT-SEC-003
    title: Account Self-Recovery
    summary: Connect recovery-only TOTP enrollment and the Recovery Code plus TOTP Passkey replacement flow across Node identity state, server boundaries, browser recovery UI, OpenAPI, and the end-to-end recovery journey.
    status: implemented
    bindings:
      - id: identity
        role: implementation
        facet: identity
        responsibility: Enforce encrypted recovery-factor storage, dual-factor recovery validation, credential-generation replacement, Recovery Code rotation, stale-authority invalidation, and recovery session creation.
        targets:
          - id: totp-enrollment
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: start_totp_enrollment }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
          - id: totp-enrollment-finish
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: finish_totp_enrollment }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
          - id: recovery-start
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: start_recovery_registration }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.dual-factor-recovery
          - id: recovery-finish
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: finish_recovery_registration }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.credential-replacement
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.stale-authority-invalidation
          - id: recovery-code-rotation
            adapter: rust
            path: crates/ugoite-identity/src/node_identity.rs
            selector: { kind: symbol, name: rotate_recovery_codes_with_snapshot_credential_and_session }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.credential-replacement
      - id: server
        role: implementation
        facet: backend
        responsibility: Expose recovery-factor enrollment, Account Self-Recovery, and Node audit reads through the authenticated server boundary.
        targets:
          - id: totp-start
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: start_totp_enrollment }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
          - id: totp-finish
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: finish_totp_enrollment }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.recovery-factor-enrollment
          - id: recovery-start
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: auth_recovery_start }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.dual-factor-recovery
          - id: recovery-finish
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: auth_recovery_finish }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.credential-replacement
          - id: node-audit
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: list_node_audit_events }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.recovery-audit-attribution
      - id: client
        role: implementation
        facet: frontend
        responsibility: Keep the browser Account Self-Recovery journey connected to the recovery API and display rotated Recovery Codes once before returning to the requested route.
        targets:
          - id: account-recovery-route
            adapter: typescript
            path: frontend/src/routes/recover/account.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.credential-replacement
          - id: browser-recovery-journey
            adapter: typescript
            path: e2e/account-self-recovery.test.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SEC-014#criterion.recovery-audit-attribution
      - id: contract
        role: contract-source
        facet: api
        responsibility: Keep the public OpenAPI recovery operations and Node audit read connected to the recovery implementation boundaries.
        targets:
          - id: totp-start
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/recovery/totp/start }
          - id: totp-finish
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/recovery/totp/finish }
          - id: recovery-start
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/recovery/start }
          - id: recovery-finish
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /auth/recovery/finish }
          - id: node-audit
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: /auth/audit }
    contracts:
      - id: account-self-recovery
        kind: http
        source: FEAT-SEC-003#binding.contract/target.recovery-start
        participants:
          - target: FEAT-SEC-003#binding.identity/target.recovery-start
            role: identity
          - target: FEAT-SEC-003#binding.identity/target.recovery-finish
            role: identity
          - target: FEAT-SEC-003#binding.identity/target.recovery-code-rotation
            role: identity
          - target: FEAT-SEC-003#binding.server/target.recovery-start
            role: backend
          - target: FEAT-SEC-003#binding.server/target.recovery-finish
            role: backend
          - target: FEAT-SEC-003#binding.client/target.account-recovery-route
            role: client
          - target: FEAT-SEC-002#binding.client/target.auth-client
            role: api-client
        guarantees:
          - REQ-SEC-014#criterion.dual-factor-recovery
          - REQ-SEC-014#criterion.credential-replacement
          - REQ-SEC-014#criterion.stale-authority-invalidation
      - id: recovery-factor-enrollment
        kind: http
        source: FEAT-SEC-003#binding.contract/target.totp-start
        participants:
          - target: FEAT-SEC-003#binding.identity/target.totp-enrollment
            role: identity
          - target: FEAT-SEC-003#binding.identity/target.totp-enrollment-finish
            role: identity
          - target: FEAT-SEC-003#binding.server/target.totp-start
            role: backend
          - target: FEAT-SEC-003#binding.server/target.totp-finish
            role: backend
        guarantees:
          - REQ-SEC-014#criterion.recovery-factor-enrollment
      - id: recovery-audit
        kind: http
        source: FEAT-SEC-003#binding.contract/target.node-audit
        participants:
          - target: FEAT-SEC-003#binding.server/target.node-audit
            role: backend
        guarantees:
          - REQ-SEC-014#criterion.recovery-audit-attribution
