schema: mitase/spec/v1
kind: features
namespace: journey
category: Golden Knowledge Journey surface bindings
features:
  - id: FEAT-JOURNEY-001
    title: Golden Knowledge Journey across surfaces
    summary: Carry JOURNEY-KNOWLEDGE-001 from the portable operation inventory through the server-backed Frontend path to exact Playwright journey evidence. CLI core and CLI remote bindings attach to the same criteria in later workstream steps without duplicating them.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep the shipped portable-protocol API modules connected to the journey outcome criteria.
        targets:
          - id: space-api
            adapter: typescript
            path: frontend/src/lib/space-api.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.space-establish
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.reopen
          - id: form-api
            adapter: typescript
            path: frontend/src/lib/form-api.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.form-establish
          - id: entry-api
            adapter: typescript
            path: frontend/src/lib/entry-api.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-create
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-edit
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-history
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-restore
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.reopen
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.stale-revision
          - id: search-api
            adapter: typescript
            path: frontend/src/lib/search-api.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.search-keyword
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.reopen
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.structured-search-narrow
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.recovered-search-reopen
          - id: change-api
            adapter: typescript
            path: frontend/src/lib/change-api.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.space-change-history
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.change-revert-append
      - id: server
        role: operation
        facet: backend
        responsibility: Route the journey flow through the Space, Form, Entry, history, restore, and search handlers owned by their capability features. This binding references without owning; handler ownership stays single-sourced.
        targets:
          - id: create-space
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: create_space }
          - id: get-space
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_space }
          - id: upsert-form
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: upsert_form }
          - id: get-form
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_form }
          - id: create-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: create_entry }
          - id: update-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: update_entry }
          - id: entry-history
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: entry_history }
          - id: entry-revision
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: entry_revision }
          - id: restore-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: restore_entry }
          - id: search-entries
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: search_entries }
          - id: list-changes
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: list_changes }
          - id: revert-change
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: revert_change }
      - id: cli-core
        role: implementation
        facet: cli
        responsibility: Implement the local/core CLI Form and Search paths exercised by the journey core evidence. Entry and Space command ownership stays with their capability features; the same journey criteria gather those bindings without duplicating them.
        targets:
          - id: form-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/form.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.form-establish
          - id: search-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/search.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.search-keyword
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.reopen
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.structured-search-narrow
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.recovered-search-reopen
          - id: change-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/change.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.space-change-history
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.change-revert-append
              - kind: satisfies
                criterion: REQ-JOURNEY-004#criterion.recovered-search-reopen
      - id: cli-remote
        role: operation
        facet: cli
        responsibility: Route the same journey flow through the server-backed CLI transport. Command ownership stays with the capability features and the cli-core binding; this binding only separates remote evidence identity from core evidence.
        targets:
          - id: space-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/space.rs
            selector: { kind: symbol, name: run }
          - id: form-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/form.rs
            selector: { kind: symbol, name: run }
          - id: entry-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/entry.rs
            selector: { kind: symbol, name: run }
          - id: search-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/search.rs
            selector: { kind: symbol, name: run }
      - id: contract
        role: contract-source
        facet: api
        responsibility: Define the authoritative HTTP operations exercised by the journey.
        owns:
          - id: openapi-source
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
        targets:
          - id: create-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /spaces }
          - id: get-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}' }
          - id: upsert-form
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces/{space_id}/forms' }
          - id: get-form
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/forms/{form_name}' }
          - id: create-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces/{space_id}/entries' }
          - id: update-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: put, path: '/spaces/{space_id}/entries/{entry_id}' }
          - id: entry-history
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/entries/{entry_id}/history' }
          - id: entry-revision
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/entries/{entry_id}/history/{revision_id}' }
          - id: restore-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces/{space_id}/entries/{entry_id}/restore' }
          - id: search-keyword
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/search' }
    contracts:
      - id: journey-space-create
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.create-space
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.space-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.space-establish]
      - id: journey-space-read
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.get-space
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.space-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
        guarantees:
          - REQ-JOURNEY-001#criterion.space-establish
          - REQ-JOURNEY-001#criterion.reopen
      - id: journey-form-upsert
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.upsert-form
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.form-api
            role: client
          - target: FEAT-JOURNEY-001#binding.cli-core/target.form-command
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.form-establish]
      - id: journey-form-read
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.get-form
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.form-api
            role: client
          - target: FEAT-JOURNEY-001#binding.cli-core/target.form-command
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.form-establish]
      - id: journey-entry-create
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.create-entry
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.entry-create]
      - id: journey-entry-update
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.update-entry
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.entry-edit]
      - id: journey-entry-history
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.entry-history
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees:
          - REQ-JOURNEY-001#criterion.entry-history
          - REQ-JOURNEY-001#criterion.reopen
      - id: journey-entry-revision
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.entry-revision
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees:
          - REQ-JOURNEY-001#criterion.entry-history
          - REQ-JOURNEY-001#criterion.entry-restore
      - id: journey-entry-restore
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.restore-entry
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.entry-restore]
      - id: journey-search
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.search-keyword
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.search-api
            role: client
          - target: FEAT-JOURNEY-001#binding.cli-core/target.search-command
            role: operator
        guarantees:
          - REQ-JOURNEY-001#criterion.search-keyword
          - REQ-JOURNEY-001#criterion.reopen
      - id: journey-reopen
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.entry-history
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.space-api
            role: client
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-JOURNEY-001#binding.frontend/target.search-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
          - target: FEAT-JOURNEY-001#binding.cli-core/target.search-command
            role: operator
        guarantees: [REQ-JOURNEY-001#criterion.reopen]
      - id: journey-stale-revision
        kind: http
        source: FEAT-JOURNEY-001#binding.contract/target.update-entry
        participants:
          - target: FEAT-JOURNEY-001#binding.frontend/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees: [REQ-JOURNEY-002#criterion.stale-revision]

  - id: FEAT-JOURNEY-002
    title: Journey Frontend-only usability surface
    summary: Keep browser-only journey usability (conflict recovery guidance, validation focus) connected to exact Frontend component evidence without inventing CLI parity.
    status: implemented
    bindings:
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Keep the shipped Entry detail workspace connected to the browser-only usability criteria.
        targets:
          - id: entry-detail-pane
            adapter: typescript
            path: frontend/src/components/EntryDetailPane.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-JOURNEY-003#criterion.conflict-recovery-guidance
              - kind: satisfies
                criterion: REQ-JOURNEY-003#criterion.validation-focus
