schema: mitase/spec/v1
kind: features
namespace: storage
category: Space storage and bootstrap foundation
features:
  - id: FEAT-STO-001
    title: Space storage foundation
    summary: Connect the shared OpenDAL storage boundary, Space bootstrap and registry behavior, authenticated creation retry and duplicate conflict, local permissions, connector validation, resilient listing, and backend-neutral operator support to exact Ugoite artifacts and verification evidence.
    status: implemented
    bindings:
      - id: opendal
        role: implementation
        facet: storage
        responsibility: Keep shared OpenDAL operator construction and storage helpers as the only runtime persistence boundary for Space data.
        targets:
          - id: operator-factory
            adapter: rust
            path: crates/ugoite-storage/src/lib.rs
            selector: { kind: symbol, name: operator_from_uri }
            claims:
              - kind: satisfies
                criterion: REQ-STO-007#criterion.backend-neutral-io
          - id: storage-helper
            adapter: rust
            path: crates/ugoite-storage/src/lib.rs
            selector: { kind: symbol, name: OpendalStorage }
            claims:
              - kind: satisfies
                criterion: REQ-STO-001#criterion.shared-opendal-boundary
      - id: space
        role: implementation
        facet: space
        responsibility: Implement current Space bootstrap, registry discovery, and local permission boundaries.
        targets:
          - id: create-space
            adapter: rust
            path: crates/ugoite-iceberg/src/space.rs
            selector: { kind: symbol, name: create_space }
            claims:
              - kind: satisfies
                criterion: REQ-STO-002#criterion.bootstrap-scaffold
              - kind: satisfies
                criterion: REQ-STO-012#criterion.bootstrap-boundary
          - id: list-spaces
            adapter: rust
            path: crates/ugoite-iceberg/src/space.rs
            selector: { kind: symbol, name: list_spaces }
            claims:
              - kind: satisfies
                criterion: REQ-STO-004#criterion.directory-registry
              - kind: satisfies
                criterion: REQ-STO-008#criterion.incomplete-directory-filtering
              - kind: satisfies
                criterion: REQ-STO-009#criterion.incomplete-space-filtering
          - id: local-permissions
            adapter: rust
            path: crates/ugoite-iceberg/src/space.rs
            selector: { kind: symbol, name: apply_local_space_permissions }
            claims:
              - kind: satisfies
                criterion: REQ-STO-003#criterion.owner-only-scaffold
      - id: service
        role: implementation
        facet: service
        responsibility: Keep application-level Space listing and mutation admission connected to the storage boundary.
        targets:
          - id: list-space-ids
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: list_space_ids }
            claims:
              - kind: satisfies
                criterion: REQ-STO-004#criterion.service-space-listing
          - id: mutation-admission
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: ensure_mutation_admitted }
            claims:
              - kind: satisfies
                criterion: REQ-STO-001#criterion.mutation-admission
      - id: space-api
        role: implementation
        facet: backend
        responsibility: Enforce authenticated Space creation, same-account retry, and duplicate-slug conflict behavior at the REST boundary while preserving recoverability for a missing final Node binding.
        targets:
          - id: create-space-api
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: create_space }
            claims:
              - kind: satisfies
                criterion: REQ-STO-005#criterion.new-space-created
              - kind: satisfies
                criterion: REQ-STO-005#criterion.bound-account-retry
              - kind: satisfies
                criterion: REQ-STO-005#criterion.duplicate-slug-conflict
              - kind: satisfies
                criterion: REQ-STO-005#criterion.missing-binding-recovery
      - id: domain
        role: implementation
        facet: domain
        responsibility: Preserve portable Space storage configuration without coupling its representation to a provider-specific persistence model.
        targets:
          - id: storage-config
            adapter: rust
            path: crates/ugoite-domain/src/space.rs
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-STO-004#criterion.portable-storage-config
      - id: connector
        role: implementation
        facet: storage
        responsibility: Validate proposed storage connector configurations and report unsafe or unreachable endpoints before they are treated as usable.
        targets:
          - id: test-storage-connection
            adapter: rust
            path: crates/ugoite-iceberg/src/space.rs
            selector: { kind: symbol, name: test_storage_connection }
            claims:
              - kind: satisfies
                criterion: REQ-STO-006#criterion.supported-connector-config
              - kind: satisfies
                criterion: REQ-STO-006#criterion.safe-remote-endpoint
              - kind: satisfies
                criterion: REQ-STO-006#criterion.explicit-connectivity-failure
      - id: connector-api
        role: implementation
        facet: backend
        responsibility: Expose the Space storage connector update and connection-validation operations through the server adapter without making the adapter a second storage authority.
        targets:
          - id: patch-space
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: patch_space }
            claims:
              - kind: satisfies
                criterion: REQ-STO-006#criterion.connector-updates
          - id: test-connection
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: test_connection }
            claims:
              - kind: satisfies
                criterion: REQ-STO-006#criterion.validation-endpoint
      - id: connector-ui
        role: implementation
        facet: frontend
        responsibility: Present storage connector metadata updates and an explicit connection-validation action without conflating saved configuration with the current physical storage topology.
        targets:
          - id: storage-settings
            adapter: typescript
            path: frontend/src/components/SpaceSettings.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-STO-006#criterion.connector-updates
              - kind: satisfies
                criterion: REQ-STO-006#criterion.validation-endpoint
      - id: contract
        role: contract-source
        facet: api
        responsibility: Define the authoritative HTTP operations for creating and updating Space storage metadata, validating a proposed storage connection, and publishing the duplicate-create boundary.
        owns:
          - id: openapi-source
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
        targets:
          - id: create-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces' }
            claims:
              - kind: satisfies
                criterion: REQ-STO-005#criterion.new-space-created
              - kind: satisfies
                criterion: REQ-STO-005#criterion.bound-account-retry
              - kind: satisfies
                criterion: REQ-STO-005#criterion.duplicate-slug-conflict
          - id: patch-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: patch, path: '/spaces/{space_id}' }
          - id: test-connection
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces/{space_id}/test-connection' }
      - id: routing
        role: implementation
        facet: cli
        responsibility: Keep Space CLI identifiers aligned with the configured local core or remote backend routing mode and document both forms in help.
        targets:
          - id: space-command-routing
            adapter: rust
            path: crates/ugoite-cli/src/commands/space.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-STO-010#criterion.remote-identifier-routing
              - kind: satisfies
                criterion: REQ-STO-010#criterion.explicit-core-root
              - kind: satisfies
                criterion: REQ-STO-010#criterion.routing-help-contract
              - kind: satisfies
                criterion: REQ-API-001#criterion.space-lifecycle
      - id: preferences
        role: implementation
        facet: storage
        responsibility: Persist portable user preferences under hashed user storage keys and merge concurrent updates through the publication boundary.
        targets:
          - id: get-user-preferences
            adapter: rust
            path: crates/ugoite-iceberg/src/preferences.rs
            selector: { kind: symbol, name: get_user_preferences }
            claims:
              - kind: satisfies
                criterion: REQ-STO-011#criterion.null-valued-default
          - id: patch-user-preferences
            adapter: rust
            path: crates/ugoite-iceberg/src/preferences.rs
            selector: { kind: symbol, name: patch_user_preferences }
            claims:
              - kind: satisfies
                criterion: REQ-STO-011#criterion.hashed-user-path
              - kind: satisfies
                criterion: REQ-STO-011#criterion.merged-concurrent-patch
      - id: layout
        role: contract-source
        facet: storage-layout
        responsibility: Keep the machine-readable Space layout and its explanatory directory reference connected to the current storage implementation. These artifacts classify bootstrap and lazy paths; they do not introduce a Ugoite-specific Mitase kind.
        targets:
          - id: layout-source
            adapter: declared
            path: docs/architecture/data-model/directory-layout.yaml
            selector: { kind: file }
          - id: directory-structure
            adapter: declared
            path: docs/architecture/data-model/directory-structure.md
            selector: { kind: file }
      - id: derived
        role: implementation
        facet: derived
        responsibility: Keep replaceable DerivedRelation Heads and their logical Iceberg coordinates within the owning Space while preserving the authoritative Catalog boundary.
        targets:
          - id: head-store
            adapter: rust
            path: crates/ugoite-storage/src/lib.rs
            selector: { kind: symbol, name: DerivedRelationHeadStore }
            claims:
              - kind: satisfies
                criterion: REQ-STO-013#criterion.space-local-coordinates
              - kind: satisfies
                criterion: REQ-STO-013#criterion.conditional-head-publication
              - kind: satisfies
                criterion: REQ-STO-013#criterion.non-authoritative-derived-state
          - id: logical-coordinate-resolver
            adapter: rust
            path: crates/ugoite-iceberg/src/logical_storage.rs
            selector: { kind: symbol, name: LogicalStorage }
            claims:
              - kind: satisfies
                criterion: REQ-STO-013#criterion.canonical-coordinate-resolution
      - id: compatibility
        role: implementation
        facet: compatibility
        responsibility: Keep the canonical v0.1 Knowledge fixture connected to the semantic compatibility requirement. The fixture protects Knowledge meaning and authority, not physical storage encoding.
        targets:
          - id: fixture
            adapter: declared
            path: crates/ugoite-iceberg/tests/fixtures/v0.1-knowledge.json
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-STO-014#criterion.fixture-identity
              - kind: satisfies
                criterion: REQ-STO-014#criterion.authoritative-recovery
              - kind: satisfies
                criterion: REQ-STO-014#criterion.append-only-history
      - id: compatibility-contract
        role: contract-source
        facet: compatibility
        responsibility: Preserve the v0.1 Knowledge compatibility reference as an artifact defining semantic recovery, authority, and append-only history without freezing physical storage encoding.
        targets:
          - id: contract
            adapter: declared
            path: docs/spec/versions/v0.1-knowledge-compatibility.md
            selector: { kind: file }
    contracts:
      - id: create-space
        kind: http
        source: FEAT-STO-001#binding.contract/target.create-space
        participants:
          - target: FEAT-STO-001#binding.space-api/target.create-space-api
            role: backend
        guarantees:
          - REQ-STO-005#criterion.new-space-created
          - REQ-STO-005#criterion.bound-account-retry
          - REQ-STO-005#criterion.duplicate-slug-conflict
      - id: patch-space
        kind: http
        source: FEAT-STO-001#binding.contract/target.patch-space
        participants:
          - target: FEAT-STO-001#binding.connector-api/target.patch-space
            role: backend
          - target: FEAT-STO-001#binding.connector-ui/target.storage-settings
            role: client
        guarantees: [REQ-STO-006#criterion.connector-updates]
      - id: test-connection
        kind: http
        source: FEAT-STO-001#binding.contract/target.test-connection
        participants:
          - target: FEAT-STO-001#binding.connector-api/target.test-connection
            role: backend
          - target: FEAT-STO-001#binding.connector-ui/target.storage-settings
            role: client
        guarantees: [REQ-STO-006#criterion.validation-endpoint]
      - id: derived-relations
        kind: custom
        source: FEAT-STO-001#binding.layout/target.layout-source
        participants:
          - target: FEAT-STO-001#binding.derived/target.head-store
            role: storage
          - target: FEAT-STO-001#binding.derived/target.logical-coordinate-resolver
            role: resolver
          - target: FEAT-ASSET-001#binding.derived/target.asset-text-rebuild
            role: producer
        guarantees:
          - REQ-STO-013#criterion.space-local-coordinates
          - REQ-STO-013#criterion.conditional-head-publication
          - REQ-STO-013#criterion.non-authoritative-derived-state
          - REQ-STO-013#criterion.rebuildable-builds
          - REQ-STO-013#criterion.canonical-coordinate-resolution
      - id: knowledge-compatibility
        kind: custom
        source: FEAT-STO-001#binding.compatibility-contract/target.contract
        participants:
          - target: FEAT-STO-001#binding.compatibility/target.fixture
            role: fixture
        guarantees:
          - REQ-STO-014#criterion.fixture-identity
          - REQ-STO-014#criterion.authoritative-recovery
          - REQ-STO-014#criterion.append-only-history
      - id: lazy-paths
        kind: custom
        source: FEAT-STO-001#binding.layout/target.layout-source
        participants:
          - target: FEAT-INT-001#binding.storage/target.space-material
            role: space-response-material
          - target: FEAT-INT-001#binding.storage/target.default-material
            role: node-response-material
          - target: FEAT-API-001#binding.core/target.create-sql-session
            role: sql-session-metadata
        guarantees: [REQ-STO-012#criterion.lazy-path-boundary]
