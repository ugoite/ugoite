schema: mitase/authoring/v2
kind: features
namespace: sql
category: SQL task-oriented editing
features:
  - id: FEAT-SQL-004
    title: Bounded task-oriented Filter and Sort editing
    summary: Construct common comparisons and ordered column keys through typed Rust SQL Document transactions for one unambiguous named Form relation.
    status: implemented
    bindings:
      - id: typed-edit-contract
        role: contract-source
        facet: core
        responsibility: Define the shared typed SQL Document semantic edit request.
        targets:
          - id: edit-request
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: SqlDocumentSemanticEdit }
      - id: rust-edit-core
        role: implementation
        facet: core
        responsibility: Construct bounded filter comparisons and sort keys from typed identifiers, operators, values, and sort options while preserving guarded inverse edits.
        targets:
          - id: add-filter-comparison
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: add_filter_comparison }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
          - id: add-order-by-column
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: add_order_by_column }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
          - id: condition-tree-transactions
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: condition_semantic_edit }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.condition-group-editing
          - id: condition-tree-projection
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: derive_sql_document_conditions }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.condition-group-editing
      - id: frontend-editor
        role: implementation
        facet: frontend
        responsibility: Present context-filtered common Filter and Sort controls and apply their drafts through the typed Rust protocol with stale-source and scope guards.
        targets:
          - id: task-editor
            adapter: typescript
            path: frontend/src/components/SqlFilterSortEditor.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.typed-filter-argument-transactions
      - id: condition-workspace
        role: implementation
        facet: frontend
        responsibility: Present parsed supported conditions as editable nested groups and submit condition drafts through the guarded Rust transaction while preserving unsupported predicate source for advanced editing.
        targets:
          - id: condition-tree-editor
            adapter: typescript
            path: frontend/src/components/SqlConditionWorkspace.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.condition-group-editing
      - id: wasm-protocol
        role: implementation
        facet: wasm
        responsibility: Expose the typed semantic edit constructors through the portable Rust JSON/WASM protocol.
        targets:
          - id: semantic-edit-action
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: invoke_json }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
              - kind: satisfies
                criterion: REQ-SQL-003#criterion.condition-group-editing
      - id: task-edit-verification
        role: verification
        facet: verification
        responsibility: Verify typed Rust construction and inverse edits, WASM protocol parity, and browser task-editor behavior for stable drafts, aliases, complex predicate preservation, and stale responses.
        targets:
          - id: native-filter-sort-construction
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: tests::task_filter_and_sort_constructors_create_typed_columns_and_undo }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
                covers:
                  - FEAT-SQL-004#binding.rust-edit-core/target.add-filter-comparison
                  - FEAT-SQL-004#binding.rust-edit-core/target.add-order-by-column
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-domain
                    test: sql_document::tests::task_filter_and_sort_constructors_create_typed_columns_and_undo
          - id: browser-task-editor
            adapter: typescript
            path: frontend/src/components/SqlFilterSortEditor.test.tsx
            selector: { kind: test, name: keeps a typed filter draft stable while typing and applies it through Rust }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
                covers:
                  - FEAT-SQL-004#binding.frontend-editor/target.task-editor
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFilterSortEditor.test.tsx
                    test: keeps a typed filter draft stable while typing and applies it through Rust
          - id: filter-argument-standalone
            adapter: typescript
            path: frontend/src/components/SqlFilterSortEditor.test.tsx
            selector:
              kind: test
              name: creates standalone arguments with the selected column type and default, without creating one for null operators
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.typed-filter-argument-transactions
                covers:
                  - FEAT-SQL-004#binding.frontend-editor/target.task-editor
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFilterSortEditor.test.tsx
                    test: creates standalone arguments with the selected column type and default, without creating one for null operators
          - id: wasm-protocol-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: sql_document_task_filter_sort_constructors_match_native }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.bounded-task-editing
                covers:
                  - FEAT-SQL-004#binding.wasm-protocol/target.semantic-edit-action
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: sql_document_task_filter_sort_constructors_match_native
      - id: condition-edit-verification
        role: verification
        facet: verification
        responsibility: Verify condition projection and atomic edits in native Rust, portable WASM, browser component, and the SQL Form-to-save browser journey.
        targets:
          - id: condition-view-and-undo
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: tests::condition_view_and_typed_mutations_preserve_sql_authority_and_undo }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers:
                  - FEAT-SQL-004#binding.rust-edit-core/target.condition-tree-transactions
                  - FEAT-SQL-004#binding.rust-edit-core/target.condition-tree-projection
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-domain
                    test: sql_document::tests::condition_view_and_typed_mutations_preserve_sql_authority_and_undo
          - id: condition-stale-and-comment-guards
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: tests::condition_mutations_reject_stale_sources_and_comment_loss }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.rust-edit-core/target.condition-tree-transactions]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-domain
                    test: sql_document::tests::condition_mutations_reject_stale_sources_and_comment_loss
          - id: condition-wasm-protocol
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: sql_document_filter_condition_protocol_matches_native_view_edit_and_undo }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.wasm-protocol/target.semantic-edit-action]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: sql_document_filter_condition_protocol_matches_native_view_edit_and_undo
          - id: condition-browser-workspace
            adapter: typescript
            path: frontend/src/components/SqlFilterSortEditor.test.tsx
            selector: { kind: test, name: shows editable existing conditions and preserves every argument on a leaf edit }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.condition-workspace/target.condition-tree-editor]
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFilterSortEditor.test.tsx
                    test: shows editable existing conditions and preserves every argument on a leaf edit
          - id: condition-group-composer
            adapter: typescript
            path: frontend/src/components/SqlFilterSortEditor.test.tsx
            selector: { kind: test, name: creates an Any group only after both inline conditions are valid }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.condition-workspace/target.condition-tree-editor]
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/components/SqlFilterSortEditor.test.tsx
                    test: creates an Any group only after both inline conditions are valid
          - id: condition-browser-journey
            adapter: typescript
            path: e2e/sql-condition-workspace.test.ts
            selector: { kind: test, name: "REQ-SQL-003 @smoke: edits nested Filter conditions, runs, and reopens the saved query" }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.condition-workspace/target.condition-tree-editor]
                runner:
                  runner: e2e-playwright
                  arguments:
                    file: e2e/sql-condition-workspace.test.ts
                    test: "REQ-SQL-003 @smoke: edits nested Filter conditions, runs, and reopens the saved query"
          - id: condition-composition-journey
            adapter: typescript
            path: e2e/composition-filter-conditions.test.ts
            selector: { kind: test, name: "Composition inline SQL filters preserve scalar bindings through nested groups, history, and save" }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.condition-workspace/target.condition-tree-editor]
                runner:
                  runner: e2e-playwright
                  arguments:
                    file: e2e/composition-filter-conditions.test.ts
                    test: "Composition inline SQL filters preserve scalar bindings through nested groups, history, and save"
          - id: condition-group-authorized-execution
            adapter: rust
            path: crates/ugoite-iceberg/tests/authorized_query.rs
            selector: { kind: test, name: typed_sql_document_filter_conditions_execute_authorized_queries }
            claims:
              - kind: verifies
                criterion: REQ-SQL-003#criterion.condition-group-editing
                covers: [FEAT-SQL-004#binding.rust-edit-core/target.condition-tree-transactions]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-iceberg
                    harness: authorized_query
                    test: typed_sql_document_filter_conditions_execute_authorized_queries
    contracts:
      - id: typed-task-filter-sort-protocol
        kind: custom
        source: FEAT-SQL-004#binding.typed-edit-contract/target.edit-request
        participants:
          - target: FEAT-SQL-004#binding.frontend-editor/target.task-editor
            role: frontend-task-editor
          - target: FEAT-SQL-004#binding.wasm-protocol/target.semantic-edit-action
            role: wasm-protocol
          - target: FEAT-SQL-004#binding.rust-edit-core/target.add-order-by-column
            role: native-domain
        guarantees: [REQ-SQL-003#criterion.bounded-task-editing]
      - id: typed-condition-group-protocol
        kind: custom
        source: FEAT-SQL-004#binding.typed-edit-contract/target.edit-request
        participants:
          - target: FEAT-SQL-004#binding.condition-workspace/target.condition-tree-editor
            role: frontend-condition-editor
          - target: FEAT-SQL-004#binding.wasm-protocol/target.semantic-edit-action
            role: wasm-protocol
          - target: FEAT-SQL-004#binding.rust-edit-core/target.condition-tree-transactions
            role: native-domain
        guarantees: [REQ-SQL-003#criterion.condition-group-editing]
