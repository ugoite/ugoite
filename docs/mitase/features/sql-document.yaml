schema: mitase/authoring/v2
kind: features
namespace: sql
category: SQL source document protocol
features:
  - id: FEAT-SQL-001
    title: Rust-owned SQL source document protocol
    summary: Preserve bounded SQL parsing, parameter rename, and Form picker relation edits as a stable Domain/WASM contract.
    status: implemented
    bindings:
      - id: contract-source
        role: contract-source
        facet: domain
        responsibility: Define the Rust source-aware Form picker operation retained as the anchor for the published parser protocol.
        targets:
          - id: guarded-edit-contract
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: apply_sql_document_semantic_edit_transaction }
            claims:
              - kind: evidences
                anchor: REQ-SQL-001#criterion.portable-protocol
      - id: rust-document
        role: implementation
        facet: domain
        responsibility: Parse exact SQL drafts, rename parameters, and apply guarded Form picker relation edits without authorizing execution.
        targets:
          - id: parser
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: parse_sql_document }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.lossless-document-draft
          - id: guarded-edit
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: apply_sql_document_semantic_edit_transaction }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.portable-protocol
          - id: parameter-rename
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: rename_sql_document_parameter }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.portable-protocol
      - id: portable-wasm
        role: implementation
        facet: wasm
        responsibility: Keep the existing versioned parser, parameter-rename, and Form picker edit actions available with typed request and response shapes.
        targets:
          - id: versioned-action-dispatch
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.portable-protocol
          - id: typed-client-contract
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.ts
            selector: { kind: symbol, name: parseSqlDocument }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.portable-protocol
      - id: protocol-verification
        role: verification
        facet: verification
        responsibility: Verify exact-source parsing and native/WASM parity for the retained public actions.
        targets:
          - id: native-parser-evidence
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::lossless_document_retains_source_tokens_and_syntax_ranges_without_execution_admission }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.lossless-document-draft
                covers: [FEAT-SQL-001#binding.rust-document/target.parser]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-domain
                    test: sql_document::tests::lossless_document_retains_source_tokens_and_syntax_ranges_without_execution_admission
          - id: native-form-picker-edit
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::semantic_form_picker_replaces_and_adds_a_relation_losslessly }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers: [FEAT-SQL-001#binding.rust-document/target.guarded-edit]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-domain
                    test: sql_document::tests::semantic_form_picker_replaces_and_adds_a_relation_losslessly
          - id: wasm-native-parser-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_protocol_matches_native_parser_for_draft_states_and_ranges }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers: [FEAT-SQL-001#binding.portable-wasm/target.versioned-action-dispatch]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: sql_document_protocol_matches_native_parser_for_draft_states_and_ranges
          - id: wasm-parameter-rename-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_parameter_rename_protocol_matches_native_tokens_and_ranges }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers: [FEAT-SQL-001#binding.rust-document/target.parameter-rename]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: sql_document_parameter_rename_protocol_matches_native_tokens_and_ranges
          - id: wasm-guarded-edit-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_form_picker_edit_protocol_matches_native_source }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers: [FEAT-SQL-001#binding.rust-document/target.guarded-edit]
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: sql_document_form_picker_edit_protocol_matches_native_source
          - id: frontend-wasm-parser
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.test.ts
            selector: { kind: test, name: parses bounded SQL drafts through the typed Rust/WASM document contract }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers: [FEAT-SQL-001#binding.portable-wasm/target.typed-client-contract]
                runner:
                  runner: frontend-vitest-file
                  arguments:
                    file: src/lib/ugoite-client/protocol.test.ts
                    test: parses bounded SQL drafts through the typed Rust/WASM document contract
    contracts:
      - id: portable-source-document
        kind: custom
        source: FEAT-SQL-001#binding.contract-source/target.guarded-edit-contract
        participants:
          - target: FEAT-SQL-001#binding.rust-document/target.parameter-rename
            role: rust-domain
          - target: FEAT-SQL-001#binding.portable-wasm/target.versioned-action-dispatch
            role: rust-wasm
          - target: FEAT-SQL-001#binding.portable-wasm/target.typed-client-contract
            role: typed-client
        guarantees: [REQ-SQL-001#criterion.portable-protocol]
