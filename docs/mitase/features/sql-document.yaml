schema: mitase/authoring/v2
kind: features
namespace: sql
category: SQL Document source and typed editing
features:
  - id: FEAT-SQL-001
    title: Source-preserving SQL Document editing
    summary: Keep bounded SQL drafts in one exact Rust-owned document, expose typed source-aware editing for supported expressions, predicates, relations, grouping and output fields, and keep parse success separate from executor admission.
    status: implemented
    bindings:
      - id: sql-document-core
        role: implementation
        facet: core
        responsibility: Parse bounded SQL drafts into an exact-source document with lossless token ranges, usable parser-provided syntax-node ranges, distinct SELECT projection-item nodes with parent links, and distinct syntax or statement-shape diagnostics; provide token-scoped parameter renaming without granting runtime admission.
        targets:
          - id: parser
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: parse_sql_document }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.lossless-document-draft
          - id: parameter-rename
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: rename_sql_document_parameter }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.source-aware-parameter-rename
      - id: typed-expression-attributes-contract
        role: contract-source
        facet: domain
        responsibility: Define typed semantic requests and parser-derived node data for bounded array access and terminal slice-bound editing shared by Rust, WASM, and the browser tree editor.
        targets:
          - id: semantic-edit-request
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: SqlDocumentSemanticEdit }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.typed-expression-attributes
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.relational-constructors
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-slicing }
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing }
      - id: typed-expression-attributes
        role: implementation
        facet: core
        responsibility: Apply typed source-aware semantic edits for parameterized CAST targets, unary and binary operators, simple CASE operands, admitted predicate forms, typed temporal or hex literals, registered aggregate FILTER toggles, GROUP BY structures, admitted relation edits, LIMIT values and expressions, CTE or derived-table output aliases, fixed-bound one-based slice construction or terminal literal-bound updates, and adjacent ARRAY literal element moves while retaining untouched source and guarded undo; composite ROLLUP/CUBE forms remain source-backed and read-only when controls cannot preserve their boundaries.
        targets:
          - id: semantic-expression-edits
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: apply_sql_document_semantic_edit_transaction }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.typed-expression-attributes
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.relational-constructors
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-element-indexing }
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-literal-element-reordering }
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-slicing }
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing }
      - id: typed-expression-attributes-frontend
        role: implementation
        facet: frontend
        responsibility: Render node-scoped typed CAST attributes, unary and binary operator controls, simple-versus-searched CASE operands, admitted predicate constructors, typed temporal or hex literal controls, a registered-aggregate FILTER toggle, editable GROUP BY controls, relational joins, LIMIT values and expressions, CTE or derived-table output aliases, controls to construct fixed-bound one-based slices, edit prepopulated terminal literal slice bounds, and move eligible ARRAY literal elements one position up or down in the SQL document tree editor.
        targets:
          - id: tree-editor-controls
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.tsx
            selector: { kind: symbol, name: SqlDocumentTreeEditor }
            claims:
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.typed-expression-attributes
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.relational-constructors
              - kind: satisfies
                criterion: REQ-SQL-001#criterion.array-element-indexing
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-literal-element-reordering }
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-slicing }
              - { kind: satisfies, criterion: REQ-SQL-001#criterion.array-slice-bound-editing }
      - id: sql-document-verification
        role: verification
        facet: verification
        responsibility: Verify exact source retention, projection-item ranges and nested SELECT parent links, typed frontend protocol coverage, syntax diagnostics, token-scoped parameter renaming, relational constructors, and the parser-versus-executor boundary with focused tests.
