                    package: ugoite-wasm
                    test: tests::sql_document_parameter_rename_accepts_maximum_escaped_source
          - id: parameter-rename-rejects-over-limit-request
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector:
              kind: symbol
              name: tests::sql_document_parameter_rename_rejects_request_over_limit
            claims:
