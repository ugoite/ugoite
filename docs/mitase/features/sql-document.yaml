                    test: tests::sql_document_parameter_rename_protocol_preserves_no_match_documents
          - id: parameter-rename-invalid-names
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector:
              kind: symbol
              name: tests::sql_document_parameter_rename_protocol_matches_native_invalid_name_errors
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers:
                  - FEAT-SQL-001#binding.sql-document-wasm-protocol/target.parameter-rename-action
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: tests::sql_document_parameter_rename_protocol_matches_native_invalid_name_errors
          - id: parameter-rename-bounds-amplified-output
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector:
              kind: symbol
              name: tests::sql_document_parameter_rename_bounds_amplified_output
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers:
                  - FEAT-SQL-001#binding.sql-document-wasm-protocol/target.parameter-rename-action
                runner:
                  runner: cargo-test-unit
                  arguments:
                    package: ugoite-wasm
                    test: tests::sql_document_parameter_rename_bounds_amplified_output
          - id: parameter-rename-accepts-maximum-escaped-source
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector:
              kind: symbol
              name: tests::sql_document_parameter_rename_accepts_maximum_escaped_source
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.portable-protocol
                covers:
                  - FEAT-SQL-001#binding.sql-document-wasm-protocol/target.parameter-rename-action
                runner:
                  runner: cargo-test-unit
