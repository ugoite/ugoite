schema: mitase/spec/v1
kind: features
namespace: ops
category: Operations documentation, automation, and quality gates
features:
  - id: FEAT-OPS-001
    title: Repository operations and quality gates
    summary: Connect local-run guidance, release container evidence, governance integrity, version milestones, root quality gates, CLI surfaces, and docsite gates to generic repository artifacts and exact verification evidence.
    status: implemented
    bindings:
      - id: documentation
        role: documentation
        facet: documentation
        responsibility: Keep the operator guides, testing contracts, version declarations, and legacy registries connected as repository documentation artifacts. The legacy registries remain read-only migration evidence for this focused slice.
        targets:
          - id: operations-guide
            adapter: declared
            path: docs/guide/operate/server/operations.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-001#criterion.local-run-guidance
          - id: container-quickstart
            adapter: declared
            path: docs/guide/start/container-quickstart.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-001#criterion.local-run-guidance
              - kind: documents
                anchor: REQ-OPS-002#criterion.release-container-validation
          - id: testing-ci-cd
            adapter: declared
            path: docs/architecture/testing/ci-cd.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-005#criterion.repository-quality-gates
              - kind: documents
                anchor: REQ-OPS-006#criterion.root-rust-gate
              - kind: documents
                anchor: REQ-OPS-007#criterion.docsite-gate
          - id: testing-strategy
            adapter: declared
            path: docs/architecture/testing/strategy.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-005#criterion.repository-quality-gates
              - kind: documents
                anchor: REQ-OPS-006#criterion.root-rust-gate
              - kind: documents
                anchor: REQ-OPS-007#criterion.docsite-gate
          - id: version-v01
            adapter: declared
            path: docs/version/v0.1.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-004#criterion.milestone-status
          - id: version-v02
            adapter: declared
            path: docs/version/v0.2.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-004#criterion.milestone-status
          - id: taxonomy-registry
            adapter: declared
            path: docs/spec/features/features.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-OPS-003#criterion.taxonomy-integrity
      - id: registries
        role: implementation
        facet: documentation
        responsibility: Keep the registry artifacts that the current taxonomy-integrity test parses as exact implementation targets. The test proves link resolution for the current registry corpus; it does not make later unmigrated domains canonical.
        targets:
          - id: taxonomy-registry
            adapter: declared
            path: docs/spec/features/features.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-003#criterion.taxonomy-integrity
      - id: versions
        role: implementation
        facet: documentation
        responsibility: Keep the current version declaration artifacts as exact implementation targets for milestone status integrity. Planned milestones remain planned and are not promoted by this binding.
        targets:
          - id: version-v01
            adapter: declared
            path: docs/version/v0.1.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-004#criterion.milestone-status
          - id: version-v02
            adapter: declared
            path: docs/version/v0.2.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-004#criterion.milestone-status
      - id: automation
        role: implementation
        facet: quality-gates
        responsibility: Keep the root task graph and hosted CI lanes connected to their generic repository artifacts. This binding describes existing automation and does not move delivery responsibilities into Mitase.
        targets:
          - id: root-mise
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-005#criterion.repository-quality-gates
              - kind: satisfies
                criterion: REQ-OPS-006#criterion.root-rust-gate
              - kind: satisfies
                criterion: REQ-OPS-007#criterion.docsite-gate
              - kind: satisfies
                criterion: REQ-OPS-019#criterion.root-mise-surface
              - kind: satisfies
                criterion: REQ-OPS-020#criterion.portable-wasm-gates
              - kind: satisfies
                criterion: REQ-OPS-021#criterion.frontend-coverage-gate
              - kind: satisfies
                criterion: REQ-OPS-024#criterion.docsite-coverage-gate
          - id: ci-workflow
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-005#criterion.repository-quality-gates
              - kind: satisfies
                criterion: REQ-OPS-006#criterion.root-rust-gate
              - kind: satisfies
                criterion: REQ-OPS-007#criterion.docsite-gate
              - kind: satisfies
                criterion: REQ-OPS-020#criterion.portable-wasm-gates
      - id: release-evidence
        role: evidence
        facet: release-gate
        responsibility: Preserve the local release task, hosted release workflow, and container smoke script as evidence for the release boundary without asserting that this documentation-only slice changes release behavior.
        targets:
          - id: local-release-gate
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-002#criterion.release-container-validation
          - id: release-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-002#criterion.release-container-validation
          - id: container-smoke
            adapter: declared
            path: scripts/verify-release-container-quickstart.sh
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-002#criterion.release-container-validation
      - id: cli
        role: implementation
        facet: cli
        responsibility: Keep the existing CLI configuration and command-help surfaces visible as generic Rust artifacts for the selected local-run contract.
        targets:
          - id: config
            adapter: rust
            path: crates/ugoite-cli/src/config.rs
            selector: { kind: symbol, name: config_path }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-006#criterion.cli-surface
          - id: help
            adapter: rust
            path: crates/ugoite-cli/src/commands/entry.rs
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-006#criterion.cli-surface

      - id: migrated-ops-tail
        role: evidence
        facet: operations
        responsibility: Connect the next migrated Operations requirements to generic repository artifacts and exact verification evidence. Remaining legacy Operations records continue as migration evidence until later slices complete the domain.
        targets:
          - id: pull-request-template
            adapter: declared
            path: .github/pull_request_template.md
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-008#criterion.pr-template-gates
          - id: close-issue-workflow
            adapter: declared
            path: .github/workflows/pr-require-close-issue.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-008#criterion.pr-template-gates
          - id: release-contract
            adapter: declared
            path: docs/architecture/release/release-contract.md
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
          - id: candidate-workflow
            adapter: declared
            path: .github/workflows/release-candidate.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
              - kind: evidences
                anchor: REQ-OPS-014#criterion.cli-language-classification
          - id: publish-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
          - id: release-implementation
            adapter: typescript
            path: tools/release.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-009#criterion.deterministic-release-promotion
              - kind: satisfies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: frontend-proxy
            adapter: typescript
            path: frontend/app.config.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-010#criterion.frontend-dev-proxy-readiness
          - id: rust-cache
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-011#criterion.rust-cache-discipline
          - id: hosted-rust-gates
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-011#criterion.rust-cache-discipline
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
              - kind: evidences
                anchor: REQ-OPS-022#criterion.path-aware-e2e-tiering
          - id: required-status
            adapter: declared
            path: .github/required-status-checks.json
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
          - id: codeql-summary
            adapter: declared
            path: .github/workflows/codeql.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
          - id: pr-status-gate
            adapter: declared
            path: .github/workflows/pr-require-close-issue.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-013#criterion.required-status-contract
          - id: stack-contract
            adapter: declared
            path: docs/architecture/contracts/stack.md
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-014#criterion.cli-language-classification
          - id: rust-workspace
            adapter: declared
            path: Cargo.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-014#criterion.cli-language-classification
          - id: knowledge-compatibility
            adapter: typescript
            path: tools/knowledge_compatibility_test.ts
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-043#criterion.knowledge-compatibility-gate
      - id: migrated-ops-verification
        role: implementation
        facet: operations-verification
        responsibility: Connect the exact frontend configuration and compatibility-gate tests to the generic implementation artifacts they verify.
        targets:
          - id: frontend-proxy
            adapter: typescript
            path: frontend/app.config.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-010#criterion.frontend-dev-proxy-readiness
          - id: knowledge-compatibility
            adapter: typescript
            path: tools/knowledge_compatibility_test.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-043#criterion.knowledge-compatibility-gate
      - id: migrated-ops-coverage
        role: implementation
        facet: quality-gates
        responsibility: Connect the frontend and docsite coverage configurations to the exact repository tests that verify their 100 percent coverage contracts.
        targets:
          - id: frontend-coverage-config
            adapter: typescript
            path: frontend/vitest.config.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-021#criterion.frontend-coverage-gate
          - id: docsite-coverage-config
            adapter: typescript
            path: docsite/vitest.config.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-024#criterion.docsite-coverage-gate
      - id: public-installer
        role: implementation
        facet: release-installer
        responsibility: Keep the public CLI installer package metadata separate from repository development tooling while release workflows remain external.
        targets:
          - id: installer-package
            adapter: declared
            path: packages/ugoite/package.json
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-023#criterion.public-installer-separation
          - id: installer-readme
            adapter: declared
            path: packages/ugoite/README.md
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-023#criterion.public-installer-separation
      - id: repository-native-release
        role: implementation
        facet: release-promotion
        responsibility: Keep the prepared version authority and release implementation connected to the repository-native candidate promotion contract. Candidate and publish execution remains owned by repository workflows.
        targets:
          - id: version-authority
            adapter: declared
            path: version.txt
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: candidate-workflow
            adapter: declared
            path: .github/workflows/release-candidate.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: publish-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
          - id: release-implementation
            adapter: typescript
            path: tools/release.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-044#criterion.repository-native-release-promotion
      - id: migrated-ops-025-028
        role: implementation
        facet: release-and-deployment
        responsibility: Connect published quick-start verification, channel release notes, strict dependency resolution, and the repository-owned Helm chart to generic repository Artifacts. Release and deployment execution remain external repository tooling.
        targets:
          - id: published-quickstart-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-025#criterion.published-release-quickstarts
          - id: published-container-quickstart
            adapter: declared
            path: scripts/verify-release-container-quickstart.sh
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-025#criterion.published-release-quickstarts
          - id: published-cli-quickstart
            adapter: declared
            path: scripts/verify-release-cli-quickstart.sh
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-025#criterion.published-release-quickstarts
          - id: channel-release-notes
            adapter: declared
            path: docs/version/changelog/stable.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-026#criterion.channel-changelog-sources
          - id: release-notes-tool
            adapter: typescript
            path: tools/release-notes.ts
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-026#criterion.channel-changelog-sources
          - id: release-notes-publish-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-026#criterion.channel-changelog-sources
          - id: locked-root-mise
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-027#criterion.strict-lockfiles
          - id: locked-ci-workflow
            adapter: declared
            path: .github/workflows/ci.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-027#criterion.strict-lockfiles
          - id: locked-release-workflow
            adapter: declared
            path: .github/workflows/release-candidate.yml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-027#criterion.strict-lockfiles
          - id: cargo-lock
            adapter: declared
            path: Cargo.lock
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-027#criterion.strict-lockfiles
          - id: deno-lock
            adapter: declared
            path: deno.lock
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-027#criterion.strict-lockfiles
          - id: helm-chart
            adapter: declared
            path: charts/ugoite/Chart.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-028#criterion.repository-owned-helm-chart
          - id: helm-values
            adapter: declared
            path: charts/ugoite/values.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-028#criterion.repository-owned-helm-chart
          - id: helm-deployment
            adapter: declared
            path: charts/ugoite/templates/deployment.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-028#criterion.repository-owned-helm-chart
          - id: helm-pvc
            adapter: declared
            path: charts/ugoite/templates/pvc.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-028#criterion.repository-owned-helm-chart
      - id: planned-ops-evidence
        role: evidence
        facet: planned-work
        responsibility: Record the current devcontainer and dependency-update surfaces as evidence for the planned change-detection criterion without claiming that a hosted workflow exists.
        targets:
          - id: devcontainer
            adapter: declared
            path: .devcontainer/devcontainer.json
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-012#criterion.devcontainer-change-detection
          - id: devcontainer-dependency-updates
            adapter: declared
            path: .github/dependabot.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-012#criterion.devcontainer-change-detection
      - id: ops-seeding
        role: implementation
        facet: local-seeding
        responsibility: Connect the root sample-data task and its repository helper to the exact workspace tests that verify the local seeding contract.
        targets:
          - id: seed-helper
            adapter: declared
            path: scripts/dev-seed.sh
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-OPS-016#criterion.local-sample-data-seeding
      - id: ops-seeding-task-evidence
        role: evidence
        facet: local-seeding
        responsibility: Record the root seed task as generic repository evidence without claiming a separate implementation owner for the shared mise artifact.
        targets:
          - id: seed-task
            adapter: declared
            path: mise.toml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-016#criterion.local-sample-data-seeding
      - id: migrated-ops-release-evidence
        role: evidence
        facet: release-installation
        responsibility: Connect the release promotion and quick-start scripts to the selected Operations requirements as generic repository Artifacts. Release execution remains owned by repository workflows and scripts.
        targets:
          - id: release-publish-workflow
            adapter: declared
            path: .github/workflows/release-publish.yml
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-017#criterion.release-container-promotion
              - kind: evidences
                anchor: REQ-OPS-018#criterion.cli-release-installation
          - id: container-quickstart-script
            adapter: declared
            path: scripts/verify-release-container-quickstart.sh
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-017#criterion.release-container-promotion
          - id: cli-install-script
            adapter: declared
            path: scripts/install-ugoite-cli.sh
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-018#criterion.cli-release-installation
          - id: cli-quickstart-script
            adapter: declared
            path: scripts/verify-release-cli-quickstart.sh
            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-018#criterion.cli-release-installation
      - id: auth-development-evidence
        role: evidence
        facet: development-authentication
        responsibility: Preserve the existing development authentication evidence and its explicit planned status through generic Rust, frontend, and E2E Artifacts. This binding does not assert production-parity completeness.
        targets:
