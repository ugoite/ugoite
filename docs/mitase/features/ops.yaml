            selector: { kind: file }
            claims:
              - kind: evidences
                anchor: REQ-OPS-015#criterion.production-authentication
          - id: auth-index-test
            adapter: typescript
            path: frontend/src/routes/index.test.tsx
            selector: { kind: file }
            claims:
