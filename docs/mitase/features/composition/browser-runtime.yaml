      claims:
      - kind: evidences
        anchor: REQ-FE-068#criterion.source-native-table-visual-details
    - id: browser-flow-revision-route
      adapter: typescript
      path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
      selector:
        kind: test
