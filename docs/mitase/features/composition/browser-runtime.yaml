        kind: test
        name: falls back to the flat renderer when the layout cannot be normalized
      claims:
      - kind: evidences
        anchor: REQ-COMP-004#criterion.exact-composition-revision
    - id: browser-metric-continuation-guard
      adapter: typescript
      path: frontend/src/components/CompositionRenderer.test.tsx
      selector:
        kind: test
        name: does not evaluate a metric from a paginated source result
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.metric-runtime-values
    - id: browser-home-reopen
      adapter: typescript
      path: frontend/src/routes/spaces/[space_id]/dashboard.test.tsx
      selector:
        kind: test
        name: rediscovers saved tools from Home and opens the listed exact revision
      claims:
      - kind: evidences
        anchor: REQ-COMP-004#criterion.exact-composition-revision
