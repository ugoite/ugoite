            claims:
              - kind: evidences
                anchor: REQ-COMP-007#criterion.typed-source-binding
      - id: core-typed-variable-resolution
        role: implementation
        facet: core
        responsibility: Bind transient variable values without coercion, preserve exact Saved SQL variable types in the existing typed SQL request, resolve Input and Text locally, and build dependency edges independently of Layout order.
        targets:
          - id: runtime-variable-binding
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector:
              kind: symbol
              name: bind_variables
            claims:
              - kind: satisfies
                criterion: REQ-COMP-007#criterion.typed-variable-declarations
          - id: typed-saved-sql-variable-binding
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector:
              kind: symbol
              name: compile_saved_sql_source
            claims:
