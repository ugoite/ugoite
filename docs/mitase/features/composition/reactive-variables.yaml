          - id: local-components-and-dependency-index
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector:
              kind: symbol
              name: resolve_composition_parts
            claims:
              - kind: satisfies
                criterion: REQ-COMP-007#criterion.input-component-binding
              - kind: satisfies
                criterion: REQ-COMP-007#criterion.direct-text-binding
              - kind: satisfies
                criterion: REQ-COMP-007#criterion.dependency-driven-execution
      - id: core-typed-variable-resolution-evidence
        role: evidence
        facet: core-tests
        responsibility: Verify exact runtime type checks, unchanged typed Saved SQL request parameters, local Input and Text bindings without extra source work, deterministic dependency edges, and isolation of affected Saved SQL requests.
