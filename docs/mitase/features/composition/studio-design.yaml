schema: mitase/authoring/v2
kind: features
namespace: composition
category: Saved, portable Composition documents
features:
- id: FEAT-COMP-005
  title: Composition Studio Design authoring
  summary: 'Provide the Design workspace for Composition authoring: canvas, inspector, selection, mode
    coordination, responsive presentation, and save readiness, with edits confined to transient drafts.'
  status: implemented
  bindings:
  - id: studio-design-runtime
    role: implementation
    facet: frontend
    responsibility: Implement the Composition Studio Design workspace, including canvas and inspector
      editing, mode coordination, responsive inspector presentation, selection, and save readiness.
    targets:
    - id: browser-design-canvas
      adapter: typescript
      path: frontend/src/components/CompositionDesignCanvas.tsx
      selector:
        kind: symbol
        name: CompositionDesignCanvas
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.ordered-component-layout
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.parameter-placement
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.text-style-enum
      - kind: satisfies
        criterion: REQ-COMP-004#criterion.used-field-fingerprint
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
    - id: browser-composition-inspector
      adapter: typescript
      path: frontend/src/components/CompositionInspector.tsx
      selector:
        kind: symbol
        name: CompositionInspector
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.text-style-enum
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.parameter-placement
      - kind: evidences
        anchor: REQ-COMP-002#criterion.optional-display-labels
      - kind: evidences
        anchor: REQ-COMP-002#criterion.typed-metric-value-field
    - id: browser-studio-mode
      adapter: typescript
      path: frontend/src/components/CompositionStudio.tsx
      selector:
        kind: symbol
        name: CompositionStudio
      claims:
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
      - kind: satisfies
        criterion: REQ-FE-074#criterion.source-design-entry
      - kind: satisfies
        criterion: REQ-FE-068#criterion.local-horizontal-overflow
      - kind: evidences
        anchor: REQ-FE-070#criterion.mobile-one-column
    - id: browser-studio-source-picker
      adapter: typescript
      path: frontend/src/components/CompositionSourcePicker.tsx
      selector:
        kind: symbol
        name: CompositionSourcePicker
      claims:
      - kind: satisfies
        criterion: REQ-FE-074#criterion.source-design-entry
    - id: browser-inspector-sheet
      adapter: typescript
      path: frontend/src/components/CompositionInspectorSheet.tsx
      selector:
        kind: symbol
        name: CompositionInspectorSheet
      claims:
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
      - kind: satisfies
        criterion: REQ-FE-068#criterion.local-horizontal-overflow
      - kind: evidences
        anchor: REQ-FE-070#criterion.mobile-one-column
    - id: browser-studio-sync
      adapter: typescript
      path: frontend/src/lib/composition-studio-sync.ts
      selector:
        kind: file
      claims:
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
      - kind: satisfies
        criterion: REQ-FE-068#criterion.controller-owned-paging
    - id: browser-studio-save-readiness
      adapter: typescript
      path: frontend/src/lib/composition-draft.ts
      selector:
        kind: symbol
        name: draftSaveReadiness
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.empty-layout-rejected
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.ordered-component-layout
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.parameter-placement
  - id: studio-design-evidence
    role: evidence
    facet: frontend-tests
    responsibility: Verify the Composition Studio Design workspace, canvas and inspector editing, mode
      coordination, responsive inspector, selection, and save readiness.
    targets:
    - id: browser-design-canvas-selection
      adapter: typescript
      path: frontend/src/components/CompositionDesignCanvas.test.tsx
      selector:
        kind: test
        name: selects canvas blocks without touching the draft
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.ordered-component-layout
    - id: browser-design-canvas-text-insertion
      adapter: typescript
      path: frontend/src/components/CompositionDesignCanvas.test.tsx
      selector:
        kind: test
        name: inserts text blocks declared and placed exactly once
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.ordered-component-layout
      - kind: evidences
        anchor: REQ-COMP-002#criterion.text-style-enum
    - id: browser-design-canvas-parameter-placement
      adapter: typescript
