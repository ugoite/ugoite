schema: mitase/authoring/v2
kind: features
namespace: composition
category: Typed query variable graph evaluation
features:
  - id: FEAT-COMP-011
    title: Validated Composition query results
    summary: Keep SQL results transient and expose only selected, dependency-closed query results to Composition preview after Core validates them against explicit bindings, the evaluation snapshot, and declared return descriptors.
    status: planned
    bindings:
      - id: query-result-validation
        role: implementation
        facet: core
        responsibility: Compile query requests from graph-bound scalar values, validate each exact response before retaining it, and let a scoped evaluation publish only its server-derived dependency closure.
        targets:
          - id: composition-query-evaluation
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector:
              kind: symbol
              name: VariableGraphQueryEvaluation
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
      - id: composition-graph-evaluation
        role: implementation
        facet: storage
        responsibility: Resolve the exact Composition target and current publication/authorization snapshot, then execute only the server-derived dependency closure through bounded stateless SQL paths.
        targets:
          - id: stateless-query-evaluation
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_query_evaluation.rs
            selector:
              kind: symbol
              name: evaluate_composition_graph_authorized_for_principals
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
              - kind: evidences
                anchor: REQ-COMP-009#criterion.query-results-validated-before-preview
      - id: authoring-query-metadata
        role: implementation
        facet: service
        responsibility: Resolve authorized query schema for authoring even when Inputs are unset, omit preview-only placeholders from values and requests, and expose Saved SQL source only from its exact pinned revision.
        targets:
          - id: authoring-preview
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_resolver.rs
            selector:
              kind: symbol
              name: preview_composition_authoring_authorized_for_principals_with_base
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.authoring-query-metadata-preview
          - id: exact-saved-sql-source
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_resolver.rs
            selector:
              kind: symbol
              name: derive_saved_sql_query_metadata
            claims:
              - kind: evidences
                anchor: REQ-COMP-009#criterion.exact-query-identities
      - id: composition-preview-response-contract
        role: contract-source
        facet: api
        responsibility: Define the Composition preview response, including optional exact-revision Saved SQL source metadata.
        targets:
          - id: composition-preview-operation
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector:
              kind: operation
              method: post
              path: /spaces/{space_id}/compositions/preview
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.authoring-query-metadata-preview
              - kind: documents
                anchor: REQ-COMP-009#criterion.exact-query-identities

      - id: dependency-scoped-browser
        role: implementation
        facet: frontend
        responsibility: Schedule independent graph branches and suppress stale dependent displays while input parsing remains transient Work.
        targets:
          - id: design-scheduler
            adapter: typescript
            path: frontend/src/lib/composition-design-evaluation.ts
            selector: { kind: symbol, name: createCompositionDesignEvaluation }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: saved-runtime
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.tsx
            selector: { kind: symbol, name: CompositionRevisionRoute }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
      - id: selected-evaluation-rest
        role: implementation
        facet: api
        responsibility: Return the validated selected-closure result map and local failure diagnostics without partial values.
        targets:
          - id: evaluate-response
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: composition_evaluation_handler }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
      - id: selected-evaluation-browser
        role: implementation
        facet: frontend
        responsibility: Invalidate failed selected results and cursors, keep only same-authority unselected results, and render an aborted evaluation locally.
        targets:
          - id: merge-results
            adapter: typescript
            path: frontend/src/lib/composition-evaluation.ts
            selector: { kind: symbol, name: mergeCompositionEvaluation }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
          - id: render-results
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.tsx
            selector: { kind: symbol, name: CompositionGraphRenderer }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
      - id: strict-save-preflight
        role: implementation
        facet: service
        responsibility: Validate every query and transient typed Input against one bound authorization and Publication snapshot before admitting a save; carry the opaque exact-head proof into a single non-refreshing publication attempt.
        targets:
          - id: save-preflight
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_query_evaluation.rs
            selector: { kind: symbol, name: preflight_composition_save_with_access }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.strict-save-current-snapshot
          - id: local-save-admission
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_local_save.rs
            selector: { kind: symbol, name: save_composition_local_with_work }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.strict-save-current-snapshot
      - id: strict-save-preflight-verification
        role: verification
        facet: verification
        responsibility: Verify that strict save failures publish no first Registry and that a proof becomes unusable after the bound Catalog Head changes.
        targets:
          - id: invalid-initial-scalar
            adapter: rust
            path: crates/ugoite-iceberg/src/composition/history_tests.rs
            selector: { kind: test, name: invalid_scalar_first_save_does_not_publish_registry_or_entry }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.strict-save-current-snapshot
                covers: [FEAT-COMP-011#binding.strict-save-preflight/target.save-preflight]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: invalid_scalar_first_save_does_not_publish_registry_or_entry } }
          - id: stale-first-registry-proof
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition.rs
            selector: { kind: test, name: strict_first_save_rejects_head_change_after_preflight_without_registry }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.strict-save-current-snapshot
                covers: [FEAT-COMP-011#binding.strict-save-preflight/target.local-save-admission]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition, test: strict_first_save_rejects_head_change_after_preflight_without_registry } }
          - id: source-change-retry
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition.rs
            selector: { kind: test, name: local_composition_retry_recovers_receipt_after_source_cardinality_changes }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.strict-save-current-snapshot
                covers: [FEAT-COMP-011#binding.strict-save-preflight/target.local-save-admission]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition, test: local_composition_retry_recovers_receipt_after_source_cardinality_changes } }
          - id: changed-work-replay
            adapter: rust
            path: crates/ugoite-iceberg/src/composition/history_tests.rs
            selector: { kind: test, name: successful_save_rejects_operation_replay_with_changed_work }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.strict-save-current-snapshot
                covers: [FEAT-COMP-011#binding.strict-save-preflight/target.save-preflight]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: successful_save_rejects_operation_replay_with_changed_work } }
      - id: atomic-selected-evaluation-verification
        role: verification
        facet: verification
        responsibility: Verify that one rejected selected result cannot expose valid siblings, and that repairing the input restores the affected closure.
        targets:
          - id: service-atomic-results
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: {
              kind: test,
              name: graph_evaluation_commits_no_selected_results_when_one_query_fails,
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner: {
                  runner: cargo-test-integration,
                  arguments: {
                    package: ugoite-iceberg,
                    harness: test_composition_preview,
                    test: graph_evaluation_commits_no_selected_results_when_one_query_fails,
                  },
                }
          - id: rest-atomic-results
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: {
              kind: test,
              name: authentication_regression_tests::composition_evaluate_route_executes_the_selected_saved_graph,
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.selected-evaluation-rest/target.evaluate-response,
                ]
                runner: {
                  runner: cargo-test-unit,
                  arguments: {
                    package: ugoite-server,
                    test: authentication_regression_tests::composition_evaluate_route_executes_the_selected_saved_graph,
                  },
                }
          - id: browser-result-invalidation
            adapter: typescript
            path: frontend/src/lib/composition-evaluation.test.ts
            selector: {
              kind: test,
              name: "retains unaffected results after a failed partial evaluation in the same snapshot",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.selected-evaluation-browser/target.merge-results,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/lib/composition-evaluation.test.ts,
                    test: "retains unaffected results after a failed partial evaluation in the same snapshot",
                  },
                }
          - id: browser-aborted-diagnostic
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.test.tsx
            selector: {
              kind: test,
              name: "shows a local aborted state for successful siblings of a failed selected evaluation",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.selected-evaluation-browser/target.render-results,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/CompositionGraphRenderer.test.tsx,
                    test: "shows a local aborted state for successful siblings of a failed selected evaluation",
                  },
                }
          - id: browser-selected-failure-repair
            adapter: typescript
            path: e2e/composition-invalid-variable-input.test.ts
            selector: {
              kind: test,
              name: "a failed selected evaluation clears successful siblings and repairs together",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
                covers: [
                  FEAT-COMP-011#binding.selected-evaluation-browser/target.merge-results,
                  FEAT-COMP-011#binding.selected-evaluation-browser/target.render-results,
                  FEAT-COMP-011#binding.selected-evaluation-rest/target.evaluate-response,
                ]
                runner: {
                  runner: e2e-playwright,
                  arguments: {
                    file: e2e/composition-invalid-variable-input.test.ts,
                    test: "a failed selected evaluation clears successful siblings and repairs together",
                  },
                }
      - id: dependency-selection-verification
        role: verification
        facet: verification
        responsibility: Verify required input scoping without weakening selected-input, identity, authorization, or snapshot checks.
        targets:
          - id: selected-input-validation
            adapter: rust
            path: crates/ugoite-core/tests/composition_query_evaluation.rs
            selector: {
              kind: test,
              name: "selected_query_inputs_do_not_require_unrelated_inputs_but_keep_request_validation",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.query-result-validation/target.composition-query-evaluation,
                ]
                runner: {
                  runner: cargo-test-integration,
                  arguments: {
                    package: ugoite-core,
                    harness: composition_query_evaluation,
                    test: selected_query_inputs_do_not_require_unrelated_inputs_but_keep_request_validation,
                  },
                }
          - id: authorized-input-selection
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: {
              kind: test,
              name: "authorized_saved_and_draft_query_selection_isolates_unrelated_missing_and_invalid_inputs",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.composition-graph-evaluation/target.stateless-query-evaluation,
                ]
                runner: {
                  runner: cargo-test-integration,
                  arguments: {
                    package: ugoite-iceberg,
                    harness: test_composition_preview,
                    test: authorized_saved_and_draft_query_selection_isolates_unrelated_missing_and_invalid_inputs,
                  },
                }
          - id: design-independent-branch
            adapter: typescript
            path: frontend/src/lib/composition-design-evaluation.test.ts
            selector: {
              kind: test,
              name: "updates and pages an independent branch while another input is invalid or pending",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.dependency-scoped-browser/target.design-scheduler,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/lib/composition-design-evaluation.test.ts,
                    test: "updates and pages an independent branch while another input is invalid or pending",
                  },
                }
          - id: runtime-independent-branch
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
            selector: {
              kind: test,
              name: "keeps an independent input branch live while another input is invalid",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.dependency-scoped-browser/target.saved-runtime,
                ]
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx",
                    test: "keeps an independent input branch live while another input is invalid",
                  },
                }

          - id: browser-independent-input-branches
            adapter: typescript
            path: e2e/composition-invalid-variable-input.test.ts
            selector: {
              kind: test,
              name: "independent Composition results update while another Input is invalid in Design and runtime",
            }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [
                  FEAT-COMP-011#binding.dependency-scoped-browser/target.design-scheduler,
                  FEAT-COMP-011#binding.dependency-scoped-browser/target.saved-runtime,
                ]
                runner: {
                  runner: e2e-playwright,
                  arguments: {
                    file: e2e/composition-invalid-variable-input.test.ts,
                    test: "independent Composition results update while another Input is invalid in Design and runtime",
                  },
                }
