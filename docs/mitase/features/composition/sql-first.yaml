schema: mitase/authoring/v2
kind: features
namespace: composition
category: SQL-first Composition authoring and execution
features:
  - id: FEAT-COMP-010
    title: SQL-first Composition source and workspace
    summary: Replace prerelease EntryQuery Composition sources with portable SQL sources resolved by the existing authorized executor, and share one accessible SQL Workspace across Saved SQL and Composition authoring.
    status: implemented
    bindings:
      - id: sql-first-composition-contract
        role: contract-source
        facet: domain
        responsibility: Define the accepted Composition source grammar, Form binding authority, Saved SQL default boundary, result behavior, and no-compatibility decision as the normative contract.
        targets:
          - id: sql-first-semantic-contract
            adapter: declared
            path: docs/architecture/contracts/adr-024-composition-sql-first.md
            selector:
              kind: file
            claims:
              - kind: documents
                anchor: REQ-COMP-008#criterion.sql-source-grammar
              - kind: documents
                anchor: REQ-COMP-008#criterion.strict-replacement-envelope
              - kind: documents
                anchor: REQ-COMP-008#criterion.no-composition-tags-or-label-fields
              - kind: documents
                anchor: REQ-COMP-008#criterion.trusted-inline-form-bindings
              - kind: documents
                anchor: REQ-COMP-008#criterion.exact-sql-result-descriptor
              - kind: documents
                anchor: REQ-COMP-008#criterion.saved-sql-exact-revision-and-defaults
              - kind: documents
                anchor: REQ-API-020#criterion.typed-variable-default
              - kind: documents
                anchor: REQ-COMP-008#criterion.scalar-metric-results
              - kind: documents
                anchor: REQ-COMP-008#criterion.stateless-bounded-execution
              - kind: documents
                anchor: REQ-COMP-008#criterion.no-composition-legacy-reader
              - kind: documents
                anchor: REQ-COMP-008#criterion.space-knowledge-and-transient-work
          - id: sql-first-workspace-ui-contract
            adapter: declared
            path: docs/spec/ui/components/sql-workspace.yaml
            selector:
              kind: file
            claims:
              - kind: documents
                anchor: REQ-FE-080#criterion.shared-editor-and-preview
              - kind: documents
                anchor: REQ-FE-080#criterion.workspace-presentation-api
              - kind: documents
                anchor: REQ-FE-080#criterion.adapter-owned-persistence-and-execution
              - kind: documents
                anchor: REQ-FE-080#criterion.transient-typed-parameters
              - kind: documents
                anchor: REQ-FE-080#criterion.adapter-supplied-structured-actions
              - kind: documents
                anchor: REQ-FE-080#criterion.safe-structured-operations
              - kind: documents
                anchor: REQ-FE-080#criterion.explicit-preview-count-and-paging
              - kind: documents
                anchor: REQ-FE-080#criterion.editor-accessibility-and-wrapping
              - kind: documents
                anchor: REQ-FE-080#criterion.mobile-sql-editor-and-results
          - id: sql-first-composition-ui-contract
            adapter: declared
            path: docs/spec/ui/components/composition-studio.yaml
            selector:
              kind: file
            claims:
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-uses-shared-workspace
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-no-label-or-tag-fields
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-structure-first-steady-state
              - kind: documents
                anchor: REQ-FE-079#criterion.form-selection-creates-inline-sql
              - kind: documents
                anchor: REQ-FE-079#criterion.sql-toolbar-keeps-query-meanings
              - kind: documents
                anchor: REQ-FE-079#criterion.design-components-use-semantic-values
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-binding-identifiers-stay-internal
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-mobile-workspace-accessibility
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-text-inspector-literal-editing
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-text-inspector-variable-binding
          - id: sql-first-composition-architecture-contract
            adapter: declared
            path: docs/architecture/contracts/composition.md
            selector:
              kind: file
            claims:
              - kind: documents
                anchor: REQ-COMP-008#criterion.strict-replacement-envelope
              - kind: documents
                anchor: REQ-COMP-008#criterion.no-composition-tags-or-label-fields
              - kind: documents
                anchor: REQ-COMP-008#criterion.space-knowledge-and-transient-work
          - id: sql-first-composition-revision-page-contract
            adapter: declared
            path: docs/spec/ui/pages/space-composition-revision.yaml
            selector:
              kind: file
            claims:
              - kind: documents
                anchor: REQ-COMP-008#criterion.stateless-bounded-execution
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
          - id: sql-first-composition-history-page-contract
            adapter: declared
            path: docs/spec/ui/pages/space-composition-history.yaml
            selector:
              kind: file
            claims:
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-history-hides-revision-identifiers
      - id: sql-first-domain-implementation
        role: implementation
        facet: domain
        responsibility: Parse and validate the single SQL-first Composition v1 grammar, reject the replaced fields, and keep result descriptors and scalar Metrics typed.
        targets:
          - id: canonical-composition-model
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionDocument }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.sql-source-grammar
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.strict-replacement-envelope
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.no-composition-tags-or-label-fields
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.no-composition-legacy-reader
      - id: sql-first-resolution-implementation
        role: implementation
        facet: core
        responsibility: Derive trusted Form identity and exact SQL requests through the existing executor while retaining stateless variables and transient runtime values.
        targets:
          - id: composition-resolver
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: resolve_composition_preview_with_unset }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.saved-sql-exact-revision-and-defaults
          - id: composition-query-evaluation
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: symbol, name: VariableGraphQueryEvaluation }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.scalar-metric-results
          - id: storage-composition-resolution
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: CompositionResolution }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.trusted-inline-form-bindings
              - kind: satisfies
                criterion: REQ-COMP-008#criterion.exact-sql-result-descriptor
      - id: sql-first-workspace-implementation
        role: implementation
        facet: frontend
        responsibility: Use the shared SQL Workspace for inline SQL and keep Composition source, design, and result interactions structure-first and accessible.
        targets:
          - id: composition-draft
            adapter: typescript
            path: frontend/src/lib/composition-draft.ts
            selector: { kind: symbol, name: toStudioDocument }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-no-label-or-tag-fields
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
          - id: composition-data-workspace
            adapter: typescript
            path: frontend/src/components/CompositionDataWorkspace.tsx
            selector: { kind: symbol, name: CompositionDataWorkspace }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-uses-shared-workspace
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
              - kind: satisfies
                criterion: REQ-FE-079#criterion.form-selection-creates-inline-sql
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-mobile-workspace-accessibility
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-source-rows-show-name-once
          - id: composition-result-renderer
            adapter: typescript
            path: frontend/src/components/CompositionRenderer.tsx
            selector: { kind: symbol, name: CompositionRenderer }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
          - id: composition-studio
            adapter: typescript
            path: frontend/src/components/CompositionStudio.tsx
            selector: { kind: symbol, name: CompositionStudio }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-structure-first-steady-state
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-mode-context-singular
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-source-rows-show-name-once
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-mobile-overlays-are-exclusive
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-insertion-completes-before-edit
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-table-source-change-is-explicit
          - id: composition-revision-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.tsx
            selector: { kind: symbol, name: CompositionRevisionRoute }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-binding-identifiers-stay-internal
          - id: composition-history-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/history.tsx
            selector: { kind: symbol, name: CompositionHistoryRoute }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-history-hides-revision-identifiers
          - id: composition-text-inspector
            adapter: typescript
            path: frontend/src/components/composition/TextInspector.tsx
            selector: { kind: symbol, name: TextInspector }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-text-inspector-literal-editing
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-text-inspector-variable-binding
