schema: mitase/authoring/v2
kind: features
namespace: composition
category: Typed variable graph Studio and SQL query evaluation
features:
  - id: FEAT-COMP-010
    title: Composition typed graph Studio
    summary: Store constants, inputs, and SQL queries in one strict typed variable graph; display components bind only to compatible graph values, and query evaluation uses stateless authorized snapshots.
    status: planned
    bindings:
      - id: sql-first-composition-contract
        role: contract-source
        facet: domain
        responsibility: Define the accepted variable graph, exact SQL identity, scalar cardinality, transient work, and no-compatibility boundary.
        targets:
          - id: sql-first-semantic-contract
            adapter: declared
            path: docs/architecture/contracts/adr-025-composition-query-variable-graph.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.single-typed-variable-graph
              - kind: documents
                anchor: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: documents
                anchor: REQ-COMP-009#criterion.exact-query-identities
              - kind: documents
                anchor: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
              - kind: documents
                anchor: REQ-COMP-009#criterion.snapshot-reactive-execution
              - kind: documents
                anchor: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
              - kind: documents
                anchor: REQ-COMP-009#criterion.design-picker-normalizes-to-variable
          - id: sql-first-workspace-ui-contract
            adapter: declared
            path: docs/spec/ui/components/sql-workspace.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-FE-080#criterion.shared-editor-and-preview
              - kind: documents
                anchor: REQ-FE-080#criterion.workspace-presentation-api
              - kind: documents
                anchor: REQ-FE-080#criterion.adapter-owned-persistence-and-execution
              - kind: documents
                anchor: REQ-FE-080#criterion.transient-typed-parameters
              - kind: documents
                anchor: REQ-FE-080#criterion.adapter-supplied-structured-actions
              - kind: documents
                anchor: REQ-FE-080#criterion.safe-structured-operations
              - kind: documents
                anchor: REQ-FE-080#criterion.explicit-preview-count-and-paging
              - kind: documents
                anchor: REQ-FE-080#criterion.editor-accessibility-and-wrapping
              - kind: documents
                anchor: REQ-FE-080#criterion.mobile-sql-editor-and-results
          - id: sql-first-composition-ui-contract
            adapter: declared
            path: docs/spec/ui/components/composition-studio.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-uses-shared-workspace
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-no-label-or-tag-fields
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-structure-first-steady-state
              - kind: documents
                anchor: REQ-FE-079#criterion.form-selection-creates-inline-sql
              - kind: documents
                anchor: REQ-FE-079#criterion.sql-toolbar-keeps-query-meanings
              - kind: documents
                anchor: REQ-FE-079#criterion.design-components-use-semantic-values
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-binding-identifiers-stay-internal
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-mobile-workspace-accessibility
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-text-inspector-literal-editing
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-text-inspector-variable-binding
          - id: sql-first-composition-architecture-contract
            adapter: declared
            path: docs/architecture/contracts/composition.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.single-typed-variable-graph
              - kind: documents
                anchor: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: documents
                anchor: REQ-COMP-009#criterion.snapshot-reactive-execution
              - kind: documents
                anchor: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
          - id: sql-first-composition-revision-page-contract
            adapter: declared
            path: docs/spec/ui/pages/space-composition-revision.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
              - kind: documents
                anchor: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: sql-first-composition-history-page-contract
            adapter: declared
            path: docs/spec/ui/pages/space-composition-history.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-history-hides-revision-identifiers
      - id: sql-first-domain-implementation
        role: implementation
        facet: domain
        responsibility: Parse and validate the strict variable graph and reject the replaced Composition schema without compatibility paths.
        targets:
          - id: canonical-composition-model
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionDocument }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.single-typed-variable-graph
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
      - id: sql-first-resolution-implementation
        role: implementation
        facet: core
        responsibility: Compile explicit graph bindings, derive query descriptors, and evaluate only dependency-closed requests through current authorized SQL paths.
        targets:
          - id: composition-resolver
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: resolve_composition_authoring_preview_with_query_selection }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.exact-query-identities
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.authoring-query-metadata-preview
          - id: composition-query-evaluation
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: symbol, name: VariableGraphQueryEvaluation }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: storage-composition-resolution
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_query_evaluation.rs
            selector: { kind: symbol, name: evaluate_composition_graph_authorized_for_principals }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
      - id: sql-first-workspace-implementation
        role: implementation
        facet: frontend
        responsibility: Present the strict graph, shared SQL Workspace, atomic typed binding picker, and transient query evaluation in the Composition Studio.
        targets:
          - id: composition-draft
            adapter: typescript
            path: frontend/src/lib/composition-variable-binding.ts
            selector: { kind: symbol, name: CompositionGraphDraft }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-no-label-or-tag-fields
          - id: composition-data-workspace
            adapter: typescript
            path: frontend/src/components/CompositionVariableGraphWorkspace.tsx
            selector: { kind: symbol, name: CompositionVariableGraphWorkspace }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-uses-shared-workspace
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-source-rows-show-name-once
          - id: sql-structure-toolbar
            adapter: typescript
            path: frontend/src/components/SqlStructureToolbar.tsx
            selector: { kind: symbol, name: SqlStructureToolbar }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.sql-filter-adds-typed-parameter
          - id: composition-result-renderer
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.tsx
            selector: { kind: symbol, name: CompositionGraphRenderer }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
          - id: composition-studio
            adapter: typescript
            path: frontend/src/components/CompositionStudio.tsx
            selector: { kind: symbol, name: CompositionStudio }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-structure-first-steady-state
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-mode-context-singular
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-insertion-completes-before-edit
          - id: composition-variable-binding-picker
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.tsx
            selector: { kind: symbol, name: CompositionVariableBindingPicker }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.form-selection-creates-inline-sql
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-insertion-completes-before-edit
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-table-source-change-is-explicit
          - id: composition-revision-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.tsx
            selector: { kind: symbol, name: CompositionRevisionRoute }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-binding-identifiers-stay-internal
          - id: composition-history-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/history.tsx
            selector: { kind: symbol, name: CompositionHistoryRoute }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-history-hides-revision-identifiers
          - id: composition-text-inspector
            adapter: typescript
            path: frontend/src/components/CompositionGraphDesignCanvas.tsx
            selector: { kind: symbol, name: CompositionGraphDesignCanvas }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-text-inspector-literal-editing
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-text-inspector-variable-binding
