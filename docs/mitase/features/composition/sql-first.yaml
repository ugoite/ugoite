schema: mitase/authoring/v2
kind: features
namespace: composition
category: Typed variable graph Studio and SQL query evaluation
features:
  - id: FEAT-COMP-010
    title: Composition typed graph Studio
    summary: Store constants, inputs, and SQL queries in one strict typed variable graph; display components bind only to compatible graph values, and query evaluation uses stateless authorized snapshots.
    status: planned
    bindings:
      - id: sql-first-composition-contract
        role: contract-source
        facet: domain
        responsibility: Define the accepted variable graph, exact SQL identity, scalar cardinality, transient work, and no-compatibility boundary.
        targets:
          - id: sql-first-semantic-contract
            adapter: declared
            path: docs/architecture/contracts/adr-025-composition-query-variable-graph.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.single-typed-variable-graph
              - kind: documents
                anchor: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: documents
                anchor: REQ-COMP-009#criterion.exact-query-identities
              - kind: documents
                anchor: REQ-COMP-009#criterion.saved-sql-label-source-explicit
              - kind: documents
                anchor: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
              - kind: documents
                anchor: REQ-COMP-009#criterion.snapshot-reactive-execution
              - kind: documents
                anchor: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
              - kind: documents
                anchor: REQ-COMP-009#criterion.design-picker-normalizes-to-variable
          - id: sql-first-workspace-ui-contract
            adapter: declared
            path: docs/spec/ui/components/sql-workspace.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-FE-080#criterion.shared-editor-and-preview
              - kind: documents
                anchor: REQ-FE-080#criterion.workspace-presentation-api
              - kind: documents
                anchor: REQ-FE-080#criterion.adapter-owned-persistence-and-execution
              - kind: documents
                anchor: REQ-FE-080#criterion.transient-typed-parameters
              - kind: documents
                anchor: REQ-FE-080#criterion.adapter-supplied-structured-actions
              - kind: documents
                anchor: REQ-FE-080#criterion.safe-structured-operations
              - kind: documents
                anchor: REQ-FE-080#criterion.explicit-preview-count-and-paging
              - kind: documents
                anchor: REQ-FE-080#criterion.editor-accessibility-and-wrapping
              - kind: documents
                anchor: REQ-FE-080#criterion.mobile-sql-editor-and-results
          - id: sql-first-composition-ui-contract
            adapter: declared
            path: docs/spec/ui/components/composition-studio.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-uses-shared-workspace
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-no-label-or-tag-fields
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-structure-first-steady-state
              - kind: documents
                anchor: REQ-FE-079#criterion.form-selection-creates-inline-sql
              - kind: documents
                anchor: REQ-FE-079#criterion.sql-toolbar-keeps-query-meanings
              - kind: documents
                anchor: REQ-FE-079#criterion.design-components-use-semantic-values
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-binding-identifiers-stay-internal
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-mobile-workspace-accessibility
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-runtime-input-accessibility
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-text-inspector-literal-editing
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-text-inspector-variable-binding
          - id: sql-first-composition-architecture-contract
            adapter: declared
            path: docs/architecture/contracts/composition.md
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.single-typed-variable-graph
              - kind: documents
                anchor: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: documents
                anchor: REQ-COMP-009#criterion.snapshot-reactive-execution
              - kind: documents
                anchor: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
          - id: sql-first-composition-revision-page-contract
            adapter: declared
            path: docs/spec/ui/pages/space-composition-revision.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
              - kind: documents
                anchor: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: sql-first-composition-history-page-contract
            adapter: declared
            path: docs/spec/ui/pages/space-composition-history.yaml
            selector: { kind: file }
            claims:
              - kind: documents
                anchor: REQ-FE-079#criterion.composition-history-hides-revision-identifiers
      - id: sql-first-domain-implementation
        role: implementation
        facet: domain
        responsibility: Parse and validate the strict variable graph and reject the replaced Composition schema without compatibility paths.
        targets:
          - id: saved-sql-label-source-contract
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: symbol, name: VariableGraphSavedSqlLabelSource }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.saved-sql-label-source-explicit
          - id: canonical-composition-model
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionDocument }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.single-typed-variable-graph
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
      - id: sql-first-resolution-implementation
        role: implementation
        facet: core
        responsibility: Compile explicit graph bindings, derive query descriptors, and evaluate only dependency-closed requests through current authorized SQL paths.
        targets:
          - id: composition-resolver
            adapter: rust
            path: crates/ugoite-core/src/composition.rs
            selector: { kind: symbol, name: resolve_composition_authoring_preview_with_query_selection }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.exact-query-identities
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.authoring-query-metadata-preview
          - id: composition-query-evaluation
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: symbol, name: VariableGraphQueryEvaluation }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: storage-composition-resolution
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_query_evaluation.rs
            selector: { kind: symbol, name: evaluate_composition_graph_authorized_for_principals }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.query-results-validated-before-preview
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: portable-query-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_resolver.rs
            selector: { kind: symbol, name: attach_portable_query_sql }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.exact-query-identities
      - id: portable-query-verification
        role: verification
        facet: verification
        responsibility: Verify independent SQL keeps immutable Form identity and the exact Saved SQL scalar projection.
        targets:
          - id: portable-form-identity
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: portable_inline_sql_count_keeps_form_identity_after_rename_and_replacement }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.exact-query-identities
                covers: [FEAT-COMP-010#binding.sql-first-resolution-implementation/target.portable-query-sql]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: portable_inline_sql_count_keeps_form_identity_after_rename_and_replacement } }
          - id: pinned-scalar-copy
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: portable_saved_sql_copy_keeps_pinned_revision_and_selected_scalar_column }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.exact-query-identities
                covers: [FEAT-COMP-010#binding.sql-first-resolution-implementation/target.portable-query-sql]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: portable_saved_sql_copy_keeps_pinned_revision_and_selected_scalar_column } }
      - id: scalar-cardinality-browser-verification
        role: verification
        facet: verification
        responsibility: Verify that the Browser reports a scalar cardinality failure when user input makes a previously valid scalar query return multiple rows, clears the invalid metric, and restores it after the user repairs the input.
        targets:
          - id: scalar-cardinality-diagnostic-and-repair
            adapter: typescript
            path: e2e/composition-scalar-state-journey.test.ts
            selector: { kind: test, name: scalar_result_distinguishes_zero_rows_null_and_zero }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.scalar-cardinality-is-explicit
                covers: [FEAT-COMP-010#binding.sql-first-resolution-implementation/target.composition-query-evaluation]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-scalar-state-journey.test.ts, test: scalar_result_distinguishes_zero_rows_null_and_zero } }
      - id: shared-metric-reference-browser-evidence
        role: evidence
        facet: frontend
        responsibility: Verify one Metric can change from a query variable shared with a sibling while both query variables, the untouched reference, and displayed scalar values survive Composition save and reopen.
        targets:
          - id: component-local-shared-query-reference
            adapter: typescript
            path: e2e/composition-scalar-state-journey.test.ts
            selector: { kind: test, name: changing one Metric reference preserves its shared query and sibling }
            claims:
              - kind: evidences
                anchor: REQ-COMP-009#criterion.display-components-reference-variables
              - kind: evidences
                anchor: REQ-FE-079#criterion.composition-table-source-change-is-explicit
      - id: composition-raw-recovery-verification
        role: verification
        facet: verification
        responsibility: Verify prereplacement source-shaped Composition data remains raw Entry history and export while typed operations reject it.
        targets:
          - id: cli-source-shaped-raw-recovery
            adapter: rust
            path: crates/ugoite-cli/tests/test_journey_remote.rs
            selector:
              kind: test
              name: test_cli_composition_unsupported_version_recovery_matches_core_remote
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.replaced-composition-grammar-fails-closed
                covers: [FEAT-COMP-010#binding.sql-first-domain-implementation/target.canonical-composition-model]
                runner:
                  runner: cargo-test-integration
                  arguments:
                    package: ugoite-cli
                    harness: test_journey_remote
                    test: test_cli_composition_unsupported_version_recovery_matches_core_remote
      - id: explicit-form-source-change-evidence
        role: evidence
        facet: frontend
        responsibility: Verify changing one placed Table through the Forms picker preserves the existing Metric reference and original Form-backed query variable through save and reopen.
        targets:
          - id: form-picker-table-reference-change
            adapter: typescript
            path: e2e/composition-studio-journey.test.ts
            selector: { kind: test, name: "Changing a Form-backed Table source preserves the Metric and query through save and reopen" }
            claims:
              - kind: evidences
                anchor: REQ-FE-079#criterion.composition-table-source-change-is-explicit
      - id: text-style-persistence-evidence
        role: evidence
        facet: frontend
        responsibility: Provide partial browser evidence for the composition-text-inspector target by persisting and rendering one selected non-default literal Text style; this does not establish that all four styles remain distinct.
        targets:
          - id: mobile-heading-style-persistence
            adapter: typescript
            path: e2e/composition-studio-journey.test.ts
            selector: { kind: test, name: "unnamed mobile Composition keeps Text focus and inserts existing data before naming" }
            claims:
              - kind: evidences
                anchor: REQ-FE-079#criterion.composition-text-inspector-literal-editing
      - id: sql-first-workspace-implementation
        role: implementation
        facet: frontend
        responsibility: Present the strict graph, shared SQL Workspace, atomic typed binding picker, and transient query evaluation in the Composition Studio.
        targets:
          - id: composition-draft
            adapter: typescript
            path: frontend/src/lib/composition-variable-binding.ts
            selector: { kind: symbol, name: CompositionGraphDraft }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-no-label-or-tag-fields
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.saved-sql-label-source-explicit
          - id: composition-data-workspace
            adapter: typescript
            path: frontend/src/components/CompositionVariableGraphWorkspace.tsx
            selector: { kind: symbol, name: CompositionVariableGraphWorkspace }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-uses-shared-workspace
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-source-rows-show-name-once
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-variable-creation-requires-name
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
          - id: variable-name-creation-form
            adapter: typescript
            path: frontend/src/components/CompositionVariableCreationForm.tsx
            selector: { kind: symbol, name: CompositionVariableCreationForm }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-variable-creation-requires-name
          - id: composition-graph-studio
            adapter: typescript
            path: frontend/src/components/CompositionGraphStudio.tsx
            selector: { kind: symbol, name: CompositionGraphStudio }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-variable-creation-requires-name
          - id: sql-structure-toolbar
            adapter: typescript
            path: frontend/src/components/SqlStructureToolbar.tsx
            selector: { kind: symbol, name: SqlStructureToolbar }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.sql-filter-adds-typed-parameter
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
          - id: composition-sql-document-tree-editor
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.tsx
            selector: { kind: symbol, name: SqlDocumentTreeEditor }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
          - id: composition-result-renderer
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.tsx
            selector: { kind: symbol, name: CompositionGraphRenderer }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-table-and-metric-use-sql-results
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-runtime-input-accessibility
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.saved-sql-label-source-explicit
          - id: composition-studio
            adapter: typescript
            path: frontend/src/components/CompositionStudio.tsx
            selector: { kind: symbol, name: CompositionStudio }
            claims:
              - kind: satisfies
                criterion: REQ-FE-080#criterion.explicit-preview-count-and-paging
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.saved-sql-label-source-explicit
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-structure-first-steady-state
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-mode-context-singular
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-insertion-completes-before-edit
          - id: composition-variable-binding-picker
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.tsx
            selector: { kind: symbol, name: CompositionVariableBindingPicker }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.form-selection-creates-inline-sql
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-insertion-completes-before-edit
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-table-source-change-is-explicit
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.design-picker-normalizes-to-variable
          - id: composition-revision-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.tsx
            selector: { kind: symbol, name: CompositionRevisionRoute }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-binding-identifiers-stay-internal
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: composition-access-change-signal
            adapter: typescript
            path: frontend/src/lib/composition-access-changes.ts
            selector: { kind: symbol, name: subscribeToCompositionAccessChanges }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: resource-access-mutation-signal
            adapter: typescript
            path: frontend/src/lib/access-api.ts
            selector: { kind: symbol, name: accessApi }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: space-membership-mutation-signal
            adapter: typescript
            path: frontend/src/lib/space-api.ts
            selector: { kind: symbol, name: spaceApi }
            claims:
              - kind: satisfies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
          - id: composition-history-route
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/history.tsx
            selector: { kind: symbol, name: CompositionHistoryRoute }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-history-hides-revision-identifiers
          - id: composition-text-inspector
            adapter: typescript
            path: frontend/src/components/CompositionGraphDesignCanvas.tsx
            selector: { kind: symbol, name: CompositionGraphDesignCanvas }
            claims:
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-text-inspector-literal-editing
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-text-inspector-variable-binding
              - kind: satisfies
                criterion: REQ-FE-079#criterion.composition-variable-creation-requires-name
      - id: graph-workspace-read-verification
        role: verification
        facet: verification
        responsibility: Verify typed SQL argument declarations bind explicitly to graph inputs in the picker, alongside explicit count and paging, obsolete-result suppression, and browser pinning before an independent inline copy.
        targets:
          - id: expression-editor-creates-typed-argument
            adapter: typescript
            path: frontend/src/components/SqlDocumentTreeEditor.wasm.test.tsx
            selector: { kind: test, name: "declares a typed SQL argument while editing an expression through actual WASM" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-sql-document-tree-editor]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/SqlDocumentTreeEditor.wasm.test.tsx, test: "declares a typed SQL argument while editing an expression through actual WASM" } }
          - id: composition-expression-argument-binding
            adapter: typescript
            path: frontend/src/components/CompositionGraphArguments.test.tsx
            selector: { kind: test, name: "creates a typed unbound SQL argument from an expression and binds it explicitly" }
            claims:
              - kind: verifies
                criterion: REQ-FE-079#criterion.composition-filter-can-add-sql-arguments
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-sql-document-tree-editor, FEAT-COMP-010#binding.sql-first-workspace-implementation/target.sql-structure-toolbar, FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-data-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "creates a typed unbound SQL argument from an expression and binds it explicitly" } }
          - id: access-change-broadcast
            adapter: typescript
            path: frontend/src/lib/composition-access-changes.test.ts
            selector: { kind: test, name: "delivers a published change to another same-origin tab channel" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-access-change-signal]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/composition-access-changes.test.ts, test: "delivers a published change to another same-origin tab channel" } }
          - id: unrelated-space-signal-is-ignored
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
            selector: { kind: test, name: "ignores access-change signals for another Space" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-revision-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: "ignores access-change signals for another Space" } }
          - id: changed-access-snapshot-gates-recovery
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
            selector: { kind: test, name: "gates results until a same-Space access-change check confirms authority" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-revision-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: "gates results until a same-Space access-change check confirms authority" } }
          - id: unchanged-access-snapshot-reveals-cache
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
            selector: { kind: test, name: "restores cached results only after a same-Space check confirms unchanged authority" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-revision-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: "restores cached results only after a same-Space check confirms unchanged authority" } }
          - id: repeated-access-change-invalidates-in-flight-snapshot
            adapter: typescript
            path: frontend/src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx
            selector: { kind: test, name: "starts a fresh check for each access-change signal while a check is pending" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.composition-revision-route]
                runner: { runner: frontend-vitest-file, arguments: { file: "src/routes/spaces/[space_id]/compositions/[composition_id]/[revision_id]/index.test.tsx", test: "starts a fresh check for each access-change signal while a check is pending" } }
          - id: successful-resource-access-mutation-signals
            adapter: typescript
            path: frontend/src/lib/access-api.test.ts
            selector: { kind: test, name: "notifies Composition views after a successful resource policy update" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-009#criterion.snapshot-reactive-execution
                covers: [FEAT-COMP-010#binding.sql-first-workspace-implementation/target.resource-access-mutation-signal]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/access-api.test.ts, test: "notifies Composition views after a successful resource policy update" } }
          - id: failed-resource-access-mutation-does-not-signal
            adapter: typescript
            path: frontend/src/lib/access-api.test.ts
            selector: { kind: test, name: "does not notify after a rejected policy update" }
            claims:
              - kind: verifies
