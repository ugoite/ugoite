  - id: display-label-domain-tests
    role: evidence
    facet: domain-tests
    responsibility: Prove labeled and unlabeled documents canonicalize to identical bytes and fingerprints
      across native Rust and WASM; exact golden-byte pinning lives in focused domain unit tests inside
      private submodules that the spec inventory cannot address and is not bound here.
    targets:
    - id: labeled-canonical-golden
      adapter: rust
      path: crates/ugoite-wasm/src/lib.rs
      selector:
        kind: symbol
        name: composition_canonicalization_matches_the_native_domain_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.optional-display-labels
      - kind: evidences
        anchor: REQ-COMP-003#criterion.semantic-fingerprint
    - id: unlabeled-canonical-golden
      adapter: rust
      path: crates/ugoite-wasm/src/lib.rs
      selector:
        kind: symbol
        name: composition_canonicalization_matches_the_native_domain_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.optional-display-labels
      - kind: evidences
        anchor: REQ-COMP-003#criterion.canonical-yaml
    - id: wasm-label-parity
