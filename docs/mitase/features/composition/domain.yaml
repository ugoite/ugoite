        anchor: REQ-COMP-002#criterion.composition-tags
  - id: portable-envelope-wasm-parity
    role: evidence
    facet: wasm-tests
    responsibility: Keep the fixed marker, tags, ordered result descriptors, canonical bytes, fingerprint,
      unknown-field rejection, diagnostics, and parser resource limits aligned between native Rust and
      WASM.
    targets:
    - id: ordered-result-descriptor-validation
      adapter: rust
      path: crates/ugoite-wasm/src/lib.rs
      selector:
        kind: symbol
        name: composition_canonicalization_matches_the_native_domain_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
    - id: restricted-envelope-yaml
      adapter: rust
      path: crates/ugoite-wasm/src/lib.rs
      selector:
        kind: symbol
        name: composition_canonicalization_matches_the_native_domain_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.restricted-yaml
    - id: envelope-fingerprint-inputs
      adapter: rust
      path: crates/ugoite-wasm/src/lib.rs
      selector:
        kind: symbol
        name: composition_canonicalization_matches_the_native_domain_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-003#criterion.semantic-fingerprint
    - id: native-envelope-parity
      adapter: rust
      path: crates/ugoite-wasm/src/lib.rs
      selector:
        kind: symbol
        name: composition_canonicalization_matches_the_native_domain_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.composition-tags
      - kind: evidences
        anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
      - kind: evidences
        anchor: REQ-COMP-003#criterion.wasm-parity
    - id: wasm32-envelope-parity
      adapter: typescript
      path: crates/ugoite-wasm/tests/composition_parity.ts
      selector:
        kind: symbol
        name: main
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.composition-tags
      - kind: evidences
        anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
      - kind: evidences
        anchor: REQ-COMP-003#criterion.wasm-parity
    - id: wasm32-bounded-parser-runtime
      adapter: typescript
      path: crates/ugoite-wasm/tests/composition_parity.ts
      selector:
        kind: symbol
        name: main
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.bounded-parser
  - id: display-label-domain
    role: implementation
    facet: domain
    responsibility: Represent optional Composition display labels without changing stable IDs or source
