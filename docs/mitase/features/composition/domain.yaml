      - kind: evidences
        anchor: REQ-COMP-002#criterion.entry-query-display-system-fields
  - id: composition-tag-storage-evidence
    role: evidence
    facet: iceberg-tests
    responsibility: Verify that document tags round-trip as the same ordered Entry metadata tags on a
      saved Composition revision.
    targets:
