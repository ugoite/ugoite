schema: mitase/authoring/v2
kind: features
namespace: composition
category: Saved, portable Composition documents
features:
- id: FEAT-COMP-001
  title: Composition Knowledge and semantic contract
  summary: Define restricted, portable Composition documents as Space-owned Knowledge with shared Rust
    semantics and bounded execution through existing query contracts. Browser evidence for the localized
    save-diagnostic matrix is not bound because its cases are parameterized cases the spec inventory cannot
    address.
  status: implemented
  bindings:
  - id: contract
    role: contract-source
    facet: domain
    responsibility: Define the Composition v1 document, semantic authority, recovery boundary, and transient
      Work boundary without claiming the planned persistence or UI behavior is already implemented.
    targets:
    - id: composition-contract
      adapter: declared
      path: docs/architecture/contracts/composition.md
      selector:
        kind: file
      claims:
      - kind: documents
        anchor: REQ-COMP-001#criterion.space-authority
      - kind: documents
        anchor: REQ-COMP-002#criterion.typed-dashboard-model
      - kind: documents
        anchor: REQ-COMP-002#criterion.composition-tags
      - kind: documents
        anchor: REQ-COMP-002#criterion.saved-sql-result-descriptor
      - kind: documents
        anchor: REQ-COMP-002#criterion.optional-display-labels
      - kind: documents
        anchor: REQ-COMP-002#criterion.typed-metric-value-field
      - kind: documents
        anchor: REQ-COMP-002#criterion.metric-runtime-values
      - kind: documents
        anchor: REQ-COMP-002#criterion.ordered-component-layout
      - kind: documents
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
      - kind: documents
        anchor: REQ-COMP-002#criterion.entry-query-display-system-fields
      - kind: documents
        anchor: REQ-COMP-003#criterion.canonical-yaml
      - kind: documents
        anchor: REQ-COMP-003#criterion.semantic-fingerprint
      - kind: documents
        anchor: REQ-COMP-003#criterion.wasm-parity
      - kind: documents
        anchor: REQ-COMP-004#criterion.entry-query-translation
      - kind: documents
        anchor: REQ-COMP-004#criterion.used-field-fingerprint
      - kind: documents
        anchor: REQ-COMP-004#criterion.saved-sql-result-fingerprint
      - kind: documents
        anchor: REQ-COMP-004#criterion.exact-composition-revision
      - kind: documents
        anchor: REQ-COMP-004#criterion.draft-preview
      - kind: documents
        anchor: REQ-COMP-004#criterion.concealed-unavailable-references
      - kind: documents
        anchor: REQ-COMP-005#criterion.raw-inspection
      - kind: documents
        anchor: REQ-COMP-006#criterion.work-state-is-transient
    - id: monthly-expense-fixture
      adapter: declared
      path: crates/ugoite-domain/tests/fixtures/composition/monthly-expense.ugcomp.yaml
      selector:
        kind: file
    - id: monthly-expense-labeled-fixture
      adapter: declared
      path: crates/ugoite-domain/tests/fixtures/composition/monthly-expense-labeled.ugcomp.yaml
      selector:
        kind: file
    - id: metric-value-fields-fixture
      adapter: declared
      path: crates/ugoite-domain/tests/fixtures/composition/metric-value-fields.ugcomp.yaml
      selector:
        kind: file
  - id: portable-envelope-domain
    role: implementation
    facet: domain
    responsibility: Represent the fixed Composition envelope, Entry tags, and ordered Saved SQL result
      descriptors as typed Rust values.
    targets:
    - id: composition-document-type
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: CompositionDocument
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.typed-dashboard-model
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.composition-tags
    - id: composition-format-marker-type
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: CompositionFormat
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.typed-dashboard-model
    - id: saved-sql-result-column-type
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: CompositionResultColumn
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.saved-sql-result-descriptor
    - id: saved-sql-result-field-types
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: CompositionResultFieldType
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.saved-sql-result-descriptor
  - id: portable-envelope-domain-evidence
    role: evidence
    facet: domain-tests
    responsibility: Verify the fixed envelope field names in the shared Rust contract and pin the byte,
      nesting-depth, and collection parser limits through the frozen v1 contract test; ordered descriptors,
      restricted YAML rejection, fingerprint inputs, and runtime enforcement across native and WASM are
      evidenced by portable-envelope-wasm-parity.
    targets:
    - id: portable-envelope-fields
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: document_uses_the_portable_envelope_field_names
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.typed-dashboard-model
      - kind: evidences
        anchor: REQ-COMP-002#criterion.composition-tags
    - id: bounded-envelope-collections
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: composition_v1_freeze_pins_portable_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.bounded-parser
    - id: bounded-envelope-input-bytes
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: composition_v1_freeze_pins_portable_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.bounded-parser
    - id: bounded-envelope-nesting-depth
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: composition_v1_freeze_pins_portable_contract
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.bounded-parser
  - id: entry-query-display-system-fields-domain
    role: implementation
    facet: domain
    responsibility: Represent optional Composition table timestamp selections in the EntryQuery template while keeping the existing Preview and property projection grammar.
    targets:
    - id: entry-query-template
      adapter: rust
      path: crates/ugoite-domain/src/composition.rs
      selector:
        kind: symbol
        name: EntryQueryTemplate
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.entry-query-display-system-fields
  - id: entry-query-display-system-fields-domain-evidence
    role: evidence
    facet: domain-tests
    responsibility: Verify omitted timestamp selections default empty, canonical output omits the empty field, and pre-existing Preview documents remain readable.
    targets:
    - id: optional-display-fields-and-preview-compatibility
      adapter: rust
