schema: mitase/authoring/v2
kind: features
namespace: composition
category: Text-first Composition graph, evaluation, and Studio
features:
  - id: FEAT-COMP-010
    title: Text-first Composition graph and Studio
    summary: Store typed Composition graphs as Space-owned Knowledge and author or read them through Rust-validated SQL, Text, Table, and Input paths.
    status: implemented
    bindings:
      - id: sql-first-composition-contract
        role: contract-source
        facet: core
        responsibility: State the portable Text-first Composition and SQL authoring decisions shared by Rust, service, and browser adapters.
        targets:
          - id: sql-first-semantic-contract
            adapter: declared
            path: docs/spec/ui/components/composition-studio.yaml
            selector: { kind: file }
            claims:
              - { kind: documents, anchor: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: documents, anchor: REQ-COMP-010#criterion.table-text-input-components }
              - { kind: documents, anchor: REQ-COMP-010#criterion.rust-parsed-text-templates }
              - { kind: documents, anchor: REQ-COMP-010#criterion.exact-scalar-query-contract }
              - { kind: documents, anchor: REQ-FE-082#criterion.inline-template-parameters }
              - { kind: documents, anchor: REQ-FE-082#criterion.form-seed-projectable-columns }
              - { kind: documents, anchor: REQ-FE-082#criterion.form-seed-without-projectable-columns }
      - id: core
        role: implementation
        facet: core
        responsibility: Own the strict portable graph, Rust Text parser, and typed query evaluation semantics.
        targets:
          - id: composition-document
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionDocument }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
          - id: inline-query-graph
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: symbol, name: compile_variable_graph }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
          - id: text-template-parser
            adapter: rust
            path: crates/ugoite-domain/src/composition/text_template.rs
            selector: { kind: symbol, name: parse_composition_text_template }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.rust-parsed-text-templates }
          - id: typed-query-evaluation
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: symbol, name: VariableGraphQueryEvaluation }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
      - id: service
        role: implementation
        facet: service
        responsibility: Resolve current Composition revisions, Forms, query schemas, authorization, and append-only save/history boundaries before returning data.
        targets:
          - id: authoring-query-resolution
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_resolver.rs
            selector: { kind: symbol, name: preview_composition_authoring_authorized_for_principals_with_base }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-query-authority-and-schema }
          - id: authorized-query-evaluation
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_query_evaluation.rs
            selector: { kind: symbol, name: evaluate_composition_graph_authorized_for_principals }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-query-authority-and-schema }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: append-only-save
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_local_save.rs
            selector: { kind: symbol, name: save_composition_local_with_work }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.append-only-save-and-raw-recovery }
      - id: backend
        role: implementation
        facet: backend
        responsibility: Derive identity and authorization from the authenticated request and expose Composition evaluation and persistence through the existing REST adapter.
        targets:
          - id: evaluation-handler
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: composition_evaluation_handler }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-query-authority-and-schema }
          - id: save-handler
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: save_composition }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.append-only-save-and-raw-recovery }
      - id: api
        role: contract-source
        facet: api
        responsibility: Define the stable HTTP response and request contract implemented by the Composition REST adapter.
        targets:
          - id: evaluate-operation
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector:
              kind: operation
              method: post
              path: /spaces/{space_id}/compositions/evaluate
            claims:
              - { kind: documents, anchor: REQ-COMP-010#criterion.current-query-authority-and-schema }
              - { kind: documents, anchor: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: preview-operation
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector:
              kind: operation
              method: post
              path: /spaces/{space_id}/compositions/preview
            claims:
              - { kind: documents, anchor: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: documents, anchor: REQ-COMP-010#criterion.rust-parsed-text-templates }
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Provide Design and Variables authoring, direct Text editing, local SQL controls, and a read-only graph renderer without duplicate authoring controls.
        targets:
          - id: design-canvas
            adapter: typescript
            path: frontend/src/components/CompositionGraphDesignCanvas.tsx
            selector: { kind: symbol, name: CompositionGraphDesignCanvas }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.design-and-variables-modes }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.text-is-edited-in-place }
          - id: graph-studio
            adapter: typescript
            path: frontend/src/components/CompositionGraphStudio.tsx
            selector: { kind: symbol, name: CompositionGraphStudio }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.design-and-variables-modes }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.variable-creation-completes-pending-placement }
          - id: variables-workspace
            adapter: typescript
            path: frontend/src/components/CompositionVariableGraphWorkspace.tsx
            selector: { kind: symbol, name: CompositionVariableGraphWorkspace }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.variables-show-local-sql-diagnostics }
          - id: reader-renderer
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.tsx
            selector: { kind: symbol, name: CompositionGraphRenderer }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.design-and-variables-modes }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.text-is-edited-in-place }
          - id: browser-protocol-integer-decoding
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.ts
            selector: { kind: symbol, name: decodeTypedIntegerResponse }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
      - id: cli
        role: implementation
        facet: cli
        responsibility: Keep Composition lint, exact revision reads, graph evaluation, and raw inspection/export/history on the shared Rust contract for local and remote CLI use.
        targets:
          - id: cli-composition-adapter
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: lint_yaml_bytes }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.append-only-save-and-raw-recovery }
      - id: wasm
        role: implementation
        facet: wasm
        responsibility: Expose the shared Rust Text parser through the bounded portable protocol without a second browser-side template parser.
        targets:
          - id: text-template-action
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: invoke_domain }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.rust-parsed-text-templates }
      - id: verification
        role: verification
        facet: verification
        responsibility: Verify strict graph rejection, Rust template semantics, scalar result validation, current Form authority, append-only revisions, adapter parity, and the browser's two-mode Text-first workflow.
        targets:
          - id: old-shape-and-component-validation
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: test, name: tests::replaced_composition_shape_is_rejected_without_hidden_fields }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.inline-sql-typed-graph
                covers: [FEAT-COMP-010#binding.core/target.composition-document]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::replaced_composition_shape_is_rejected_without_hidden_fields } }
          - id: saved-sql-variant-rejected
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: test, name: tests::query_definition_decoding_rejects_saved_sql_and_unknown_fields }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.inline-sql-typed-graph
                covers: [FEAT-COMP-010#binding.core/target.inline-query-graph]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::variable_graph::tests::query_definition_decoding_rejects_saved_sql_and_unknown_fields } }
          - id: replaced-component-kinds-rejected
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: test, name: tests::old_component_kinds_and_table_presentation_are_rejected }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.table-text-input-components
                covers: [FEAT-COMP-010#binding.core/target.composition-document]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::canonical::tests::old_component_kinds_and_table_presentation_are_rejected } }
          - id: text-template-syntax
            adapter: rust
            path: crates/ugoite-domain/src/composition/text_template.rs
            selector: { kind: test, name: tests::malformed_references_have_stable_syntax_errors }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.rust-parsed-text-templates
                covers: [FEAT-COMP-010#binding.core/target.text-template-parser]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::text_template::tests::malformed_references_have_stable_syntax_errors } }
          - id: scalar-cardinality
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: test, name: tests::scalar_results_never_choose_a_first_row_or_column }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.core/target.typed-query-evaluation]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition_query::tests::scalar_results_never_choose_a_first_row_or_column } }
          - id: scalar-null-and-cardinality
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: test, name: tests::scalar_results_distinguish_cardinality_null_and_valid_values }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.core/target.inline-query-graph]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::variable_graph::tests::scalar_results_distinguish_cardinality_null_and_valid_values } }
          - id: result-schema-and-unused-form-change
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: saved_graph_ignores_unused_form_field_changes }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.service/target.authoring-query-resolution]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: saved_graph_ignores_unused_form_field_changes } }
          - id: current-form-acl-recheck
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: graph_evaluation_drops_query_results_when_form_access_is_revoked_before_final_check }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.service/target.authorized-query-evaluation]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: graph_evaluation_drops_query_results_when_form_access_is_revoked_before_final_check } }
          - id: descriptor-drift-rejected
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: saves_reject_forged_complete_query_result_descriptors }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.service/target.authoring-query-resolution]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: saves_reject_forged_complete_query_result_descriptors } }
          - id: count-snapshot-float-transport
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_query_authorization.rs
            selector: { kind: test, name: inline_float_count_snapshot_matches_integer_json_zero }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.service/target.authorized-query-evaluation]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_query_authorization, test: inline_float_count_snapshot_matches_integer_json_zero } }
          - id: append-only-history
            adapter: rust
            path: crates/ugoite-iceberg/src/composition/history_tests.rs
            selector: { kind: test, name: tests::authorized_composition_history_pages_and_exact_reads_reach_revisions_after_read_cap }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.append-only-save-and-raw-recovery
                covers: [FEAT-COMP-010#binding.service/target.append-only-save]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-iceberg, test: composition::history_tests::authorized_composition_history_pages_and_exact_reads_reach_revisions_after_read_cap } }
          - id: raw-cli-projection
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: test, name: tests::local_raw_projection_matches_the_portable_composition_read_dto }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.append-only-save-and-raw-recovery
                covers: [FEAT-COMP-010#binding.cli/target.cli-composition-adapter]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-cli, test: commands::composition::tests::local_raw_projection_matches_the_portable_composition_read_dto } }
          - id: evaluation-rest-route
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: test, name: authentication_regression_tests::composition_evaluate_route_executes_the_selected_saved_graph }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.backend/target.evaluation-handler]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::composition_evaluate_route_executes_the_selected_saved_graph } }
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.backend/target.evaluation-handler]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-server, test: authentication_regression_tests::composition_evaluate_route_executes_the_selected_saved_graph } }
          - id: openapi-composition-contract
            adapter: rust
            path: crates/ugoite-server/tests/api_contract.rs
            selector: { kind: test, name: openapi_exposes_graph_composition_operations_without_legacy_adapters }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.inline-sql-typed-graph
                covers:
                  - FEAT-COMP-010#binding.api/target.evaluate-operation
                  - FEAT-COMP-010#binding.api/target.preview-operation
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-server, harness: api_contract, test: openapi_exposes_graph_composition_operations_without_legacy_adapters } }
          - id: cli-rejects-old-graph
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: test, name: tests::lint_rejects_the_removed_prerelease_source_document }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.inline-sql-typed-graph
                covers: [FEAT-COMP-010#binding.cli/target.cli-composition-adapter]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-cli, test: commands::composition::tests::lint_rejects_the_removed_prerelease_source_document } }
          - id: wasm-native-template-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::composition_text_template_action_matches_the_native_domain_parser }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.rust-parsed-text-templates
                covers: [FEAT-COMP-010#binding.wasm/target.text-template-action]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: composition_text_template_action_matches_the_native_domain_parser } }
          - id: design-canvas-authoring
            adapter: typescript
            path: frontend/src/components/CompositionGraphDesignCanvas.test.tsx
            selector: { kind: test, name: "edits Text directly, selects a local style, and inserts a scalar variable" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.text-is-edited-in-place
                covers: [FEAT-COMP-010#binding.frontend/target.design-canvas]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphDesignCanvas.test.tsx, test: "edits Text directly, selects a local style, and inserts a scalar variable" } }
          - id: graph-studio-modes-and-placement
            adapter: typescript
            path: frontend/src/components/CompositionGraphArguments.test.tsx
            selector: { kind: test, name: adds and cancels a Design input in place with matching graph references }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.variable-creation-completes-pending-placement
                covers: [FEAT-COMP-010#binding.frontend/target.graph-studio]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "adds and cancels a Design input in place with matching graph references" } }
          - id: variables-bindings-and-diagnostics
            adapter: typescript
            path: frontend/src/components/CompositionVariableGraphWorkspace.test.tsx
            selector: { kind: test, name: keeps SQL and argument bindings current through consecutive graph edits }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.variables-show-local-sql-diagnostics
                covers: [FEAT-COMP-010#binding.frontend/target.variables-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionVariableGraphWorkspace.test.tsx, test: "keeps SQL and argument bindings current through consecutive graph edits" } }
          - id: reader-exact-text-values
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.test.tsx
            selector: { kind: test, name: renders exact i64 and decimal scalar tokens without Number coercion }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.frontend/target.reader-renderer]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphRenderer.test.tsx, test: "renders exact i64 and decimal scalar tokens without Number coercion" } }
              - kind: verifies
                criterion: REQ-FE-083#criterion.text-is-edited-in-place
                covers: [FEAT-COMP-010#binding.frontend/target.reader-renderer]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphRenderer.test.tsx, test: "renders exact i64 and decimal scalar tokens without Number coercion" } }
          - id: browser-protocol-exact-i64
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.test.ts
            selector: { kind: test, name: preserves typed Composition i64 values across real HTTP and WASM boundaries }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.frontend/target.browser-protocol-integer-decoding]
                runner: { runner: frontend-vitest-file, arguments: { file: src/lib/ugoite-client/protocol.test.ts, test: "preserves typed Composition i64 values across real HTTP and WASM boundaries" } }
          - id: browser-save-reopen-reader
            adapter: typescript
            path: e2e/composition-golden-journey.test.ts
            selector: { kind: test, name: "Browser saves a Text tool once, reopens its exact revision from Home, and exposes a read-only reader" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.design-and-variables-modes
                covers:
                  - FEAT-COMP-010#binding.frontend/target.design-canvas
                  - FEAT-COMP-010#binding.frontend/target.reader-renderer
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-golden-journey.test.ts, test: "Browser saves a Text tool once, reopens its exact revision from Home, and exposes a read-only reader" } }
