schema: mitase/authoring/v2
kind: features
namespace: composition
category: Text-first Composition graph, evaluation, and Studio
features:
  - id: FEAT-COMP-010
    title: Text-first Composition graph and Studio
    summary: Store typed Composition graphs as Space-owned Knowledge and author or read them through Rust-validated SQL, Text, Table, and Input paths.
    status: implemented
    bindings:
      - id: sql-first-composition-contract
        role: contract-source
        facet: core
        responsibility: State the portable Text-first Composition and SQL authoring decisions shared by Rust, service, and browser adapters.
        targets:
          - id: sql-first-semantic-contract
            adapter: declared
            path: docs/spec/ui/components/composition-studio.yaml
            selector: { kind: file }
            claims:
              - { kind: documents, anchor: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: documents, anchor: REQ-COMP-010#criterion.table-text-input-components }
              - { kind: documents, anchor: REQ-COMP-010#criterion.rust-parsed-text-templates }
              - { kind: documents, anchor: REQ-COMP-010#criterion.exact-scalar-query-contract }
              - { kind: documents, anchor: REQ-COMP-010#criterion.current-shape-save-validation }
              - { kind: documents, anchor: REQ-COMP-010#criterion.append-only-save-history }
              - { kind: documents, anchor: REQ-COMP-010#criterion.raw-history-remains-readable }
              - { kind: documents, anchor: REQ-FE-082#criterion.inline-template-parameters }
              - { kind: documents, anchor: REQ-FE-082#criterion.form-seed-projectable-columns }
              - { kind: documents, anchor: REQ-FE-082#criterion.form-seed-without-projectable-columns }
              - { kind: documents, anchor: REQ-FE-083#criterion.design-and-variables-modes }
              - { kind: documents, anchor: REQ-FE-083#criterion.text-is-edited-in-place }
              - { kind: documents, anchor: REQ-FE-083#criterion.reader-table-scroll-stays-local }
              - { kind: documents, anchor: REQ-FE-083#criterion.variable-creation-completes-pending-placement }
              - { kind: documents, anchor: REQ-FE-083#criterion.input-creation-places-once }
              - { kind: documents, anchor: REQ-FE-083#criterion.duplicate-variable-name-is-rejected }
              - { kind: documents, anchor: REQ-FE-083#criterion.variable-name-is-suggested }
              - { kind: documents, anchor: REQ-FE-083#criterion.variables-show-local-sql-diagnostics }
              - { kind: documents, anchor: REQ-FE-083#criterion.sql-arguments-bind-locally }
      - id: core
        role: implementation
        facet: core
        responsibility: Own the strict portable graph, Rust Text parser, and typed query evaluation semantics.
        targets:
          - id: composition-document
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: symbol, name: CompositionDocument }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
          - id: inline-query-graph
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: symbol, name: compile_variable_graph }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: satisfies, criterion: REQ-FE-082#criterion.inline-template-parameters }
          - id: component-binding-graph
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_binding.rs
            selector: { kind: symbol, name: compile_variable_graph_bindings }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
          - id: typed-query-result-validation
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: symbol, name: validate_variable_graph_result }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: typed-query-result-ingestion
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: symbol, name: validate_variable_graph_sql_page }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: text-template-parser
            adapter: rust
            path: crates/ugoite-domain/src/composition/text_template.rs
            selector: { kind: symbol, name: parse_composition_text_template }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.rust-parsed-text-templates }
          - id: typed-query-evaluation
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: symbol, name: VariableGraphQueryEvaluation }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
      - id: service
        role: implementation
        facet: service
        responsibility: Resolve current Composition revisions, Forms, query schemas, authorization, and append-only save/history boundaries before returning data.
        targets:
          - id: authoring-query-resolution
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_resolver.rs
            selector: { kind: symbol, name: read_current_queries }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-query-authority-and-schema }
          - id: authorized-query-evaluation
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_query_evaluation.rs
            selector: { kind: symbol, name: evaluate_composition_graph_authorized_for_principals }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-query-authority-and-schema }
          - id: append-only-save
            adapter: rust
            path: crates/ugoite-iceberg/src/service/composition_local_save.rs
            selector: { kind: symbol, name: save_composition_local_with_work }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.append-only-save-history }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-shape-save-validation }
      - id: backend
        role: implementation
        facet: backend
        responsibility: Derive identity and authorization from the authenticated request and expose Composition evaluation and persistence through the existing REST adapter.
        targets:
          - id: evaluation-response-query-projection
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: api_composition_queries_and_bindings }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
      - id: api
        role: contract-source
        facet: api
        responsibility: Define the stable HTTP response and request contract implemented by the Composition REST adapter.
        targets:
          - id: evaluate-operation
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector:
              kind: operation
              method: post
              path: /spaces/{space_id}/compositions/evaluate
            claims:
              - { kind: documents, anchor: REQ-COMP-010#criterion.current-query-authority-and-schema }
              - { kind: documents, anchor: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: preview-operation
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector:
              kind: operation
              method: post
              path: /spaces/{space_id}/compositions/preview
            claims:
              - { kind: documents, anchor: REQ-COMP-010#criterion.inline-sql-typed-graph }
              - { kind: documents, anchor: REQ-COMP-010#criterion.rust-parsed-text-templates }
      - id: frontend
        role: implementation
        facet: frontend
        responsibility: Provide Design and Variables authoring, direct Text editing, local SQL controls, and a read-only graph renderer without duplicate authoring controls.
        targets:
          - id: design-canvas
            adapter: typescript
            path: frontend/src/components/CompositionGraphDesignCanvas.tsx
            selector: { kind: symbol, name: CompositionGraphDesignCanvas }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.design-and-variables-modes }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.text-is-edited-in-place }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.design-evaluation-has-current-state }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
          - id: graph-studio
            adapter: typescript
            path: frontend/src/components/CompositionGraphStudio.tsx
            selector: { kind: symbol, name: CompositionGraphStudio }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.design-and-variables-modes }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.variable-creation-completes-pending-placement }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.editor-work-is-scope-bound }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.input-creation-places-once }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.duplicate-variable-name-is-rejected }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.variable-name-is-suggested }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
          - id: inline-sql-variable-workspace
            adapter: typescript
            path: frontend/src/components/CompositionVariableGraphWorkspace.tsx
            selector: { kind: symbol, name: CompositionVariableGraphWorkspace }
            claims:
              - { kind: satisfies, criterion: REQ-FE-082#criterion.inline-template-parameters }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.variables-show-local-sql-diagnostics }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.sql-arguments-bind-locally }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.editor-work-is-scope-bound }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.input-creation-places-once }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.variable-name-is-suggested }
          - id: reader-renderer
            adapter: typescript
            path: frontend/src/components/CompositionGraphRenderer.tsx
            selector: { kind: symbol, name: CompositionGraphRenderer }
            claims:
              - { kind: satisfies, criterion: REQ-FE-083#criterion.reader-is-read-only }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.reader-table-scroll-stays-local }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.rust-parsed-text-templates }
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: composition-variable-binding-picker
            adapter: typescript
            path: frontend/src/components/CompositionVariableBindingPicker.tsx
            selector: { kind: symbol, name: CompositionVariableBindingPicker }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.table-text-input-components }
              - { kind: satisfies, criterion: REQ-FE-083#criterion.table-picker-focus-restoration }
          - id: browser-protocol-integer-decoding
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.ts
            selector: { kind: symbol, name: decodeTypedIntegerResponse }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.exact-scalar-query-contract }
          - id: composition-studio-count
            adapter: typescript
            path: frontend/src/components/CompositionStudio.tsx
            selector: { kind: symbol, name: CompositionStudio }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.current-query-authority-and-schema }
      - id: cli
        role: implementation
        facet: cli
        responsibility: Keep Composition lint, exact revision reads, graph evaluation, and raw inspection/export/history on the shared Rust contract for local and remote CLI use.
        targets:
          - id: cli-composition-response-projection
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: composition_queries_and_bindings }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.inline-sql-typed-graph }
          - id: cli-raw-inspection
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: read_composition }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.raw-history-remains-readable }
          - id: cli-raw-history
            adapter: rust
            path: crates/ugoite-cli/src/commands/composition.rs
            selector: { kind: symbol, name: read_composition_history }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.raw-history-remains-readable }
      - id: wasm
        role: implementation
        facet: wasm
        responsibility: Expose the shared Rust Text parser through the bounded portable protocol without a second browser-side template parser.
        targets:
          - id: text-template-action
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: invoke_domain }
            claims:
              - { kind: satisfies, criterion: REQ-COMP-010#criterion.rust-parsed-text-templates }
      - id: verification
        role: verification
        facet: verification
        responsibility: Verify strict graph rejection, Rust template semantics, scalar result validation, current Form authority, append-only revisions, adapter parity, and the browser's two-mode Text-first workflow.
        targets:
          - id: strict-document-fields
            adapter: rust
            path: crates/ugoite-domain/src/composition.rs
            selector: { kind: test, name: tests::schema_rejects_unknown_fields }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.inline-sql-typed-graph
                covers: [FEAT-COMP-010#binding.core/target.composition-document]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::tests::schema_rejects_unknown_fields } }
          - id: saved-sql-variant-rejected
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: test, name: tests::query_definition_decoding_rejects_saved_sql_and_unknown_fields }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.inline-sql-typed-graph
                covers: [FEAT-COMP-010#binding.core/target.inline-query-graph]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::variable_graph::tests::query_definition_decoding_rejects_saved_sql_and_unknown_fields } }
          - id: graph-template-validation
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: test, name: tests::inline_template_markers_validate_bindings }
            claims:
              - kind: verifies
                criterion: REQ-FE-082#criterion.inline-template-parameters
                covers: [FEAT-COMP-010#binding.core/target.inline-query-graph]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::variable_graph::tests::inline_template_markers_validate_bindings } }
          - id: replaced-component-kinds-rejected
            adapter: rust
            path: crates/ugoite-domain/src/composition/canonical.rs
            selector: { kind: test, name: tests::old_component_kinds_and_table_presentation_are_rejected }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.table-text-input-components
                covers: [FEAT-COMP-010#binding.core/target.composition-document]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::canonical::tests::old_component_kinds_and_table_presentation_are_rejected } }
          - id: text-template-syntax
            adapter: rust
            path: crates/ugoite-domain/src/composition/text_template.rs
            selector: { kind: test, name: tests::malformed_references_have_stable_syntax_errors }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.rust-parsed-text-templates
                covers: [FEAT-COMP-010#binding.core/target.text-template-parser]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::text_template::tests::malformed_references_have_stable_syntax_errors } }
          - id: scalar-cardinality
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: test, name: tests::scalar_results_never_choose_a_first_row_or_column }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.core/target.typed-query-evaluation]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition_query::tests::scalar_results_never_choose_a_first_row_or_column } }
          - id: scalar-null-and-cardinality
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_graph.rs
            selector: { kind: test, name: tests::scalar_results_distinguish_cardinality_null_and_valid_values }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.core/target.typed-query-result-validation]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::variable_graph::tests::scalar_results_distinguish_cardinality_null_and_valid_values } }
          - id: inline-result-schema-contract
            adapter: rust
            path: crates/ugoite-core/src/composition_query.rs
            selector: { kind: test, name: tests::validates_inline_planner_schema_before_exposing_scalar_values }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.exact-scalar-query-contract
                covers: [FEAT-COMP-010#binding.core/target.typed-query-result-ingestion]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-core, test: composition_query::tests::validates_inline_planner_schema_before_exposing_scalar_values } }
          - id: component-bindings
            adapter: rust
            path: crates/ugoite-domain/src/composition/variable_binding.rs
            selector: { kind: test, name: tests::compiles_variable_only_bindings_and_tracks_input_components }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.table-text-input-components
                covers: [FEAT-COMP-010#binding.core/target.component-binding-graph]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: composition::variable_binding::tests::compiles_variable_only_bindings_and_tracks_input_components } }
          - id: result-schema-and-unused-form-change
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: saved_graph_ignores_unused_form_field_changes }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.service/target.authoring-query-resolution]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: saved_graph_ignores_unused_form_field_changes } }
          - id: stable-form-identity-for-page-and-count
            adapter: rust
            path: crates/ugoite-iceberg/tests/test_composition_preview.rs
            selector: { kind: test, name: portable_inline_sql_count_keeps_form_identity_after_rename_and_replacement }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers: [FEAT-COMP-010#binding.service/target.authorized-query-evaluation]
                runner: { runner: cargo-test-integration, arguments: { package: ugoite-iceberg, harness: test_composition_preview, test: portable_inline_sql_count_keeps_form_identity_after_rename_and_replacement } }
          - id: composition-count-page-snapshot
            adapter: typescript
            path: e2e/composition-table-metric-pagination.test.ts
            selector: { kind: test, name: "Studio counts inline Table SQL separately from paged reads" }
            claims:
              - kind: verifies
                criterion: REQ-COMP-010#criterion.current-query-authority-and-schema
                covers:
                  - FEAT-COMP-010#binding.service/target.authorized-query-evaluation
                  - FEAT-COMP-010#binding.frontend/target.composition-studio-count
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-table-metric-pagination.test.ts, test: "Studio counts inline Table SQL separately from paged reads" } }
          - id: narrow-reader-table-scroll
            adapter: typescript
            path: e2e/composition-table-mobile.test.ts
            selector: { kind: test, name: "Composition Table scrolls inside a narrow read-only reader" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.reader-table-scroll-stays-local
                covers: [FEAT-COMP-010#binding.frontend/target.reader-renderer]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-table-mobile.test.ts, test: "Composition Table scrolls inside a narrow read-only reader" } }
          - id: unique-variable-name-browser
            adapter: typescript
            path: e2e/composition-studio-journey.test.ts
            selector: { kind: test, name: "Composition Studio prevents duplicate variable IDs in query creation" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.duplicate-variable-name-is-rejected
                covers: [FEAT-COMP-010#binding.frontend/target.graph-studio]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-studio-journey.test.ts, test: "Composition Studio prevents duplicate variable IDs in query creation" } }
          - id: text-first-sql-argument-binding
            adapter: typescript
            path: frontend/src/components/CompositionGraphArguments.test.tsx
            selector: { kind: test, name: "binds each Rust-parsed marker beside the text editor without structure dialogs" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.variables-show-local-sql-diagnostics
                covers: [FEAT-COMP-010#binding.frontend/target.inline-sql-variable-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "binds each Rust-parsed marker beside the text editor without structure dialogs" } }
              - kind: verifies
                criterion: REQ-FE-083#criterion.sql-arguments-bind-locally
                covers: [FEAT-COMP-010#binding.frontend/target.inline-sql-variable-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "binds each Rust-parsed marker beside the text editor without structure dialogs" } }
          - id: create-variable-from-sql-marker
            adapter: typescript
            path: frontend/src/components/CompositionGraphArguments.test.tsx
            selector: { kind: test, name: "creates a unique suggested variable and binds it atomically from the SQL marker" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.sql-arguments-bind-locally
                covers: [FEAT-COMP-010#binding.frontend/target.inline-sql-variable-workspace]
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "creates a unique suggested variable and binds it atomically from the SQL marker" } }
              - kind: verifies
                criterion: REQ-FE-083#criterion.variable-name-is-suggested
                covers:
                  - FEAT-COMP-010#binding.frontend/target.graph-studio
                  - FEAT-COMP-010#binding.frontend/target.inline-sql-variable-workspace
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "creates a unique suggested variable and binds it atomically from the SQL marker" } }
          - id: variable-name-suggestion
            adapter: typescript
            path: frontend/src/components/CompositionGraphArguments.test.tsx
            selector: { kind: test, name: "suggests a unique name for variables created from Design" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.variable-name-is-suggested
                covers:
                  - FEAT-COMP-010#binding.frontend/target.graph-studio
                  - FEAT-COMP-010#binding.frontend/target.inline-sql-variable-workspace
                runner: { runner: frontend-vitest-file, arguments: { file: src/components/CompositionGraphArguments.test.tsx, test: "suggests a unique name for variables created from Design" } }
          - id: form-backed-table-creation-return
            adapter: typescript
            path: e2e/composition-studio-journey.test.ts
            selector: { kind: test, name: "Studio creates a Form-backed Table query from Design and reopens its result" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.variable-creation-completes-pending-placement
                covers: [FEAT-COMP-010#binding.frontend/target.graph-studio]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-studio-journey.test.ts, test: "Studio creates a Form-backed Table query from Design and reopens its result" } }
          - id: table-query-replacement-rollback
            adapter: typescript
            path: e2e/composition-studio-journey.test.ts
            selector: { kind: test, name: "Table query replacement uses Check and preserves the component position on cancel" }
            claims:
              - kind: verifies
                criterion: REQ-FE-083#criterion.variable-creation-completes-pending-placement
                covers: [FEAT-COMP-010#binding.frontend/target.graph-studio]
                runner: { runner: e2e-playwright, arguments: { file: e2e/composition-studio-journey.test.ts, test: "Table query replacement uses Check and preserves the component position on cancel" } }
          - id: input-work-remains-transient
