schema: mitase/authoring/v2
kind: features
namespace: composition
category: Saved, portable Composition documents
features:
- id: FEAT-COMP-006
  title: Composition Studio Data authoring
  summary: 'Provide the Data workspace for Composition authoring: source navigation, EntryQuery editing,
    Saved SQL read-only controls, seed mappings, and source-aware previews.'
  status: implemented
  bindings:
  - id: entry-query-save-builder-evidence
    role: evidence
    facet: frontend-tests
    responsibility: Verify the pure EntryQuery to Composition source builder maps Form-scope text, filters,
      sort, and projection to literals with a field_schema snapshot covering every query-used field (text-searchable
      expansion and preview-wide coverage included, matching the resolver drift contract), and reports
      All-scope, system-ref, non-scalar, unmapped-type, and unresolvable-reference states as inexpressible
      without approximating.
    targets:
    - id: builder-round-trip
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: round-trips a form-scope text+filter+sort+fields view to a source fragment
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
    - id: builder-preview-snapshot
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: snapshots every form field for a preview projection
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
    - id: builder-text-snapshot
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: snapshots text-searchable fields when text is set
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
    - id: builder-fail-closed
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: reports All-scope as inexpressible without a form
      claims:
      - kind: evidences
        anchor: REQ-COMP-004#criterion.entry-query-translation
    - id: builder-fail-closed-system-refs
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: reports a system-ref filter as inexpressible
      claims:
      - kind: evidences
        anchor: REQ-COMP-004#criterion.entry-query-translation
    - id: builder-fail-closed-unknown-type
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: reports an unknown field type as inexpressible
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
    - id: builder-fail-closed-non-scalar
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: reports non-scalar filter values as inexpressible
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
    - id: builder-fail-closed-reference
      adapter: typescript
      path: frontend/src/lib/entry-query-composition.test.ts
      selector:
        kind: test
        name: reports an unresolvable reference target as inexpressible
      claims:
      - kind: evidences
        anchor: REQ-COMP-002#criterion.used-field-schema-snapshot
  - id: studio-data-runtime
    role: implementation
    facet: frontend
    responsibility: Implement the Composition Studio Data workspace, source and query editors, seed mappings,
      and source-scoped draft preview through the existing query contract.
    targets:
    - id: browser-data-workspace
      adapter: typescript
      path: frontend/src/components/CompositionDataWorkspace.tsx
      selector:
        kind: symbol
        name: CompositionDataWorkspace
      claims:
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
      - kind: satisfies
        criterion: REQ-FE-068#criterion.controller-owned-paging
      - kind: satisfies
        criterion: REQ-FE-068#criterion.local-horizontal-overflow
      - kind: evidences
        anchor: REQ-COMP-004#criterion.entry-query-translation
      - kind: evidences
        anchor: REQ-COMP-004#criterion.exact-saved-sql-revision
      - kind: evidences
        anchor: REQ-FE-068#criterion.controller-owned-paging
      - kind: evidences
        anchor: REQ-FE-068#criterion.local-horizontal-overflow
      - kind: evidences
        anchor: REQ-FE-068#criterion.source-native-composition-rendering
      - kind: evidences
        anchor: REQ-FE-068#criterion.semantic-row-ownership
    - id: browser-source-navigator
      adapter: typescript
      path: frontend/src/components/SourceNavigator.tsx
      selector:
        kind: symbol
        name: SourceNavigator
      claims:
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
      - kind: evidences
        anchor: REQ-FE-068#criterion.semantic-row-ownership
    - id: browser-entry-query-editor
      adapter: typescript
      path: frontend/src/components/EntryQuerySourceEditor.tsx
      selector:
        kind: symbol
        name: EntryQuerySourceEditor
      claims:
      - kind: satisfies
        criterion: REQ-COMP-004#criterion.entry-query-translation
      - kind: evidences
        anchor: REQ-FE-068#criterion.source-native-composition-rendering
    - id: browser-entry-query-studio-capabilities
      adapter: typescript
      path: frontend/src/lib/entry-query-studio-capabilities.ts
      selector:
        kind: file
      claims:
      - kind: satisfies
        criterion: REQ-COMP-004#criterion.entry-query-translation
    - id: browser-studio-seed
      adapter: typescript
      path: frontend/src/lib/composition-draft.ts
      selector:
        kind: symbol
        name: applyStudioSeed
      claims:
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.ordered-component-layout
      - kind: satisfies
        criterion: REQ-COMP-004#criterion.exact-saved-sql-revision
      - kind: satisfies
        criterion: REQ-COMP-002#criterion.parameter-placement
      - kind: evidences
        anchor: REQ-COMP-004#criterion.entry-query-translation
    - id: browser-preview-handle
      adapter: typescript
      path: frontend/src/lib/composition-preview-handle.ts
      selector:
        kind: symbol
        name: createCompositionPreviewHandle
      claims:
      - kind: satisfies
        criterion: REQ-COMP-006#criterion.work-state-is-transient
      - kind: satisfies
        criterion: REQ-FE-068#criterion.controller-owned-paging
