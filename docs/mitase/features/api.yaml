schema: mitase/authoring/v2
kind: features
namespace: api
category: API contract surfaces
features:
  - id: FEAT-API-001
    title: API contract and operator surfaces
    summary: Map the shipped API domain across canonical service, backend, frontend, CLI, and exact OpenAPI operation artifacts without introducing a Ugoite-specific specification kind.
    status: implemented
    bindings:
      - id: core
        role: implementation
        facet: core
        responsibility: Implement saved SQL persistence and stateless SQL query evaluation at the canonical Iceberg boundary.
        targets:
          - id: list-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/saved_sql.rs
            selector: { kind: symbol, name: list_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-name-field
          - id: get-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/saved_sql.rs
            selector: { kind: symbol, name: get_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-name-field
          - id: create-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/saved_sql.rs
            selector: { kind: symbol, name: create_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
              - kind: satisfies
                criterion: REQ-API-007#criterion.declared-template-bindings
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-name-field
          - id: update-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/saved_sql.rs
            selector: { kind: symbol, name: update_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-name-field
          - id: delete-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/saved_sql.rs
            selector: { kind: symbol, name: delete_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
      - id: service
        role: operation
        facet: service
        responsibility: Connect the canonical Iceberg service methods to saved SQL and stateless SQL query implementations.
        targets:
          - id: create-entry
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: create_structured_entry_with_receipt }
          - id: list-entries
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: list_entries }
          - id: get-entry
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: get_entry }
          - id: create-entry-authorized
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: create_structured_entry_authorized_for_principals }
          - id: update-entry-authorized
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: update_structured_entry_authorized_for_principals }
          - id: get-preferences
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: get_user_preferences }
          - id: patch-preferences
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: patch_user_preferences }
          - id: list-saved-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: list_saved_sql_operator_unscoped }
          - id: create-saved-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: create_saved_sql }
          - id: get-saved-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: get_saved_sql }
          - id: update-saved-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: update_saved_sql }
          - id: delete-saved-sql
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: delete_saved_sql }
      - id: space-service-implementation
        role: implementation
        facet: service
        responsibility: Implement the Space service lifecycle used by the canonical API operations and immutable identity boundary.
        targets:
          - id: create-space
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: create_space_for_principal_with_name }
            claims:
              - kind: satisfies
                criterion: REQ-API-001#criterion.space-lifecycle
              - kind: satisfies
                criterion: REQ-API-001#criterion.stable-space-identity
          - id: get-space
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: get_space }
            claims:
              - kind: satisfies
                criterion: REQ-API-001#criterion.space-lifecycle
              - kind: satisfies
                criterion: REQ-API-001#criterion.stable-space-identity
      - id: service-implementation
        role: implementation
        facet: service
        responsibility: Implement the API Entry service paths exercised by the canonical service-boundary tests.
        targets:
          - id: create-entry
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: create_structured_entry_with_receipt }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: list-entries
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: list_entries }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: get-entry
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: get_entry }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: create-entry-authorized
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: create_structured_entry_authorized_for_principals }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: update-entry-authorized
            adapter: rust
            path: crates/ugoite-iceberg/src/service.rs
            selector: { kind: symbol, name: update_structured_entry_authorized_for_principals }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
      - id: backend
        role: operation
        facet: backend
        responsibility: Expose the API-owned operations through the Rust server adapter.
        targets:
          - id: list-entries
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: list_entries }
          - id: create-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: create_entry }
          - id: get-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_entry }
          - id: update-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: update_entry }
          - id: delete-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: delete_entry }
          - id: get-preferences
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_preferences }
          - id: patch-preferences
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: patch_preferences }
          - id: list-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: list_sql }
          - id: create-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: create_sql }
          - id: get-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_sql }
          - id: update-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: update_sql }
          - id: delete-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: delete_sql }
      - id: space-backend-implementation
        role: implementation
        facet: backend
        responsibility: Implement the authenticated Space HTTP handlers exercised by the canonical Space lifecycle contract.
        targets:
          - id: get-space
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_space }
            claims:
              - kind: satisfies
                criterion: REQ-API-001#criterion.space-lifecycle
              - kind: satisfies
                criterion: REQ-API-001#criterion.stable-space-identity
      - id: backend-implementation
        role: implementation
        facet: backend
        responsibility: Implement the API Entry handlers exercised by the canonical backend route tests.
        targets:
          - id: create-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: create_entry }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: get-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: get_entry }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: update-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: update_entry }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: delete-entry
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: delete_entry }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
          - id: query-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: query_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-015#criterion.canonical-sql-page
              - kind: satisfies
                criterion: REQ-API-015#criterion.ordered-pagination
          - id: count-sql
            adapter: rust
            path: crates/ugoite-server/src/lib.rs
            selector: { kind: symbol, name: count_sql }
            claims:
              - kind: satisfies
                criterion: REQ-API-015#criterion.canonical-sql-count
      - id: frontend
        role: operation
        facet: frontend
        responsibility: Keep the shipped TypeScript API adapters connected to the same protocol and HTTP contracts.
        targets:
          - id: preferences-api
            adapter: typescript
            path: frontend/src/lib/preferences-api.ts
            selector: { kind: symbol, name: preferencesApi }
          - id: sql-api
            adapter: typescript
            path: frontend/src/lib/sql-api.ts
            selector: { kind: symbol, name: sqlApi }
      - id: frontend-implementation
        role: implementation
        facet: frontend
        responsibility: Implement the Space and Entry API adapters used by the shipped frontend client.
        targets:
          - id: space-api
            adapter: typescript
            path: frontend/src/lib/space-api.ts
            selector: { kind: symbol, name: spaceApi }
            claims:
              - kind: satisfies
                criterion: REQ-API-001#criterion.space-lifecycle
              - kind: satisfies
                criterion: REQ-FE-043#criterion.readable-errors
          - id: entry-api
            adapter: typescript
            path: frontend/src/lib/entry-api.ts
            selector: { kind: symbol, name: entryApi }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
      - id: cli-implementation
        role: implementation
        facet: cli
        responsibility: Implement the CLI operator paths exercised by exact API routing and saved SQL lifecycle tests.
        targets:
          - id: entry-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/entry.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-API-002#criterion.entry-lifecycle
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-create
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-edit
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-history
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.entry-restore
              - kind: satisfies
                criterion: REQ-JOURNEY-001#criterion.reopen
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.invalid-field
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.missing-required
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.stale-revision
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.restore-unknown-revision
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.missing-form
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.remote-authorization
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.entry-delete
              - kind: satisfies
                criterion: REQ-JOURNEY-002#criterion.delete-requires-approval
          - id: sql-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/sql.rs
            selector: { kind: symbol, name: run }
            claims:
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-lifecycle
              - kind: satisfies
                criterion: REQ-API-006#criterion.saved-sql-name-field
              - kind: satisfies
                criterion: REQ-API-015#criterion.canonical-sql-page
              - kind: satisfies
                criterion: REQ-API-015#criterion.canonical-sql-count
              - kind: satisfies
                criterion: REQ-API-015#criterion.local-remote-parity
          - id: entry-query-command
            adapter: rust
            path: crates/ugoite-cli/src/commands/entry_query.rs
            selector: { kind: symbol, name: list }
            claims:
              - kind: satisfies
                criterion: REQ-ENTRY-012#criterion.canonical-query
              - kind: satisfies
                criterion: REQ-ENTRY-012#criterion.typed-options
              - kind: satisfies
                criterion: REQ-ENTRY-012#criterion.human-machine-output
      - id: contract
        role: contract-source
        facet: api
        responsibility: Define the API-owned HTTP operations using the generated OpenAPI snapshot produced from the Rust server.
        owns:
          - id: openapi-source
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: file }
        targets:
          - id: list-spaces
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: /spaces }
          - id: create-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: /spaces }
          - id: get-space
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}' }
          - id: list-entries
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/entries' }
          - id: create-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces/{space_id}/entries' }
          - id: get-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/entries/{entry_id}' }
          - id: update-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: put, path: '/spaces/{space_id}/entries/{entry_id}' }
          - id: delete-entry
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: delete, path: '/spaces/{space_id}/entries/{entry_id}' }
          - id: get-preferences
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: /preferences/me }
          - id: patch-preferences
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: patch, path: /preferences/me }
          - id: list-sql
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/sql' }
          - id: create-sql
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: post, path: '/spaces/{space_id}/sql' }
          - id: get-sql
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: get, path: '/spaces/{space_id}/sql/{sql_id}' }
          - id: update-sql
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: put, path: '/spaces/{space_id}/sql/{sql_id}' }
          - id: delete-sql
            adapter: openapi
            path: crates/ugoite-server/src/openapi.json
            selector: { kind: operation, method: delete, path: '/spaces/{space_id}/sql/{sql_id}' }
    contracts:
      - id: list-spaces
        kind: http
        source: FEAT-API-001#binding.contract/target.list-spaces
        participants:
          - target: FEAT-STO-001#binding.service/target.list-space-ids
            role: service
          - target: FEAT-E2E-001#binding.server/target.list-spaces
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.space-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
        guarantees: [REQ-API-001#criterion.space-lifecycle, REQ-API-001#criterion.authorized-space-list]
      - id: create-space
        kind: http
        source: FEAT-API-001#binding.contract/target.create-space
        participants:
          - target: FEAT-API-001#binding.space-service-implementation/target.create-space
            role: service
          - target: FEAT-STO-001#binding.space-api/target.create-space-api
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.space-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
        guarantees: [REQ-API-001#criterion.space-lifecycle, REQ-API-001#criterion.stable-space-identity]
      - id: get-space
        kind: http
        source: FEAT-API-001#binding.contract/target.get-space
        participants:
          - target: FEAT-API-001#binding.space-service-implementation/target.get-space
            role: service
          - target: FEAT-API-001#binding.space-backend-implementation/target.get-space
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.space-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
        guarantees: [REQ-API-001#criterion.space-lifecycle, REQ-API-001#criterion.stable-space-identity]
      - id: space-lifecycle
        kind: http
        source: FEAT-API-001#binding.contract/target.list-spaces
        participants:
          - target: FEAT-STO-001#binding.service/target.list-space-ids
            role: service
          - target: FEAT-API-001#binding.space-service-implementation/target.create-space
            role: service
          - target: FEAT-API-001#binding.space-service-implementation/target.get-space
            role: service
          - target: FEAT-E2E-001#binding.server/target.list-spaces
            role: backend
          - target: FEAT-STO-001#binding.space-api/target.create-space-api
            role: backend
          - target: FEAT-API-001#binding.space-backend-implementation/target.get-space
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.space-api
            role: client
          - target: FEAT-STO-001#binding.routing/target.space-command-routing
            role: operator
        guarantees: [REQ-API-001#criterion.space-lifecycle, REQ-API-001#criterion.stable-space-identity]
      - id: create-entry
        kind: http
        source: FEAT-API-001#binding.contract/target.create-entry
        participants:
          - target: FEAT-API-001#binding.service-implementation/target.create-entry
            role: service
          - target: FEAT-API-001#binding.backend-implementation/target.create-entry
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.entry-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.entry-command
            role: operator
        guarantees: [REQ-API-002#criterion.entry-lifecycle]
      - id: list-entries
        kind: http
        source: FEAT-API-001#binding.contract/target.list-entries
        participants:
          - target: FEAT-API-001#binding.service-implementation/target.list-entries
            role: service
          - target: FEAT-API-001#binding.backend/target.list-entries
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.entry-api
            role: client
        guarantees: [REQ-API-002#criterion.entry-lifecycle]
      - id: get-entry
        kind: http
        source: FEAT-API-001#binding.contract/target.get-entry
        participants:
          - target: FEAT-API-001#binding.service-implementation/target.get-entry
            role: service
          - target: FEAT-API-001#binding.backend-implementation/target.get-entry
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.entry-api
            role: client
        guarantees: [REQ-API-002#criterion.entry-lifecycle]
      - id: update-entry
        kind: http
        source: FEAT-API-001#binding.contract/target.update-entry
        participants:
          - target: FEAT-API-001#binding.service-implementation/target.update-entry-authorized
            role: service
          - target: FEAT-API-001#binding.backend-implementation/target.update-entry
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.entry-api
            role: client
        guarantees: [REQ-API-002#criterion.entry-lifecycle]
      - id: delete-entry
        kind: http
        source: FEAT-API-001#binding.contract/target.delete-entry
        participants:
          - target: FEAT-API-001#binding.backend-implementation/target.delete-entry
            role: backend
          - target: FEAT-API-001#binding.frontend-implementation/target.entry-api
            role: client
        guarantees: [REQ-API-002#criterion.entry-lifecycle]
      - id: get-preferences
        kind: http
        source: FEAT-API-001#binding.contract/target.get-preferences
        participants:
          - target: FEAT-API-001#binding.backend/target.get-preferences
            role: backend
          - target: FEAT-API-001#binding.frontend/target.preferences-api
            role: client
        guarantees: [REQ-API-011#criterion.preferences-roundtrip]
      - id: patch-preferences
        kind: http
        source: FEAT-API-001#binding.contract/target.patch-preferences
        participants:
          - target: FEAT-API-001#binding.backend/target.patch-preferences
            role: backend
          - target: FEAT-API-001#binding.frontend/target.preferences-api
            role: client
        guarantees: [REQ-API-011#criterion.preferences-roundtrip, REQ-API-011#criterion.selected-space-validation]
      - id: list-saved-sql
        kind: http
        source: FEAT-API-001#binding.contract/target.list-sql
        participants:
          - target: FEAT-API-001#binding.core/target.list-sql
            role: core
          - target: FEAT-API-001#binding.service/target.list-saved-sql
            role: service
          - target: FEAT-API-001#binding.backend/target.list-sql
            role: backend
          - target: FEAT-API-001#binding.frontend/target.sql-api
            role: client
          - target: FEAT-API-001#binding.cli-implementation/target.sql-command
            role: operator
        guarantees: [REQ-API-006#criterion.saved-sql-lifecycle]
      - id: create-saved-sql
        kind: http
        source: FEAT-API-001#binding.contract/target.create-sql
        participants:
