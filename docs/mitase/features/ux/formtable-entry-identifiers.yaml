schema: mitase/authoring/v2
kind: features
namespace: ux
category: FormTable Entry identity presentation
features:
  - id: FEAT-UX-017
    title: FormTable Entry IDs stay out of primary rows
    summary: Keep stable Entry IDs out of primary desktop and mobile FormTable content while retaining access through advanced Entry Info details.
    status: implemented
    bindings:
      - id: formtable-entry-identity-implementation
        role: implementation
        facet: frontend
        responsibility: Keep FormTable primary rows ID-free, preserve row navigation, and expose stable Entry IDs only through advanced Entry Info details.
        targets:
          - id: form-table-surface
            adapter: typescript
            path: frontend/src/components/FormTable.tsx
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-FORMTABLE-001#criterion.primary-rows-id-free
          - id: form-table-component-contract
            adapter: declared
            path: docs/spec/ui/components/form-table.yaml
            selector: { kind: file }
            claims:
              - kind: satisfies
                criterion: REQ-UX-FORMTABLE-001#criterion.primary-rows-id-free
              - kind: satisfies
                criterion: REQ-UX-FORMTABLE-001#criterion.advanced-id-access

      - id: formtable-entry-identity-verification
        role: verification
        facet: verification
        responsibility: Verify ID-free desktop and mobile FormTable rows, row navigation, and advanced Entry Info identity access through exact frontend tests.
        targets:
          - id: desktop-id-free-rows
            adapter: typescript
            path: frontend/src/components/FormTable.test.tsx
            selector: {
              kind: test,
              name: "REQ-UX-FORMTABLE-001: keeps Entry IDs out of desktop rows and opens entries by action",
            }
            claims:
              - kind: verifies
                criterion: REQ-UX-FORMTABLE-001#criterion.primary-rows-id-free
                covers:
                  - FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-surface
                  - FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-component-contract
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/FormTable.test.tsx,
                    test: "REQ-UX-FORMTABLE-001: keeps Entry IDs out of desktop rows and opens entries by action",
                  },
                }
          - id: mobile-id-free-rows
            adapter: typescript
            path: frontend/src/components/FormTable.test.tsx
            selector: {
              kind: test,
              name: "REQ-UX-FORMTABLE-001: keeps Entry IDs out of mobile rows and opens entries by action",
            }
            claims:
              - kind: verifies
                criterion: REQ-UX-FORMTABLE-001#criterion.primary-rows-id-free
                covers:
                  - FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-surface
                  - FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-component-contract
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/FormTable.test.tsx,
                    test: "REQ-UX-FORMTABLE-001: keeps Entry IDs out of mobile rows and opens entries by action",
                  },
                }
          - id: advanced-entry-id-access
            adapter: typescript
            path: frontend/src/components/EntryInfoIdentity.test.tsx
            selector: {
              kind: test,
              name: "REQ-UX-FORMTABLE-001: keeps Entry IDs in advanced Info details",
            }
            claims:
              - kind: verifies
                criterion: REQ-UX-FORMTABLE-001#criterion.advanced-id-access
                covers:
                  - FEAT-UX-017#binding.formtable-entry-identity-implementation/target.form-table-component-contract
                runner: {
                  runner: frontend-vitest-file,
                  arguments: {
                    file: src/components/EntryInfoIdentity.test.tsx,
                    test: "REQ-UX-FORMTABLE-001: keeps Entry IDs in advanced Info details",
                  },
                }
