schema: mitase/authoring/v2
kind: features
namespace: sql
category: SQL parameter handling
features:
  - id: FEAT-SQL-008
    title: Source-aware SQL parameter renaming
    summary: Rename named parameter tokens in source-preserving SQL drafts through the Rust operation and bounded WASM protocol.
    status: implemented
    bindings:
      - id: parameter-rename-core
        role: implementation
        facet: core
        responsibility: Rename only valid named-parameter tokens in exact source, preserving lookalikes and draft diagnostics while enforcing name and output bounds.
        targets:
          - id: parameter-rename-operation
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: symbol, name: rename_sql_document_parameter }
            claims: [{ kind: satisfies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename }]
      - id: parameter-rename-wasm
        role: implementation
        facet: wasm
        responsibility: Expose source-aware renaming through the bounded SQL Document protocol, preserving native errors and token-range behavior.
        targets:
          - id: parameter-rename-action
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: symbol, name: invoke_sql_document_parameter_rename }
            claims: [{ kind: satisfies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename }]
      - id: parameter-rename-contract-source
        role: contract-source
        facet: frontend
        responsibility: Define the typed frontend request shape for the portable parameter-rename action.
        targets:
          - id: typed-parameter-rename-request
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.ts
            selector: { kind: symbol, name: renameSqlDocumentParameter }
            claims: [{ kind: evidences, anchor: REQ-SQL-001#criterion.source-aware-parameter-rename }]
      - id: parameter-rename-verification
        role: verification
        facet: verification
        responsibility: Verify native token selection, no-match behavior, invalid names and draft diagnostics, plus WASM parity and protocol bounds.
        targets:
          - id: native-token-and-lookalike-preservation
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::renames_repeated_parameter_tokens_and_preserves_lookalikes }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-core/target.parameter-rename-operation], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::renames_repeated_parameter_tokens_and_preserves_lookalikes } } }]
          - id: native-no-match-preservation
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::parameter_rename_without_a_match_preserves_source_and_diagnostics }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-core/target.parameter-rename-operation], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::parameter_rename_without_a_match_preserves_source_and_diagnostics } } }]
          - id: native-invalid-name-rejection
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::parameter_rename_rejects_invalid_names }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-core/target.parameter-rename-operation], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::parameter_rename_rejects_invalid_names } } }]
          - id: native-draft-diagnostics-preservation
            adapter: rust
            path: crates/ugoite-domain/src/sql_document.rs
            selector: { kind: test, name: tests::parameter_rename_reparses_invalid_drafts_and_keeps_diagnostics }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-core/target.parameter-rename-operation], runner: { runner: cargo-test-unit, arguments: { package: ugoite-domain, test: sql_document::tests::parameter_rename_reparses_invalid_drafts_and_keeps_diagnostics } } }]
          - id: wasm-native-range-parity
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_parameter_rename_protocol_matches_native_tokens_and_ranges }
            claims:
              - kind: verifies
                criterion: REQ-SQL-001#criterion.source-aware-parameter-rename
                covers: [FEAT-SQL-008#binding.parameter-rename-wasm/target.parameter-rename-action]
                runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_parameter_rename_protocol_matches_native_tokens_and_ranges } }
          - id: wasm-output-bound
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_parameter_rename_bounds_amplified_output }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-wasm/target.parameter-rename-action], runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_parameter_rename_bounds_amplified_output } } }]
          - id: wasm-request-bound
            adapter: rust
            path: crates/ugoite-wasm/src/lib.rs
            selector: { kind: test, name: tests::sql_document_parameter_rename_rejects_request_over_limit }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-wasm/target.parameter-rename-action], runner: { runner: cargo-test-unit, arguments: { package: ugoite-wasm, test: tests::sql_document_parameter_rename_rejects_request_over_limit } } }]
          - id: typed-client-request
            adapter: typescript
            path: frontend/src/lib/ugoite-client/protocol.test.ts
            selector: { kind: test, name: renames SQL Document parameters through the typed Rust/WASM client }
            claims: [{ kind: verifies, criterion: REQ-SQL-001#criterion.source-aware-parameter-rename, covers: [FEAT-SQL-008#binding.parameter-rename-wasm/target.parameter-rename-action], runner: { runner: frontend-vitest-file, arguments: { file: src/lib/ugoite-client/protocol.test.ts, test: renames SQL Document parameters through the typed Rust/WASM client } } }]
    contracts:
      - id: parameter-rename-portable-contract
        kind: custom
        source: FEAT-SQL-008#binding.parameter-rename-contract-source/target.typed-parameter-rename-request
        participants:
          - target: FEAT-SQL-008#binding.parameter-rename-core/target.parameter-rename-operation
            role: rust-core
          - target: FEAT-SQL-008#binding.parameter-rename-wasm/target.parameter-rename-action
            role: rust-wasm
          - target: FEAT-SQL-008#binding.parameter-rename-contract-source/target.typed-parameter-rename-request
            role: frontend-client
        guarantees: [REQ-SQL-001#criterion.source-aware-parameter-rename]
