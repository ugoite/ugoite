nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/ugoite/ugoite
  tag: stable
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

containerPort: 8000
staticDir: /app/static
bootstrapDefaultSpace: true
extraEnv: []
podAnnotations: {}

persistence:
  enabled: true
  mountPath: /data
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

podSecurityContext:
  fsGroup: 10001

resources: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}

auth:
  mode: mock-oauth
  devUserId: dev-local-user
  bootstrapToken: ""
  signingKid: release-compose-local-v1
  signingSecret: ""
  bearerSecrets: ""
  bearerActiveKids:
    - release-compose-local-v1
