nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/ugoite/ugoite
  tag: 0.1.0 # x-release-please-version
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

containerPort: 8000
staticDir: /app/static
publicOrigin: http://localhost:8000
apiBaseUrl: ""
webauthnRpId: localhost
nodeControlUri: ""
nodeSecret:
  existingSecret: ""
  key: encryption-key
extraEnv: []
podAnnotations: {}

persistence:
  enabled: true
  mountPath: /data
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

podSecurityContext:
  fsGroup: 10001

resources: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
