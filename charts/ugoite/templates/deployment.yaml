apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ugoite.fullname" . }}
  labels:
    {{- include "ugoite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ugoite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ugoite.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ugoite
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: UGOITE_ROOT
              value: {{ .Values.persistence.mountPath | quote }}
            - name: UGOITE_SERVER_ADDRESS
              value: {{ printf "0.0.0.0:%v" .Values.containerPort | quote }}
            - name: UGOITE_STATIC_DIR
              value: {{ .Values.staticDir | quote }}
            - name: UGOITE_PUBLIC_ORIGIN
              value: {{ .Values.publicOrigin | quote }}
            - name: UGOITE_API_BASE_URL
              value: {{ default (printf "%s/api" (trimSuffix "/" .Values.publicOrigin)) .Values.apiBaseUrl | quote }}
            - name: UGOITE_WEBAUTHN_RP_ID
              value: {{ .Values.webauthnRpId | quote }}
            {{- with .Values.nodeControlUri }}
            - name: UGOITE_NODE_CONTROL_URI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.nodeSecret.existingSecret }}
            - name: UGOITE_NODE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.nodeSecret.key | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: storage
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ugoite.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
