{{- $signingSecret := required "charts/ugoite values.auth.signingSecret must be set to a unique secret" .Values.auth.signingSecret -}}
{{- $bootstrapToken := required "charts/ugoite values.auth.bootstrapToken must be set to a unique token" .Values.auth.bootstrapToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ugoite.authSecretName" . }}
  labels:
    {{- include "ugoite.labels" . | nindent 4 }}
type: Opaque
stringData:
  UGOITE_BOOTSTRAP_TOKEN: {{ $bootstrapToken | quote }}
  UGOITE_DEV_SIGNING_SECRET: {{ $signingSecret | quote }}
  UGOITE_AUTH_BEARER_SIGNING_SECRETS: {{ include "ugoite.authBearerSecrets" . | quote }}
