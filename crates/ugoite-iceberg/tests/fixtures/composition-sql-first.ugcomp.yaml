format: ugoite.composition
format_version: 1
kind: dashboard
name: Iceberg Composition test
spec:
  variables:
    - id: total
      kind: query
      returns:
        kind: scalar
        value_type:
          scalar_type: integer
          nullable: false
      query:
        kind: inline_sql
        sql: SELECT 1 AS total
        arguments: []
        form_bindings: []
        schema_fingerprint: ''
  components:
    - id: total
      kind: text
      content: "Total: {{total}}"
      style: body
  layout:
    kind: flow
    rows:
      - id: main
        items:
          - kind: component
            component: total
