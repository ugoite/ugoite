[package]
name = "ugoite-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
arrow-array = "58.4"
arrow-schema = "58.4"
base64 = "0.22"
chrono = "0.4.44"
datafusion = "53.1.0"
futures = "0.3"
iceberg = "=0.10.0"
iceberg-datafusion = "=0.10.0"
iceberg-storage-opendal = "=0.10.0"
opendal = { version = "0.57", default-features = false, features = ["executors-tokio", "services-fs", "services-memory", "services-s3", "services-gcs", "services-azdls", "services-oss"] }
parquet = { version = "58.4", default-features = false, features = ["arrow", "async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
typetag = "0.2"
ugoite-domain = { path = "../ugoite-domain" }
ugoite-storage = { path = "../ugoite-storage" }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "revision_log"
harness = false
