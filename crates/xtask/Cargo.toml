[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
opendal = { version = "0.58", default-features = false, features = ["executors-tokio", "services-fs"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
ugoite_iceberg = { package = "ugoite-iceberg", path = "../ugoite-iceberg" }
