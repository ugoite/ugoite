[package]
name = "ugoite-domain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0"
sha2 = "0.11"
sqlparser = { version = "0.63.0", features = ["visitor"] }
url = "2.5.0"
uuid = { version = "1.23.2", features = ["serde"] }
