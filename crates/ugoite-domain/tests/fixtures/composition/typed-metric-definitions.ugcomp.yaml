format: ugoite.composition
format_version: 1
name: Typed metric definitions
kind: dashboard
tags: []
spec:
  sources:
    - id: expense_rows
      kind: entry_query
      form_id: "00000000-0000-7000-8000-000000000010"
      field_schema:
        - field_id: 100
          field_type: string
        - field_id: 102
          field_type: double
        - field_id: 103
          field_type: string
        - field_id: 104
          field_type: date
        - field_id: 105
          field_type: timestamp
      query:
        projection:
          kind: fields
          fields: [100]
    - id: monthly_total
      kind: saved_sql
      entry_id: "00000000-0000-7000-8000-000000000020"
      revision_id: "00000000-0000-7000-8000-000000000021"
      expected_result:
        - name: total
          type: decimal
  components:
    - id: expense_count
      kind: metric
      definition:
        kind: aggregate
        source: expense_rows
        operation: count_rows
      presentation:
        kind: number
        unit: 件
        fraction_digits: 0
    - id: expense_sum
      kind: metric
      definition:
        kind: aggregate
        source: expense_rows
        operation: sum
        field_id: 102
      presentation:
        kind: number
        unit: 円
        fraction_digits: 0
    - id: expense_values
      kind: metric
      definition:
        kind: aggregate
        source: expense_rows
        operation: count_values
        field_id: 103
      presentation:
        kind: number
        unit: 件
        fraction_digits: 0
    - id: earliest_expense
      kind: metric
      definition:
        kind: aggregate
        source: expense_rows
        operation: min
        field_id: 104
    - id: latest_expense
      kind: metric
      definition:
        kind: aggregate
        source: expense_rows
        operation: max
        field_id: 105
    - id: total
      kind: metric
      definition:
        kind: sql_scalar
        source: monthly_total
        column: total
  layout:
    kind: flow
    rows:
      - id: main
        items:
          - kind: component
            component: expense_count
          - kind: component
            component: expense_sum
          - kind: component
            component: expense_values
          - kind: component
            component: earliest_expense
          - kind: component
            component: latest_expense
          - kind: component
            component: total
