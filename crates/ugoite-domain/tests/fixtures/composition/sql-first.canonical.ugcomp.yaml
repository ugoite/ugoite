format: ugoite.composition
format_version: 1
kind: dashboard
name: Monthly expenses
spec:
  variables:
    - id: month_start
      kind: input
      value_type:
        scalar_type: date
        nullable: false
      required: true
    - id: month_end
      kind: input
      value_type:
        scalar_type: date
        nullable: false
      required: true
    - id: expense_rows
      kind: query
      returns:
        kind: table
        columns:
          - name: Date
            value_type:
              scalar_type: date
              nullable: false
          - name: category
            value_type:
              scalar_type: string
              nullable: true
          - name: amount
            value_type:
              scalar_type: decimal
              nullable: true
      query:
        kind: inline_sql
        sql: |-
          SELECT "Date", category, amount
          FROM "Expense"
          WHERE "Date" >= $month_start AND "Date" < $month_end
          ORDER BY "Date" DESC
        arguments:
          - name: month_start
            variable: month_start
          - name: month_end
            variable: month_end
        form_bindings:
          - relation: Expense
            form_id: 00000000-0000-7000-8000-000000000010
        schema_fingerprint: 99a980a869d3c01c212a4d175e0616b3237ddfc19b35a6f027829f7cadad3d67
    - id: month_total
      kind: query
      returns:
        kind: scalar
        value_type:
          scalar_type: decimal
          nullable: true
      query:
        kind: saved_sql
        entry_id: 00000000-0000-7000-8000-000000000020
        revision_id: 00000000-0000-7000-8000-000000000021
        column: total
        arguments:
          - name: month_start
            variable: month_start
          - name: month_end
            variable: month_end
        schema_fingerprint: f907f602a58c987ee0678cbdd199189fb05085e9e4d21dd05e8dbf64b63d87e1
  components:
    - kind: input
      id: month_start_input
      variable: month_start
    - kind: input
      id: month_end_input
      variable: month_end
    - kind: metric
      id: total
      variable: month_total
    - kind: table
      id: transactions
      variable: expense_rows
  layout:
    kind: flow
    rows:
      - id: main
        items:
          - kind: component
            component: month_start_input
          - kind: component
            component: month_end_input
          - kind: component
            component: total
          - kind: component
            component: transactions
