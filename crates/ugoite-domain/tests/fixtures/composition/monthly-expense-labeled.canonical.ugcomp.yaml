format: ugoite.composition
format_version: 1
kind: dashboard
name: Monthly expenses
tags: []
spec:
  variables:
    - id: month_start
      label: Start month
      type: date
      required: true
      format: year-month
    - id: month_end
      label: End month
      type: date
      required: true
      format: year-month
  sources:
    - kind: entry_query
      id: expense_rows
      form_id: 00000000-0000-7000-8000-000000000010
      field_schema:
        - field_id: 100
          field_type: date
        - field_id: 101
          field_type: string
        - field_id: 102
          field_type: double
      query:
        filters:
          - field_id: 100
            operator: gte
            value:
              variable: month_start
          - field_id: 100
            operator: lt
            value:
              variable: month_end
        sort:
          - field_id: 100
            direction: desc
        page_limit: 100
        projection:
          kind: fields
          fields:
            - 100
            - 101
            - 102
    - kind: saved_sql
      id: month_total
      entry_id: 00000000-0000-7000-8000-000000000020
      revision_id: 00000000-0000-7000-8000-000000000021
      expected_result:
        - name: total
          type: float
      variables:
        month_end:
          variable: month_end
        month_start:
          variable: month_start
  components:
    - kind: input
      id: month_start_input
      variable: month_start
    - kind: input
      id: month_end_input
      variable: month_end
    - kind: text
      id: summary_title
      content:
        kind: literal
        text: Monthly summary
      style: heading
    - kind: metric
      id: total
      label: Monthly total
      source: month_total
      column: total
    - kind: table
      id: transactions
      label: Expense transactions
      source: expense_rows
  layout:
    kind: flow
    rows:
      - id: main
        items:
          - kind: component
            component: month_start_input
          - kind: component
            component: month_end_input
          - kind: component
            component: summary_title
          - kind: component
            component: total
          - kind: component
            component: transactions
