format: ugoite.composition
format_version: 1
kind: dashboard
name: Saved SQL metric columns
tags: []
spec:
  sources:
    - kind: entry_query
      id: expense_rows
      form_id: 00000000-0000-7000-8000-000000000010
      field_schema:
        - field_id: 100
          field_type: string
        - field_id: 102
          field_type: double
      query:
        page_limit: 100
        projection:
          kind: fields
          fields:
            - 100
