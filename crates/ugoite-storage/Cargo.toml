[package]
name = "ugoite-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"
hex = "0.4"
opendal = { version = "0.58", default-features = false, features = ["executors-tokio", "http-transport-reqwest", "services-fs", "services-memory", "services-s3", "services-gcs", "services-azdls", "services-oss"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.52", features = ["sync"] }
thiserror = "2.0"
ugoite-domain = { path = "../ugoite-domain" }
url = "2"
uuid = { version = "1.23.2", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
