[package]
name = "ugoite-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
opendal = { version = "0.57", default-features = false, features = ["executors-tokio", "services-fs", "services-memory", "services-s3", "services-gcs", "services-azdls", "services-oss"] }
ugoite-domain = { path = "../ugoite-domain" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
