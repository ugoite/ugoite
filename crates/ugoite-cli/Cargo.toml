[package]
name = "ugoite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ugoite"
path = "src/main.rs"

[dependencies]
ugoite_core = { package = "ugoite-core", path = "../ugoite-core" }
ugoite-api-client = { path = "../ugoite-api-client" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls"] }
opendal = { version = "0.57", default-features = false, features = ["executors-tokio", "services-fs", "services-memory"] }

[dev-dependencies]
tempfile = "3"
