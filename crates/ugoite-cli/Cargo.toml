[package]
name = "ugoite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ugoite"
path = "src/main.rs"

[dependencies]
ugoite_iceberg = { package = "ugoite-iceberg", path = "../ugoite-iceberg" }
ugoite-api-client = { path = "../ugoite-api-client" }
ugoite-konase = { path = "../ugoite-konase" }
ugoite-konase-rig = { path = "../ugoite-konase-rig" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "multipart", "rustls"] }
opendal = { version = "0.58", default-features = false, features = ["executors-tokio", "services-fs", "services-memory"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
base64 = "0.23"
sha2 = "0.11"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
uuid = { version = "1.23", features = ["v7", "serde"] }
chrono = "0.4"
url = "2.5"
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1.52", features = ["net", "sync"] }
