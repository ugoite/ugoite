[package]
name = "ugoite-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7", features = ["cors", "fs", "request-id", "trace"] }
ugoite-core = { path = "../ugoite-core" }
ugoite-iceberg = { path = "../ugoite-iceberg" }
ugoite-identity = { path = "../ugoite-identity" }
ugoite-storage = { path = "../ugoite-storage" }
ugoite-domain = { path = "../ugoite-domain" }
uuid = { version = "1.23.2", features = ["v4", "v7", "serde"] }
url = "2.5"
webauthn-rs = "0.5.3"
chrono = "0.4.44"
openidconnect = "4.0.1"
sha2 = "0.11"
hex = "0.4"
percent-encoding = "2.3"

[dev-dependencies]
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
