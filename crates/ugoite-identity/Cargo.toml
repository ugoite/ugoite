[package]
name = "ugoite-identity"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
data-encoding = "2.9"
fs2 = "0.4"
hex = "0.4"
hmac = "0.13"
opendal = { version = "0.58", default-features = false, features = ["executors-tokio", "services-fs", "services-memory", "services-s3", "services-gcs", "services-azdls", "services-oss"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
ugoite-domain = { path = "../ugoite-domain" }
uuid = { version = "1.23.2", features = ["v4", "v7", "serde"] }
webauthn-rs = { version = "0.5.3", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tempfile = "3"
ugoite-storage = { path = "../ugoite-storage" }
