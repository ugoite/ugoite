[package]
name = "ugoite-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ugoite-domain = { path = "../ugoite-domain" }
base64 = "0.23"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "alloc", "std", "clock"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0.18"
uuid = { version = "1.23.2", features = ["serde"] }
