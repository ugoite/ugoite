[package]
name = "ugoite-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ugoite-domain = { path = "../ugoite-domain" }
opendal = { version = "0.57", default-features = false, features = ["executors-tokio", "services-fs", "services-memory", "services-s3", "services-gcs", "services-azdls", "services-oss"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
chrono = { version = "0.4.44", features = ["serde"] }
url = "2.5.0"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
futures = { version = "0.3.32", features = ["std"] }
thiserror = "2.0.18"
base64 = "0.22.1"
rand = "0.10.1"
serde_yaml = "0.9.34"
regex = "1.12.3"
sha2 = "0.10"
sha2_hmac = { package = "sha2", version = "0.11" }
hmac = "0.13"
pbkdf2 = "0.13"
hex = "0.4"
subtle = "2.6"
iceberg = { version = "0.8.0", default-features = false, features = ["storage-fs", "storage-memory", "storage-s3", "storage-gcs", "storage-azdls", "storage-oss"] }
arrow-array = "57.3"
arrow-schema = "57.3"
parquet = { version = "57.3", default-features = false, features = ["arrow", "async"] }
sqlparser = "0.62.0"

[dev-dependencies]
tempfile = "3"
